<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.card h3{
margin-bottom:15px;
color:#2563eb;
}

input,
textarea{
width:100%;
padding:13px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

textarea{
height:90px;
resize:none;
}

button{
width:100%;
background:#2563eb;
color:white;
border:none;
padding:14px;
border-radius:12px;
margin-top:15px;
font-size:16px;
}

.option{
display:block;
background:#2563eb;
color:white;
padding:15px;
border-radius:12px;
margin-top:12px;
text-align:center;
text-decoration:none;
font-size:16px;
}

.option:active{
opacity:.8;
}

.message{
margin-top:12px;
text-align:center;
font-weight:bold;
}

.logout{
background:#dc2626;
}

</style>

</head>


<body>


<div class="header">
⚙️ EliteTask Pro Admin
</div>


<!-- ADD TASK -->

<div class="card">

<h3>
➕ Add New Task
</h3>


<input
id="taskName"
type="text"
placeholder="Task Name"
>


<input
id="taskPrice"
type="number"
placeholder="Task Price"
>


<input
id="taskCommission"
type="number"
placeholder="Commission"
>


<textarea
id="taskDesc"
placeholder="Task Description"
></textarea>


<button id="addTaskBtn">
Add Task
</button>


<div
id="taskMessage"
class="message">
</div>

</div>



<!-- ADMIN CONTROLS -->

<div class="card">

<h3>
Admin Controls
</h3>


<a
class="option"
href="users.html">
👥 Users Management
</a>


<a
class="option"
href="orders-admin.html">
📦 Orders Management
</a>


<a
class="option"
href="withdraw-admin.html">
💰 Withdraw Requests
</a>


<a
class="option"
href="support-admin.html">
🎧 Live Chat Support
</a>


</div>



<!-- LOGOUT -->

<div class="card">

<button
id="logoutBtn"
class="logout">
Logout Admin
</button>

</div>



<script type="module">

import { auth, db } from "./firebase.js";


import {
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


import {
signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";



const addTaskBtn =
document.getElementById("addTaskBtn");

const taskMessage =
document.getElementById("taskMessage");



addTaskBtn.addEventListener(
"click",
async function(){

const name =
document.getElementById("taskName")
.value
.trim();

const price =
document.getElementById("taskPrice")
.value;

const commission =
document.getElementById("taskCommission")
.value;

const description =
document.getElementById("taskDesc")
.value
.trim();


if(
!name ||
!price ||
!commission
){

taskMessage.innerText =
"Please fill Task Name, Price and Commission.";

return;

}


try{

await addDoc(
collection(db,"tasks"),
{

name:name,

price:Number(price),

commission:Number(commission),

description:description,

createdAt:serverTimestamp()

}
);


taskMessage.innerText =
"Task Added Successfully ✅";


document.getElementById("taskName")
.value="";

document.getElementById("taskPrice")
.value="";

document.getElementById("taskCommission")
.value="";

document.getElementById("taskDesc")
.value="";


}catch(error){

taskMessage.innerText =
"Error: " + error.message;

}

});



document.getElementById("logoutBtn")
.addEventListener(
"click",
async function(){

try{

await signOut(auth);

window.location.href =
"admin-login.html";

}catch(error){

alert(error.message);

}

});

</script>


</body>

</html>
