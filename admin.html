<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    padding:15px;
    color:#111;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    border-radius:14px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.header small{
    font-size:14px;
    opacity:.8;
}

.tabs{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.tabs button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.tabs button.active{
    background:#111827;
}

.section{
    display:none;
    margin-top:15px;
}

.section.active{
    display:block;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:14px;
    box-shadow:0 2px 8px #ddd;
}

.card h3{
    margin-bottom:4px;
}

.email{
    color:#666;
    font-size:14px;
    margin-top:6px;
    word-break:break-word;
}

.info{
    margin-top:8px;
    font-size:15px;
    word-break:break-word;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}

button{
    cursor:pointer;
}

.edit,
.delete,
.approve,
.reject{
    flex:1;
    border:0;
    padding:11px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.edit{
    background:#2563eb;
}

.delete{
    background:#dc2626;
}

.approve{
    background:#16a34a;
}

.reject{
    background:#dc2626;
}

.approve:disabled,
.reject:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.editBox{
    display:none;
    margin-top:12px;
    background:#f3f4f6;
    padding:12px;
    border-radius:10px;
}

.editBox input{
    width:100%;
    padding:11px;
    margin-top:6px;
    margin-bottom:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

.save{
    width:100%;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-weight:bold;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:15px;
    background:#eee;
    font-size:13px;
    font-weight:bold;
}

.status.pending{
    background:#fef3c7;
    color:#92400e;
}

.status.approved{
    background:#dcfce7;
    color:#166534;
}

.status.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.loading{
    text-align:center;
    padding:20px;
    color:#777;
}

.error{
    color:#dc2626;
    padding:15px;
    word-break:break-word;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}
</style>

</head>

<body>

<div class="header">
    EliteTask Pro<br>
    <small>Admin Panel</small>
</div>

<div class="tabs">

```
<button
    id="usersBtn"
    class="active"
    onclick="showUsers()">
    👥 Users
</button>

<button
    id="withdrawBtn"
    onclick="showWithdraws()">
    💸 Withdraws
</button>
```

</div>

<!-- USERS -->

<div id="usersSection" class="section active">

```
<div id="usersList">
    <div class="loading">
        Loading Users...
    </div>
</div>
```

</div>

<!-- WITHDRAWS -->

<div id="withdrawSection" class="section">

```
<div id="withdrawList">
    <div class="loading">
        Loading Withdraws...
    </div>
</div>
```

</div>

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    deleteDoc,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const usersList =
document.getElementById("usersList");

const withdrawList =
document.getElementById("withdrawList");


/* =========================
   SHOW USERS
========================= */

window.showUsers = function(){

    document
    .getElementById("usersSection")
    .classList.add("active");

    document
    .getElementById("withdrawSection")
    .classList.remove("active");

    document
    .getElementById("usersBtn")
    .classList.add("active");

    document
    .getElementById("withdrawBtn")
    .classList.remove("active");

    loadUsers();

};


/* =========================
   SHOW WITHDRAWS
========================= */

window.showWithdraws = function(){

    document
    .getElementById("usersSection")
    .classList.remove("active");

    document
    .getElementById("withdrawSection")
    .classList.add("active");

    document
    .getElementById("usersBtn")
    .classList.remove("active");

    document
    .getElementById("withdrawBtn")
    .classList.add("active");

    loadWithdraws();

};


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    usersList.innerHTML =
    '<div class="loading">Loading Users...</div>';

    try{

        const snap =
        await getDocs(
            collection(db,"users")
        );

        usersList.innerHTML = "";

        if(snap.empty){

            usersList.innerHTML =
            '<div class="card empty">No users found.</div>';

            return;
        }


        snap.forEach((item)=>{

            const u = item.data();

            const name =
            u.name || "User";

            const email =
            u.email || "";

            const balance =
            Number(u.balance || 0);

            const commission =
            Number(u.commission || 0);

            const completed =
            Number(u.completed || 0);

            const role =
            u.role || "user";


            usersList.innerHTML += `

            <div class="card">

                <h3>👤 ${escapeHTML(name)}</h3>

                <div class="email">
                    ${escapeHTML(email)}
                </div>

                <div class="info">
                    💰 Balance: <b>Rs ${balance}</b>
                </div>

                <div class="info">
                    💵 Commission: <b>Rs ${commission}</b>
                </div>

                <div class="info">
                    ✅ Completed: <b>${completed}</b>
                </div>

                <div class="info">
                    👑 Role: <b>${escapeHTML(role)}</b>
                </div>

                <div class="actions">

                    <button
                        class="edit"
                        onclick="openEdit('${item.id}')">
                        ✏️ Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteUser('${item.id}')">
                        🗑️ Delete
                    </button>

                </div>


                <div
                    class="editBox"
                    id="edit-${item.id}">

                    <label>Balance</label>

                    <input
                        type="number"
                        id="bal-${item.id}"
                        value="${balance}">


                    <label>Commission</label>

                    <input
                        type="number"
                        id="com-${item.id}"
                        value="${commission}">


                    <label>Completed</label>

                    <input
                        type="number"
                        id="done-${item.id}"
                        value="${completed}">


                    <button
                        class="save"
                        onclick="saveUser('${item.id}')">
                        💾 Save
                    </button>

                </div>

            </div>

            `;

        });

    }
    catch(error){

        usersList.innerHTML = `
        <div class="error">
            Users Error:<br><br>
            ${escapeHTML(error.message)}
        </div>
        `;

    }

}


/* =========================
   OPEN EDIT
========================= */

window.openEdit = function(id){

    const box =
    document.getElementById(
        "edit-"+id
    );

    if(!box){
        return;
    }

    box.style.display =
    box.style.display === "block"
    ? "none"
    : "block";

};


/* =========================
   SAVE USER
========================= */

window.saveUser = async function(id){

    try{

        const balance =
        Number(
            document.getElementById(
                "bal-"+id
            ).value
        );

        const commission =
        Number(
            document.getElementById(
                "com-"+id
            ).value
        );

        const completed =
        Number(
            document.getElementById(
                "done-"+id
            ).value
        );


        if(
            !Number.isFinite(balance) ||
            !Number.isFinite(commission) ||
            !Number.isFinite(completed)
        ){

            throw new Error(
                "Please enter valid numbers."
            );

        }


        if(
            balance < 0 ||
            commission < 0 ||
            completed < 0
        ){

            throw new Error(
                "Values cannot be negative."
            );

        }


        await updateDoc(

            doc(
                db,
                "users",
                id
            ),

            {
                balance:balance,
                commission:commission,
                completed:completed
            }

        );


        alert("User updated successfully");

        loadUsers();

    }
    catch(error){

        alert(
            "Update failed: " +
            error.message
        );

    }

};


/* =========================
   DELETE USER
========================= */

window.deleteUser = async function(id){

    if(
        !confirm(
            "Delete this user?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "users",
                id
            )
        );


        alert(
            "User deleted"
        );

        loadUsers();

    }
    catch(error){

        alert(
            "Delete failed: " +
            error.message
        );

    }

};


/* =========================
   LOAD WITHDRAWS
========================= */

async function loadWithdraws(){

    withdrawList.innerHTML =
    '<div class="loading">Loading Withdraws...</div>';


    try{

        const snap =
        await getDocs(
            collection(db,"withdraws")
        );


        withdrawList.innerHTML = "";


        if(snap.empty){

            withdrawList.innerHTML =
            '<div class="card empty">No withdraw requests.</div>';

            return;
        }


        snap.forEach((item)=>{

            const w =
            item.data();


            const amount =
            Number(w.amount || 0);

            const name =
            w.name || "User";

            const email =
            w.email || "";

            const uid =
            w.uid || "";

            const method =
            w.method ||
            w.paymentMethod ||
            "Not provided";

            const account =
            w.account ||
            w.accountNumber ||
            "Not provided";

            const status =
            String(w.status || "pending")
            .toLowerCase();


            let statusClass = "pending";

            if(status === "approved"){
                statusClass = "approved";
            }

            if(status === "rejected"){
                statusClass = "rejected";
            }


            withdrawList.innerHTML += `

            <div class="card">

                <h3>
                    💸 Rs ${amount}
                </h3>

                <div class="email">
                    👤 ${escapeHTML(name)}
                </div>

                <div class="email">
                    📧 ${escapeHTML(email)}
                </div>

                <div class="info">
                    🆔 UID: ${escapeHTML(uid)}
                </div>

                <div class="info">
                    💳 Method: ${escapeHTML(method)}
                </div>

                <div class="info">
                    🏦 Account: ${escapeHTML(account)}
                </div>

                <div class="status ${statusClass}">
                    Status: ${escapeHTML(status)}
                </div>

                ${
                    status === "pending"
                    ?
                    `

                    <div class="actions">

                        <button
                            class="approve"
                            id="approve-${item.id}"
                            onclick="approveWithdraw('${item.id}','${uid}',${amount})">
                            ✅ Approve
                        </button>

                        <button
                            class="reject"
                            id="reject-${item.id}"
                            onclick="rejectWithdraw('${item.id}')">
                            ❌ Reject
                        </button>

                    </div>

                    `
                    :
                    ""
                }

            </div>

            `;

        });

    }
    catch(error){

        withdrawList.innerHTML = `
        <div class="error">
            Withdraw Error:<br><br>
            ${escapeHTML(error.message)}
        </div>
        `;

    }

}


/* =========================
   APPROVE WITHDRAW
========================= */

window.approveWithdraw =
async function(
    withdrawId,
    uid,
    amount
){

    if(!uid){

        alert(
            "This withdrawal has no user UID."
        );

        return;

    }


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        alert(
            "Invalid withdrawal amount."
        );

        return;

    }


    if(
        !confirm(
            "Approve Rs " +
            amount +
            " withdrawal?"
        )
    ){

        return;

    }


    const approveButton =
    document.getElementById(
        "approve-"+withdrawId
    );

    const rejectButton =
    document.getElementById(
        "reject-"+withdrawId
    );


    if(approveButton){
        approveButton.disabled = true;
        approveButton.innerText = "Processing...";
    }

    if(rejectButton){
        rejectButton.disabled = true;
    }


    try{

        const userRef =
        doc(
            db,
            "users",
            uid
        );


        const withdrawRef =
        doc(
            db,
            "withdraws",
            withdrawId
        );


        /*
         * TRANSACTION
         *
         * 1. Check withdrawal is still pending.
         * 2. Read current user balance.
         * 3. Check sufficient balance.
         * 4. Deduct amount.
         * 5. Mark withdrawal approved.
         *
         * This prevents the same pending withdrawal
         * from being approved twice at the same time.
         */

        await runTransaction(
            db,
            async(transaction)=>{

                const withdrawSnap =
                await transaction.get(
                    withdrawRef
                );


                if(!withdrawSnap.exists()){

                    throw new Error(
                        "Withdrawal request not found."
                    );

                }


                const withdrawData =
                withdrawSnap.data();


                const currentStatus =
                String(
                    withdrawData.status ||
                    "pending"
                ).toLowerCase();


                if(
                    currentStatus !== "pending"
                ){

                    throw new Error(
                        "This withdrawal is already " +
                        currentStatus +
                        "."
                    );

                }


                const userSnap =
                await transaction.get(
                    userRef
                );


                if(!userSnap.exists()){

                    throw new Error(
                        "User profile not found."
                    );

                }


                const userData =
                userSnap.data();


                const currentBalance =
                Number(
                    userData.balance || 0
                );


                if(
                    !Number.isFinite(currentBalance)
                ){

                    throw new Error(
                        "User balance is invalid."
                    );

                }


                if(
                    currentBalance < amount
                ){

                    throw new Error(
                        "Insufficient balance. User balance is Rs " +
                        currentBalance
                    );

                }


                const newBalance =
                currentBalance - amount;


                transaction.update(

                    userRef,

                    {
                        balance:newBalance
                    }

                );


                transaction.update(

                    withdrawRef,

                    {
                        status:"approved"
                    }

                );

            }
        );


        alert(
            "Withdrawal Approved Successfully"
        );


        loadWithdraws();
        loadUsers();

    }
    catch(error){

        alert(
            "Approve failed: " +
            error.message
        );


        if(approveButton){
            approveButton.disabled = false;
            approveButton.innerText = "✅ Approve";
        }

        if(rejectButton){
            rejectButton.disabled = false;
        }

    }

};


/* =========================
   REJECT WITHDRAW
========================= */

window.rejectWithdraw =
async function(id){

    if(
        !confirm(
            "Reject this withdrawal?"
        )
    ){

        return;

    }


    const rejectButton =
    document.getElementById(
        "reject-"+id
    );

    const approveButton =
    document.getElementById(
        "approve-"+id
    );


    if(rejectButton){

        rejectButton.disabled = true;
        rejectButton.innerText =
        "Processing...";

    }

    if(approveButton){
        approveButton.disabled = true;
    }


    try{

        const withdrawRef =
        doc(
            db,
            "withdraws",
            id
        );


        /*
         * Only pending requests can be rejected.
         */

        const withdrawSnap =
        await getDoc(
            withdrawRef
        );


        if(!withdrawSnap.exists()){

            throw new Error(
                "Withdrawal request not found."
            );

        }


        const withdrawData =
        withdrawSnap.data();


        const currentStatus =
        String(
            withdrawData.status ||
            "pending"
        ).toLowerCase();


        if(
            currentStatus !== "pending"
        ){

            throw new Error(
                "This withdrawal is already " +
                currentStatus +
                "."
            );

        }


        await updateDoc(

            withdrawRef,

            {
                status:"rejected"
            }

        );


        alert(
            "Withdrawal Rejected"
        );


        loadWithdraws();

    }
    catch(error){

        alert(
            "Reject failed: " +
            error.message
        );


        if(rejectButton){

            rejectButton.disabled = false;
            rejectButton.innerText =
            "❌ Reject";

        }

        if(approveButton){
            approveButton.disabled = false;
        }

    }

};


/* =========================
   ESCAPE HTML
========================= */

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(
