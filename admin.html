<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EliteTask Pro Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f7edbd;
    color:#3d2d00;
    padding:15px 15px 40px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    background:linear-gradient(
        135deg,
        #806000,
        #d9b43d,
        #967000
    );
    color:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:25px;
}

.logout{
    background:white;
    color:#806000;
    border:0;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:15px;
}

.tab{
    padding:12px 4px;
    border:0;
    border-radius:9px;
    background:white;
    color:#725300;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
}

.tab.active{
    background:#b48600;
    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.10);
}

.card h3{
    color:#715200;
    margin-bottom:14px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #dbc879;
    border-radius:10px;
    margin-bottom:10px;
    outline:none;
}

.preview{
    width:100%;
    max-height:230px;
    object-fit:cover;
    border-radius:14px;
    display:none;
    margin-bottom:10px;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:linear-gradient(
        135deg,
        #9d7200,
        #dfba45,
        #9d7200
    );
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.main-btn:disabled{
    opacity:.6;
}

.item{
    border:1px solid #ead99a;
    border-radius:14px;
    padding:13px;
    margin-top:10px;
    background:#fffdf7;
}

.item img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:9px;
}

.item h4{
    margin-bottom:6px;
    color:#624700;
}

.item p{
    font-size:13px;
    color:#777;
    margin:4px 0;
}

.row{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.small{
    flex:1;
    padding:10px;
    border:0;
    border-radius:8px;
    background:#b48600;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.red{
    background:#b33b2e;
}

.green{
    background:#218c55;
}

.blue{
    background:#2868b2;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:#777;
}


/* USERS */

.user-card{
    border:1px solid #ead99a;
    border-radius:14px;
    padding:14px;
    margin-top:10px;
    background:#fffdf7;
}

.user-name{
    font-size:16px;
    font-weight:bold;
    color:#624700;
}

.user-email{
    font-size:12px;
    color:#777;
    margin-top:4px;
    word-break:break-word;
}

.user-balance{
    font-size:13px;
    margin-top:8px;
    color:#218c55;
    font-weight:bold;
}

.user-commission{
    font-size:13px;
    margin-top:4px;
    color:#b48600;
    font-weight:bold;
}

.user-actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-top:10px;
}

.user-actions button{
    padding:11px 5px;
    border:0;
    border-radius:9px;
    color:white;
    font-weight:bold;
    font-size:11px;
    cursor:pointer;
}

.balance-btn{
    background:#218c55;
}

.support-btn{
    background:#2868b2;
}

.delete-btn{
    background:#b33b2e;
}

.user-support{
    display:none;
    margin-top:12px;
    border-top:1px solid #ead99a;
    padding-top:12px;
}

.user-support.active{
    display:block;
}

.chat-box{
    height:260px;
    overflow-y:auto;
    background:#faf7e8;
    border:1px solid #ead99a;
    border-radius:12px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.chat-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#999;
    font-size:12px;
}

.chat-message{
    max-width:85%;
    padding:9px 11px;
    border-radius:12px;
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
}

.chat-user{
    align-self:flex-end;
    background:#e4c75e;
    color:white;
    border-bottom-right-radius:3px;
}

.chat-admin{
    align-self:flex-start;
    background:white;
    border:1px solid #ead99a;
    color:#333;
    border-bottom-left-radius:3px;
}

.chat-label{
    font-size:9px;
    font-weight:bold;
    margin-bottom:3px;
    opacity:.7;
}

.reply-area{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.reply-input{
    flex:1;
    min-width:0;
    height:42px;
    padding:0 10px;
    border:1px solid #dbc879;
    border-radius:9px;
    outline:none;
}

.reply-send{
    width:48px;
    border:0;
    border-radius:9px;
    background:#2868b2;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.no-data{
    padding:15px;
    text-align:center;
    color:#888;
    font-size:13px;
}


/* WITHDRAW */

.withdraw-card{
    border:1px solid #ead99a;
    border-radius:14px;
    padding:14px;
    margin-top:10px;
    background:#fffdf7;
}

.withdraw-name{
    font-weight:bold;
    color:#624700;
    font-size:15px;
}

.withdraw-email{
    font-size:11px;
    color:#888;
    margin-top:3px;
    word-break:break-word;
}

.withdraw-amount{
    font-size:19px;
    font-weight:bold;
    color:#b48600;
    margin-top:9px;
}

.withdraw-info{
    font-size:12px;
    color:#666;
    margin-top:5px;
    line-height:1.5;
}

.withdraw-pending{
    color:#b48600;
    font-weight:bold;
}

.withdraw-approved{
    color:#218c55;
    font-weight:bold;
}

.withdraw-rejected{
    color:#b33b2e;
    font-weight:bold;
}

@media(max-width:380px){

    body{
        padding:10px 10px 35px;
    }

    .header{
        padding:15px;
    }

    .header h2{
        font-size:20px;
    }

    .tabs{
        grid-template-columns:repeat(3,1fr);
    }

    .tab{
        font-size:10px;
    }

    .card{
        padding:14px;
    }

    .user-actions{
        grid-template-columns:1fr 1fr 1fr;
    }

}

</style>

</head>

<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <h2>
        EliteTask Pro Admin
    </h2>

    <button
        class="logout"
        id="logoutBtn"
        type="button"
    >
        Logout
    </button>

</div>


<!-- TABS -->

<div class="tabs">

    <button
        class="tab active"
        data-tab="tasks"
        type="button"
    >
        Tasks
    </button>

    <button
        class="tab"
        data-tab="users"
        type="button"
    >
        Users
    </button>

    <button
        class="tab"
        data-tab="withdraws"
        type="button"
    >
        Withdraws
    </button>

</div>


<!-- =========================
     TASKS
========================= -->

<div
    id="tasks"
    class="panel active"
>

    <div class="card">

        <h3>
            Add New Task
        </h3>

        <input
            id="taskName"
            class="input"
            placeholder="Task name"
        >

        <input
            id="taskPrice"
            class="input"
            type="number"
            placeholder="Task price"
        >

        <input
            id="taskCommission"
            class="input"
            type="number"
            placeholder="Commission"
        >

        <input
            id="taskImage"
            class="input"
            type="file"
            accept="image/*"
        >

        <img
            id="imagePreview"
            class="preview"
        >

        <button
            id="saveTask"
            class="main-btn"
            type="button"
        >

        </button>

        <div
            id="taskStatus"
            class="status"
        >
            Ready
        </div>

    </div>


    <div class="card">

        <h3>
            Tasks
        </h3>

        <div id="taskList">
            Loading tasks...
        </div>

    </div>

</div>


<!-- =========================
     USERS
========================= -->

<div
    id="users"
    class="panel"
>

    <div class="card">

        <h3>
            Users
        </h3>

        <div id="userList">
            Loading users...
        </div>

    </div>

</div>


<!-- =========================
     WITHDRAWS
========================= -->

<div
    id="withdraws"
    class="panel"
>

    <div class="card">

        <h3>
            Withdraw Requests
        </h3>

        <div id="withdrawList">
            Loading withdrawals...
        </div>

    </div>

</div>


</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from

}
from

const firebaseConfig = {

    apiKey:
    "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
    "elitetask-pro.firebaseapp.com",

    projectId:
    "elitetask-pro",

    storageBucket:
    "elitetask-pro.firebasestorage.app",

    messagingSenderId:
    "504295275402",

    appId:
    "1:504295275402:web:cf744a5d4e82c72145a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


let currentAdmin = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            location.href =
            "index.html";

            return;

        }

        currentAdmin = user;

        loadTasks();

    }
);


/* =========================
   TABS
========================= */

document
.querySelectorAll(".tab")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".tab")
            .forEach(tab => {

                tab.classList.remove(
                    "active"
                );

            });


            document
            .querySelectorAll(".panel")
            .forEach(panel => {

                panel.classList.remove(
                    "active"
                );

            });


            button.classList.add(
                "active"
            );


            const tabName =
                button.dataset.tab;


            document
            .getElementById(tabName)
            .classList.add("active");


            if(tabName === "tasks"){

                loadTasks();

            }


            if(tabName === "users"){

                loadUsers();

            }


            if(tabName === "withdraws"){

                loadWithdraws();

            }

        }
    );

});


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            location.href =
                "index.html";

        }
        catch(error){

            alert(
                "Logout failed."
            );

        }

    }
);


/* =========================
   IMAGE PREVIEW
========================= */

document
.getElementById("taskImage")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        const preview =
            document.getElementById(
                "imagePreview"
            );


        if(!file){

            preview.style.display =
                "none";

            return;

        }


        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

    }
);


/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            let width =
                                img.width;

                            let height =
                                img.height;


                            const max =
                                350;


                            if(width > height){

                                if(width > max){

                                    height =
                                        height *
                                        max /
                                        width;

                                    width =
                                        max;

                                }

                            }
                            else{

                                if(height > max){

                                    width =
                                        width *
                                        max /
                                        height;

                                    height =
                                        max;

                                }

                            }


                            canvas.width =
                                Math.round(width);

                            canvas.height =
                                Math.round(height);


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .35
                                )
                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   SAVE TASK
========================= */

document
.getElementById("saveTask")
.addEventListener(
    "click",
    async () => {

        const name =
            document
            .getElementById("taskName")
            .value
            .trim();


        const price =
            Number(
                document
                .getElementById("taskPrice")
                .value
            );


        const commission =
            Number(
                document
                .getElementById(
                    "taskCommission"
                )
                .value
            );


        const file =
            document
            .getElementById("taskImage")
            .files[0];


        if(
            !name ||
            !price ||
            !commission ||
            !file
        ){

            alert(
                "Task name, price, commission and image required."
            );

            return;

        }


        const status =
            document.getElementById(
                "taskStatus"
            );


        const btn =
            document.getElementById(
                "saveTask"
            );


        btn.disabled = true;

        status.textContent =
            "Compressing image...";


        try{

            const image =
                await compressImage(file);


            status.textContent =
                "Saving task...";


            await addDoc(
                collection(
                    db,
                    "tasks"
                ),
                {

                    name:
                        name,

                    price:
                        price,

                    commission:
                        commission,

                    image:
                        image,

                    order:
                        Date.now(),

                    createdAt:
                        serverTimestamp()

                }
            );


            document
            .getElementById("taskName")
            .value = "";


            document
            .getElementById("taskPrice")
            .value = "";


            document
            .getElementById(
                "taskCommission"
            )
            .value = "";


            document
            .getElementById("taskImage")
            .value = "";


            document
            .getElementById("imagePreview")
            .style.display =
                "none";


            status.textContent =
                "Task saved successfully ✓";


            await loadTasks();

        }
        catch(error){

            console.error(
                "Save task error:",
                error
            );


            status.textContent =
                error.message;


            alert(
                error.message
            );

        }


        btn.disabled = false;

    }
);


/* =========================
   LOAD TASKS
========================= */

    const list =
        document.getElementById(
            "taskList"
        );


    list.innerHTML =
        "Loading tasks...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "tasks"
                )
            );

            list.innerHTML =

            return;

        }

            item => {

                tasks.push({

                    id:
                        item.id,

                    ...item.data()

            }
        );

            (a,b) =>
                Number(a.order || 0) -
                Number(b.order || 0)
        );


        list.innerHTML = "";


        tasks.forEach(
            task => {

                div.className =
                    "item";


                div.innerHTML = `

                        task.image

                        `
                        <img

                        >
                        `
                        :
                        ""
                    }

                    <h4>
                        ${escapeHTML(
                            task.name ||
                            "Task"
                        )}
                    </h4>

                    <p>
                        Price:
                        PKR ${Number(
                            task.price || 0
