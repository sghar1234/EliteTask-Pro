<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f7edbd;
    color:#3d2d00;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#8c6500,#d8b33d,#9c7100);
    color:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header h2{
    font-size:20px;
}

.logout{
    background:white;
    color:#8b6500;
    border:0;
    padding:9px 13px;
    border-radius:9px;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.card h3{
    margin-bottom:15px;
    color:#715200;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #dbc879;
    border-radius:10px;
    margin-bottom:11px;
    outline:none;
}

.input:focus{
    border-color:#b78a00;
}

.preview{
    width:100%;
    max-height:230px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:12px;
    display:none;
}

.save-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#9d7200,#dfba45,#9d7200);
    color:white;
    font-weight:bold;
    font-size:15px;
}

.task{
    border:1px solid #ead99a;
    border-radius:15px;
    overflow:hidden;
    margin-top:12px;
}

.task img{
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
}

.task-info{
    padding:14px;
}

.task-info h4{
    color:#624700;
    margin-bottom:6px;
}

.task-info p{
    margin-top:4px;
    color:#777;
    font-size:13px;
}

.reply-row{
    display:flex;
    gap:8px;
}

.reply-row input{
    flex:1;
    padding:12px;
    border:1px solid #dbc879;
    border-radius:10px;
}

.reply-btn{
    border:0;
    border-radius:10px;
    padding:0 16px;
    background:#b48600;
    color:white;
}

#status{
    margin-top:10px;
    font-size:13px;
    color:#777;
}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h2>EliteTask Pro Admin</h2>

<button
    class="logout"
    id="logoutBtn"
>
Logout
</button>

</div>


<div class="card">

<h3>Add New Task</h3>


<input
    id="taskName"
    class="input"
    placeholder="Task name"
>


<input
    id="taskPrice"
    class="input"
    type="number"
    placeholder="Task price"
>


<input
    id="taskCommission"
    class="input"
    type="number"
    placeholder="Commission"
>


<input
    id="taskImage"
    class="input"
    type="file"
    accept="image/*"
>


<img
    id="imagePreview"
    class="preview"
    alt="Selected image"
>


<button
    id="saveTask"
    class="save-btn"
    type="button"
>
Save Task
</button>


<div id="status"></div>

</div>


<div class="card">

<h3>Tasks</h3>

<div id="taskList">
Loading tasks...
</div>

</div>


<div class="card">

<h3>Customer Service</h3>


<div class="reply-row">

<input
    id="replyInput"
    placeholder="Type reply..."
    autocomplete="off"
>


<button
    id="replyBtn"
    class="reply-btn"
    type="button"
>
Send
</button>

</div>

</div>


</div>


<script type="module">


import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
        "elitetask-pro.firebaseapp.com",

    projectId:
        "elitetask-pro",

    storageBucket:
        "elitetask-pro.firebasestorage.app",

    messagingSenderId:
        "504295275402",

    appId:
        "1:504295275402:web:cf744a5d4e82c72145a673"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const storage =
    getStorage(app);


const imageInput =
    document.getElementById("taskImage");


const preview =
    document.getElementById("imagePreview");


const status =
    document.getElementById("status");


imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];

        if(!file){

            preview.style.display =
                "none";

            return;

        }


        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

    }
);


document
.getElementById("saveTask")
.addEventListener(
    "click",
    async () => {

        try{

            const name =
                document
                .getElementById("taskName")
                .value
                .trim();


            const price =
                Number(
                    document
                    .getElementById("taskPrice")
                    .value
                );


            const commission =
                Number(
                    document
                    .getElementById("taskCommission")
                    .value
                );


            const file =
                imageInput.files[0];


            if(!name){

                alert("Enter task name.");

                return;

            }


            if(!price){

                alert("Enter task price.");

                return;

            }


            if(!commission){

                alert("Enter commission.");

                return;

            }


            if(!file){

                alert(
                    "Please select an image from Gallery."
                );

                return;

            }


            status.textContent =
                "Uploading image...";


            const safeName =
                file.name
                .replace(
                    /[^a-zA-Z0-9.-]/g,
                    "_"
                );


            const imageRef =
                ref(
                    storage,
                    "tasks/" +
                    Date.now() +
                    "_" +
                    safeName
                );


            await uploadBytes(
                imageRef,
                file
            );


            const imageURL =
                await getDownloadURL(
                    imageRef
                );


            status.textContent =
                "Saving task...";


            await addDoc(
                collection(db,"tasks"),
                {

                    name:name,

                    price:price,

                    commission:commission,

                    image:imageURL,

                    createdAt:
                        serverTimestamp()

                }
            );


            status.textContent =
                "Task saved successfully.";


            document
            .getElementById("taskName")
            .value = "";


            document
            .getElementById("taskPrice")
            .value = "";


            document
            .getElementById("taskCommission")
            .value = "";


            imageInput.value = "";


            preview.src = "";

            preview.style.display =
                "none";


            loadTasks();

        }

        catch(error){

            console.error(error);

            status.textContent =
                error.message;

            alert(
                "Error: " +
                error.message
            );

        }

    }
);


async function loadTasks(){

    const list =
        document.getElementById(
            "taskList"
        );


    list.innerHTML =
        "Loading tasks...";


    try{

        const snapshot =
            await getDocs(
                collection(db,"tasks")
            );


        if(snapshot.empty){

            list.innerHTML =
                "No tasks found.";

            return;

        }


        list.innerHTML = "";


        snapshot.forEach(
            (taskDoc) => {

                const task =
                    taskDoc.data();


                const image =
                    task.image ||
                    task.imageUrl ||
                    task.imageURL ||
                    "";


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "task";


                div.innerHTML = `

                    ${
                        image
                        ?
                        `
                        <img
                            src="${image}"
                            alt="${task.name || "Task"}"
                        >
                        `
                        :
                        ""
                    }

                    <div class="task-info">

                        <h4>
                            ${task.name || "Task"}
                        </h4>

                        <p>
                            Price:
                            ${task.price || 0}
                        </p>

                        <p>
                            Commission:
                            ${task.commission || 0}
                        </p>

                    </div>

                `;


                list.appendChild(div);

            }
        );

    }

    catch(error){

        console.error(error);

        list.innerHTML =
            "Unable to load tasks.";

    }

}


document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async () => {

        await signOut(auth);

        location.href =
            "index.html";

    }
);


onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            location.href =
                "index.html";

            return;

        }


        loadTasks();

    }
);

</script>


</body>

</html>
