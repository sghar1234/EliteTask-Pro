<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}


.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}


.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}


.card h3{
margin-bottom:15px;
color:#2563eb;
}


input, textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
}


button{

width:100%;
background:#2563eb;
color:white;
border:none;
padding:14px;
border-radius:12px;
margin-top:15px;
font-size:16px;

}


.option{

display:block;
background:#2563eb;
color:white;
padding:15px;
border-radius:12px;
margin-top:12px;
text-align:center;
text-decoration:none;

}


</style>

</head>


<body>


<div class="header">
⚙️ EliteTask Pro Admin
</div>



<div class="card">

<h3>Add New Task</h3>


<input type="text" placeholder="Task Name">


<input type="number" placeholder="Task Price">


<input type="number" placeholder="Commission">


<textarea placeholder="Task Description"></textarea>


<button>
Add Task
</button>


</div>



<div class="card">

<h3>Admin Controls</h3>


<a class="option" href="#">
👥 Users Management
</a>


<a class="option" href="#">
📦 Orders Management
</a>


<a class="option" href="#">
💰 Withdraw Requests
</a>


</div>



</body>

</html>
