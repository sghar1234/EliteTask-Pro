<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EliteTask Pro Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f7edbd;
    color:#3d2d00;
    padding:15px 15px 40px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#806000,#d9b43d,#967000);
    color:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:25px;
}

.logout{
    background:white;
    color:#806000;
    border:0;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:15px;
}

.tab{
    padding:12px 4px;
    border:0;
    border-radius:9px;
    background:white;
    color:#725300;
    font-weight:bold;
    font-size:11px;
    cursor:pointer;
}

.tab.active{
    background:#b48600;
    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.10);
}

.card h3{
    color:#715200;
    margin-bottom:14px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #dbc879;
    border-radius:10px;
    margin-bottom:10px;
    outline:none;
    font-size:14px;
}

textarea.input{
    min-height:90px;
    resize:vertical;
}

.preview{
    width:100%;
    max-height:230px;
    object-fit:cover;
    border-radius:14px;
    display:none;
    margin-bottom:10px;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#9d7200,#dfba45,#9d7200);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.main-btn:disabled{
    opacity:.6;
}

.item{
    border:1px solid #ead99a;
    border-radius:14px;
    padding:13px;
    margin-top:10px;
    background:#fffdf7;
}

.item img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:9px;
}

.item h4{
    margin-bottom:6px;
    color:#624700;
}

.item p{
    font-size:13px;
    color:#777;
    margin:5px 0;
}

.row{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.small{
    flex:1;
    padding:10px;
    border:0;
    border-radius:8px;
    background:#b48600;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.small:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.red{
    background:#b33b2e;
}

.green{
    background:#218c55;
}

.blue{
    background:#2868b2;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:#777;
}

.loading{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:15px;
    color:#888;
}

.no-data{
    padding:18px;
    text-align:center;
    color:#888;
    background:white;
    border-radius:14px;
}

.message{
    background:#faf7e8;
    padding:12px;
    border-radius:12px;
    margin-top:9px;
    font-size:13px;
    cursor:pointer;
    border:1px solid #ead99a;
}

.message.selected{
    border:2px solid #2868b2;
}

.message img{
    max-width:180px;
    max-height:180px;
    border-radius:10px;
    margin-top:8px;
}

.support-user-title{
    font-weight:bold;
    color:#624700;
    margin-bottom:8px;
}

.chat-area{
    margin-top:10px;
    max-height:350px;
    overflow-y:auto;
    padding:5px;
}

.chat-message{
    padding:9px 11px;
    border-radius:11px;
    margin-top:6px;
    max-width:90%;
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
}

.chat-user{
    margin-left:auto;
    background:#e4c75e;
    color:white;
}

.chat-admin{
    background:white;
    border:1px solid #ead99a;
}

.reply-box{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.reply-box input{
    flex:1;
    min-width:0;
    padding:11px;
    border:1px solid #dbc879;
    border-radius:9px;
    outline:none;
}

.reply-box button{
    width:55px;
    border:0;
    border-radius:9px;
    background:#2868b2;
    color:white;
    font-weight:bold;
}

.user-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.user-actions button{
    flex:1;
}

.error-box{
    background:#fff0ed;
    border:1px solid #e0a095;
    color:#9b3024;
    padding:14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:380px){

    .header h2{
        font-size:20px;
    }

    .tab{
        font-size:10px;
    }

    .row{
        flex-direction:column;
    }

    .user-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h2>EliteTask Pro Admin</h2>

    <button class="logout" id="logoutBtn">

    </button>
</div>

<!-- TASKS -->

<div class="card">

</div>

<div id="users" class="panel">

<div class="card">

<h3>Users</h3>

<div id="userList">
    Loading users...
</div>

</div>

</div>


<!-- WITHDRAWS -->

<div id="withdraws" class="panel">

<div class="card">

<h3>Withdraw Requests</h3>

<div id="withdrawList">
    Loading withdrawals...
</div>

</div>

</div>


<!-- SUPPORT -->

<div id="support" class="panel">

<div class="card">

<h3>Customer Service</h3>

<div id="supportList">
    Loading messages...
</div>

<div id="selectedSupport"
     style="display:none;margin-top:15px">

    <div
        class="support-user-title"
        id="selectedUserTitle"
    >
        Customer
    </div>

    <div
        id="chatArea"
        class="chat-area"
    ></div>

    <div class="reply-box">

        <input
            id="replyInput"
            type="text"
            placeholder="Type reply..."
        >

        <button id="replyBtn">
            ➤
        </button>

    </div>

    <div
        id="supportStatus"
        class="status"
    ></div>

</div>

</div>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    where,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
    "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
    "elitetask-pro.firebaseapp.com",

    projectId:
    "elitetask-pro",

    storageBucket:
    "elitetask-pro.firebasestorage.app",

    messagingSenderId:
    "504295275402",

    appId:
    "1:504295275402:web:cf744a5d4e82c72145a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ADMIN UID */

const ADMIN_UID =
"BLmacTdfuBVlQ0eEJWsQidnexY02";


let currentAdmin = null;
let selectedUserId = null;


/* SAFE HTML */

function safe(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ERROR */

function showError(element,message){

    element.innerHTML =
    `
    <div class="error-box">
        ${safe(message)}
    </div>
    `;

}


/* AUTH */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            location.href =
            "index.html";

            return;

        }


        /*
        Sirf admin UID ko access
        */

        if(user.uid !== ADMIN_UID){

            alert(
                "Admin access required."
            );

            await signOut(auth);

            location.href =
            "index.html";

            return;

        }


        currentAdmin = user;


        /*
        Firebase load hone ke baad
        Tasks load karo
        */

        await loadTasks();

    },
    error => {

        console.error(
            "Auth error:",
            error
        );

        showError(
            document.getElementById("taskList"),
            error.message
        );

    }
);


/* TABS */

document
.querySelectorAll(".tab")
.forEach(button => {

    button.addEventListener(
        "click",
        async function(){

            const target =
            this.dataset.tab;


            document
            .querySelectorAll(".tab")
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );

            });


            document
            .querySelectorAll(".panel")
            .forEach(panel => {

                panel.classList.remove(
                    "active"
                );

            });


            this.classList.add(
                "active"
            );


            const panel =
            document.getElementById(
                target
            );


            if(panel){

                panel.classList.add(
                    "active"
                );

            }


            if(target === "tasks"){

                await loadTasks();

            }


            if(target === "users"){

                await loadUsers();

            }


            if(target === "withdraws"){

                await loadWithdraws();

            }


            if(target === "support"){

                await loadSupport(
                    selectedUserId
                );

            }

        }
    );

});


/* LOGOUT */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            location.href =
            "index.html";

        }
        catch(error){

            alert(error.message);

        }

    }
);


/* IMAGE PREVIEW */

document
.getElementById("taskImage")
.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];

        const preview =
        document.getElementById(
            "imagePreview"
        );


        if(!file){

            preview.style.display =
            "none";

            preview.removeAttribute("src");

            return;

        }


        preview.src =
        URL.createObjectURL(file);

        preview.style.display =
        "block";

    }
);


/* COMPRESS IMAGE */

function compressImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
            new FileReader();


            reader.onload =
            event => {

                const img =
                new Image();


                img.onload =
                () => {

                    const canvas =
                    document.createElement(
                        "canvas"
                    );


                    let width =
                    img.width;

                    let height =
                    img.height;


                    const max =
                    350;


                    if(
                        width > max ||
                        height > max
                    ){

                        if(width > height){

                            height =
                            height * max / width;

                            width =
                            max;

                        }
                        else{

                            width =
                            width * max / height;

                            height =
                            max;

                        }

                    }


                    canvas.width =
                    Math.round(width);

                    canvas.height =
                    Math.round(height);


                    const ctx =
                    canvas.getContext("2d");


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            0.35
                        )
                    );

                };


                img.onerror =
                () => reject(
                    new Error(
                        "Image could not be loaded."
                    )
                );


                img.src =
                event.target.result;

            };


            reader.onerror =
            () => reject(
                new Error(
                    "Image could not be read."
                )
            );


            reader.readAsDataURL(file);

        }
    );

}


/* SAVE TASK */

document
.getElementById("saveTask")
.addEventListener(
    "click",
    async () => {

        const status =
        document.getElementById(
            "taskStatus"
        );

        const button =
        document.getElementById(
            "saveTask"
        );


        try{

            const name =
            document
            .getElementById("taskName")
            .value
            .trim();


            const price =
            Number(
                document
                .getElementById("taskPrice")
                .value
            );


            const commission =
            Number(
                document
                .getElementById("taskCommission")
                .value
            );


            const file =
            document
            .getElementById("taskImage")
            .files[0];


            if(
                !name ||
                !Number.isFinite(price) ||
                price <= 0 ||
                !Number.isFinite(commission) ||
                commission < 0
            ){

                alert(
                    "Task name, price and commission enter karo."
                );

                return;

            }


            button.disabled =
            true;


            let image = "";


            if(file){

                status.textContent =
                "Compressing image...";

                image =
                await compressImage(file);

            }


            status.textContent =
            "Saving task...";


            await addDoc(
                collection(db,"tasks"),
                {

                    name:
                    name,

                    price:
                    price,

                    commission:
                    commission,

                    image:
                    image,

                    order:
                    Date.now(),

                    createdAt:
                    serverTimestamp()

                }
            );


            status.textContent =
            "Task saved successfully ✓";


            document
            .getElementById("taskName")
            .value = "";


            document
            .getElementById("taskPrice")
            .value = "";


            document
            .getElementById("taskCommission")
            .value = "";


            document
            .getElementById("taskImage")
            .value = "";


            const preview =
            document.getElementById(
                "imagePreview"
            );

            preview.style.display =
            "none";

            preview.removeAttribute("src");


            await loadTasks();

        }
        catch(error){

            console.error(
                "Save task error:",
                error
            );

            status.textContent =
            error.message;

            alert(
                error.message
            );

        }
        finally{

            button.disabled =
            false;

        }

    }
);


/* LOAD TASKS */

async function loadTasks(){

    const list =
    document.getElementById(
        "taskList"
    );


    list.innerHTML =
    '<div class="loading">Loading tasks...</div>';


    try{

        const snap =
        await getDocs(
            collection(
                db,
                "tasks"
            )
        );


        if(snap.empty){

            list.innerHTML =
            '<div class="no-data">No tasks found.</div>';

            return;

        }


        const tasks = [];


        snap.forEach(
            item => {

                tasks.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );


        tasks.sort(
            (a,b) =>
            Number(a.order || 0) -
            Number(b.order || 0)
        );


        list.innerHTML = "";


        tasks.forEach(
            task => {

                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "item";


                div.innerHTML =
                `

                ${
                    task.image
                    ?
                    `<img
                        src="${safe(task.image)}"
                        alt="Task Image"
                    >`
                    :
                    ""
                }

                <h4>
                    ${safe(task.name || "Task")}
                </h4>

                <p>
                    Price:
                    PKR ${Number(task.price || 0).toFixed(2)}
                </p>

                <p>
                    Commission:
                    PKR ${Number(task.commission || 0).toFixed(2)}
                </p>

                <div class="row">

                    <button
                        class="small red delete-task"
                    >
                        Delete
                    </button>

                </div>

                `;


                div
                .querySelector(
                    ".delete-task"
                )
                .addEventListener(
                    "click",
                    async () => {

                        if(
                            !confirm(
                                "Delete this task?"
                            )
                        ){

                            return;

                        }


                        try{

                            await deleteDoc(
                                doc(
                                    db,
                                    "tasks",
                                    task.id
                                )
                            );


                            await loadTasks();

                        }
                        catch(error){

                            alert(
                                error.message
                            );

                        }

                    }
                );


                list.appendChild(div);

            }
        );

    }
    catch(error){

        console.error(
            "Tasks error:",
            error
        );


        showError(
            list,
            "Unable to load tasks: " +
            error.message
        );

    }

}


/* LOAD USERS */

async function loadUsers(){

    const list =
    document.getElementById(
        "userList"
    );


    list.innerHTML =
    '<div class="loading">Loading users...</div>';


    try{

        const snap =
        await getDocs(
            collection(
                db,
                "users"
            )
        );


        if(snap.empty){

            list.innerHTML =
            '<div class="no-data">No users found.</div>';

            return;

        }


        list.innerHTML = "";


        let foundUser = false;


        snap.forEach(
            item => {

                const user =
                item.data();


                if(item.id === ADMIN_UID){

                    return;

                }


                foundUser = true;


                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "item";


                div.innerHTML =
                `

                <h4>
                    ${safe(user.name || "User")}
                </h4>

                <p>
                    Email:
                    ${safe(user.email || "")}
                </p>

                <p>
                    Balance:
                    PKR ${Number(user.balance || 0).toFixed(2)}
                </p>

                <p>
                    Commission:
                    PKR ${Number(user.commission || 0).toFixed(2)}
                </p>

                <input
                    class="input newBalance"
                    type="number"
                    min="0"
                    placeholder="New balance"
                >

                <div class="user-actions">

                    <button
                        class="small green update-balance"
                    >
                        Update Balance
                    </button>

                    <button
                        class="small blue open-support"
                    >
                        Support
                    </button>

                    <button
                        class="small red delete-user"
                    >
                        Delete User
                    </button>

                </div>

                `;


                /* UPDATE BALANCE */

                div
                .querySelector(
                    ".update-balance"
                )
                .addEventListener(
                    "click",
                    async () => {

                        const input =
                        div.querySelector(
                            ".newBalance"
                        );


                        const value =
                        Number(
                            input.value
                        );


                        if(
                            !Number.isFinite(value) ||
                            value < 0
                        ){

                            alert(
                                "Valid balance enter karo."
                            );

                            return;

                        }


                        try{

                            await updateDoc(
                                doc(
                                    db,
                                    "users",
                                    item.id
                                ),
                                {
                                    balance:
                                    value
                                }
                            );


                            alert(
                                "Balance updated successfully."
                            );


                            await loadUsers();

                        }
                        catch(error){

                            console.error(error);

                            alert(
                                error.message
                            );

                        }

                    }
                );


                /* OPEN SUPPORT */

                div
                .querySelector(
                    ".open-support"
                )
                .addEventListener(
                    "click",
                    async () => {

                        selectedUserId =
                        item.id;


                        const supportTab =
                        document.querySelector(
                            '[data-tab="support"]'
                        );


                        if(supportTab){

                            supportTab.click();

                        }


                        await loadSupport(
                            selectedUserId
                        );

                    }
                );


                /* DELETE USER */

                div
                .querySelector(
                    ".delete-user"
                )
                .addEventListener(
                    "click",
                    async () => {

                        if(
                            !confirm(
                                "Delete this user from Firestore?"
                            )
                        ){

                            return;

                        }


                        try{

                            await deleteDoc(
                                doc(
                                    db,
                                    "users",
                                    item.id
                                )
                            );


                            alert(
                                "User deleted from users list."
                            );


                            await loadUsers();

                        }
                        catch(error){

                            console.error(error);

                            alert(
                                error.message
                            );

                        }

                    }
                );


                list.appendChild(div);

            }
        );


        if(!foundUser){

            list.innerHTML =
            '<div class="no-data">No users found.</div>';

        }

    }
    catch(error){

        console.error(
            "Users error:",
            error
        );


        showError(
            list,
            "Unable to load users: " +
            error.message
        );

    }

}


/* LOAD WITHDRAWS */

async function loadWithdraws(){

    const list =
    document.getElementById(
        "withdrawList"
    );


    list.innerHTML =
    '<div class="loading">Loading withdrawals...</div>';


    try{

        const snap =
        await getDocs(
            collection(
                db,
                "withdraws"
            )
        );


        if(snap.empty){

            list.innerHTML =
            '<div class="no-data">No withdrawal requests.</div>';

            return;

        }


        const withdrawals = [];


        snap.forEach(
            item => {

                withdrawals.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );


        withdrawals.sort(
            (a,b) => {

                const aTime =
                a.createdAt?.seconds || 0;

                const bTime =
                b.createdAt?.seconds || 0;

                return bTime - aTime;

            }
        );


        list.innerHTML = "";


        withdrawals.forEach(
            withdrawal => {

                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "item";


                const status =
                String(
                    withdrawal.status ||
                    "pending"
                ).toLowerCase();


                div.innerHTML =
                `

                <h4>
                    Withdrawal Request
                </h4>

                <p>
                    User ID:
                    ${safe(
                        withdrawal.userId ||
                        withdrawal.uid ||
                        ""
                    )}
                </p>

                <p>
                    Amount:
                    PKR ${Number(
                        withdrawal.amount || 0
                    ).toFixed(2)}
                </p>

                <p>
                    Method:
                    ${safe(
                        withdrawal.method ||
                        withdrawal.paymentMethod ||
                        ""
                    )}
                </p>

                <p>
                    Account:
                    ${safe(
                        withdrawal.account ||
                        withdrawal.accountNumber ||
                        ""
                    )}
                </p>

                <p>
                    Status:
                    <b>
                        ${safe(status.toUpperCase())}
                    </b>
                </p>

                <div class="row">

                    <button
                        class="small green approve"
                        ${status !== "pending" ? "disabled" : ""}
                    >
                        Approve
                    </button>

                    <button
                        class="small red reject"
                        ${status !== "pending" ? "disabled" : ""}
                    >
                        Reject
                    </button>

                </div>

                `;


                const approve =
                div.querySelector(
                    ".approve"
                );


                const reject =
                div.querySelector(
                    ".reject"
                );


                approve.addEventListener(
                    "click",
                    async () => {

                        await changeWithdrawStatus(
                            withdrawal.id,
                            "approved"
                        );

                    }
                );


                reject.addEventListener(
                    "click",
                    async () => {

                        await changeWithdrawStatus(
                            withdrawal.id,
                            "rejected"
                        );

                    }
                );


                list.appendChild(div);

            }
        );

    }
    catch(error){

        console.error(
            "Withdraw error:",
            error
        );


        showError(
            list,
            "Unable to load withdrawals: " +
            error.message
        );

    }

}


/* WITHDRAW STATUS */

async function changeWithdrawStatus(
    withdrawId,
    status
){

    try{

        await updateDoc(
            doc(
                db,
                "withdraws",
                withdrawId
            ),
            {

                status:
                status,

                updatedAt:
                serverTimestamp()

            }
        );


        await loadWithdraws();

    }
    catch(error){

        console.error(error);

        alert(
            error.message
        );

    }

}


/* LOAD SUPPORT */

async function loadSupport(
    focusUserId = null
){

    const list =
    document.getElementById(
        "supportList"
    );


    list.innerHTML =
    '<div class="loading">Loading messages...</div>';


    try{

        const snap =
        await getDocs(
            collection(
                db,
                "supportMessages"
            )
        );


        if(snap.empty){

            list.innerHTML =
            '<div class="no-data">No support messages.</div>';

            document
            .getElementById(
                "selectedSupport"
            )
            .style.display =
            "none";

            return;

        }


        const users = {};


        snap.forEach(
            item => {

                const message =
                item.data();


                const uid =
                message.userId ||
                message.uid;


                if(!uid){

                    return;

                }


                if(!users[uid]){

                    users[uid] = [];

                }


                users[uid].push({

                    id:
                    item.id,

                    ...message

                });

            }
        );


        list.innerHTML = "";


        const userIds =
        Object.keys(users);


        if(userIds.length === 0){

            list.innerHTML =
            '<div class="no-data">No support messages.</div>';

            return;

        }


        userIds.forEach(
            uid => {

                const messages =
                users[uid];


                messages.sort(
                    (a,b) =>
                    getTime(a.createdAt) -
                    getTime(b.createdAt)
                );


                const last =
                messages[
                    messages.length - 1
                ];


                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "message";


                div.innerHTML =
                `

                <b>
                    User ID:
                </b>

                ${safe(uid)}

                <br>

                <span style="color:#777">
                    ${safe(
                        last.message ||
                        last.text ||
                        ""
                    )}
                </span>

                `;


                if(
                    focusUserId &&
                    uid === focusUserId
                ){

                    div.classList.add(
                        "selected"
                    );

                }


                div.addEventListener(
                    "click",
                    () => {

                        selectedUserId =
                        uid;


                        document
                        .querySelectorAll(
                            ".message"
                        )
                        .forEach(
                            x =>
                            x.classList.remove(
                                "selected"
                            )
                        );


                        div.classList.add(
                            "selected"
                        );


                        showUserChat(
                            uid,
                            users[uid]
                        );

                    }
                );


                list.appendChild(div);

            }
        );


        if(focusUserId){

            if(users[focusUserId]){

                selectedUserId =
                focusUserId;


                showUserChat(
                    focusUserId,
                    users[focusUserId]
                );

            }

        }

    }
    catch(error){

        console.error(
            "Support error:",
            error
        );


        showError(
            list,
            "Unable to load support: " +
            error.message
        );

    }

}


/* TIME */

function getTime(timestamp){

    if(
        timestamp &&
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }

    if(
        timestamp &&
        timestamp.seconds
    ){

        return Number(
            timestamp.seconds
        ) * 1000;

    }

    return 0;

}


/* SHOW USER CHAT */

function showUserChat(
    uid,
    messages
){

    selectedUserId =
    uid;


    const box =
    document.getElementById(
        "selectedSupport"
    );


    const title =
    document.getElementById(
        "selectedUserTitle"
    );


    const chat =
    document.getElementById(
        "chatArea"
    );


    box.style.display =
    "block";


    title.textContent =
    "Customer: " + uid;


    chat.innerHTML = "";


    messages
    .slice()
    .sort(
        (a,b) =>
        getTime(a.createdAt) -
        getTime(b.createdAt)
    )
    .forEach(
        message => {

            const div =
            document.createElement(
                "div"
            );


            const sender =
            String(
                message.sender ||
                message.from ||
                "user"
            ).toLowerCase();


            div.className =
            "chat-message " +
            (
                sender === "admin" ||
                sender === "support"
                ?
                "chat-admin"
                :
                "chat-user"
            );


            let html =
            safe(
                message.message ||
                message.text ||
                ""
            );


            if(message.image){

                html +=
                `<br>
                <img
                    src="${safe(message.image)}"
                    style="max-width:180px;border-radius:10px;margin-top:8px"
                >`;

            }


            div.innerHTML =
            html;


            chat.appendChild(div);

        }
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/* ADMIN REPLY */

document
.getElementById("replyBtn")
.addEventListener(
    "click",
    async () => {

        const input =
        document.getElementById(
            "replyInput"
        );


        const status =
        document.getElementById(
            "supportStatus"
        );


        const button =
        document.getElementById(
            "replyBtn"
        );


        const text =
        input.value.trim();


        if(!selectedUserId){

            alert(
                "Pehle customer select karo."
            );

            return;

        }


        if(!text){

            alert(
                "Reply likho."
            );

            return;

        }


        button.disabled =
        true;


        try{

            await addDoc(
                collection(
                    db,
                    "supportMessages"
                ),
                {

                    userId:
                    selectedUserId,

                    message:
                    text,

                    sender:
                    "admin",

                    status:
                    "answered",

                    createdAt:
                    serverTimestamp()

                }
            );


            input.value = "";


            status.textContent =
            "Reply sent ✓";


            await loadSupport(
                selectedUserId
            );

        }
        catch(error){

            console.error(
                "Reply error:",
                error
            );


            status.textContent =
            error.message;


            alert(
                error.message
            );

        }
        finally{

            button.disabled =
            false;

        }

    }
);


/* ENTER REPLY */

document
.getElementById("replyInput")
.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();


            document
            .getElementById("replyBtn")
            .click();

        }

    }
);
