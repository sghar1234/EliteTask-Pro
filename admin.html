async function loadUsers(){

'<div class="loading">Loading Users...</div>';


try{

const snap =
await getDocs(
collection(
db,
"users"
)
);


usersList.innerHTML = "";


if(snap.empty){

usersList.innerHTML =
'<div class="empty">No users found.</div>';

return;

}


snap.forEach(
(item)=>{

const u =
item.data();


const name =
u.name ||
"User";


const email =
u.email ||
"";


const balance =
Number(
u.balance || 0
);


const commission =
Number(
u.commission || 0
);


const completed =
Number(
u.completed || 0
);


const role =
u.role ||
"user";


usersList.innerHTML += `

<div class="card">

<h3>
👤 ${escapeHtml(name)}
</h3>

<div class="email">
${escapeHtml(email)}
</div>

<div class="info">

</div>

</div>

</div>

class="edit"
onclick="openEdit('${item.id}')">

✏️ Edit

</button>


<button
class="delete"
onclick="deleteUser('${item.id}')">

🗑️ Delete

</button>

</div>

class="editBox"

Balance
</label>

<input
type="number"
id="bal-${item.id}"
value="${balance}"
>


<label>
Commission
</label>

<input
type="number"

>

Completed
</label>

>

class="saveTask"

async function loadWithdraws(){

withdrawList.innerHTML =
'<div class="loading">Loading Withdraws...</div>';


try{

const snap =
await getDocs(
collection(
db,
"withdraws"
)
);


withdrawList.innerHTML = "";


if(snap.empty){

withdrawList.innerHTML =
'<div class="empty">No withdraw requests.</div>';

return;

}


snap.forEach(
(item)=>{

const w =
item.data();


const amount =
Number(
w.amount || 0
);


const name =
w.name ||
"User";


const email =
w.email ||
"";


const uid =
w.uid ||
"";


const method =
w.method ||
"Not provided";


const account =
w.account ||
"Not provided";


const status =
String(
w.status ||
"pending"
).toLowerCase();


let statusClass =
"pending";


if(status === "approved"){

statusClass =
"approved";

}


if(status === "rejected"){

statusClass =
"rejected";

}


withdrawList.innerHTML += `

<div class="card">

<h3>
💸 Rs ${amount}
</h3>

<div class="email">
👤 ${escapeHtml(name)}
</div>

<div class="email">
📧 ${escapeHtml(email)}
</div>

<div class="info">
🆔 UID:
${escapeHtml(uid)}
</div>

<div class="info">
💳 Method:
${escapeHtml(method)}
</div>

<div class="info">
🏦 Account:
${escapeHtml(account)}
</div>

<div
class="status ${statusClass}">

Status:
${escapeHtml(status)}

</div>


${
status === "pending"
?
`

<div class="actions">

<button
class="approve"
onclick="approveWithdraw('${item.id}')">

✅ Approve

</button>


<button
class="reject"
onclick="rejectWithdraw(
'${item.id}',
'${uid}',
${amount}
)">

❌ Reject

</button>

</div>

`
:
""
}

</div>

`;

});

}
catch(error){

withdrawList.innerHTML = `

<div class="error">

Withdraw Error:

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}

/* =========================
   REJECT WITHDRAW
========================= */

window.rejectWithdraw =
async function(
withdrawId,
uid,
amount
){

if(
!confirm(
"Reject this withdrawal and refund Rs " +
amount +
"?"
)
){

return;

}


try{

const userRef =
doc(
db,
"users",
uid
);


const withdrawRef =
doc(
db,
"withdraws",
withdrawId
);


const userSnap =
await getDoc(
userRef
);


const withdrawSnap =
await getDoc(
withdrawRef
);


if(
!userSnap.exists()
){

throw new Error(
"User not found."
);

}


if(
!withdrawSnap.exists()
){

throw new Error(
"Withdrawal not found."
);

}


const user =
userSnap.data();


const withdrawal =
withdrawSnap.data();


const status =
String(
withdrawal.status ||
"pending"
).toLowerCase();


if(
status !== "pending"
){

throw new Error(
"This withdrawal is already " +
status
);

}


const oldBalance =
Number(
user.balance || 0
);


const newBalance =
oldBalance +
Number(amount || 0);


await updateDoc(

userRef,

{
balance:newBalance
}

);


await updateDoc(

withdrawRef,

{
status:"rejected"
}

);


alert(
"Withdrawal rejected and amount refunded."
);


loadWithdraws();

}
catch(error){

alert(
"Reject failed: " +
error.message
);

}

};

async function addTask(){

const order =
Number(
document.getElementById(
"taskOrder"
).value
);


const name =
document.getElementById(
"taskName"
).value.trim();


const price =
Number(
document.getElementById(
"taskPrice"
).value
);


const commission =
Number(
document.getElementById(
"taskCommission"
).value
);


const image =
document.getElementById(
"taskImage"
).value.trim();


const description =
document.getElementById(
"taskDescription"
).value.trim();


const message =
document.getElementById(
"taskMessage"
);


message.innerText = "";


if(
!order ||
order < 1
){

message.innerText =
"Task number enter karo.";

return;

}


if(!name){

message.innerText =
"Task name enter karo.";

return;

}


if(
price < 0 ||
isNaN(price)
){

message.innerText =
"Valid price enter karo.";

return;

}


if(
commission < 0 ||
isNaN(commission)
){

message.innerText =
"Valid commission enter karo.";

return;

}


const addButton =
document.getElementById(
"addTaskBtn"
);


addButton.disabled = true;

addButton.innerText =
"Publishing...";


try{


const existing =
await getDocs(
collection(
db,
"tasks"
)
);


let duplicate = false;


existing.forEach(
(item)=>{

const data =
item.data();


const existingOrder =
Number(
data.order ||
data.taskNumber ||
data.number ||
0
);


if(
existingOrder === order
){

duplicate = true;

}

});


if(duplicate){

throw new Error(
"Task number " +
order +
" already exists."
);

}


await addDoc(

collection(
db,
"tasks"
),

{

order:order,

taskNumber:order,

name:name,

price:price,

commission:commission,

image:image,

description:description,

createdAt:new Date()

}

);


message.innerText =
"✅ Task published successfully.";

message.style.color =
"#16a34a";


clearTaskForm();

await loadTasks();

}
catch(error){

message.innerText =
"Error: " +
error.message;

message.style.color =
"#dc2626";

}


addButton.disabled = false;

addButton.innerText =
"➕ Publish Task";

}

async function loadTasks(){

tasksList.innerHTML =
'<div class="loading">Loading Tasks...</div>';


try{

const snap =
await getDocs(
collection(
db,
"tasks"
)
);


tasksList.innerHTML = "";


if(snap.empty){

tasksList.innerHTML =
'<div class="empty">No tasks published yet.</div>';

return;

}


const tasks = [];


snap.forEach(
(item)=>{

tasks.push({

id:item.id,

data:item.data()

});

});


tasks.sort(
(a,b)=>{

const orderA =
Number(
a.data.order ||
a.data.taskNumber ||
a.data.number ||
999999
);


const orderB =
Number(
b.data.order ||
b.data.taskNumber ||
b.data.number ||
999999
);


return orderA - orderB;

});


tasks.forEach(
(item)=>{

const task =
item.data;


const order =
Number(
task.order ||
task.taskNumber ||
task.number ||
0
);


const image =
task.image ||
"";


tasksList.innerHTML += `

<div class="card">

${
image
?
`

<img
src="${escapeHtml(image)}"
class="task-image"
onerror="this.style.display='none'"
>

`
:
""
}


<div class="task-number">

TASK ${order}

</div>


<div class="task-name">

${escapeHtml(
task.name ||
"Task"
)}

</div>


<div class="info">

💰 Price:
<b>
Rs ${Number(
task.price || 0
)}
</b>

</div>


<div class="info">

💵 Commission:
<b>
Rs ${Number(
task.commission || 0
)}
</b>

</div>


<div class="info">

📝
${escapeHtml(
task.description ||
"No description"
)}

</div>


<button
class="task-delete"
onclick="deleteTask('${item.id}')">

🗑️ Delete Task

</button>

</div>

`;

});

}
