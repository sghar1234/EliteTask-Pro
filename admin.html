<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - EliteTask Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:15px;
    color:#111827;
}

.header{
    background:#111827;
    color:white;
    padding:20px;
    border-radius:16px;
    font-size:24px;
    font-weight:bold;
    text-align:center;
}

.menu{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.menu button{
    flex:1;
    border:none;
    padding:14px 8px;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    color:white;
    background:#2563eb;
}

.menu button.active{
    background:#111827;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 10px #ddd;
}

.user-card,
.withdraw-card{
    background:white;
    margin-top:12px;
    padding:17px;
    border-radius:13px;
    border:1px solid #eee;
}

.user-name{
    font-size:19px;
    font-weight:bold;
}

.email,
.info{
    margin-top:7px;
    color:#666;
    font-size:14px;
    word-break:break-word;
}

.id{
    margin-top:7px;
    color:#777;
    font-size:11px;
    word-break:break-all;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.label{
    color:#666;
}

.value{
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:15px;
}

button{
    border:none;
    color:white;
    padding:12px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.edit-btn{
    background:#2563eb;
    flex:1;
}

.delete-btn{
    background:#dc2626;
    flex:1;
}

.approve-btn{
    background:#16a34a;
    flex:1;
}

.reject-btn{
    background:#dc2626;
    flex:1;
}

.save-btn{
    background:#16a34a;
    width:100%;
    margin-top:10px;
}

.cancel-btn{
    background:#6b7280;
    width:100%;
    margin-top:8px;
}

.edit-box{
    display:none;
    margin-top:15px;
    padding:14px;
    background:#f3f4f6;
    border-radius:12px;
}

.edit-box label{
    display:block;
    font-size:13px;
    color:#555;
    margin-top:9px;
}

.edit-box input{
    width:100%;
    padding:11px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:7px 12px;
    border-radius:20px;
    background:#f3f4f6;
    font-size:13px;
    font-weight:bold;
}

.pending{
    color:#d97706;
}

.approved{
    color:#16a34a;
}

.rejected{
    color:#dc2626;
}

.loading{
    text-align:center;
    color:#777;
    padding:20px;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

.error{
    text-align:center;
    color:#dc2626;
    padding:20px;
}

.refresh{
    width:100%;
    background:#111827;
    margin-top:12px;
}

.small-title{
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
    ⚙️ EliteTask Pro<br>
    <span style="font-size:15px;">Admin Panel</span>
</div>

<div class="menu">

    <button
        id="usersTab"
        class="active"
        onclick="showSection('users')">
        👥 Users
    </button>

    <button
        id="withdrawTab"
        onclick="showSection('withdraws')">
        💸 Withdraws
    </button>

</div>


<!-- ================= USERS ================= -->

<div id="usersSection" class="section active">

    <div class="card">

        <div class="small-title">
            👥 Users Management
        </div>

        <div id="usersList">
            <div class="loading">
                Loading Users...
            </div>
        </div>

    </div>

</div>


<!-- ================= WITHDRAWS ================= -->

<div id="withdrawsSection" class="section">

    <div class="card">

        <div class="small-title">
            💸 Withdraw Requests
        </div>

        <button
            class="refresh"
            onclick="loadWithdraws()">
            🔄 Refresh Requests
        </button>

        <div id="withdrawsList">
            <div class="loading">
                Loading Withdraw Requests...
            </div>
        </div>

    </div>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    runTransaction
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const usersList =
document.getElementById("usersList");

const withdrawsList =
document.getElementById("withdrawsList");


/* =========================
   SECTION SWITCH
========================= */

window.showSection = function(section){

    document
    .getElementById("usersSection")
    .classList.remove("active");

    document
    .getElementById("withdrawsSection")
    .classList.remove("active");

    document
    .getElementById("usersTab")
    .classList.remove("active");

    document
    .getElementById("withdrawTab")
    .classList.remove("active");


    if(section === "users"){

        document
        .getElementById("usersSection")
        .classList.add("active");

        document
        .getElementById("usersTab")
        .classList.add("active");

    }


    if(section === "withdraws"){

        document
        .getElementById("withdrawsSection")
        .classList.add("active");

        document
        .getElementById("withdrawTab")
        .classList.add("active");

        loadWithdraws();

    }

};


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    try{

        const snapshot =
        await getDocs(
            collection(db,"users")
        );


        usersList.innerHTML="";


        if(snapshot.empty){

            usersList.innerHTML=`
                <div class="empty">
                    No users found.
                </div>
            `;

            return;
        }


        snapshot.forEach((item)=>{

            const user =
            item.data();


            const name =
            user.name || "User";


            const email =
            user.email || "";


            const balance =
            Number(user.balance || 0);


            const commission =
            Number(user.commission || 0);


            const completed =
            Number(user.completed || 0);


            const role =
            user.role || "user";


            usersList.innerHTML += `

            <div class="user-card"
                 id="card-${item.id}">

                <div class="user-name">
                    👤 ${escapeHtml(name)}
                </div>

                <div class="email">
                    📧 ${escapeHtml(email)}
                </div>

                <div class="id">
                    🆔 ${escapeHtml(item.id)}
                </div>


                <div class="row">
                    <span class="label">
                        Balance
                    </span>

                    <span class="value">
                        Rs ${balance}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Commission
                    </span>

                    <span class="value">
                        Rs ${commission}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Completed Tasks
                    </span>

                    <span class="value">
                        ${completed}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Role
                    </span>

                    <span class="value">
                        ${escapeHtml(role)}
                    </span>
                </div>


                <div class="buttons">

                    <button
                        class="edit-btn"
                        onclick="showEdit('${item.id}')">
                        ✏️ Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteUser(
                            '${item.id}',
                            '${escapeJs(email)}'
                        )">
                        🗑️ Delete
                    </button>

                </div>


                <div
                    class="edit-box"
                    id="edit-${item.id}">

                    <label>
                        Balance
                    </label>

                    <input
                        type="number"
                        id="balance-${item.id}"
                        value="${balance}"
                        min="0">


                    <label>
                        Commission
                    </label>

                    <input
                        type="number"
                        id="commission-${item.id}"
                        value="${commission}"
                        min="0">


                    <label>
                        Completed Tasks
                    </label>

                    <input
                        type="number"
                        id="completed-${item.id}"
                        value="${completed}"
                        min="0">


                    <button
                        class="save-btn"
                        onclick="saveUser('${item.id}')">
                        💾 Save Changes
                    </button>


                    <button
                        class="cancel-btn"
                        onclick="hideEdit('${item.id}')">
                        Cancel
                    </button>

                </div>

            </div>

            `;

        });


    }catch(error){

        usersList.innerHTML=`

            <div class="error">

                Error loading users:

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


/* =========================
   EDIT USER
========================= */

window.showEdit = function(id){

    const box =
    document.getElementById(
        "edit-"+id
    );

    if(box){

        box.style.display="block";

    }

};


window.hideEdit = function(id){

    const box =
    document.getElementById(
        "edit-"+id
    );

    if(box){

        box.style.display="none";

    }

};


window.saveUser = async function(id){

    try{

        const balance =
        Number(
            document.getElementById(
                "balance-"+id
            ).value
        );


        const commission =
        Number(
            document.getElementById(
                "commission-"+id
            ).value
        );


        const completed =
        Number(
            document.getElementById(
                "completed-"+id
            ).value
        );


        if(
            balance < 0 ||
            commission < 0 ||
            completed < 0
        ){

            alert(
                "Values cannot be negative."
            );

            return;

        }


        await updateDoc(

            doc(
                db,
                "users",
                id
            ),

            {
                balance:balance,
                commission:commission,
                completed:completed
            }

        );


        alert(
            "User updated successfully!"
        );


        loadUsers();

    }catch(error){

        alert(
            "Update failed: " +
            error.message
        );

    }

};


/* =========================
   DELETE USER
========================= */

window.deleteUser =
async function(id,email){

    const confirmDelete =
    confirm(
        "Delete this user record?\n\n" +
        "Email: " + email
    );


    if(!confirmDelete){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "users",
                id
            )
        );


        alert(
            "User record deleted successfully."
        );


        loadUsers();

    }catch(error){

        alert(
            "Delete failed: " +
            error.message
        );

    }

};


/* =========================
   LOAD WITHDRAWS
========================= */

async function loadWithdraws(){

    withdrawsList.innerHTML=`
        <div class="loading">
            Loading Withdraw Requests...
        </div>
    `;


    try{

        const snapshot =
        await getDocs(
            collection(db,"withdraws")
        );


        withdrawsList.innerHTML="";


        if(snapshot.empty){

            withdrawsList.innerHTML=`

                <div class="empty">
                    No withdraw requests found.
                </div>

            `;

            return;

        }


        let count = 0;


        snapshot.forEach((item)=>{

            const data =
            item.data();


            const amount =
            Number(data.amount || 0);


            const status =
            String(
                data.status || "pending"
            ).toLowerCase();


            const name =
            data.name || "User";


            const email =
            data.email || "";


            const uid =
            data.uid || "";


            const method =
            data.method ||
            data.paymentMethod ||
            "Not provided";


            const account =
            data.account ||
            data.accountNumber ||
            data.wallet ||
            "Not provided";


            let statusClass =
            "pending";


            if(status === "approved"){
                statusClass="approved";
            }


            if(
                status === "rejected" ||
                status === "failed"
            ){
                statusClass="rejected";
            }


            withdrawsList.innerHTML += `

            <div class="withdraw-card">

                <div class="user-name">
                    💸 Rs ${amount}
                </div>


                <div class="email">
                    👤 ${escapeHtml(name)}
                </div>


                <div class="email">
                    📧 ${escapeHtml(email)}
                </div>


                <div class="id">
                    🆔 ${escapeHtml(uid)}
                </div>


                <div class="info">
                    💳 Method:
                    ${escapeHtml(String(method))}
                </div>


                <div class="info">
                    🏦 Account:
                    ${escapeHtml(String(account))}
                </div>


                <div class="status ${statusClass}">
                    Status: ${escapeHtml(status)}
                </div>


                ${
                    status === "pending"
                    ?
                    `

                    <div class="buttons">

                        <button
                            class="approve-btn"
                            onclick="approveWithdraw(
                                '${item.id}'
                            )">
                            ✅ Approve
                        </button>


                        <button
                            class="reject-btn"
                            onclick="rejectWithdraw(
                                '${item.id}'
                            )">
                            ❌ Reject
                        </button>

                    </div>

                    `
                    :
                    ``
                }

            </div>

            `;


            count++;

        });


        if(count === 0){

            withdrawsList.innerHTML=`

                <div class="empty">
                    No requests found.
                </div>

            `;

        }


    }catch(error){

        withdrawsList.innerHTML=`

            <div class="error">

                Error loading requests:

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


/* =========================
   APPROVE WITHDRAW
========================= */

window.approveWithdraw =
async function(withdrawId){

    const yes =
    confirm(
        "Approve this withdrawal?"
    );


    if(!yes){

        return;

    }


    try{

        await runTransaction(
            db,
            async(transaction)=>{

                const withdrawRef =
                doc(
                    db,
                    "withdraws",
                    withdrawId
                );


                const withdrawSnap =
                await transaction.get(
                    withdrawRef
                );


                if(!withdrawSnap.exists()){

                    throw new Error(
                        "Withdraw request not found."
                    );

                }


                const withdraw =
                withdrawSnap.data();


                const currentStatus =
                String(
                    withdraw.status ||
                    "pending"
                ).toLowerCase();


                if(
                    currentStatus !==
                    "pending"
                ){

                    throw new Error(
                        "This request is already processed."
                    );

                }


                const uid =
                withdraw.uid;


                const amount =
                Number(
                    withdraw.amount || 0
                );


                if(!uid){

                    throw new Error(
                        "User UID is missing."
                    );

                }


                if(
                    !amount ||
                    amount <= 0
                ){

                    throw new Error(
                        "Invalid withdrawal amount."
                    );

                }


                const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


                const userSnap =
                await transaction.get(
                    userRef
                );


                if(!userSnap.exists()){

                    throw new Error(
                        "User profile not found."
                    );

                }


                const user =
                userSnap.data();


                const balance =
                Number(
                    user.balance || 0
                );


                if(balance < amount){

                    throw new Error(
                        "Insufficient balance."
                    );

                }


                const newBalance =
                balance - amount;


                transaction.update(
                    userRef,
                    {
                        balance:newBalance
                    }
                );


                transaction.update(
                    withdrawRef,
                    {
                        status:"approved"
                    }
                );

            }
        );


        alert(
            "Withdrawal approved successfully."
        );


        loadWithdraws();
        loadUsers();


    }catch(error){

        alert(
            "Approve failed: " +
            error.message
        );

    }

};


/* =========================
   REJECT WITHDRAW
========================= */
