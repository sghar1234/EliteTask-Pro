<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EliteTask Pro Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f7edbd;
    color:#3d2d00;
    padding:15px 15px 40px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#806000,#d9b43d,#967000);
    color:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;

.header h2{
    font-size:25px;
}

.logout{

    color:#806000;
    border:0;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:15px;
}

.tab{
    padding:12px 4px;
    border:0;
    border-radius:9px;

    color:#725300;
    font-weight:bold;
    font-size:11px;
    cursor:pointer;
}

.tab.active{

    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.10);
}

.card h3{
    color:#715200;
    margin-bottom:14px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #dbc879;
    border-radius:10px;
    margin-bottom:10px;

    font-size:14px;
}

textarea.input{
    min-height:90px;
    resize:vertical;
}

.preview{
    width:100%;
    max-height:230px;
    object-fit:cover;
    border-radius:14px;

    margin-bottom:10px;
}

.main-btn{

.item h4{
    margin-bottom:6px;

}

.item p{
    font-size:13px;
    color:#777;
    margin:5px 0;
}

.row{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.small{
    flex:1;
    padding:10px;
    border:0;
    border-radius:8px;
    background:#b48600;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.small:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.red{
    background:#b33b2e;
}

.green{
    background:#218c55;
}

.blue{
    background:#2868b2;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:#777;
}

.loading{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:15px;
    color:#888;
}

.no-data{
    padding:18px;
    text-align:center;
    color:#888;
    background:white;
    border-radius:14px;
}

.message{
    background:#faf7e8;
    padding:12px;
    border-radius:12px;
    margin-top:9px;
    font-size:13px;
    cursor:pointer;
    border:1px solid #ead99a;
}

.message.selected{
    border:2px solid #2868b2;
}

.message img{
    max-width:180px;
    max-height:180px;
    border-radius:10px;
    margin-top:8px;
}

.support-user-title{
    font-weight:bold;
    color:#624700;
    margin-bottom:8px;
}

.chat-area{
    margin-top:10px;
    max-height:350px;
    overflow-y:auto;
    padding:5px;
}

.chat-message{
    padding:9px 11px;
    border-radius:11px;
    margin-top:6px;
    max-width:90%;
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
}

.chat-user{
    margin-left:auto;
    background:#e4c75e;
    color:white;
}

.chat-admin{
    background:white;
    border:1px solid #ead99a;
}

.reply-box{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.reply-box input{
    flex:1;
    min-width:0;
    padding:11px;
    border:1px solid #dbc879;
    border-radius:9px;
    outline:none;
}

.reply-box button{
    width:55px;
    border:0;
    border-radius:9px;
    background:#2868b2;
    color:white;
    font-weight:bold;
}

.user-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.user-actions button{
    flex:1;
}

.error-box{
    background:#fff0ed;
    border:1px solid #e0a095;
    color:#9b3024;
    padding:14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:380px){

    .header h2{
        font-size:20px;
    }

    .tab{
        font-size:10px;
    }

    .row{
        flex-direction:column;
    }

    .user-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

</div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    where,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
    "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
    "elitetask-pro.firebaseapp.com",

    projectId:
    "elitetask-pro",

    storageBucket:
    "elitetask-pro.firebasestorage.app",

    messagingSenderId:
    "504295275402",

    appId:
    "1:504295275402:web:cf744a5d4e82c72145a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ADMIN UID */

const ADMIN_UID =
"BLmacTdfuBVlQ0eEJWsQidnexY02";


let currentAdmin = null;
let selectedUserId = null;


/* SAFE HTML */

function safe(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ERROR */

function showError(element,message){

    element.innerHTML =
    `
    <div class="error-box">
        ${safe(message)}
    </div>
    `;

}


/* AUTH */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            location.href =
            "index.html";

            return;

        }


        /*
        Sirf admin UID ko access
        */

        if(user.uid !== ADMIN_UID){

            alert(
                "Admin access required."
            );

            await signOut(auth);

            location.href =
            "index.html";

            return;

        }


        currentAdmin = user;


        /*
        Firebase load hone ke baad
        Tasks load karo
        */

        await loadTasks();

    },
    error => {

        console.error(
            "Auth error:",
            error
        );

        showError(
            document.getElementById("taskList"),
            error.message
        );

    }
);


/* TABS */

document
.querySelectorAll(".tab")
.forEach(button => {

    button.addEventListener(
        "click",
        async function(){

            const target =
            this.dataset.tab;


            document
            .querySelectorAll(".tab")
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );

            });


            document
            .querySelectorAll(".panel")
            .forEach(panel => {

                panel.classList.remove(
                    "active"
                );

            });


            this.classList.add(
                "active"
            );


            const panel =
            document.getElementById(
                target
            );


            if(panel){

                panel.classList.add(
                    "active"
                );

            }


            if(target === "tasks"){

                await loadTasks();

            }


            if(target === "users"){

                await loadUsers();

            }


            if(target === "withdraws"){

                await loadWithdraws();

            }


            if(target === "support"){

                await loadSupport(
                    selectedUserId
                );

            }

        }
    );

});


/* LOGOUT */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            location.href =
            "index.html";

        }
        catch(error){

            alert(error.message);

        }

    }
);


/* IMAGE PREVIEW */

document
.getElementById("taskImage")
.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];

        const preview =
        document.getElementById(
            "imagePreview"
        );


        if(!file){

            preview.style.display =
            "none";

            preview.removeAttribute("src");

            return;

        }


        preview.src =
        URL.createObjectURL(file);

        preview.style.display =
        "block";

    }
);


/* COMPRESS IMAGE */

function compressImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
            new FileReader();


            reader.onload =
            event => {

                const img =
                new Image();


                img.onload =
                () => {

                    const canvas =
                    document.createElement(
                        "canvas"
                    );


                    let width =
                    img.width;

                    let height =
                    img.height;


                    const max =
                    350;


                    if(
                        width > max ||
                        height > max
                    ){

                        if(width > height){

                            height =
                            height * max / width;

                            width =
                            max;

                        }
                        else{

                            width =
                            width * max / height;

                            height =
                            max;

                        }

                    }


                    canvas.width =
                    Math.round(width);

                    canvas.height =
                    Math.round(height);


                    const ctx =
                    canvas.getContext("2d");


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            0.35
                        )
                    );

                };


                img.onerror =
                () => reject(
                    new Error(
                        "Image could not be loaded."
                    )
                );


                img.src =
                event.target.result;

            };


            reader.onerror =
            () => reject(
                new Error(
                    "Image could not be read."
                )
            );


            reader.readAsDataURL(file);

        }
    );

}


/* SAVE TASK */

document
.getElementById("saveTask")
.addEventListener(
    "click",
    async () => {

        const status =
        document.getElementById(
            "taskStatus"
        );

        const button =
        document.getElementById(
            "saveTask"
        );


        try{

            const name =
            document
            .getElementById("taskName")
            .value
            .trim();


            const price =
            Number(
                document
                .getElementById("taskPrice")
                .value
            );


            const commission =
            Number(
                document
                .getElementById("taskCommission")
                .value
            );


            const file =
            document
            .getElementById("taskImage")
            .files[0];


            if(
                !name ||
                !Number.isFinite(price) ||
                price <= 0 ||
                !Number.isFinite(commission) ||
                commission < 0
            ){

                alert(
                    "Task name, price and commission enter karo."
                );

                return;

            }


            button.disabled =
            true;


            let image = "";


            if(file){

                status.textContent =
                "Compressing image...";

                image =
                await compressImage(file);

            }


            status.textContent =
            "Saving task...";


            await addDoc(
                collection(db,"tasks"),
                {

                    name:
                    name,

                    price:
                    price,

                    commission:
                    commission,

                    image:
                    image,

                    order:
                    Date.now(),

                    createdAt:
                    serverTimestamp()

                }
            );


            status.textContent =
            "Task saved successfully ✓";


            document
            .getElementById("taskName")
            .value = "";


            document
            .getElementById("taskPrice")
            .value = "";


            document
            .getElementById("taskCommission")
            .value = "";


            document
            .getElementById("taskImage")
            .value = "";


            const preview =
            document.getElementById(
                "imagePreview"
            );

            preview.style.display =
            "none";

            preview.removeAttribute("src");


            await loadTasks();

        }
        catch(error){

            console.error(
                "Save task error:",
                error
            );

            status.textContent =
            error.message;

            alert(
                error.message
            );

        }
        finally{

            button.disabled =
            false;

        }

    }
);


/* LOAD TASKS */

async function loadTasks(){

    const list =
    document.getElementById(
        "taskList"
    );


    list.innerHTML =
    '<div class="loading">Loading tasks...</div>';


    try{

        const snap =
        await getDocs(
            collection(
                db,
                "tasks"
            )
        );


        if(snap.empty){

            list.innerHTML =
            '<div class="no-data">No tasks found.</div>';

            return;

        }


        const tasks = [];


        snap.forEach(
            item => {

                tasks.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );


        tasks.sort(
            (a,b) =>
            Number(a.order || 0) -
            Number(b.order || 0)
        );


        list.innerHTML = "";


        tasks.forEach(
            task => {

                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "item";


                div.innerHTML =
                `

                ${
                    task.image
                    ?
                    `<img
                        src="${safe(task.image)}"
                        alt="Task Image"
                    >`
                    :
                    ""
                }

                <h4>
                    ${safe(task.name || "Task")}
                </h4>

                <p>
                    Price:
                    PKR ${Number(task.price || 0).toFixed(2)}
                </p>

                <p>
                    Commission:
                    PKR ${Number(task.commission || 0).toFixed(2)}
                </p>

                <div class="row">

                    <button
                        class="small red delete-task"
                    >
                        Delete
                    </button>

                </div>

                `;


                div
                .querySelector(
                    ".delete-task"
                )
                .addEventListener(
                    "click",
                    async () => {

                        if(
                            !confirm(
                                "Delete this task?"
                            )
                        ){

                            return;

                        }


                        try{

                            await deleteDoc(
                                doc(
                                    db,
                                    "tasks",
                                    task.id
                                )
                            );


                            await loadTasks();

                        }
                        catch(error){

                            alert(
