<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

h3{
color:#2563eb;
margin-bottom:15px;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
background:#2563eb;
color:white;
border:none;
padding:14px;
margin-top:15px;
border-radius:12px;
font-size:16px;
}

.option{
display:block;
background:#2563eb;
color:white;
padding:15px;
border-radius:12px;
margin-top:12px;
text-align:center;
text-decoration:none;
}

</style>

</head>


<body>


<div class="header">
⚙️ EliteTask Pro Admin
</div>



<div class="card">

<h3>Add New Task</h3>


<input id="taskName" placeholder="Task Name">


<input id="taskPrice" type="number" placeholder="Task Price">


<input id="taskCommission" type="number" placeholder="Commission">


<textarea id="taskDesc" placeholder="Task Description"></textarea>


<button id="addTask">
Add Task
</button>


</div>



<div class="card">

<h3>Admin Controls</h3>


<a class="option" href="users.html">
👥 Users Management
</a>


<a class="option" href="#">
📦 Orders Management
</a>


💰 <a class="option" href="withdraw-admin.html">
💰 Withdraw Requests
</a>


</div>




<script type="module">


import { db } from "./firebase.js";


import {
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



document.getElementById("addTask")
.addEventListener("click",async()=>{


let name=document.getElementById("taskName").value;

let price=document.getElementById("taskPrice").value;

let commission=document.getElementById("taskCommission").value;

let desc=document.getElementById("taskDesc").value;



if(!name || !price || !commission){

alert("Fill all fields");

return;

}



await addDoc(collection(db,"tasks"),{


name:name,

price:Number(price),

commission:Number(commission),

description:desc,

createdAt:serverTimestamp()


});



alert("Task Added Successfully");


});



</script>



</body>
</html>
