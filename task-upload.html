<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Task</title>

<style>
body{
font-family:Arial;
background:#f7edbd;
padding:20px;
}
.box{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:18px;
}
input,button{
width:100%;
padding:13px;
margin:7px 0;
border-radius:10px;
border:1px solid #d8c477;
}
button{
background:#b8860b;
color:white;
font-weight:bold;
border:0;
}
#preview{
width:100%;
max-height:220px;
object-fit:cover;
border-radius:12px;
display:none;
margin-top:10px;
}
#status{
text-align:center;
margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

<h2>EliteTask Pro</h2>

<input id="taskName" placeholder="Task name">

<input
id="taskPrice"
type="number"
placeholder="Task price"
>

<input
id="taskCommission"
type="number"
placeholder="Commission"
>

<input
id="taskImage"
type="file"
accept="image/*"
>

<img id="preview">

<button id="saveBtn">
Save Task
</button>

<div id="status">Ready</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

authDomain:"elitetask-pro.firebaseapp.com",

projectId:"elitetask-pro",

storageBucket:"elitetask-pro.firebasestorage.app",

messagingSenderId:"504295275402",

appId:"1:504295275402:web:cf744a5d4e82c72145a673"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let user=null;


onAuthStateChanged(auth,u=>{

user=u;

document.getElementById("status").textContent=
u ? "Ready" : "Please login";

});


const imageInput=
document.getElementById("taskImage");

const preview=
document.getElementById("preview");


imageInput.onchange=()=>{

const file=imageInput.files[0];

if(file){

preview.src=URL.createObjectURL(file);

preview.style.display="block";

}

};


function makeImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

let w=img.width;
let h=img.height;

const max=300;

if(w>h){

if(w>max){
h=h*max/w;
w=max;
}

}else{

if(h>max){
w=w*max/h;
h=max;
}

}

canvas.width=w;
canvas.height=h;

canvas
.getContext("2d")
.drawImage(img,0,0,w,h);

resolve(
canvas.toDataURL("image/jpeg",0.35)
);

};

img.src=e.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


document
.getElementById("saveBtn")
.onclick=async()=>{

try{

if(!user){

alert("Please login first");

return;

}

const name=
document.getElementById("taskName").value.trim();

const price=
Number(document.getElementById("taskPrice").value);

const commission=
Number(document.getElementById("taskCommission").value);

const file=imageInput.files[0];

if(!name||!price||!commission||!file){

alert("Fill all fields and select image");

return;

}

document.getElementById("status").textContent=
"Saving...";


const image=await makeImage(file);


await addDoc(
collection(db,"tasks"),
{

name:name,

price:price,

commission:commission,

image:image,

createdAt:serverTimestamp(),

createdBy:user.uid

});


document.getElementById("status").textContent=
"Task Saved ✓";


document.getElementById("taskName").value="";
document.getElementById("taskPrice").value="";
document.getElementById("taskCommission").value="";
imageInput.value="";
preview.style.display="none";


}catch(e){

console.error(e);

document.getElementById("status").textContent=
"Error: "+e.message;

}

};

</script>

</body>
</html>
