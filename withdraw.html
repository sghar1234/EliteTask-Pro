<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:8px;
}

input,
select{
width:100%;
padding:13px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
}

button:disabled{
opacity:.6;
}

.message{
margin-top:12px;
text-align:center;
font-size:14px;
font-weight:bold;
}

.success{
color:#16a34a;
}

.error{
color:#dc2626;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
text-decoration:none;
}

.note{
margin-top:10px;
color:#777;
font-size:13px;
}


/* HISTORY */

.history-title{
font-size:20px;
font-weight:bold;
margin-bottom:5px;
}

.history-card{
background:#f9fafb;
border:1px solid #e5e7eb;
padding:15px;
margin-top:12px;
border-radius:12px;
}

.history-amount{
font-size:20px;
font-weight:bold;
color:#111827;
}

.history-row{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:8px;
font-size:14px;
}

.history-label{
color:#777;
}

.history-value{
font-weight:bold;
text-align:right;
word-break:break-word;
}

.status{
display:inline-block;
margin-top:12px;
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.pending{
background:#fef3c7;
color:#b45309;
}

.approved{
background:#dcfce7;
color:#15803d;
}

.rejected{
background:#fee2e2;
color:#dc2626;
}

.history-empty{
text-align:center;
padding:20px;
color:#777;
}

.history-loading{
text-align:center;
padding:20px;
color:#777;
}

</style>

</head>


<body>


<div class="header">
💰 Withdraw
</div>


<!-- BALANCE + WITHDRAW -->

<div class="card">

<p>Available Balance</p>

<div
class="balance"
id="balance">

Loading...

</div>


<p class="note">
Enter the amount you want to withdraw.
</p>


<select id="method">

<option value="">
Select Payment Method
</option>

<option value="EasyPaisa">
EasyPaisa
</option>

<option value="JazzCash">
JazzCash
</option>

<option value="Bank Account">
Bank Account
</option>

</select>


<input
id="account"
type="text"
placeholder="Enter Account / Number"
>


<input
id="amount"
type="number"
placeholder="Enter Amount"
min="1"
>


<button id="withdrawBtn">
Submit Withdraw Request
</button>


<div
id="message"
class="message">
</div>

</div>


<!-- WITHDRAW HISTORY -->

<div class="card">

<div class="history-title">
📋 Withdraw History
</div>

<p class="note">
Your previous withdrawal requests
</p>


<div id="historyList">

<div class="history-loading">
Loading History...
</div>

</div>

</div>


<a
class="back"
href="dashboard.html">

⬅ Back to Dashboard

</a>



<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
query,
where,
getDocs,
runTransaction,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUser = null;

let currentBalance = 0;



const balanceElement =
document.getElementById("balance");

const methodElement =
document.getElementById("method");

const accountElement =
document.getElementById("account");

const amountElement =
document.getElementById("amount");

const withdrawBtn =
document.getElementById("withdrawBtn");

const messageElement =
document.getElementById("message");

const historyList =
document.getElementById("historyList");



/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUser = user;


await loadBalance();

await loadHistory();

});



/* =========================
   LOAD BALANCE
========================= */

async function loadBalance(){

try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

balanceElement.innerText =
"Rs 0";

showMessage(
"User profile not found.",
"error"
);

return;

}


const data =
userSnap.data();


currentBalance =
Number(
data.balance || 0
);


balanceElement.innerText =
"Rs " + currentBalance;


}
catch(error){

balanceElement.innerText =
"Rs 0";

showMessage(
"Unable to load balance.",
"error"
);

}

}



/* =========================
   SUBMIT WITHDRAW
========================= */

withdrawBtn.addEventListener(
"click",
submitWithdraw
);



async function submitWithdraw(){


messageElement.innerText = "";

messageElement.className =
"message";


const method =
methodElement.value;


const account =
accountElement.value.trim();


const amount =
Number(
amountElement.value
);



if(!method){

showMessage(
"Please select a payment method.",
"error"
);

return;

}


if(!account){

showMessage(
"Please enter your account number.",
"error"
);

return;

}


if(!amount || amount <= 0){

showMessage(
"Please enter a valid amount.",
"error"
);

return;

}


if(amount > currentBalance){

showMessage(
"Insufficient balance.",
"error"
);

return;

}


withdrawBtn.disabled = true;

withdrawBtn.innerText =
"Submitting...";


try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const withdrawRef =
doc(
collection(
db,
"withdraws"
)
);



await runTransaction(
db,
async(transaction)=>{


const userSnap =
await transaction.get(
userRef
);


if(!userSnap.exists()){

throw new Error(
"User profile not found."
);

}


const userData =
userSnap.data();


const balance =
Number(
userData.balance || 0
);


if(amount > balance){

throw new Error(
"Insufficient balance."
);

}


const newBalance =
balance - amount;



/* BALANCE DEDUCT */

transaction.update(

userRef,

{
balance:newBalance
}

);



/* WITHDRAW REQUEST */

transaction.set(

withdrawRef,

{

uid:
currentUser.uid,

name:
userData.name || "",

email:
currentUser.email || "",

method:
method,

account:
account,

amount:
amount,

status:
"Pending",

createdAt:
serverTimestamp()

}

);

}

);



/* UPDATE SCREEN */

currentBalance =
currentBalance - amount;


balanceElement.innerText =
"Rs " + currentBalance;



showMessage(
"Withdraw request submitted successfully ✅",
"success"
);


methodElement.value = "";

accountElement.value = "";

amountElement.value = "";



/* REFRESH HISTORY */

await loadHistory();


}
catch(error){

showMessage(
"Error: " + error.message,
"error"
);

}


withdrawBtn.disabled = false;

withdrawBtn.innerText =
"Submit Withdraw Request";

}



/* =========================
   LOAD WITHDRAW HISTORY
========================= */

async function loadHistory(){


historyList.innerHTML = `

<div class="history-loading">
Loading History...
</div>

`;


try{


const q =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
)

);



const snapshot =
await getDocs(q);


historyList.innerHTML = "";


if(snapshot.empty){

historyList.innerHTML = `

<div class="history-empty">

No withdrawal history yet.

</div>

`;

return;

}



/* Convert documents to array */

const withdrawals = [];


snapshot.forEach(
(item)=>{

withdrawals.push({

id:item.id,

data:item.data()

});

});



/* Newest first */

withdrawals.sort(
(a,b)=>{

const timeA =
a.data.createdAt &&
a.data.createdAt.toMillis
?
a.data.createdAt.toMillis()
:
0;


const timeB =
b.data.createdAt &&
b.data.createdAt.toMillis
?
b.data.createdAt.toMillis()
:
0;


return timeB - timeA;

}

);



withdrawals.forEach(
(item)=>{


const data =
item.data;


const amount =
Number(
data.amount || 0
);


const method =
data.method ||
"Not provided";


const account =
data.account ||
"Not provided";


const status =
String(
data.status ||
"Pending"
);


let statusClass =
"pending";


if(
status.toLowerCase()
===
"approved"
){

statusClass =
"approved";

}


if(
status.toLowerCase()
===
"rejected"
){

statusClass =
"rejected";

}



let dateText =
"Date not available";


if(
data.createdAt &&
data.createdAt.toDate
){

const date =
data.createdAt.toDate();


dateText =
date.toLocaleString();

}



historyList.innerHTML += `

<div class="history-card">


<div class="history-amount">

Rs ${amount}

</div>


<div class="history-row">

<span class="history-label">
Payment Method
</span>

<span class="history-value">
${escapeHtml(method)}
</span>

</div>


<div class="history-row">

<span class="history-label">
Account
</span>

<span class="history-value">
${escapeHtml(account)}
</span>

</div>


<div class="history-row">

<span class="history-label">
Date
</span>

<span class="history-value">
${escapeHtml(dateText)}
</span>

</div>


<div
class="status ${statusClass}">

${escapeHtml(status)}

</div>


</div>

`;

});



}
catch(error){


historyList.innerHTML = `

<div class="history-empty">

Unable to load history.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}



/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

messageElement.innerText =
text;

messageElement.className =
"message " + type;

}



/* =========================
   SECURITY DISPLAY
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>


</body>

</html>
