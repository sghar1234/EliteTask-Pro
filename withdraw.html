
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteTask Pro - Withdraw</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#172033;padding-bottom:90px}

.topbar{
height:70px;
background:linear-gradient(135deg,#07152f,#1454a3);
display:flex;align-items:center;justify-content:space-between;
padding:0 17px;color:white
}

.back-btn{
width:43px;height:43px;border-radius:50%;
background:#ffffff24;display:flex;
align-items:center;justify-content:center;
color:white;text-decoration:none;font-size:22px
}

.logo-area{display:flex;align-items:center;gap:9px}
.logo{
width:38px;height:38px;border-radius:12px;
background:linear-gradient(135deg,#2d8cff,#55c8ff);
display:flex;align-items:center;justify-content:center;
font-weight:bold
}
.logo-text{font-size:16px;font-weight:bold}

.container{max-width:600px;margin:auto;padding:18px 15px}
.page-title{margin:5px 2px 18px}
.page-title h2{font-size:22px}
.page-title p{color:#8992a2;font-size:13px;margin-top:5px}

.balance-card{
background:linear-gradient(135deg,#081a3c,#1454a3);
color:white;border-radius:22px;padding:22px;margin-bottom:16px
}
.balance-card span{font-size:12px;opacity:.8}
.balance-card h2{font-size:30px;margin-top:7px}

.form-card,.history-card,.empty{
background:white;border-radius:18px;padding:18px;
box-shadow:0 5px 20px #14285012;margin-bottom:12px
}

.form-title{font-size:16px;margin-bottom:15px;font-weight:bold}
label{display:block;font-size:12px;color:#737e8f;margin-bottom:7px}

select,input{
width:100%;height:48px;border:1px solid #e1e6ee;
border-radius:12px;padding:0 13px;outline:none;
font-size:13px;background:white;margin-bottom:14px
}

select:focus,input:focus{border-color:#2588ed}

.withdraw-btn{
width:100%;height:49px;border:0;border-radius:13px;
background:linear-gradient(135deg,#1478ed,#25a5ff);
color:white;font-size:14px;font-weight:bold
}
.withdraw-btn:disabled{opacity:.6}

.history-title{margin:22px 2px 12px;font-size:17px}
.history-card{padding:15px}
.history-top,.history-bottom{
display:flex;align-items:center;justify-content:space-between;gap:10px
}
.method{font-size:13px;font-weight:bold;overflow-wrap:anywhere}
.amount{font-size:15px;font-weight:bold;color:#e58b00;white-space:nowrap}
.history-bottom{margin-top:8px;font-size:10px;color:#8992a2}

.status{font-weight:bold}
.pending{color:#e58b00}
.approved{color:#16a05d}
.rejected{color:#e23b3b}

.empty{text-align:center;color:#8992a2;font-size:13px;padding:25px}

.bottom-nav{
position:fixed;bottom:0;left:0;right:0;height:73px;
background:white;display:flex;justify-content:space-around;
align-items:center;box-shadow:0 -5px 25px #00000019;z-index:1000
}

.nav-item{
text-decoration:none;color:#8992a2;
display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:4px;width:25%;font-size:10px
}
.nav-item span{font-size:21px}
.nav-item.active{color:#1677e8;font-weight:bold}

.nav-center{
width:55px;height:55px;margin-top:-25px;border-radius:50%;
background:linear-gradient(135deg,#1478ed,#36b4ff);
color:white;display:flex;align-items:center;
justify-content:center;font-size:24px;
border:5px solid #f4f7fb
}

</style>
</head>

<body>

<div class="topbar">
<a href="dashboard.html" class="back-btn">←</a>

<div class="logo-area">
<div class="logo">ET</div>
<div class="logo-text">EliteTask Pro</div>
</div>
</div>

<div class="container">

<div class="page-title">
<h2>Withdraw</h2>
<p>Withdraw your available earnings.</p>
</div>

<div class="balance-card">
<span>Available Balance</span>
<h2 id="balance">$0.00</h2>
</div>

<div class="form-card">

<div class="form-title">Withdrawal Details</div>

<label>Payment Method</label>
<select id="method">
<option value="">Select payment method</option>
<option value="EasyPaisa">EasyPaisa</option>
<option value="JazzCash">JazzCash</option>
<option value="Bank Account">Bank Account</option>
<option value="USDT">USDT</option>
</select>

<label>Account / Wallet Number</label>
<input
type="text"
id="account"
placeholder="Enter account or wallet number"
autocomplete="off"
>

<label>Withdrawal Amount</label>
<input
type="number"
id="amount"
placeholder="Enter amount"
min="0.01"
step="any"
>

<button class="withdraw-btn" id="withdrawBtn" type="button">
Submit Withdrawal
</button>

</div>

<h3 class="history-title">Withdrawal History</h3>

<div id="history">
<div class="empty">Loading history...</div>
</div>

</div>

<div class="bottom-nav">

<a href="dashboard.html" class="nav-item">
<span>⌂</span>Home
</a>

<a href="orders.html" class="nav-item">
<span>▣</span>Tasks
</a>

<a href="support.html" class="nav-item">
<div class="nav-center">💬</div>Support
</a>

<a href="withdraw.html" class="nav-item active">
<span>💳</span>Withdraw
</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",
authDomain: "elitetask-pro.firebaseapp.com",
projectId: "elitetask-pro",
storageBucket: "elitetask-pro.firebasestorage.app",
messagingSenderId: "504295275402",
appId: "1:504295275402:web:8c480445c5510fa645a673"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let availableBalance = 0;

const balanceElement = document.getElementById("balance");
const historyElement = document.getElementById("history");

const methodInput = document.getElementById("method");
const accountInput = document.getElementById("account");
const amountInput = document.getElementById("amount");
const withdrawBtn = document.getElementById("withdrawBtn");


onAuthStateChanged(auth, async user => {

if (!user) {
window.location.href = "index.html";
return;
}

currentUser = user;

await loadUserData();
await loadHistory();

});


async function loadUserData() {

try {

const snap = await getDoc(doc(db, "users", currentUser.uid));

if (!snap.exists()) {
availableBalance = 0;
balanceElement.textContent = "$0.00";
return;
}

const data = snap.data();

const balance = Number(data.balance || 0);
const commission = Number(data.commission || 0);

availableBalance = balance + commission;

balanceElement.textContent = "$" + availableBalance.toFixed(2);

} catch (error) {

console.error("User data error:", error);
balanceElement.textContent = "$0.00";

}

}


withdrawBtn.addEventListener("click", async () => {

const method = methodInput.value;
const account = accountInput.value.trim();
const amount = Number(amountInput.value);

if (!method) {
alert("Please select payment method.");
return;
}

if (!account) {
alert("Please enter your account or wallet number.");
return;
}

if (!Number.isFinite(amount) || amount <= 0) {
alert("Please enter a valid withdrawal amount.");
return;
}

if (amount > availableBalance) {
alert("Insufficient balance.");
return;
}

if (!currentUser) {
alert("Please login first.");
return;
}

try {

withdrawBtn.disabled = true;
withdrawBtn.textContent = "Processing...";

await addDoc(collection(db, "withdraws"), {

userId: currentUser.uid,
method: method,
account: account,
amount: amount,
status: "pending",
createdAt: serverTimestamp()

});

alert("Withdrawal request submitted successfully!");

methodInput.value = "";
accountInput.value = "";
amountInput.value = "";

await loadHistory();

} catch (error) {

console.error("Withdrawal error:", error);
alert("Withdrawal request failed. Please try again.");

} finally {

withdrawBtn.disabled = false;
withdrawBtn.textContent = "Submit Withdrawal";

}

});


async function loadHistory() {

try {

if (!currentUser) return;

const q = query(
collection(db, "withdraws"),
where("userId", "==", currentUser.uid)
);

const snap = await getDocs(q);

if (snap.empty) {

historyElement.innerHTML =
'<div class="empty">No withdrawal history yet.</div>';

return;

}

const records = snap.docs.map(d => ({
id: d.id,
...d.data()
}));

records.sort((a, b) => {

const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;

return tb - ta;

});

historyElement.innerHTML = "";

records.forEach(record => {

const card = document.createElement("div");
card.className = "history-card";

const top = document.createElement("div");
top.className = "history-top";

const method = document.createElement("div");
method.className = "method";

method.textContent =
(record.method || "Payment") + " • " + (record.account || "");

const amount = document.createElement("div");
amount.className = "amount";

amount.textContent =
"$" + Number(record.amount || 0).toFixed(2);

top.append(method, amount);

const bottom = document.createElement("div");
bottom.className = "history-bottom";

const dateText = document.createElement("span");

const date = record.createdAt?.toDate
? record.createdAt.toDate()
: null;

dateText.textContent = date
? date.toLocaleString()
: "Date pending";

const status = document.createElement("span");

const statusValue =
String(record.status || "pending").toLowerCase();

status.className = "status " + (
statusValue === "approved" ? "approved" :
statusValue === "rejected" ? "rejected" :
"pending"
);

status.textContent =
statusValue.charAt(0).toUpperCase() +
statusValue.slice(1);

bottom.append(dateText, status);

card.append(top, bottom);

historyElement.appendChild(card);

});

} catch (error) {

console.error("History error:", error);

historyElement.innerHTML =
'<div class="empty">Could not load withdrawal history.</div>';

}

}

</script>

</body>
</html>
