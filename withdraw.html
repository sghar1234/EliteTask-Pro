<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
query,
where,
getDocs,
runTransaction,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUser = null;

let currentBalance = 0;

let currentCompleted = 0;

let withdrawalCount = 0;

let withdrawUnlocked = false;



const balanceElement =
document.getElementById("balance");

const withdrawStatus =
document.getElementById("withdrawStatus");

const methodElement =
document.getElementById("method");

const accountElement =
document.getElementById("account");

const amountElement =
document.getElementById("amount");

const withdrawBtn =
document.getElementById("withdrawBtn");

const messageElement =
document.getElementById("message");

const historyList =
document.getElementById("historyList");



/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUser = user;


await loadUserAndWithdrawStatus();

await loadHistory();

});



/* =========================
   LOAD USER + STATUS
========================= */

async function loadUserAndWithdrawStatus(){

try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

balanceElement.innerText =
"Rs 0";

withdrawStatus.innerHTML =
"User profile not found.";

withdrawStatus.className =
"locked";

withdrawBtn.disabled = true;

return;

}


const data =
userSnap.data();


currentBalance =
Number(
data.balance || 0
);


currentCompleted =
Number(
data.completed || 0
);


balanceElement.innerText =
"Rs " +
currentBalance;



/*
 * GET USER WITHDRAW HISTORY
 */

const q =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);



/*
 * Only Pending + Approved
 * count as used withdrawal.
 *
 * Rejected request does NOT count,
 * because amount is refunded.
 */

withdrawalCount = 0;


snapshot.forEach(
(item)=>{

const data =
item.data();


const status =
String(
data.status ||
"pending"
).toLowerCase();


if(
status === "pending" ||
status === "approved"
){

withdrawalCount++;

}

});



/*
 * WITHDRAW RULE
 *
 * Task 10 = first withdrawal
 *
 * Task 20 = second withdrawal
 */

withdrawUnlocked = false;


if(
currentCompleted >= 20
){

if(
withdrawalCount < 2
){

withdrawUnlocked = true;

}

}
else if(
currentCompleted >= 10
){

if(
withdrawalCount < 1
){

withdrawUnlocked = true;

}

}



/*
 * SHOW STATUS
 */

if(
withdrawUnlocked
){

if(
currentCompleted >= 20
){

withdrawStatus.innerHTML =
"🎉 20 Tasks Completed!<br><br>" +
"Your 2nd Withdrawal is unlocked.";

}
else{

withdrawStatus.innerHTML =
"🎉 10 Tasks Completed!<br><br>" +
"Your 1st Withdrawal is unlocked.";

}


withdrawStatus.className =
"unlock";


withdrawBtn.disabled = false;

}
else{


withdrawBtn.disabled = true;


if(
currentCompleted < 10
){

const remaining =
10 -
currentCompleted;


withdrawStatus.innerHTML =
"🔒 Withdrawal Locked<br><br>" +
"Complete " +
remaining +
" more task(s) to unlock your 1st withdrawal.";

}
else if(
currentCompleted < 20
){

withdrawStatus.innerHTML =
"🔒 1st Withdrawal Already Used<br><br>" +
"Complete Tasks 11–20 to unlock your 2nd withdrawal.";

}
else{

withdrawStatus.innerHTML =
"🔒 All Withdrawals Used<br><br>" +
"You have completed the available 20-task withdrawal rounds.";

}


withdrawStatus.className =
"locked";

}


}
catch(error){

console.log(error);

balanceElement.innerText =
"Rs 0";

withdrawStatus.innerHTML =
"Unable to check withdrawal status.";

withdrawStatus.className =
"locked";

withdrawBtn.disabled = true;

}

}



/* =========================
   SUBMIT WITHDRAW
========================= */

withdrawBtn.addEventListener(
"click",
submitWithdraw
);



async function submitWithdraw(){


messageElement.innerText = "";

messageElement.className =
"message";


/*
 * SECURITY:
 * Re-check user data and withdrawal
 * status from Firebase before submitting.
 */

try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

showMessage(
"User profile not found.",
"error"
);

return;

}


const userData =
userSnap.data();


const completed =
Number(
userData.completed || 0
);


const balance =
Number(
userData.balance || 0
);



/*
 * CHECK WITHDRAW HISTORY AGAIN
 */

const q =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);


let usedWithdrawals = 0;


snapshot.forEach(
(item)=>{

const data =
item.data();


const status =
String(
data.status ||
"pending"
).toLowerCase();


if(
status === "pending" ||
status === "approved"
){

usedWithdrawals++;

}

});



/*
 * CHECK ROUND
 */

let allowed = false;


if(
completed >= 20 &&
usedWithdrawals < 2
){

allowed = true;

}
else if(
completed >= 10 &&
completed < 20 &&
usedWithdrawals < 1
){

allowed = true;

}


if(!allowed){

if(
completed < 10
){

showMessage(
"Withdrawal locked. Complete 10 tasks first.",
"error"
);

}
else if(
completed < 20
){

showMessage(
"Complete Tasks 11-20 to unlock your 2nd withdrawal.",
"error"
);

}
else{

showMessage(
"All available withdrawals have already been used.",
"error"
);

}

return;

}



/*
 * FORM VALUES
 */

const method =
methodElement.value;


const account =
accountElement.value.trim();


const amount =
Number(
amountElement.value
);



if(!method){

showMessage(
"Please select a payment method.",
"error"
);

return;

}


if(!account){

showMessage(
"Please enter your account number.",
"error"
);

return;

}


if(
!amount ||
amount <= 0
){

showMessage(
"Please enter a valid amount.",
"error"
);

return;

}


if(
amount > balance
){

showMessage(
"Insufficient balance.",
"error"
);

return;

}


withdrawBtn.disabled = true;

withdrawBtn.innerText =
"Submitting...";



/*
 * TRANSACTION
 */

const withdrawRef =
doc(
collection(
db,
"withdraws"
)
);



await runTransaction(
db,
async(transaction)=>{


const freshUserSnap =
await transaction.get(
userRef
);


if(
!freshUserSnap.exists()
){

throw new Error(
"User profile not found."
);

}


const freshUser =
freshUserSnap.data();


const freshBalance =
Number(
freshUser.balance || 0
);


const freshCompleted =
Number(
freshUser.completed || 0
);


if(
freshCompleted < 10
){

throw new Error(
"Complete 10 tasks first."
);

}


/*
 * Deduct balance immediately.
 */

const newBalance =
freshBalance -
amount;


if(
newBalance < 0
){

throw new Error(
"Insufficient balance."
);

}


/*
 * Update user balance.
 */

transaction.update(

userRef,

{

balance:
newBalance

}

);


/*
 * Create withdraw request.
 */

transaction.set(

withdrawRef,

{

uid:
currentUser.uid,

name:
freshUser.name || "",

email:
currentUser.email || "",

method:
method,

account:
account,

amount:
amount,

status:
"Pending",

createdAt:
serverTimestamp()

}

);

}

);



currentBalance =
currentBalance -
amount;


balanceElement.innerText =
"Rs " +
currentBalance;



showMessage(
"Withdraw request submitted successfully ✅",
"success"
);



methodElement.value = "";

accountElement.value = "";

amountElement.value = "";



/*
 * After submitting, lock withdrawal.
 */

withdrawUnlocked = false;

withdrawalCount++;


withdrawBtn.disabled = true;


withdrawStatus.innerHTML =
"⏳ Withdrawal Request Submitted<br><br>" +
"Wait for admin approval.";


withdrawStatus.className =
"locked";



await loadHistory();


}
catch(error){

showMessage(
"Error: " +
error.message,
"error"
);

}


withdrawBtn.innerText =
"Submit Withdraw Request";

}



/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){


historyList.innerHTML = `

<div class="history-loading">
Loading History...
</div>

`;


try{


const q =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);


historyList.innerHTML = "";


if(snapshot.empty){

historyList.innerHTML = `

<div class="history-empty">

No withdrawal history yet.

</div>

`;

return;

}


const withdrawals = [];


snapshot.forEach(
(item)=>{

withdrawals.push({

id:item.id,

data:item.data()

});

});


/*
 * Newest first
 */

withdrawals.sort(
(a,b)=>{

const timeA =
a.data.createdAt &&
a.data.createdAt.toMillis
?
a.data.createdAt.toMillis()
:
0;


const timeB =
b.data.createdAt &&
b.data.createdAt.toMillis
?
b.data.createdAt.toMillis()
:
0;


return timeB - timeA;

}

);



withdrawals.forEach(
(item)=>{


const data =
item.data;


const amount =
Number(
data.amount || 0
);


const method =
data.method ||
"Not provided";


const account =
data.account ||
"Not provided";


const status =
String(
data.status ||
"Pending"
);


let statusClass =
"pending";


if(
status.toLowerCase()
===
"approved"
){

statusClass =
"approved";

}


if(
status.toLowerCase()
===
"rejected"
){

statusClass =
"rejected";

}



let dateText =
"Date not available";


if(
data.createdAt &&
data.createdAt.toDate
){

const date =
data.createdAt.toDate();


dateText =
date.toLocaleString();

}



historyList.innerHTML += `

<div class="history-card">


<div class="history-amount">

Rs ${amount}

</div>


<div class="history-row">

<span class="history-label">
Payment Method
</span>

<span class="history-value">
${escapeHtml(method)}
</span>

</div>


<div class="history-row">

<span class="history-label">
Account
</span>

<span class="history-value">
${escapeHtml(account)}
</span>

</div>


<div class="history-row">

<span class="history-label">
Date
</span>

<span class="history-value">
${escapeHtml(dateText)}
</span>

</div>


<div
class="status ${statusClass}">

${escapeHtml(status)}

</div>


</div>

`;

});



}
catch(error){

historyList.innerHTML = `

<div class="history-empty">

Unable to load history.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}



/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

messageElement.innerText =
text;

messageElement.className =
"message " +
type;

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>


</body>

</html>
```
