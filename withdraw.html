<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteTask Pro - Withdraw</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#172033;padding-bottom:90px}
.topbar{height:70px;background:linear-gradient(135deg,#07152f,#1454a3);display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:white}
.back-btn{width:43px;height:43px;border-radius:50%;background:#ffffff24;display:flex;align-items:center;justify-content:center;color:white;text-decoration:none;font-size:22px}
.logo-area{display:flex;align-items:center;gap:9px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2d8cff,#55c8ff);display:flex;align-items:center;justify-content:center;font-weight:bold}
.logo-text{font-size:16px;font-weight:bold}
.container{max-width:600px;margin:auto;padding:18px 15px}
.page-title{margin:5px 2px 18px}
.page-title h2{font-size:22px}
.page-title p{color:#8992a2;font-size:13px;margin-top:5px}
.balance-card{background:linear-gradient(135deg,#081a3c,#1454a3);color:white;border-radius:22px;padding:22px;margin-bottom:16px}
.balance-card span{font-size:12px;opacity:.8}
.balance-card h2{font-size:30px;margin-top:7px}
.form-card,.history-card,.empty{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 20px #14285012;margin-bottom:12px}
.form-title{font-size:16px;margin-bottom:15px;font-weight:bold}
label{display:block;font-size:12px;color:#737e8f;margin-bottom:7px}
select,input{width:100%;height:48px;border:1px solid #e1e6ee;border-radius:12px;padding:0 13px;outline:none;font-size:14px;background:white;margin-bottom:14px}
select:focus,input:focus{border-color:#2588ed}
.withdraw-btn{width:100%;min-height:49px;border:0;border-radius:13px;background:linear-gradient(135deg,#1478ed,#25a5ff);color:white;font-size:14px;font-weight:bold;cursor:pointer}
.withdraw-btn:disabled{opacity:.6;cursor:not-allowed}
.history-title{margin:22px 2px 12px;font-size:17px}
.history-card{padding:15px}
.history-top,.history-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.method{font-size:13px;font-weight:bold;overflow-wrap:anywhere}
.amount{font-size:15px;font-weight:bold;color:#e58b00;white-space:nowrap}
.history-bottom{margin-top:8px;font-size:10px;color:#8992a2}
.status{font-weight:bold}
.pending{color:#e58b00}
.approved{color:#16a05d}
.rejected{color:#e23b3b}
.empty{text-align:center;color:#8992a2;font-size:13px;padding:25px}
.message{display:none;font-size:13px;margin-bottom:13px;padding:12px;border-radius:10px;line-height:1.5;overflow-wrap:anywhere}
.message.error{display:block;background:#fff0f0;color:#c62828}
.message.success{display:block;background:#e9fff1;color:#168347}
.small-note{font-size:11px;color:#8992a2;line-height:1.5;margin-top:10px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:73px;background:white;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -5px 25px #00000019;z-index:1000}
.nav-item{text-decoration:none;color:#8992a2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:25%;font-size:10px}
.nav-item span{font-size:21px}
.nav-item.active{color:#1677e8;font-weight:bold}
.nav-center{width:55px;height:55px;margin-top:-25px;border-radius:50%;background:linear-gradient(135deg,#1478ed,#36b4ff);color:white;display:flex;align-items:center;justify-content:center;font-size:24px;border:5px solid #f4f7fb}
</style>
</head>

<body>

<div class="topbar">
<a href="dashboard.html" class="back-btn">←</a>
<div class="logo-area">
<div class="logo">ET</div>
<div class="logo-text">EliteTask Pro</div>
</div>
</div>

<div class="container">

<div class="page-title">
<h2>Withdraw</h2>
<p>Submit your withdrawal request and check its status.</p>
</div>

<div class="balance-card">
<span>Available Balance</span>
<h2 id="balance">$0.00</h2>
</div>

<div class="form-card">
<div class="form-title">Withdrawal Details</div>

<div id="message" class="message"></div>

<label>Payment Method</label>
<select id="method">
<option value="">Select payment method</option>
<option value="EasyPaisa">EasyPaisa</option>
<option value="JazzCash">JazzCash</option>
<option value="Bank Account">Bank Account</option>
<option value="USDT">USDT</option>
</select>

<label>Account / Wallet Number</label>
<input type="text" id="account" placeholder="Enter account or wallet number" autocomplete="off">

<button type="button" id="saveAccount" class="withdraw-btn" style="margin-bottom:18px">
Save Account Number
</button>

<label>Withdrawal Amount</label>
<input type="number" id="amount" placeholder="Enter any amount" min="0.01" step="any">

<button class="withdraw-btn" id="withdrawBtn" type="button">
Submit Withdrawal
</button>

<p class="small-note">Your account number is saved on this browser and can be edited whenever needed.</p>
</div>

<h3 class="history-title">Withdrawal History</h3>
<div id="history">
<div class="empty">Loading history...</div>
</div>

</div>

<div class="bottom-nav">
<a href="dashboard.html" class="nav-item"><span>⌂</span>Home</a>
<a href="orders.html" class="nav-item"><span>▣</span>Tasks</a>
<a href="support.html" class="nav-item"><div class="nav-center">💬</div>Support</a>
<a href="withdraw.html" class="nav-item active"><span>💳</span>Withdraw</a>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 collection,
 query,
 where,
 getDocs,
 addDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Apni existing Firebase configuration yahan paste karein */
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "elitetask-pro.firebaseapp.com",
 projectId: "elitetask-pro",
 storageBucket: "elitetask-pro.firebasestorage.app",
 messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
 appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const balanceEl = document.getElementById("balance");
const accountEl = document.getElementById("account");
const methodEl = document.getElementById("method");
const amountEl = document.getElementById("amount");
const withdrawBtn = document.getElementById("withdrawBtn");
const saveAccountBtn = document.getElementById("saveAccount");
const historyEl = document.getElementById("history");
const messageEl = document.getElementById("message");

let currentUser = null;
let availableBalance = 0;

function money(value){
 return "$" + (Number(value)||0).toFixed(2);
}

function showMessage(text,type="error"){
 messageEl.textContent = text;
 messageEl.className = "message " + type;
}

function clearMessage(){
 messageEl.textContent = "";
 messageEl.className = "message";
}

function accountKey(user){
 return "eliteTaskWithdrawAccount_" + user.uid;
}

function methodKey(user){
 return "eliteTaskWithdrawMethod_" + user.uid;
}

/* Account number and payment method stay saved on this browser */
function loadSavedDetails(user){
 const savedAccount = localStorage.getItem(accountKey(user));
 const savedMethod = localStorage.getItem(methodKey(user));

 if(savedAccount !== null) accountEl.value = savedAccount;
 if(savedMethod !== null) methodEl.value = savedMethod;
}

saveAccountBtn.addEventListener("click",()=>{
 clearMessage();

 if(!currentUser){
  showMessage("Please log in first.");
  return;
 }

 const account = accountEl.value.trim();
 const method = methodEl.value;

 if(!method){
  showMessage("Please select a payment method.");
  return;
 }

 if(!account){
  showMessage("Please enter your account or wallet number.");
  return;
 }

 localStorage.setItem(accountKey(currentUser),account);
 localStorage.setItem(methodKey(currentUser),method);

 showMessage("Account number saved successfully. You can edit it anytime.","success");
});

accountEl.addEventListener("input",clearMessage);
methodEl.addEventListener("change",()=>{
 clearMessage();

 if(currentUser){
  localStorage.setItem(methodKey(currentUser),methodEl.value);
 }
});

/* Load balance for display only */
async function loadBalance(user){
 try{
  const snap = await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()){
   availableBalance = 0;
   balanceEl.textContent = money(0);
   return;
  }

  const data = snap.data();

  availableBalance = Number(data.balance ?? data.Balance ?? 0);
  balanceEl.textContent = money(availableBalance);

 }catch(error){
  console.error("Balance error:",error);
  showMessage("Could not load balance. Please check Firebase permissions.");
 }
}

/* Load withdrawal history */
async function loadHistory(user){
 historyEl.innerHTML = '<div class="empty">Loading history...</div>';

 try{
  const q = query(
   collection(db,"withdraws"),
   where("userId","==",user.uid)
  );

  const snap = await getDocs(q);

  if(snap.empty){
   historyEl.innerHTML = '<div class="empty">No withdrawal history yet.</div>';
   return;
  }

  const records = [];

  snap.forEach(item=>{
   records.push({id:item.id,...item.data()});
  });

  records.sort((a,b)=>{
   const aTime = a.createdAt?.toMillis?.() || 0;
   const bTime = b.createdAt?.toMillis?.() || 0;
   return bTime-aTime;
  });

  historyEl.innerHTML = "";

  records.forEach(data=>{
   const status = String(data.status || "pending").toLowerCase();

   let statusClass = "pending";

   if(["approved","success","completed"].includes(status)){
    statusClass = "approved";
   }

   if(["rejected","declined"].includes(status)){
    statusClass = "rejected";
   }

   let dateText = "Date unavailable";

   if(data.createdAt?.toDate){
    dateText = data.createdAt.toDate().toLocaleString();
   }

   const card = document.createElement("div");
   card.className = "history-card";

   const top = document.createElement("div");
   top.className = "history-top";

   const method = document.createElement("div");
   method.className = "method";
   method.textContent = data.method || "Withdrawal";

   const amount = document.createElement("div");
   amount.className = "amount";
   amount.textContent = money(data.amount);

   top.append(method,amount);

   const bottom = document.createElement("div");
   bottom.className = "history-bottom";

   const date = document.createElement("span");
   date.textContent = dateText;

   const statusEl = document.createElement("span");
   statusEl.className = "status " + statusClass;
   statusEl.textContent = status.charAt(0).toUpperCase()+status.slice(1);

   bottom.append(date,statusEl);
   card.append(top,bottom);
   historyEl.appendChild(card);
  });

 }catch(error){
  console.error("History error:",error);
  historyEl.innerHTML = '<div class="empty">History could not load. Please check Firebase permissions.</div>';
 }
}

/* Submit request: no 10,000 limit and no available-balance comparison */
withdrawBtn.addEventListener("click",async()=>{
 clearMessage();

 if(!currentUser){
  showMessage("Please log in first.");
  return;
 }

 const method = methodEl.value;
 const account = accountEl.value.trim();
 const amount = Number(amountEl.value);

 if(!method){
  showMessage("Please select a payment method.");
  return;
 }

 if(!account){
  showMessage("Please enter your account or wallet number.");
  return;
 }

 if(!Number.isFinite(amount) || amount<=0){
  showMessage("Please enter a valid amount greater than zero.");
  return;
 }

 withdrawBtn.disabled = true;
 withdrawBtn.textContent = "Submitting...";

 try{
  localStorage.setItem(accountKey(currentUser),account);
  localStorage.setItem(methodKey(currentUser),method);

  await addDoc(collection(db,"withdraws"),{
   userId:currentUser.uid,
   method:method,
   account:account,
   amount:amount,
   status:"pending",
   createdAt:serverTimestamp()
  });

  amountEl.value = "";

  showMessage("Withdrawal request submitted successfully.","success");

  await loadHistory(currentUser);

 }catch(error){
  console.error("Withdrawal submission error:",error);
  showMessage("Request could not be submitted. Please check Firebase permissions.");
 }finally{
  withdrawBtn.disabled = false;
  withdrawBtn.textContent = "Submit Withdrawal";
 }
});

onAuthStateChanged(auth,async(user)=>{
 if(!user){
  currentUser = null;
  availableBalance = 0;
  balanceEl.textContent = money(0);
  historyEl.innerHTML = '<div class="empty">Please log in to view your withdrawal history.</div>';
  withdrawBtn.disabled = true;
  showMessage("Please log in to continue.");
  return;
 }

 currentUser = user;
 withdrawBtn.disabled = false;

 loadSavedDetails(user);

 await loadBalance(user);
 await loadHistory(user);
});
</script>

</body>
</html>
