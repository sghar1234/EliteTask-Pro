.balance-card{background:linear-gradient(135deg,#081a3c,#1454a3);color:white;border-radius:22px;padding:22px;margin-bottom:16px}
.balance-card span{font-size:12px;opacity:.8}
.balance-card h2{font-size:30px;margin-top:7px}
.form-card,.history-card,.empty{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 20px #14285012;margin-bottom:12px}

label{display:block;font-size:12px;color:#737e8f;margin-bottom:7px}

.withdraw-btn{width:100%;height:49px;border:0;border-radius:13px;background:linear-gradient(135deg,#1478ed,#25a5ff);color:white;font-size:14px;font-weight:bold;cursor:pointer}

.method{font-size:13px;font-weight:bold;overflow-wrap:anywhere}

.history-account{font-size:12px;color:#566174;margin-top:10px;overflow-wrap:anywhere}

.status{font-weight:bold}
.pending{color:#e58b00}

<body>

<div class="logo-text">EliteTask Pro</div>
</div>
</div>

<div class="container">

<div class="page-title">
<h2>Withdraw</h2>
<p>Withdrawal status and history.</p>
</div>

<div class="balance-card">
<span>Available Balance</span>

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 collection,
 query,
 where,
 getDocs,
 addDoc,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Apni asli Firebase configuration yahan paste karein */
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "elitetask-pro.firebaseapp.com",
 projectId: "elitetask-pro",
 storageBucket: "elitetask-pro.firebasestorage.app",
 messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
 appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const balanceEl = document.getElementById("balance");
const accountEl = document.getElementById("account");
const methodEl = document.getElementById("method");
const amountEl = document.getElementById("amount");
const withdrawBtn = document.getElementById("withdrawBtn");
const saveAccountBtn = document.getElementById("saveAccount");
const historyEl = document.getElementById("history");
const messageEl = document.getElementById("message");

let currentUser = null;

function money(value){
 return "$" + (Number(value)||0).toFixed(2);
}

function showMessage(text,type="error"){
 messageEl.textContent = text;
 messageEl.className = "message " + type;
}

function clearMessage(){
 messageEl.textContent = "";
 messageEl.className = "message";
}

/* Load the user's saved withdrawal account from Firebase */
async function loadSavedDetails(user){
 try{
  const userSnap = await getDoc(doc(db,"users",user.uid));

  if(userSnap.exists()){
   const data = userSnap.data();
   accountEl.value = data.withdrawalAccount || "";
   methodEl.value = data.withdrawalMethod || "";
  }else{
   accountEl.value = "";
   methodEl.value = "";
  }
 }catch(error){
  console.error("Saved account load error:",error);
  showMessage("Could not load saved account number. Check Firebase permissions.");
 }
}

/* Save or update account number in the user's Firebase document */
saveAccountBtn.addEventListener("click",async()=>{
 clearMessage();

 if(!currentUser){
  showMessage("Please log in first.");
  return;
 }

 const account = accountEl.value.trim();
 const method = methodEl.value;

 if(!method){
  showMessage("Please select a payment method.");
  return;
 }

 if(!account){
  showMessage("Please enter your account or wallet number.");
  return;
 }

 saveAccountBtn.disabled = true;
 saveAccountBtn.textContent = "Saving...";

 try{
  await setDoc(doc(db,"users",currentUser.uid),{
   withdrawalAccount:account,
   withdrawalMethod:method
  },{merge:true});

  showMessage("Account number saved successfully.","success");
 }catch(error){
  console.error("Account save error:",error);
  showMessage("Account number could not be saved. Check Firebase rules.");
 }finally{
  saveAccountBtn.disabled = false;
  saveAccountBtn.textContent = "Save Account Number";
 }
});

/* Save updated payment method when changed */
methodEl.addEventListener("change",clearMessage);
accountEl.addEventListener("input",clearMessage);

/* Load balance for display */
async function loadBalance(user){
 try{
  const snap = await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()){
   balanceEl.textContent = money(0);
   return;
  }

  const data = snap.data();
  const balance = Number(data.balance ?? data.Balance ?? 0);

  balanceEl.textContent = money(balance);
 }catch(error){
  console.error("Balance load error:",error);
  showMessage("Could not load balance. Check Firebase permissions.");
 }
}

/* Load withdrawal history and show the current saved account number */
async function loadHistory(user){
 historyEl.innerHTML = '<div class="empty">Loading history...</div>';

 try{
  const q = query(
   collection(db,"withdraws"),
   where("userId","==",user.uid)
  );

  const snap = await getDocs(q);

  if(snap.empty){
   historyEl.innerHTML = '<div class="empty">No withdrawal history yet.</div>';
   return;
  }

  const records = [];

  snap.forEach(item=>{
   records.push({id:item.id,...item.data()});
