```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - EliteTask Pro</title>

<style>

*{
margin:0;

box-sizing:border-box;

}

body{

<body>


<div class="header">
💰 Withdraw
</div>


<!-- BALANCE + WITHDRAW -->

<div class="card">

<p>Available Balance</p>

<div
class="balance"
id="balance">

Loading...

</div>


<div
id="withdrawProgress"
class="progress">

Checking withdrawal eligibility...

</div>


<p class="note">
Withdrawal is available after every 10 completed tasks.
</p>


<select id="method">

<option value="">
Select Payment Method
</option>

<option value="EasyPaisa">
EasyPaisa
</option>

<option value="JazzCash">
JazzCash
</option>

<option value="Bank Account">
Bank Account
</option>

</select>


<input
id="account"
type="text"
placeholder="Enter Account / Number"
>


<input
id="amount"
type="number"
placeholder="Enter Amount"
min="1"
>


<button id="withdrawBtn">

Submit Withdraw Request

</button>


<div
id="message"
class="message">
</div>

</div>


<!-- WITHDRAW HISTORY -->

<div class="card">

<div class="history-title">
📋 Withdraw History
</div>

<p class="note">
Your previous withdrawal requests
</p>


<div id="historyList">

<div class="history-loading">
Loading History...
</div>

</div>

</div>


<a
class="back"
href="dashboard.html">

⬅ Back to Dashboard

</a>



<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
query,
where,
getDocs,
runTransaction,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUser = null;

let currentBalance = 0;

let completedTasks = 0;

let withdrawalUsed = 0;

let availableWithdrawals = 0;



const balanceElement =
document.getElementById("balance");

const progressElement =
document.getElementById("withdrawProgress");

const methodElement =
document.getElementById("method");

const accountElement =
document.getElementById("account");

const amountElement =
document.getElementById("amount");

const withdrawBtn =
document.getElementById("withdrawBtn");

const messageElement =
document.getElementById("message");

const historyList =
document.getElementById("historyList");



/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUser = user;


await loadUserData();

await loadHistory();

});



/* =========================
   LOAD USER DATA
========================= */

async function loadUserData(){

try{

const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

balanceElement.innerText =
"Rs 0";

progressElement.innerText =
"User profile not found.";

progressElement.className =
"progress locked";

withdrawBtn.disabled = true;

return;

}


const data =
userSnap.data();


currentBalance =
Number(
data.balance || 0
);


completedTasks =
Number(
data.completed || 0
);


/*
 * withdrawUsed ka matlab:
 * kitni withdrawal opportunities
 * already use ho chuki hain.
 *
 * Agar field pehle nahi hai
 * to 0 se start hogi.
 */

withdrawalUsed =
Number(
data.withdrawalUsed || 0
);


/*
 * Har 10 completed tasks par
 * 1 withdrawal opportunity.
 *
 * Example:
 *
 * 0-9  = 0
 * 10-19 = 1
 * 20-29 = 2
 * 30-39 = 3
 */

const totalMilestones =
Math.floor(
completedTasks / 10
);


/*
 * Available withdrawal opportunities
 */

availableWithdrawals =
totalMilestones -
withdrawalUsed;


if(
availableWithdrawals < 0
){

availableWithdrawals = 0;

}


balanceElement.innerText =
"Rs " + currentBalance;



updateWithdrawalStatus();


}
catch(error){

balanceElement.innerText =
"Rs 0";

progressElement.innerText =
"Unable to load account.";

progressElement.className =
"progress locked";

withdrawBtn.disabled = true;

showMessage(
"Unable to load account.",
"error"
);

}

}



/* =========================
   WITHDRAW STATUS
========================= */

function updateWithdrawalStatus(){


if(
availableWithdrawals > 0
){

progressElement.className =
"progress unlocked";


progressElement.innerHTML =

"✅ Withdrawal Unlocked<br>" +

"Completed Tasks: " +
completedTasks +
"<br>" +

"Available Withdrawals: " +
availableWithdrawals;


withdrawBtn.disabled = false;


}
else{


progressElement.className =
"progress locked";


const nextMilestone =
(Math.floor(completedTasks / 10) + 1) * 10;


const remaining =
nextMilestone -
completedTasks;


progressElement.innerHTML =

"🔒 Withdrawal Locked<br>" +

"Completed Tasks: " +
completedTasks +
"<br>" +

"Complete " +
remaining +
" more task(s) to unlock next withdrawal";


withdrawBtn.disabled = true;

}

}



/* =========================
   SUBMIT WITHDRAW
========================= */

withdrawBtn.addEventListener(
"click",
submitWithdraw
);



async function submitWithdraw(){


messageElement.innerText = "";

messageElement.className =
"message";


if(
availableWithdrawals <= 0
){

showMessage(
"Complete 10 tasks to unlock withdrawal.",
"error"
);

return;

}


const method =
methodElement.value;


const account =
accountElement.value.trim();


const amount =
Number(
amountElement.value
);



if(!method){

showMessage(
"Please select a payment method.",
"error"
);

return;

}


if(!account){

showMessage(
"Please enter your account number.",
"error"
);

return;

}


if(!amount || amount <= 0){

showMessage(
"Please enter a valid amount.",
"error"
);

return;

}


if(amount > currentBalance){

showMessage(
"Insufficient balance.",
"error"
);

return;

}


withdrawBtn.disabled = true;

withdrawBtn.innerText =
"Submitting...";


try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const withdrawRef =
doc(
collection(
db,
"withdraws"
)
);



await runTransaction(
db,
async(transaction)=>{


const userSnap =
await transaction.get(
userRef
);


if(!userSnap.exists()){

throw new Error(
"User profile not found."
);

}


const userData =
userSnap.data();


const balance =
Number(
userData.balance || 0
);


const completed =
Number(
userData.completed || 0
);


const used =
Number(
userData.withdrawalUsed || 0
);


/*
 * Check milestone again
 * inside transaction.
 */

const totalMilestones =
Math.floor(
completed / 10
);


const available =
totalMilestones - used;


if(
available <= 0
){

throw new Error(
"Withdrawal is locked. Complete more tasks."
);

}


if(amount > balance){

throw new Error(
"Insufficient balance."
);

}


const newBalance =
balance - amount;


const newUsed =
used + 1;



/*
 * Balance deduct
 */

transaction.update(

userRef,

{
balance:newBalance,
withdrawalUsed:newUsed
}

);



/*
 * Withdraw request
 */

transaction.set(

withdrawRef,

{

uid:
currentUser.uid,

name:
userData.name || "",

email:
currentUser.email || "",

method:
method,

account:
account,

amount:
amount,

status:
"Pending",

milestone:
used + 1,

completedAtRequest:
completed,

createdAt:
serverTimestamp()

}

);

}

);



/* UPDATE SCREEN */

currentBalance =
currentBalance - amount;


withdrawalUsed =
withdrawalUsed + 1;


availableWithdrawals =
availableWithdrawals - 1;


balanceElement.innerText =
"Rs " + currentBalance;


updateWithdrawalStatus();


showMessage(
"Withdraw request submitted successfully ✅",
"success"
);


methodElement.value = "";

accountElement.value = "";

amountElement.value = "";



/* REFRESH HISTORY */

await loadHistory();


}
catch(error){

showMessage(
"Error: " + error.message,
"error"
);

}


if(
availableWithdrawals > 0
){

withdrawBtn.disabled = false;

}


withdrawBtn.innerText =
"Submit Withdraw Request";

}



/* =========================
   LOAD WITHDRAW HISTORY
========================= */

async function loadHistory(){


historyList.innerHTML = `

<div class="history-loading">
Loading History...
</div>

`;


try{


const q =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
)

);



const snapshot =
await getDocs(q);


historyList.innerHTML = "";


if(snapshot.empty){

historyList.innerHTML = `

<div class="history-empty">

No withdrawal history yet.

</div>

`;

return;

}



/* Convert documents to array */

const withdrawals = [];


snapshot.forEach(
(item)=>{

withdrawals.push({

id:item.id,

data:item.data()

});

});



/* Newest first */

withdrawals.sort(
(a,b)=>{

const timeA =
a.data.createdAt &&
a.data.createdAt.toMillis
?
a.data.createdAt.toMillis()
:
0;


const timeB =
b.data.createdAt &&
b.data.createdAt.toMillis
?
b.data.createdAt.toMillis()
:
0;


return timeB - timeA;

}

);



withdrawals.forEach(
(item)=>{


const data =
item.data;


const amount =
Number(
data.amount || 0
);


const method =
data.method ||
"Not provided";


const account =
data.account ||
"Not provided";


const status =
String(
data.status ||
"Pending"
);


let statusClass =
"pending";


if(
status.toLowerCase()
===
"approved"
){

statusClass =
"approved";

}


if(
status.toLowerCase()
===
"rejected"
){

statusClass =
"rejected";

}



let dateText =
"Date not available";


if(
data.createdAt &&
data.createdAt.toDate
){

const date =
data.createdAt.toDate();


dateText =
date.toLocaleString();

}



historyList.innerHTML += `

<div class="history-card">


<div class="history-amount">

Rs ${amount}

</div>


<div class="history-row">

<span class="history-label">
Payment Method
</span>

<span class="history-value">
${escapeHtml(method)}
</span>

</div>


<div class="history-row">

<span class="history-label">
Account
</span>

<span class="history-value">
${escapeHtml(account)}
</span>

</div>


<div class="history-row">

<span class="history-label">
Milestone
</span>

<span class="history-value">
10 Tasks × ${Number(data.milestone || 1)}
</span>

</div>


<div class="history-row">

<span class="history-label">
Date
</span>

<span class="history-value">
${escapeHtml(dateText)}
</span>

</div>


<div
class="status ${statusClass}">

${escapeHtml(status)}

</div>


</div>

`;

});



}
catch(error){


historyList.innerHTML = `

<div class="history-empty">

Unable to load history.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}



/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

messageElement.innerText =
text;

messageElement.className =
"message " + type;

}



/* =========================
   SECURITY DISPLAY
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>


</body>

</html>
```
