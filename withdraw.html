<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Withdraw</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
    padding-bottom:90px;
}

.topbar{
    height:70px;
    background:linear-gradient(135deg,#07152f,#1454a3);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    color:white;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.back-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:22px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    background:linear-gradient(135deg,#2d8cff,#55c8ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.logo-text{
    font-size:16px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:auto;
    padding:18px 15px;
}

.page-title{
    margin:5px 2px 18px;
}

.page-title h2{
    font-size:22px;
}

.page-title p{
    color:#8992a2;
    font-size:13px;
    margin-top:5px;
}

.balance-card{
    background:linear-gradient(135deg,#081a3c,#1454a3);
    color:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 10px 28px rgba(13,65,140,.22);
    margin-bottom:16px;
}

.balance-card span{
    font-size:12px;
    opacity:.7;
}

.balance-card h2{
    font-size:30px;
    margin-top:7px;
}

.form-card{
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 5px 20px rgba(20,40,80,.07);
}

.form-title{
    font-size:16px;
    margin-bottom:15px;
}

label{
    display:block;
    font-size:12px;
    color:#737e8f;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    height:48px;
    border:1px solid #e1e6ee;
    border-radius:12px;
    padding:0 13px;
    outline:none;
    font-size:13px;
    background:white;
    margin-bottom:14px;
}

select:focus,
input:focus{
    border-color:#2588ed;
}

.withdraw-btn{
    width:100%;
    height:49px;
    border:none;
    border-radius:13px;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    font-size:14px;
    font-weight:bold;
    margin-top:4px;
}

.history-title{
    margin:22px 2px 12px;
    font-size:17px;
}

.history-card{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 18px rgba(20,40,80,.06);
    margin-bottom:10px;
}

.history-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.method{
    font-size:14px;
    font-weight:bold;
}

.amount{
    font-size:15px;
    font-weight:bold;
    color:#e58b00;
}

.history-bottom{
    margin-top:7px;
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:#8992a2;
}

.status{
    font-weight:bold;
}

.pending{
    color:#e58b00;
}

.approved{
    color:#16a05d;
}

.rejected{
    color:#e23b3b;
}

.empty{
    background:white;
    border-radius:18px;
    padding:28px;
    text-align:center;
    color:#8992a2;
    font-size:13px;
}

/* =========================
   WITHDRAW LOCK
========================= */

.withdraw-locked{
    background:white;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(20,40,80,.07);
    margin-bottom:18px;
}

.withdraw-locked-icon{
    font-size:42px;
    margin-bottom:12px;
}

.withdraw-locked h3{
    font-size:20px;
    margin-bottom:8px;
    color:#172033;
}

.withdraw-locked p{
    font-size:13px;
    color:#8992a2;
    line-height:1.5;
}

.withdraw-locked strong{
    color:#1677e8;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:73px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 25px rgba(0,0,0,.10);
    z-index:1000;
    border-top:1px solid #edf0f5;
}

.nav-item{
    text-decoration:none;
    color:#8992a2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:25%;
    font-size:10px;
}

.nav-item span{
    font-size:21px;
}

.nav-item.active{
    color:#1677e8;
    font-weight:bold;
}

.nav-center{
    width:55px;
    height:55px;
    margin-top:-25px;
    border-radius:50%;
    background:linear-gradient(135deg,#1478ed,#36b4ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 8px 20px rgba(20,120,237,.35);
    border:5px solid #f4f7fb;
}

.hidden{
    display:none !important;
}

</style>

</head>

<body>

<div class="topbar">

    <a href="dashboard.html" class="back-btn">
        ←
    </a>

    <div class="logo-area">

        <div class="logo">
            ET
        </div>

        <div class="logo-text">
            EliteTask Pro
        </div>

    </div>

</div>


<div class="container">

    <div class="page-title">

        <h2>
            Withdraw
        </h2>

        <p>
            Request your available earnings.
        </p>

    </div>


    <div class="balance-card">

        <span>
            Available Balance
        </span>

        <h2 id="balance">
            $0.00
        </h2>

    </div>


    <!-- LOCK MESSAGE -->

    <div
        class="withdraw-locked hidden"
        id="withdrawLocked"
    >

        <div class="withdraw-locked-icon">
            🔒
        </div>

        <h3>
            Withdrawal Locked
        </h3>

        <p>
            You must complete
            <strong>10 tasks</strong>
            before you can withdraw your earnings.
        </p>

    </div>


    <!-- WITHDRAW FORM -->

    <div
        class="form-card"
        id="withdrawForm"
    >

        <div class="form-title">
            Withdrawal Details
        </div>


        <label>
            Payment Method
        </label>

        <select id="method">

            <option value="">
                Select payment method
            </option>

            <option value="EasyPaisa">
                EasyPaisa
            </option>

            <option value="JazzCash">
                JazzCash
            </option>

            <option value="Bank Account">
                Bank Account
            </option>

            <option value="USDT">
                USDT
            </option>

        </select>


        <label>
            Account / Wallet Number
        </label>

        <input
            type="text"
            id="account"
            placeholder="Enter account or wallet number"
        >


        <label>
            Withdrawal Amount
        </label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="1"
        >


        <button
            class="withdraw-btn"
            id="withdrawBtn"
            type="button"
        >
            Submit Withdrawal
        </button>

    </div>


    <h3 class="history-title">
        Withdrawal History
    </h3>


    <div id="history">

        <div class="empty">
            Loading history...
        </div>

    </div>

</div>


<div class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item"
    >

        <span>⌂</span>

        Home

    </a>


    <a
        href="orders.html"
        class="nav-item"
    >

        <span>▣</span>

        Tasks

    </a>


    <a
        href="support.html"
        class="nav-item"
    >

        <div class="nav-center">
            💬
        </div>

        Support

    </a>


    <a
        href="withdraw.html"
        class="nav-item active"
        id="withdrawNav"
    >

        <span>💳</span>

        Withdraw

    </a>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    collection,
    addDoc,
    query,
    where,
    orderBy,
    getDocs,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
        "elitetask-pro.firebaseapp.com",

    projectId:
        "elitetask-pro",

    storageBucket:
        "elitetask-pro.firebasestorage.app",

    messagingSenderId:
        "504295275402",

    appId:
        "1:504295275402:web:8c480445c5510fa645a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let currentBalance = 0;

let currentCommission = 0;

let withdrawableBalance = 0;

let completedTasks = 0;

let withdrawalAllowed = false;


/* =========================
   ELEMENTS
========================= */

const balanceElement =
    document.getElementById("balance");

const withdrawForm =
    document.getElementById("withdrawForm");

const withdrawLocked =
    document.getElementById("withdrawLocked");

const withdrawNav =
    document.getElementById("withdrawNav");

const withdrawBtn =
    document.getElementById("withdrawBtn");


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser = user;

        await loadUserData();

        if(withdrawalAllowed){

            showWithdraw();

        }
        else{

            lockWithdraw();

        }

        await loadHistory();

    }
);


/* =========================
   LOAD USER DATA
========================= */

async function loadUserData(){

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snap =
            await getDoc(userRef);


        if(!snap.exists()){

            lockWithdraw();

            return;

        }


        const data =
            snap.data();


        /* =========================
           BALANCE
        ========================= */

        currentBalance =
            Number(
                data.balance || 0
            );


        /* =========================
           COMMISSION
        ========================= */

        currentCommission =
            Number(
                data.commission || 0
            );


        /* =========================
           COMPLETED TASKS
        =========================

           Main field:
           completedTasks

           Extra fallback fields bhi
           rakhe hain taake agar tumhare
           existing user data mein naam
           thora different ho to bhi kaam kare.
        */

        completedTasks =
            Number(
                data.completedTasks ??
                data.completed ??
                data.tasksCompleted ??
                0
            );


        /* =========================
           WITHDRAW BALANCE
        ========================= */

        withdrawableBalance =
            currentBalance +
            currentCommission;


        balanceElement.textContent =
            "$" +
            withdrawableBalance.toFixed(2);


        /* =========================
           10 TASK CHECK
        ========================= */

        if(completedTasks >= 10){

            withdrawalAllowed = true;

        }
        else{

            withdrawalAllowed = false;

        }

    }
    catch(error){

        console.error(
            "User data error:",
            error
        );

        withdrawalAllowed = false;

        lockWithdraw();

    }

}


/* =========================
   SHOW WITHDRAW
========================= */

function showWithdraw(){

    withdrawForm.classList.remove(
        "hidden"
    );

    withdrawLocked.classList.add(
        "hidden"
    );

    withdrawNav.classList.remove(
        "hidden"
    );

}


/* =========================
   LOCK WITHDRAW
========================= */

function lockWithdraw(){

    withdrawalAllowed = false;

    withdrawForm.classList.add(
        "hidden"
    );

    withdrawLocked.classList.remove(
        "hidden"
    );

    /*
    Bottom navigation se bhi
    Withdraw option hide.
    */

    withdrawNav.classList.add(
        "hidden"
    );

}


/* =========================
   SUBMIT WITHDRAW
========================= */

withdrawBtn.addEventListener(
    "click",
    async () => {

        /*
        IMPORTANT SECURITY CHECK

        Agar user ke 10 tasks complete
        nahi hue to request bilkul
        submit nahi hogi.
        */

        if(!withdrawalAllowed){

            alert(
                "Withdrawal unlock hone ke liye pehle 10 tasks complete karo."
            );

            return;

        }


        /*
        Firebase se dobara user data
        check kar rahe hain.

        Isse page old value par
        withdrawal submit nahi karega.
        */

        try{

            const latestUserRef =
                doc(
                    db,
                    "users",
                    currentUser.uid
                );


            const latestSnap =
                await getDoc(
                    latestUserRef
                );


            if(!latestSnap.exists()){

                alert(
                    "User account data nahi mila."
                );

                return;

            }


            const latestData =
                latestSnap.data();


            const latestCompletedTasks =
                Number(
                    latestData.completedTasks ??
                    latestData.completed ??
                    latestData.tasksCompleted ??
                    0
                );


            /*
            FINAL 10 TASK CHECK
            */

            if(latestCompletedTasks < 10){

                alert(
                    "Pehle 10 tasks complete karo. Withdrawal abhi locked hai."
                );

                lockWithdraw();

                return;

            }


            const method =
                document
                .getElementById("method")
                .value;


            const account =
                document
                .getElementById("account")
                .value
                .trim();


            const amount =
                Number(
                    document
                    .getElementById("amount")
                    .value
                );


            if(!method){

                alert(
                    "Payment method select karo."
                );

                return;

            }


            if(!account){

                alert(
                    "Account number enter karo."
                );

                return;

            }


            if(!amount || amount <= 0){

                alert(
                    "Valid amount enter karo."
                );

                return;

            }


            /*
            Latest balance + commission
            */

            const latestBalance =
                Number(
                    latestData.balance || 0
                );


            const latestCommission =
                Number(
                    latestData.commission || 0
                );


            const latestWithdrawable =
                latestBalance +
                latestCommission;


            if(amount > latestWithdrawable){

                alert(
                    "Available balance kam hai."
                );

                return;

            }


            withdrawBtn.disabled = true;

            withdrawBtn.textContent =
                "Submitting...";


            /*
            =========================
            CREATE WITHDRAW REQUEST
            =========================
            */

            await addDoc(

                collection(
                    db,
                    "withdraws"
                ),

                {

                    userId:
                        currentUser.uid,

                    email:
                        currentUser.email || "",

                    method:
                        method,

                    account:
                        account,

                    amount:
                        amount,

                    status:
                        "pending",

                    completedTasks:
                        latestCompletedTasks,

                    createdAt:
                        serverTimestamp()

                }

            );


            /*
            =========================
            DEDUCT BALANCE
            =========================

            Pehle balance se deduction.

            Agar balance kam hua to
            commission se remaining amount
            deduct hoga.
            */


            let remainingAmount =
                amount;


            let newBalance =
                latestBalance;


            let newCommission =
                latestCommission;


            /*
            STEP 1
            Balance deduction
            */

            if(newBalance >= remainingAmount){

                newBalance =
                    newBalance -
                    remainingAmount;

                remainingAmount = 0;

            }
            else{

                remainingAmount =
                    remainingAmount -
                    newBalance;

                newBalance = 0;

            }


            /*
            STEP 2
            Commission deduction
            */

            if(remainingAmount > 0){

                newCommission =
                    newCommission -
                    remainingAmount;

                remainingAmount = 0;

            }


            /*
            Firebase update
            */

            await updateDoc(

                latestUserRef,

                {

                    balance:
                        newBalance,

                    commission:
                        newCommission

                }

            );


            /*
            Local values update
            */

            currentBalance =
                newBalance;


            currentCommission =
                newCommission;


            withdrawableBalance =
                currentBalance +
                currentCommission;


            balanceElement.textContent =
                "$" +
                withdrawableBalance.toFixed(2);


            /*
            Clear form
            */

            document
            .getElementById("method")
            .value = "";


            document
            .getElementById("account")
            .value = "";


            document
            .getElementById("amount")
            .value = "";


            alert(
                "Withdrawal request submit ho gayi."
            );


            await loadHistory();

        }
        catch(error){

            console.error(
                "Withdrawal error:",
                error
            );

            alert(
                "Withdrawal submit nahi ho saki."
            );

        }


        withdrawBtn.disabled = false;

        withdrawBtn.textContent =
            "Submit Withdrawal";

    }
);


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

    const history =
        document.getElementById(
            "history"
        );


    try{

        const ref =
            collection(
                db,
                "withdraws"
            );


        const q =
            query(
                ref,

                where(
                    "userId",
                    "==",
                    currentUser.uid
                ),

                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(q);


        history.innerHTML = "";


        if(snapshot.empty){

            history.innerHTML = `

                <div class="empty">

                    No withdrawal history yet.

                </div>

            `;

            return;

        }


        snapshot.forEach(
            (item) => {

                const data =
                    item.data();


                const amount =
                    Number(
                        data.amount || 0
                    );


                const status =
                    data.status ||
                    "pending";


                const date =
                    data.createdAt
                    ?.toDate
                    ? data.createdAt
                        .toDate()
                        .toLocaleString()
                    : "Just now";


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "history-card";


                card.innerHTML = `

                    <div class="history-top">

                        <div class="method">
                            ${data.method || "Payment"}
                        </div>

                        <div class="amount">
                            $${amount.toFixed(2)}
                        </div>

                    </div>

                    <div class="history-bottom">

                        <span>
                            ${date}
                        </span>

                        <span class="status ${status}">
                            ${status.toUpperCase()}
                        </span>

                    </div>

                `;


                history.appendChild(
                    card
                );

            }
        );

    }
    catch(error){

        console.error(
            "History error:",
            error
        );


        history.innerHTML = `

            <div class="empty">

                Withdrawal history load nahi ho saki.

            </div>

        `;

    }

}

</script>

</body>
</html>
