<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:8px;
}

.progress{
margin-top:12px;
padding:13px;
background:#eff6ff;
border-radius:10px;
color:#1d4ed8;
font-size:14px;
font-weight:bold;
}

.withdraw-lock{
margin-top:12px;
padding:13px;
background:#fff7ed;
border-radius:10px;
color:#c2410c;
font-size:14px;
font-weight:bold;
}

.withdraw-ready{
margin-top:12px;
padding:13px;
background:#dcfce7;
border-radius:10px;
color:#15803d;
font-size:14px;
font-weight:bold;
}

input,
select{
width:100%;
padding:13px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
}

button:disabled{
opacity:.6;
}

.message{
margin-top:12px;
text-align:center;
font-size:14px;
font-weight:bold;
}

.success{
color:#16a34a;
}

.error{
color:#dc2626;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
text-decoration:none;
}

.note{
margin-top:10px;
color:#777;
font-size:13px;
}

.history-title{
font-size:20px;
font-weight:bold;
margin-bottom:5px;
}

.history-card{
background:#f9fafb;
border:1px solid #e5e7eb;
padding:15px;
margin-top:12px;
border-radius:12px;
}

.history-amount{
font-size:20px;
font-weight:bold;
color:#111827;
}

.history-row{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:8px;
font-size:14px;
}

.history-label{
color:#777;
}

.history-value{
font-weight:bold;
text-align:right;
word-break:break-word;
}

.status{
display:inline-block;
margin-top:12px;
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.pending{
background:#fef3c7;
color:#b45309;
}

.approved{
background:#dcfce7;
color:#15803d;
}

.rejected{
background:#fee2e2;
color:#dc2626;
}

.history-empty,
.history-loading{
text-align:center;
padding:20px;
color:#777;
}

</style>

</head>

<body>

<div class="header">
💰 Withdraw
</div>

<div class="card">

<p>Available Balance</p>

<div
class="balance"
id="balance">

Loading...

</div>

<div
class="progress"
id="progressBox">

Loading task progress...

</div>

<div
id="withdrawStatus">

</div>

<p class="note">

Withdraw sirf har 10 completed tasks ke baad available hoga.

</p>

<select id="method">

<option value="">
Select Payment Method
</option>

<option value="EasyPaisa">
EasyPaisa
</option>

<option value="JazzCash">
JazzCash
</option>

<option value="Bank Account">
Bank Account
</option>

</select>

<input
id="account"
type="text"
placeholder="Enter Account / Number"

>

<input
id="amount"
type="number"
placeholder="Enter Amount"
min="1"

>

<button
id="withdrawBtn">

Submit Withdraw Request

</button>

<div
id="message"
class="message">

</div>

</div>

<div class="card">

<div class="history-title">
📋 Withdraw History
</div>

<p class="note">
Your previous withdrawal requests
</p>

<div id="historyList">

<div class="history-loading">
Loading History...
</div>

</div>

</div>

<a
class="back"
href="dashboard.html">

⬅ Back to Dashboard

</a>

<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
doc,
getDoc,
collection,
query,
where,
getDocs,
runTransaction,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


let currentUser = null;

let currentBalance = 0;

let currentCompleted = 0;

let currentMilestone = 0;


const balanceElement =
document.getElementById("balance");

const progressBox =
document.getElementById("progressBox");

const withdrawStatus =
document.getElementById("withdrawStatus");

const methodElement =
document.getElementById("method");

const accountElement =
document.getElementById("account");

const amountElement =
document.getElementById("amount");

const withdrawBtn =
document.getElementById("withdrawBtn");

const messageElement =
document.getElementById("message");

const historyList =
document.getElementById("historyList");


/* =========================
   LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href =
"index.html";

return;

}

currentUser = user;

await loadUser();

await loadHistory();

}
);


/* =========================
   LOAD USER
========================= */

async function loadUser(){

try{

const userRef =
doc(
db,
"users",
currentUser.uid
);

const userSnap =
await getDoc(userRef);

if(!userSnap.exists()){

balanceElement.innerText =
"Rs 0";

showMessage(
"User profile not found.",
"error"
);

return;

}

const data =
userSnap.data();


currentBalance =
Number(
data.balance || 0
);


currentCompleted =
Number(
data.completed || 0
);


/*
 * Withdraw milestones:
 *
 * 10
 * 20
 * 30
 * 40...
 */

currentMilestone =
Math.floor(
currentCompleted / 10
) * 10;


balanceElement.innerText =
"Rs " +
currentBalance;


updateWithdrawStatus();


}
catch(error){

balanceElement.innerText =
"Rs 0";

showMessage(
"Unable to load account.",
"error"
);

}

}


/* =========================
   WITHDRAW STATUS
========================= */

async function updateWithdrawStatus(){

if(currentCompleted < 10){

const remaining =
10 - currentCompleted;


progressBox.innerText =
"📊 Completed: " +
currentCompleted +
"/10 tasks";


withdrawStatus.innerHTML = `

<div class="withdraw-lock">

🔒 Withdraw Locked

<br><br>

Complete ${remaining} more task(s) to unlock your first withdrawal.

</div>

`;

withdrawBtn.disabled = true;

return;

}


/*
 * Current milestone
 */

const milestone =
currentMilestone;


/*
 * Check whether this milestone
 * already has pending/approved withdrawal.
 */

try{

const q =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
),

where(
"milestone",
"==",
milestone
)

);


const snapshot =
await getDocs(q);


let alreadyUsed = false;


snapshot.forEach(
(item)=>{

const data =
item.data();


const status =
String(
data.status || ""
).toLowerCase();


/*
 * Rejected withdrawal does not
 * permanently block the milestone.
 */

if(
status === "pending" ||
status === "approved"
){

alreadyUsed = true;

}

});


progressBox.innerText =
"📊 Completed: " +
currentCompleted +
" tasks";


if(alreadyUsed){

withdrawStatus.innerHTML = `

<div class="withdraw-lock">

🔒 ${milestone} Tasks Withdrawal Already Used

<br><br>

Complete next 10 tasks to unlock another withdrawal.

</div>

`;

withdrawBtn.disabled = true;

}
else{

withdrawStatus.innerHTML = `

<div class="withdraw-ready">

✅ Withdraw Unlocked

<br><br>

You completed ${milestone} tasks.

You can submit your withdrawal now.

</div>

`;

withdrawBtn.disabled = false;

}

}
catch(error){

withdrawStatus.innerHTML = `

<div class="withdraw-lock">

Unable to check withdrawal status.

</div>

`;

withdrawBtn.disabled = true;

}

}


/* =========================
   SUBMIT WITHDRAW
========================= */

withdrawBtn.addEventListener(
"click",
submitWithdraw
);


async function submitWithdraw(){

messageElement.innerText = "";

messageElement.className =
"message";


/*
 * Double-check task milestone
 */

if(
currentCompleted < 10 ||
currentCompleted % 10 !== 0
){

showMessage(
"Withdraw sirf 10, 20, 30... completed tasks par available hai.",
"error"
);

return;

}


const method =
methodElement.value;


const account =
accountElement.value.trim();


const amount =
Number(
amountElement.value
);


if(!method){

showMessage(
"Please select a payment method.",
"error"
);

return;

}


if(!account){

showMessage(
"Please enter your account number.",
"error"
);

return;

}


if(
!amount ||
amount <= 0
){

showMessage(
"Please enter a valid amount.",
"error"
);

return;

}


if(
amount > currentBalance
){

showMessage(
"Insufficient balance.",
"error"
);

return;

}


withdrawBtn.disabled = true;

withdrawBtn.innerText =
"Submitting...";


try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const withdrawRef =
doc(
collection(
db,
"withdraws"
)
);


/*
 * Transaction
 */

await runTransaction(
db,
async(transaction)=>{


const userSnap =
await transaction.get(
userRef
);


if(
!userSnap.exists()
){

throw new Error(
"User profile not found."
);

}


const userData =
userSnap.data();


const balance =
Number(
userData.balance || 0
);


const completed =
Number(
userData.completed || 0
);


if(
completed < 10 ||
completed % 10 !== 0
){

throw new Error(
"Withdraw is only available after every 10 completed tasks."
);

}


const milestone =
Math.floor(
completed / 10
) * 10;


/*
 * Check previous withdrawal
 */

const existingQuery =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
),

where(
"milestone",
"==",
milestone
)

);


const existingSnapshot =
await getDocs(
existingQuery
);


let alreadyUsed = false;


existingSnapshot.forEach(
(item)=>{

const oldData =
item.data();


const oldStatus =
String(
oldData.status || ""
).toLowerCase();


if(
oldStatus === "pending" ||
oldStatus === "approved"
){

alreadyUsed = true;

}

});


if(alreadyUsed){

throw new Error(
"This 10-task withdrawal has already been used."
);

}


if(
amount > balance
){

throw new Error(
"Insufficient balance."
);

}


const newBalance =
balance - amount;


/*
 * Balance immediately deduct
 */

transaction.update(

userRef,

{
balance:newBalance
}

);


/*
 * Create withdrawal
 */

transaction.set(

withdrawRef,

{

uid:
currentUser.uid,

name:
userData.name || "",

email:
currentUser.email || "",

method:
method,

account:
account,

amount:
amount,

milestone:
milestone,

status:
"Pending",

createdAt:
serverTimestamp()

}

);

}

);


/*
 * Update screen
 */

currentBalance =
currentBalance - amount;


balanceElement.innerText =
"Rs " +
currentBalance;


showMessage(
"Withdraw request submitted successfully ✅",
"success"
);


methodElement.value = "";

accountElement.value = "";

amountElement.value = "";


/*
 * Lock this milestone
 */

await updateWithdrawStatus();

await loadHistory();

}
catch(error){

showMessage(
"Error: " +
error.message,
"error"
);

}


withdrawBtn.disabled = false;

withdrawBtn.innerText =
"Submit Withdraw Request";


/*
 * Re-check status
 */

await updateWithdrawStatus();

}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

historyList.innerHTML = `

<div class="history-loading">
Loading History...
</div>

`;


try{


const q =
query(

collection(
db,
"withdraws"
),

where(
"uid",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);


historyList.innerHTML = "";


if(snapshot.empty){

historyList.innerHTML = `

<div class="history-empty">

No withdrawal history yet.

</div>

`;

return;

}


const withdrawals = [];


snapshot.forEach(
(item)=>{

withdrawals.push({

id:item.id,

data:item.data()

});

});


withdrawals.sort(
(a,b)=>{

const timeA =
a.data.createdAt &&
a.data.createdAt.toMillis
?
a.data.createdAt.toMillis()
:
0;


const timeB =
b.data.createdAt &&
b.data.createdAt.toMillis
?
b.data.createdAt.toMillis()
:
0;


return timeB - timeA;

}

);


withdrawals.forEach(
(item)=>{


const data =
item.data;


const amount =
Number(
data.amount || 0
);


const method =
data.method ||
"Not provided";


const account =
data.account ||
"Not provided";


const milestone =
Number(
data.milestone || 0
);


const status =
String(
data.status ||
"Pending"
);


let statusClass =
"pending";


if(
status.toLowerCase()
===
"approved"
){

statusClass =
"approved";

}


if(
status.toLowerCase()
===
"rejected"
){

statusClass =
"rejected";

}


let dateText =
"Date not available";


if(
data.createdAt &&
data.createdAt.toDate
){

const date =
data.createdAt.toDate();

dateText =
date.toLocaleString();

}


historyList.innerHTML += `

<div class="history-card">

<div class="history-amount">

Rs ${amount}

</div>


<div class="history-row">

<span class="history-label">
Task Milestone
</span>

<span class="history-value">

${milestone}
Tasks

</span>

</div>


<div class="history-row">

<span class="history-label">
Payment Method
</span>

<span class="history-value">

${escapeHtml(method)}

</span>

</div>


<div class="history-row">

<span class="history-label">
Account
</span>

<span class="history-value">

${escapeHtml(account)}

</span>

</div>


<div class="history-row">

<span class="history-label">
Date
</span>

<span class="history-value">

${escapeHtml(dateText)}

</span>

</div>


<div class="status ${statusClass}">

${escapeHtml(status)}

</div>


</div>

`;

});


}
catch(error){

historyList.innerHTML = `

<div class="history-empty">

Unable to load history.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

messageElement.innerText =
text;

messageElement.className =
"message " +
type;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>

</body>

</html>
