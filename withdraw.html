<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:8px;
}

input,
select{
width:100%;
padding:13px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
}

button:disabled{
opacity:.6;
}

.message{
margin-top:12px;
text-align:center;
font-size:14px;
font-weight:bold;
}

.success{
color:#16a34a;
}

.error{
color:#dc2626;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
text-decoration:none;
}

.note{
margin-top:10px;
color:#777;
font-size:13px;
}

</style>

</head>


<body>


<div class="header">
💰 Withdraw
</div>


<div class="card">

<p>Available Balance</p>

<div
class="balance"
id="balance">

Loading...

</div>


<p class="note">
Enter the amount you want to withdraw.
</p>


<select id="method">

<option value="">
Select Payment Method
</option>

<option value="EasyPaisa">
EasyPaisa
</option>

<option value="JazzCash">
JazzCash
</option>

<option value="Bank Account">
Bank Account
</option>

</select>


<input
id="account"
type="text"
placeholder="Enter Account / Number"
>


<input
id="amount"
type="number"
placeholder="Enter Amount"
min="1"
>


<button id="withdrawBtn">
Submit Withdraw Request
</button>


<div
id="message"
class="message">
</div>

</div>


<a
class="back"
href="dashboard.html">

⬅ Back to Dashboard

</a>



<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUser = null;

let currentBalance = 0;



const balanceElement =
document.getElementById("balance");

const methodElement =
document.getElementById("method");

const accountElement =
document.getElementById("account");

const amountElement =
document.getElementById("amount");

const withdrawBtn =
document.getElementById("withdrawBtn");

const messageElement =
document.getElementById("message");



onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUser = user;


await loadBalance();

});



async function loadBalance(){

try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

balanceElement.innerText =
"Rs 0";

showMessage(
"User profile not found.",
"error"
);

return;

}


const data =
userSnap.data();


currentBalance =
Number(data.balance || 0);


balanceElement.innerText =
"Rs " + currentBalance;


}catch(error){

balanceElement.innerText =
"Rs 0";

showMessage(
"Unable to load balance.",
"error"
);

}

}



withdrawBtn.addEventListener(
"click",
submitWithdraw
);



async function submitWithdraw(){


messageElement.innerText = "";
messageElement.className =
"message";


const method =
methodElement.value;


const account =
accountElement.value.trim();


const amount =
Number(amountElement.value);



if(!method){

showMessage(
"Please select a payment method.",
"error"
);

return;

}


if(!account){

showMessage(
"Please enter your account number.",
"error"
);

return;

}


if(!amount || amount <= 0){

showMessage(
"Please enter a valid amount.",
"error"
);

return;

}


if(amount > currentBalance){

showMessage(
"Insufficient balance.",
"error"
);

return;

}


withdrawBtn.disabled=true;

withdrawBtn.innerText =
"Submitting...";


try{


await addDoc(

collection(db,"withdraws"),

{

uid:currentUser.uid,

name:currentUser.displayName || "",

email:currentUser.email || "",

method:method,

account:account,

amount:amount,

status:"Pending",

createdAt:serverTimestamp()

}

);


showMessage(
"Withdraw request submitted successfully ✅",
"success"
);


methodElement.value="";

accountElement.value="";

amountElement.value="";


}catch(error){

showMessage(
"Error: " + error.message,
"error"
);

}


withdrawBtn.disabled=false;

withdrawBtn.innerText =
"Submit Withdraw Request";

}



function showMessage(text,type){

messageElement.innerText =
text;

messageElement.className =
"message " + type;

}

</script>


</body>

</html>
