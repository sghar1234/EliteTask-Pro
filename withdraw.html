<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:26px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

input,select{

width:100%;
padding:13px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;

}

button{

width:100%;
padding:14px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;

}

.back{

display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
text-decoration:none;

}

</style>

</head>


<body>


<div class="header">
💰 Withdraw
</div>



<div class="card">


<p>
Available Balance
</p>


<div class="balance" id="balance">
Rs 0
</div>



<select id="method">

<option value="">
Select Payment Method
</option>

<option>
EasyPaisa
</option>

<option>
JazzCash
</option>

<option>
Bank Account
</option>

</select>



<input id="amount" type="number" placeholder="Enter Amount">



<button id="withdrawBtn">
Submit Withdraw Request
</button>



</div>



<a class="back" href="dashboard.html">
⬅ Back to Dashboard
</a>




<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
addDoc,
collection,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let userData;



onAuthStateChanged(auth, async(user)=>{


if(user){


const snap =
await getDoc(doc(db,"users",user.uid));


userData=snap.data();



document.getElementById("balance").innerText =
"Rs "+userData.balance;



}


});





document.getElementById("withdrawBtn")
.addEventListener("click",async()=>{


let amount =
document.getElementById("amount").value;


let method =
document.getElementById("method").value;



if(!amount || !method){

alert("Fill all fields");

return;

}



await addDoc(collection(db,"withdraws"),{


uid:userData.uid || "",

name:userData.name,

email:userData.email,

amount:Number(amount),

method:method,

status:"Pending",

createdAt:serverTimestamp()


});



alert("Withdraw Request Submitted Successfully");


});



</script>


</body>
</html>
