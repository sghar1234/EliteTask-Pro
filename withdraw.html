<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:27px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

input,select{
width:100%;
padding:13px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
}

.request{
background:#f9fafb;
padding:15px;
border-radius:12px;
margin-top:12px;
border:1px solid #eee;
}

.status{
display:inline-block;
margin-top:10px;
padding:6px 10px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.pending{
background:#fef3c7;
color:#92400e;
}

.approved{
background:#dcfce7;
color:#166534;
}

.rejected{
background:#fee2e2;
color:#991b1b;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
text-decoration:none;
}

</style>

</head>


<body>


<div class="header">
💰 Withdraw
</div>


<div class="card">

<p>Available Balance</p>

<div class="balance" id="balance">
Rs 0
</div>


<select id="method">

<option value="">
Select Payment Method
</option>

<option value="EasyPaisa">
EasyPaisa
</option>

<option value="JazzCash">
JazzCash
</option>

<option value="Bank Account">
Bank Account
</option>

</select>


<input
id="amount"
type="number"
placeholder="Enter Amount"
min="1"
>


<button id="withdrawBtn">
Submit Withdraw Request
</button>

</div>



<div class="card">

<h3>
My Withdraw Requests
</h3>

<div id="requestList">
Loading...
</div>

</div>



<a class="back" href="dashboard.html">
⬅ Back to Dashboard
</a>



<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
doc,
getDoc,
addDoc,
collection,
query,
where,
getDocs,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


let currentUser = null;
let currentBalance = 0;



onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="index.html";
return;

}


currentUser = user;


const userSnap =
await getDoc(doc(db,"users",user.uid));


if(userSnap.exists()){

const data = userSnap.data();

currentBalance = Number(data.balance || 0);

document.getElementById("balance").innerText =
"Rs " + currentBalance;

}


loadRequests();

});



document.getElementById("withdrawBtn")
.addEventListener("click", async()=>{

if(!currentUser){

alert("Please login first");
return;

}


const amount =
Number(document.getElementById("amount").value);


const method =
document.getElementById("method").value;


if(!amount || amount <= 0){

alert("Enter a valid amount");
return;

}


if(!method){

alert("Select payment method");
return;

}


if(amount > currentBalance){

alert("Insufficient balance");
return;

}


try{

await addDoc(
collection(db,"withdraws"),
{

uid:currentUser.uid,

name:currentUser.displayName || "",

email:currentUser.email,

amount:amount,

method:method,

status:"Pending",

createdAt:serverTimestamp()

}
);


alert("Withdraw Request Submitted Successfully");


document.getElementById("amount").value="";
document.getElementById("method").value="";


loadRequests();


}catch(error){

alert(error.message);

}

});



async function loadRequests(){

if(!currentUser){
return;
}


const requestList =
document.getElementById("requestList");


try{


const q = query(
collection(db,"withdraws"),
where("uid","==",currentUser.uid)
);


const snapshot =
await getDocs(q);


requestList.innerHTML="";


if(snapshot.empty){

requestList.innerHTML=
"<p style='margin-top:12px;color:#777;'>No withdraw requests yet.</p>";

return;

}


snapshot.forEach((item)=>{

const data = item.data();

const status =
data.status || "Pending";


let statusClass="pending";


if(status === "Approved"){
statusClass="approved";
}

if(status === "Rejected"){
statusClass="rejected";
}


requestList.innerHTML += `

<div class="request">

<p>
<strong>Amount:</strong>
Rs ${data.amount || 0}
</p>

<p style="margin-top:7px;">
<strong>Method:</strong>
${data.method || ""}
</p>

<span class="status ${statusClass}">
${status}
</span>

</div>

`;

});


}catch(error){

requestList.innerHTML =
"<p>Unable to load requests.</p>";

}

}

</script>


</body>

</html>
