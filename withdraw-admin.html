<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw Requests Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.info{
margin-top:8px;
color:#555;
}

.back{
display:block;
margin-top:20px;
text-align:center;
color:#2563eb;
text-decoration:none;
}

</style>

</head>


<body>


<div class="header">
💰 Withdraw Requests
</div>


<div id="withdrawList">
Loading Requests...
</div>


<a href="admin.html" class="back">
⬅ Back to Admin
</a>



<script type="module">


import { db } from "./firebase.js";


import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const list=document.getElementById("withdrawList");



const data =
await getDocs(collection(db,"withdraws"));



list.innerHTML="";



if(data.empty){

list.innerHTML="No Withdraw Requests";

}else{


data.forEach((item)=>{


let w=item.data();



list.innerHTML += `


<div class="card">

<h3>
${w.name || "User"}
</h3>

<p class="info">
Amount: Rs ${w.amount}
</p>

<p class="info">
Method: ${w.method}
</p>

<p class="info">
Status: ${w.status || "Pending"}
</p>

</div>


`;


});


}



</script>


</body>

</html>
