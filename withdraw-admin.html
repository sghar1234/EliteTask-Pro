<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw Requests - Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:21px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.info{
margin-top:8px;
color:#555;
}

.status{
display:inline-block;
margin-top:10px;
font-weight:bold;
padding:6px 10px;
border-radius:20px;
}

.pending{
background:#fef3c7;
color:#92400e;
}

.approved{
background:#dcfce7;
color:#166534;
}

.rejected{
background:#fee2e2;
color:#991b1b;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

button{
padding:12px;
border:none;
border-radius:10px;
color:white;
font-size:15px;
}

.approve{
background:#16a34a;
}

.reject{
background:#dc2626;
}

.back{
display:block;
margin-top:20px;
text-align:center;
color:#2563eb;
text-decoration:none;
}

</style>
</head>


<body>

<div class="header">
💰 Withdraw Requests
</div>

<div id="withdrawList">
Loading Requests...
</div>

<a href="admin.html" class="back">
⬅ Back to Admin
</a>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
doc,
runTransaction
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const list =
document.getElementById("withdrawList");


async function loadWithdraws(){

try{

const snapshot =
await getDocs(collection(db,"withdraws"));

list.innerHTML="";


if(snapshot.empty){

list.innerHTML=`
<div class="card">
No Withdraw Requests
</div>
`;

return;

}


snapshot.forEach((item)=>{

const w=item.data();

const status =
w.status || "Pending";


let statusClass="pending";

if(status === "Approved"){
statusClass="approved";
}

if(status === "Rejected"){
statusClass="rejected";
}


let buttons="";


if(status === "Pending"){

buttons=`

<div class="buttons">

<button class="approve"
onclick="approveRequest('${item.id}')">
Approve
</button>

<button class="reject"
onclick="rejectRequest('${item.id}')">
Reject
</button>

</div>

`;

}


list.innerHTML += `

<div class="card">

<h3>
${w.name || "User"}
</h3>

<p class="info">
Email: ${w.email || ""}
</p>

<p class="info">
Amount: Rs ${w.amount || 0}
</p>

<p class="info">
Method: ${w.method || ""}
</p>

<p class="info">
User ID: ${w.uid || ""}
</p>

<span class="status ${statusClass}">
${status}
</span>

${buttons}

</div>

`;

});

}catch(error){

list.innerHTML=`
<div class="card">
Error: ${error.message}
</div>
`;

}

}



window.approveRequest = async function(requestId){

const confirmApprove =
confirm("Approve this withdrawal?");

if(!confirmApprove){
return;
}


try{

await runTransaction(db, async(transaction)=>{

const requestRef =
doc(db,"withdraws",requestId);

const requestSnap =
await transaction.get(requestRef);


if(!requestSnap.exists()){
throw new Error("Request not found");
}


const request =
requestSnap.data();


if(request.status !== "Pending"){
throw new Error("This request has already been processed");
}


if(!request.uid){
throw new Error("User ID missing");
}


const userRef =
doc(db,"users",request.uid);

const userSnap =
await transaction.get(userRef);


if(!userSnap.exists()){
throw new Error("User account not found");
}


const user =
userSnap.data();


const balance =
Number(user.balance || 0);

const amount =
Number(request.amount || 0);


if(amount <= 0){
throw new Error("Invalid withdrawal amount");
}


if(amount > balance){
throw new Error("User balance is insufficient");
}


transaction.update(userRef,{

balance: balance - amount

});


transaction.update(requestRef,{

status:"Approved"

});

});


alert("Withdrawal Approved");

loadWithdraws();


}catch(error){

alert(error.message);

}

};



window.rejectRequest = async function(requestId){

const confirmReject =
confirm("Reject this withdrawal?");

if(!confirmReject){
return;
}


try{

const requestRef =
doc(db,"withdraws",requestId);


await runTransaction(db, async(transaction)=>{

const requestSnap =
await transaction.get(requestRef);


if(!requestSnap.exists()){
throw new Error("Request not found");
}


const request =
requestSnap.data();


if(request.status !== "Pending"){
throw new Error("This request has already been processed");
}


transaction.update(requestRef,{

status:"Rejected"

});

});


alert("Withdrawal Rejected");

loadWithdraws();


}catch(error){

alert(error.message);

}

};


loadWithdraws();

</script>

</body>
</html>
