<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw Requests - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:21px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.request{
border:1px solid #eee;
padding:16px;
border-radius:13px;
margin-top:12px;
}

.request h3{
color:#2563eb;
margin-bottom:10px;
}

.info{
margin-top:7px;
color:#555;
font-size:14px;
}

.status{
display:inline-block;
margin-top:10px;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
background:#fef3c7;
color:#92400e;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:10px;
color:white;
font-size:15px;
}

.approve{
background:#16a34a;
}

.reject{
background:#dc2626;
}

button:disabled{
opacity:.6;
}

.empty{
text-align:center;
color:#777;
padding:20px;
}

.error{
color:#dc2626;
text-align:center;
padding:15px;
}

.back{
display:block;
margin-top:20px;
background:#2563eb;
color:white;
text-decoration:none;
text-align:center;
padding:14px;
border-radius:12px;
}

</style>

</head>


<body>


<div class="header">
💰 Withdraw Requests
</div>


<div class="card">

<div id="requestsList">
Loading Requests...
</div>

</div>


<a
href="admin.html"
class="back">

⬅ Back to Admin

</a>



<script type="module">

import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
collection,
getDocs,
doc,
runTransaction,
serverTimestamp,
query,
orderBy
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const requestsList =
document.getElementById("requestsList");



onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href =
"admin-login.html";

return;

}

loadRequests();

});



async function loadRequests(){

try{

const q =
query(
collection(db,"withdraws"),
orderBy("createdAt","desc")
);


const snapshot =
await getDocs(q);


requestsList.innerHTML="";


if(snapshot.empty){

requestsList.innerHTML=`

<div class="empty">

No withdraw requests yet.

</div>

`;

return;

}


snapshot.forEach((item)=>{

const data =
item.data();


const status =
data.status || "Pending";


let buttons = "";


if(status === "Pending"){

buttons = `

<button
class="approve"
onclick="approveRequest('${item.id}')">

✅ Approve Withdraw

</button>


<button
class="reject"
onclick="rejectRequest('${item.id}')">

❌ Reject Request

</button>

`;

}


requestsList.innerHTML += `

<div class="request">

<h3>
💰 Rs ${Number(data.amount || 0)}
</h3>


<p class="info">
👤 ${escapeHtml(data.name || "User")}
</p>


<p class="info">
📧 ${escapeHtml(data.email || "")}
</p>


<p class="info">
💳 Method: ${escapeHtml(data.method || "")}
</p>


<p class="info">
🔢 Account: ${escapeHtml(data.account || "")}
</p>


<span class="status">
${escapeHtml(status)}
</span>


${buttons}

</div>

`;

});

}catch(error){

requestsList.innerHTML=`

<div class="error">

Error loading requests:<br>
${escapeHtml(error.message)}

</div>

`;

}

}



/* APPROVE */

window.approveRequest =
async function(requestId){

if(!confirm(
"Approve this withdraw request?"
)){

return;

}


try{


await runTransaction(
db,
async(transaction)=>{


const requestRef =
doc(
db,
"withdraws",
requestId
);


const requestSnap =
await transaction.get(
requestRef
);


if(!requestSnap.exists()){

throw new Error(
"Withdraw request not found."
);

}


const request =
requestSnap.data();


if(request.status !== "Pending"){

throw new Error(
"This request has already been processed."
);

}


const uid =
request.uid;


const amount =
Number(request.amount || 0);


if(!uid){

throw new Error(
"User ID missing."
);

}


if(amount <= 0){

throw new Error(
"Invalid withdrawal amount."
);

}


const userRef =
doc(
db,
"users",
uid
);


const userSnap =
await transaction.get(
userRef
);


if(!userSnap.exists()){

throw new Error(
"User account not found."
);

}


const user =
userSnap.data();


const balance =
Number(user.balance || 0);


if(balance < amount){

throw new Error(
"User has insufficient balance."
);

}


const newBalance =
balance - amount;


/*
Update user balance
*/

transaction.update(
userRef,
{

balance:newBalance

}
);


/*
Update withdrawal status
*/

transaction.update(
requestRef,
{

status:"Approved",

processedAt:
serverTimestamp()

}
);

}
);


alert(
"Withdraw approved successfully ✅"
);


loadRequests();


}catch(error){

alert(
"Approval failed: " +
error.message
);

}

};



/* REJECT */

window.rejectRequest =
async function(requestId){

if(!confirm(
"Reject this withdraw request?"
)){

return;

}


try{


const requestRef =
doc(
db,
"withdraws",
requestId
);


await runTransaction(
db,
async(transaction)=>{


const requestSnap =
await transaction.get(
requestRef
);


if(!requestSnap.exists()){

throw new Error(
"Request not found."
);

}


const request =
requestSnap.data();


if(request.status !== "Pending"){

throw new Error(
"This request has already been processed."
);

}


transaction.update(
requestRef,
{

status:"Rejected",

processedAt:
serverTimestamp()

}
);

}
);


alert(
"Withdraw request rejected."
);


loadRequests();


}catch(error){

alert(
"Rejection failed: " +
error.message
);

}

};



function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
text || "";

return div.innerHTML;

}

</script>


</body>

</html>
