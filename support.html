<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Support - EliteTask Pro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    padding:15px;
    color:#111827;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    border-radius:15px;
    text-align:center;
}

.header h2{
    font-size:22px;
}

.header p{
    margin-top:5px;
    font-size:13px;
    opacity:.8;
}

.card{
    background:white;
    margin-top:15px;
    padding:18px;
    border-radius:15px;
    box-shadow:0 3px 10px #ddd;
}

.option{
    display:block;
    text-decoration:none;
    padding:16px;
    border-radius:12px;
    margin-top:12px;
    color:white;
    text-align:center;
    font-weight:bold;
}

.telegram{
    background:#229ED9;
}

.live{
    background:#2563eb;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

label{
    display:block;
    margin-top:14px;
    font-size:14px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    margin-top:7px;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:none;
}

.send{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.send:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:12px;
    font-size:14px;
    font-weight:bold;
}

.success{
    color:#16a34a;
}

.error{
    color:#dc2626;
}

.info{
    margin-top:10px;
    color:#6b7280;
    font-size:13px;
    line-height:1.5;
}

</style>

</head>

<body>

<div class="header">

<h2>🎧 Customer Support</h2>

<p>EliteTask Pro Support Center</p>

</div>

<!-- TELEGRAM -->

<div class="card">

<h3>📲 Telegram Support</h3>

<p class="info">
For quick support, contact us directly on Telegram.
</p>

<a
href="https://t.me/Helpcenter21"
target="_blank"
class="option telegram">

📲 Open Telegram Support

</a>

</div>

<!-- LIVE SUPPORT -->

<div class="card">

<h3>💬 Live Support</h3>

<p class="info">
Send your message below. Our support team will receive your message.
</p>

<label>
Your Name
</label>

<input
type="text"
id="name"
placeholder="Enter your name"

>

<label>
Message
</label>

<textarea
id="message"
placeholder="Write your message here..."
></textarea>

<button
class="send"
id="sendBtn">

📨 Send Message

</button>

<div
id="status"
class="message">
</div>

</div>

<a
href="dashboard.html"
class="back">

⬅ Back to Dashboard

</a>

<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


let currentUser = null;


const nameInput =
document.getElementById("name");

const messageInput =
document.getElementById("message");

const sendBtn =
document.getElementById("sendBtn");

const statusBox =
document.getElementById("status");


/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href =
"index.html";

return;

}

currentUser = user;


/* LOAD USER NAME */

try{

const userRef =
doc(
db,
"users",
user.uid
);

const userSnap =
await getDoc(userRef);

if(userSnap.exists()){

const data =
userSnap.data();

nameInput.value =
data.name || "";

}

}
catch(error){

console.log(
"User data error:",
error.message
);

}

});


/* =========================
   SEND MESSAGE
========================= */

sendBtn.addEventListener(
"click",
sendMessage
);


async function sendMessage(){

statusBox.innerText = "";

statusBox.className =
"message";


if(!currentUser){

showStatus(
"Please login first.",
"error"
);

return;

}


const name =
nameInput.value.trim();


const message =
messageInput.value.trim();


if(!name){

showStatus(
"Please enter your name.",
"error"
);

return;

}


if(!message){

showStatus(
"Please enter your message.",
"error"
);

return;

}


if(message.length < 2){

showStatus(
"Please write a proper message.",
"error"
);

return;

}


sendBtn.disabled = true;

sendBtn.innerText =
"Sending...";


try{


/* GET USER DATA */

const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


let email =
currentUser.email || "";


if(userSnap.exists()){

const userData =
userSnap.data();

email =
userData.email ||
email;

}


/* SAVE MESSAGE */

await addDoc(

collection(
db,
"supportMessages"
),

{

uid:
currentUser.uid,

name:
name,

email:
email,

message:
message,

status:
"unread",

createdAt:
serverTimestamp()

}

);


showStatus(
"Message sent successfully ✅",
"success"
);


messageInput.value = "";


}
catch(error){

showStatus(
"Message failed: " +
error.message,
"error"
);

}


sendBtn.disabled = false;

sendBtn.innerText =
"📨 Send Message";

}


/* =========================
   STATUS
========================= */

function showStatus(
text,
type
){

statusBox.innerText =
text;

statusBox.className =
"message " + type;

}

</script>

</body>

</html>
