<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Customer Service</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f0ff;
    color:#17152d;
    padding-bottom:90px;
}

/* TOP BAR */

.top-area{
    height:70px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid #eee8ff;
}

.back-btn{
    position:absolute;
    left:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#f4efff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#6d35e8;
    font-size:25px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(135deg,#6d28ff,#a64cff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.logo-text{
    font-size:18px;
    font-weight:800;
    color:#30245f;
}

/* MAIN */

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:15px 14px 30px;
}

/* HEADER */

.service-header{
    text-align:center;
    padding:12px 5px 18px;
}

.service-icon{
    width:62px;
    height:62px;
    margin:auto;
    border-radius:20px;
    background:linear-gradient(135deg,#7134ef,#a14ff5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    box-shadow:0 8px 22px rgba(111,52,239,.22);
}

.service-header h2{
    margin-top:11px;
    font-size:22px;
}

.service-header p{
    margin-top:5px;
    font-size:13px;
    color:#77738c;
}

/* CONTACT BUTTONS */

.contact-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:13px;
}

.contact-btn{
    height:47px;
    border:none;
    border-radius:14px;
    color:white;
    font-size:14px;
    font-weight:bold;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.whatsapp{
    background:#25D366;
}

.telegram{
    background:#229ED9;
}

/* SUPPORT CARD */

.support-card{
    background:white;
    border-radius:22px;
    padding:16px;
    box-shadow:0 7px 25px rgba(50,30,100,.08);
}

.support-card h3{
    font-size:18px;
}

.support-card > p{
    margin-top:5px;
    margin-bottom:12px;
    color:#77738c;
    font-size:12px;
}

/* CHAT */

.chat-box{
    height:380px;
    overflow-y:auto;
    padding:10px;
    border-radius:17px;
    background:#faf9ff;
    border:1px solid #eee8ff;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.empty-chat{
    flex:1;
    min-height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#9995a8;
    font-size:13px;
    padding:20px;
}

/* MESSAGE */

.chat-message{
    max-width:82%;
    padding:9px 12px;
    border-radius:15px;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.user-message{
    align-self:flex-end;
    background:linear-gradient(135deg,#7134ef,#9149f4);
    color:white;
    border-bottom-right-radius:4px;
}

.admin-message{
    align-self:flex-start;
    background:white;
    color:#333;
    border:1px solid #e8e1fa;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
    border-bottom-left-radius:4px;
}

.message-label{
    font-size:10px;
    font-weight:bold;
    margin-bottom:3px;
    opacity:.7;
}

.message-text{
    white-space:pre-wrap;
}

.chat-image{
    width:100%;
    max-width:270px;
    max-height:280px;
    object-fit:contain;
    border-radius:11px;
    margin-top:5px;
    display:block;
}

/* MESSAGE AREA */

.message-area{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
}

.gallery-btn{
    width:45px;
    height:45px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:#f0eaff;
    color:#7035ed;
    font-size:21px;
    cursor:pointer;
}

.message-input{
    flex:1;
    height:45px;
    border:1px solid #ddd8e8;
    border-radius:13px;
    outline:none;
    padding:0 12px;
    font-size:13px;
    background:white;
}

.message-input:focus{
    border-color:#7838ef;
    box-shadow:0 0 0 3px rgba(120,56,239,.08);
}

.send-btn{
    width:45px;
    height:45px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:linear-gradient(135deg,#7134ef,#974bf5);
    color:white;
    font-size:19px;
    cursor:pointer;
}

.send-btn:disabled,
.gallery-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.file-name{
    display:none;
    font-size:11px;
    color:#77738c;
    margin-top:6px;
    padding-left:4px;
}

/* QUICK HELP */

.quick-title{
    margin:22px 2px 11px;
    font-size:18px;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.quick-btn{
    border:none;
    background:white;
    border-radius:16px;
    padding:14px 8px;
    cursor:pointer;
    box-shadow:0 5px 18px rgba(50,30,100,.07);
    color:#38236f;
}

.quick-btn div{
    font-size:23px;
    margin-bottom:5px;
}

.quick-btn span{
    font-size:12px;
    font-weight:bold;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #eee8ff;
    box-shadow:0 -5px 20px rgba(50,30,100,.08);
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:1000;
}

.nav-item{
    width:25%;
    height:100%;
    text-decoration:none;
    color:#8a8795;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:10px;
}

.nav-item span{
    font-size:20px;
}

.nav-item.active{
    color:#7134ef;
    font-weight:bold;
}

.nav-center{
    width:47px;
    height:47px;
    margin-top:-19px;
    border-radius:50%;
    background:linear-gradient(135deg,#7134ef,#984bf5);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    border:4px solid white;
    box-shadow:0 6px 18px rgba(113,52,239,.3);
}

/* UPLOAD */

.uploading{
    text-align:center;
    font-size:12px;
    color:#7134ef;
    padding:5px;
}

/* SMALL MOBILE */

@media(max-width:380px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .chat-box{
        height:350px;
    }

    .chat-message{
        max-width:86%;
    }

    .logo-text{
        font-size:16px;
    }

}

</style>
</head>

<script type="module">

    getDownloadURL

/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:

    authDomain:

    projectId:

    storageBucket:

    appId:
    "1:504295275402:web:8c480445c5510fa645a673"

};


/* INITIALIZE */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/* ELEMENTS */

const chatBox =
    document.getElementById("chatBox");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const galleryBtn =
    document.getElementById("galleryBtn");

const imageInput =
    document.getElementById("imageInput");

const uploadStatus =
    document.getElementById("uploadStatus");


let currentUser = null;
let unsubscribeMessages = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentUser = user;


        messageInput.disabled = false;
        sendBtn.disabled = false;
        galleryBtn.disabled = false;


        await createWelcomeMessage(
            user
        );


        loadMessages(
            user.uid
        );

    }
);


/* =========================
   NEW USER WELCOME
========================= */

async function createWelcomeMessage(user){

    try{

        const messagesRef =
            collection(
                db,
                "supportMessages"
            );


        const q =
            query(
                messagesRef,
                where(
                    "userId",
                    "==",
                    user.uid
                )
            );


        let found = false;


        const unsubscribe =
            onSnapshot(
                q,
                (snapshot) => {

                    found =
                        !snapshot.empty;

                }
            );


        setTimeout(
            async () => {

                unsubscribe();


                if(found){
                    return;
                }


                await addDoc(
                    messagesRef,
                    {

                        userId:
                            user.uid,

                        userEmail:
                            user.email || "",

                        message:
                            "Welcome to EliteTask Pro Customer Support. How can we help you today?",

                        sender:
                            "admin",

                        status:
                            "new",

                        createdAt:
                            serverTimestamp()

                    }
                );

            },
            1200
        );

    }
    catch(error){

        console.error(
            "Welcome message error:",
            error
        );

    }

}


/* =========================
   LOAD CHAT
========================= */

function loadMessages(uid){

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    chatBox.innerHTML = `

        <div class="empty-chat">
            Loading conversation...
        </div>

    `;


    const messagesRef =
        collection(
            db,
            "supportMessages"
        );


    const q =
        query(
            messagesRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribeMessages =
        onSnapshot(

            q,

            (snapshot) => {

                if(snapshot.empty){

                    chatBox.innerHTML = `

                        <div class="empty-chat">

                            No messages yet.<br>
                            Send us a message.

                        </div>

                    `;

                    return;

                }


                const messages = [];


                snapshot.forEach(
                    (docSnap) => {

                        const data =
                            docSnap.data();


                        messages.push({

                            id:
                                docSnap.id,

                            ...data

                        });

                    }
                );


                /* LOCAL SORT */

                messages.sort(
                    (a,b) => {

                        return getMessageTime(
                            a.createdAt
                        )
                        -
                        getMessageTime(
                            b.createdAt
                        );

                    }
                );


                chatBox.innerHTML = "";


                messages.forEach(
                    (msg) => {

                        const message =
                            document.createElement(
                                "div"
                            );


                        const sender =
                            String(
                                msg.sender ||
                                msg.from ||
                                "user"
                            ).toLowerCase();


                        const isAdmin =
                            sender === "admin" ||
                            sender === "support";


                        message.className =
                            isAdmin
                            ?
                            "chat-message admin-message"
                            :
                            "chat-message user-message";


                        const label =
                            isAdmin
                            ?
                            "Customer Support"
                            :
                            "You";


                        const labelElement =
                            document.createElement(
                                "div"
                            );


                        labelElement.className =
                            "message-label";


                        labelElement.textContent =
                            label;


                        message.appendChild(
                            labelElement
                        );


                        /* TEXT */

                        const text =
                            msg.message ||
                            msg.text ||
                            "";


                        if(text){

                            const textElement =
                                document.createElement(
                                    "div"
                                );


                            textElement.className =
                                "message-text";


                            textElement.textContent =
                                text;


                            message.appendChild(
                                textElement
                            );

                        }


                        /* IMAGE */

                        const imageUrl =
                            msg.imageUrl ||
                            msg.image ||
                            msg.photoURL ||
                            "";


                        if(imageUrl){

                            const image =
                                document.createElement(
                                    "img"
                                );


                            image.className =
                                "chat-image";


                            image.src =
                                imageUrl;


                            image.alt =
                                "Attachment";


                            image.loading =
                                "lazy";


                            image.onclick =
                            function(){

                                window.open(
                                    imageUrl,
                                    "_blank"
                                );

                            };


                            message.appendChild(
                                image
                            );

                        }


                        chatBox.appendChild(
                            message
                        );

                    }
                );


                /* ALWAYS SCROLL BOTTOM */

                setTimeout(
                    () => {

                        chatBox.scrollTop =
                            chatBox.scrollHeight;

                    },
                    50
                );

            },


            (error) => {

                console.error(
                    "Chat error:",
                    error
                );


                chatBox.innerHTML = `

                    <div class="empty-chat">

                        Unable to load conversation.<br><br>
