<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Customer Service</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
    padding-bottom:90px;
}

.topbar{
    height:70px;
    background:linear-gradient(135deg,#07152f,#1454a3);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    color:white;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.back-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:22px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    background:linear-gradient(135deg,#2d8cff,#55c8ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.logo-text{
    font-size:16px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:auto;
    padding:18px 15px;
}

.service-header{
    text-align:center;
    margin:10px 0 20px;
}

.service-icon{
    width:72px;
    height:72px;
    margin:auto;
    border-radius:22px;
    background:linear-gradient(135deg,#1478ed,#36b4ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 10px 25px rgba(20,120,237,.25);
}

.service-header h2{
    margin-top:13px;
    font-size:22px;
}

.service-header p{
    margin-top:6px;
    color:#8490a0;
    font-size:13px;
}

.support-card{
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 5px 20px rgba(20,40,80,.07);
}

.support-card h3{
    font-size:16px;
    margin-bottom:7px;
}

.support-card > p{
    font-size:12px;
    color:#8992a2;
    line-height:1.5;
}

.chat-box{
    background:#f8faff;
    border-radius:17px;
    padding:15px;
    height:360px;
    overflow-y:auto;
    margin:15px 0 12px;
    border:1px solid #edf1f6;
}

.message{
    max-width:82%;
    padding:11px 13px;
    border-radius:14px;
    margin-bottom:10px;
    font-size:12px;
    line-height:1.45;
    word-wrap:break-word;
}

.admin-message{
    background:white;
    color:#4b5565;
    border:1px solid #e9edf3;
    border-bottom-left-radius:4px;
    margin-right:auto;
}

.user-message{
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    margin-left:auto;
    border-bottom-right-radius:4px;
}

.message-time{
    font-size:9px;
    opacity:.55;
    margin-top:5px;
}

.empty-chat{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#8992a2;
    font-size:12px;
}

.message-area{
    display:flex;
    gap:8px;
}

.message-input{
    flex:1;
    min-width:0;
    border:1px solid #e2e7ef;
    border-radius:13px;
    padding:13px;
    outline:none;
    font-size:13px;
    background:#fff;
}

.message-input:focus{
    border-color:#2d8cff;
}

.send-btn{
    width:52px;
    height:48px;
    border:none;
    border-radius:13px;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send-btn:active{
    transform:scale(.96);
}

.send-btn:disabled{
    opacity:.6;
}

.quick-title{
    margin:20px 2px 12px;
    font-size:17px;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.quick-btn{
    border:none;
    background:white;
    border-radius:17px;
    padding:17px 10px;
    box-shadow:0 5px 18px rgba(20,40,80,.06);
    text-align:center;
    color:#172033;
    cursor:pointer;
}

.quick-btn:active{
    transform:scale(.98);
}

.quick-btn div{
    font-size:23px;
    margin-bottom:7px;
}

.quick-btn span{
    font-size:11px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:73px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 25px rgba(0,0,0,.10);
    z-index:1000;
    border-top:1px solid #edf0f5;
}

.nav-item{
    text-decoration:none;
    color:#8992a2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:25%;
    font-size:10px;
}

.nav-item span{
    font-size:21px;
}

.nav-item.active{
    color:#1677e8;
    font-weight:bold;
}

.nav-center{
    width:55px;
    height:55px;
    margin-top:-25px;
    border-radius:50%;
    background:linear-gradient(135deg,#1478ed,#36b4ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 8px 20px rgba(20,120,237,.35);
    border:5px solid #f4f7fb;
}
</style>
</head>

<body>

<div class="topbar">

    <a href="dashboard.html" class="back-btn">
        ←
    </a>

    <div class="logo-area">

        <div class="logo">
            ET
        </div>

        <div class="logo-text">
            EliteTask Pro
        </div>

    </div>

</div>

<div class="container">

    <div class="service-header">

        <div class="service-icon">
            💬
        </div>

        <h2>
            Customer Service
        </h2>

        <p>
            How can we help you today?
        </p>

    </div>

    <div class="support-card">

        <h3>
            Live Support
        </h3>

        <p>
            Send us a message and our support team will respond.
        </p>

        <div
            class="chat-box"
            id="chatBox"
        >

            <div class="empty-chat">
                Loading conversation...
            </div>

        </div>

        <div class="message-area">

            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button
                class="send-btn"
                id="sendBtn"
                type="button"
            >
                ➤
            </button>

        </div>

    </div>

    <h3 class="quick-title">
        Quick Help
    </h3>

    <div class="quick-grid">

        <button
            class="quick-btn"
            onclick="sendQuick('I need help with my tasks.')"
        >
            <div>📦</div>
            <span>Task Help</span>
        </button>

        <button
            class="quick-btn"
            onclick="sendQuick('I need help with withdrawal.')"
        >
            <div>💳</div>
            <span>Withdrawal</span>
        </button>

        <button
            class="quick-btn"
            onclick="sendQuick('I have a problem with my account.')"
        >
            <div>👤</div>
            <span>Account</span>
        </button>

        <button
            class="quick-btn"
            onclick="sendQuick('I need help with my balance.')"
        >
            <div>💰</div>
            <span>Balance</span>
        </button>

    </div>

</div>

<div class="bottom-nav">

    <a href="dashboard.html" class="nav-item">
        <span>⌂</span>
        Home
    </a>

    <a href="orders.html" class="nav-item">
        <span>▣</span>
        Tasks
    </a>

    <a href="support.html" class="nav-item active">

        <div class="nav-center">
            💬
        </div>

        Support

    </a>

    <a href="profile.html" class="nav-item">
        <span>👤</span>
        Profile
    </a>

</div>

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    query,
    where,
    orderBy,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain: "elitetask-pro.firebaseapp.com",

    projectId: "elitetask-pro",

    storageBucket: "elitetask-pro.firebasestorage.app",

    messagingSenderId: "504295275402",

    appId: "1:504295275402:web:8c480445c5510fa645a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


let currentUser = null;
let unsubscribeMessages = null;


/* LOGIN */

onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser = user;

        loadMessages(user.uid);

    }
);


/* LOAD ONLY CURRENT USER CHAT */

function loadMessages(uid){

    const chatBox =
        document.getElementById("chatBox");


    if(unsubscribeMessages){

        unsubscribeMessages();

    }


    const messagesRef =
        collection(
            db,
            "supportMessages"
        );


    const q =
        query(
            messagesRef,
            where(
                "userId",
                "==",
                uid
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(
            q,
            (snapshot) => {

                chatBox.innerHTML = "";


                if(snapshot.empty){

                    chatBox.innerHTML = `

                        <div class="empty-chat">

                            💬<br><br>

                            No messages yet.<br>
                            Send a message to customer support.

                        </div>

                    `;

                    return;

                }


                snapshot.forEach(
                    (messageDoc) => {

                        const data =
                            messageDoc.data();


                        const div =
                            document.createElement(
                                "div"
                            );


                        if(
                            data.sender ===
                            "admin"
                        ){

                            div.className =
                                "message admin-message";

                        }
                        else{

                            div.className =
                                "message user-message";

                        }


                        const text =
                            document.createElement(
                                "div"
                            );

                        text.textContent =
                            data.message || "";


                        div.appendChild(text);


                        if(
                            data.createdAt
                        ){

                            const time =
                                document.createElement(
                                    "div"
                                );

                            time.className =
                                "message-time";

                            time.textContent =
                                formatTime(
                                    data.createdAt
                                );

                            div.appendChild(time);

                        }


                        chatBox.appendChild(div);

                    }
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            },

            (error) => {

                console.error(
                    "Chat listener error:",
                    error
                );


                chatBox.innerHTML = `

                    <div class="empty-chat">

                        Unable to load chat.<br><br>

                        Please try again.

                    </div>

                `;

            }
        );

}


/* SEND MESSAGE */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const sendBtn =
        document.getElementById(
            "sendBtn"
        );


    const message =
        input.value.trim();


    if(!message){

        return;

    }


    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    sendBtn.disabled = true;


    try{

        await addDoc(
            collection(
                db,
                "supportMessages"
            ),
            {

                userId:
                    currentUser.uid,

                email:
                    currentUser.email || "",

                message:
                    message,

                sender:
                    "user",

                createdAt:
                    serverTimestamp()

            }
        );


        input.value = "";


    }
    catch(error){

        console.error(
            "Send message error:",
            error
        );


        alert(
            "Message send nahi ho saka."
        );

    }
    finally{

        sendBtn.disabled = false;

        input.focus();

    }

}


/* SEND BUTTON */

document
    .getElementById("sendBtn")
    .addEventListener(
        "click",
        sendMessage
    );


/* ENTER */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        (event) => {

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* QUICK HELP */

window.sendQuick =
    function(message){

        document
            .getElementById(
                "messageInput"
            )
            .value =
            message;

        sendMessage();

    };


/* TIME */

function formatTime(timestamp){

    try{

        const date =
            timestamp.toDate();

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "";

    }

}

</script>

</body>
</html>
