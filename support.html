<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Customer Service</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f1ff;
    color:#17182d;
    padding-bottom:85px;
}

/* TOP BAR */

.topbar{
    height:64px;
    background:linear-gradient(135deg,#24185c,#5630d9);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color:white;
    box-shadow:0 4px 18px rgba(40,20,100,.18);
}

.back-btn{
    position:absolute;
    left:16px;
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:28px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo{
    width:36px;
    height:36px;
    border-radius:11px;
    background:linear-gradient(135deg,#7c3cff,#a56cff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:13px;
}

.logo-text{
    font-size:17px;
    font-weight:bold;
}

/* MAIN */

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:12px 14px 25px;
}

/* SUPPORT HEADER */

.service-header{
    text-align:center;
    padding:10px 5px 15px;
}

.service-icon{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:20px;
    background:linear-gradient(135deg,#7138ff,#a855f7);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 8px 20px rgba(103,58,220,.22);
}

.service-header h2{
    margin-top:10px;
    font-size:21px;
}

.service-header p{
    margin-top:5px;
    color:#73758c;
    font-size:13px;
}

/* SUPPORT CARD */

.support-card{
    background:white;
    border-radius:22px;
    padding:15px;
    box-shadow:0 8px 30px rgba(60,40,120,.08);
}

/* CHAT HEADER */

.chat-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 3px 13px;
}

.support-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    background:linear-gradient(135deg,#ddd6fe,#f5f3ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.chat-header-text strong{
    display:block;
    font-size:15px;
}

.chat-header-text span{
    display:block;
    color:#85879a;
    font-size:11px;
    margin-top:2px;
}

/* CHAT BOX */

.chat-box{
    height:350px;
    overflow-y:auto;
    padding:12px 8px;
    border-radius:18px;
    background:#f8f7fc;
    border:1px solid #eeeaf8;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty-chat{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#9698a8;
    font-size:13px;
}

/* MESSAGES */

.chat-message{
    max-width:82%;
    padding:10px 13px;
    border-radius:16px;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.user-message{
    align-self:flex-end;
    background:linear-gradient(135deg,#7138ff,#8b45f7);
    color:white;
    border-bottom-right-radius:5px;
}

.admin-message{
    align-self:flex-start;
    background:white;
    color:#333;
    border:1px solid #e9e5f3;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
    border-bottom-left-radius:5px;
}

.message-label{
    font-size:10px;
    font-weight:bold;
    margin-bottom:4px;
    opacity:.72;
}

.message-text{
    white-space:pre-wrap;
}

.chat-image{
    display:block;
    width:100%;
    max-width:260px;
    max-height:260px;
    object-fit:cover;
    border-radius:12px;
    margin-top:3px;
}

/* INPUT AREA */

.message-area{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:11px;
}

.attach-btn{
    width:43px;
    height:45px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:#f1edff;
    color:#7138ff;
    font-size:22px;
    cursor:pointer;
}

.message-input{
    flex:1;
    min-width:0;
    height:45px;
    border-radius:13px;
    border:1px solid #ddd9e8;
    outline:none;
    padding:0 13px;
    font-size:13px;
    background:white;
}

.message-input:focus{
    border-color:#7c3cff;
    box-shadow:0 0 0 3px rgba(124,60,255,.08);
}

.send-btn{
    width:45px;
    height:45px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:linear-gradient(135deg,#7138ff,#9b4dff);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* IMAGE PREVIEW */

.image-preview{
    display:none;
    margin-top:8px;
    padding:8px;
    border-radius:12px;
    background:#f5f1ff;
    align-items:center;
    gap:8px;
}

.image-preview img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:9px;
}

.preview-name{
    flex:1;
    font-size:11px;
    color:#666;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.remove-image{
    border:none;
    background:#eee8ff;
    color:#7138ff;
    width:28px;
    height:28px;
    border-radius:50%;
    font-size:16px;
}

/* QUICK HELP */

.quick-title{
    margin:20px 3px 10px;
    font-size:18px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.quick-btn{
    border:none;
    background:white;
    border:1px solid #eee8fa;
    border-radius:15px;
    padding:13px 8px;
    cursor:pointer;
    box-shadow:0 5px 16px rgba(50,30,100,.06);
    color:#38304f;
}

.quick-btn:active{
    transform:scale(.97);
}

.quick-btn div{
    font-size:21px;
    margin-bottom:4px;
}

.quick-btn span{
    font-size:12px;
    font-weight:600;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 22px rgba(40,25,90,.10);
    z-index:1000;
    border-top:1px solid #eeeaf5;
}

.nav-item{
    text-decoration:none;
    color:#858698;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    width:25%;
    height:100%;
    font-size:10px;
}

.nav-item span{
    font-size:20px;
}

.nav-item.active{
    color:#7138ff;
    font-weight:bold;
}

.nav-center{
    width:48px;
    height:48px;
    margin-top:-20px;
    border-radius:50%;
    background:linear-gradient(135deg,#7138ff,#9b4dff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    box-shadow:0 7px 20px rgba(113,56,255,.35);
    border:4px solid white;
}

/* SMALL MOBILE */

@media(max-width:380px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .chat-box{
        height:320px;
    }

    .support-card{
        padding:12px;
    }

    .chat-message{
        max-width:86%;
        font-size:13px;
    }

    .quick-grid{
        gap:8px;
    }

}

</style>

</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

    <a href="dashboard.html" class="back-btn">
        ←
    </a>

    <div class="logo-area">

        <div class="logo">
            ET
        </div>

        <div class="logo-text">
            EliteTask Pro
        </div>

    </div>

</div>


<div class="container">

    <!-- HEADER -->

    <div class="service-header">

        <div class="service-icon">
            💬
        </div>

        <h2>
            Customer Service
        </h2>

        <p>
            We're here to help you.
        </p>

    </div>


    <!-- SUPPORT CARD -->

    <div class="support-card">

        <div class="chat-header">

            <div class="support-avatar">
                👨‍💼
            </div>

            <div class="chat-header-text">

                <strong>
                    Customer Support
                </strong>

                    Usually replies quickly
                </span>

        <!-- CHAT -->

        <div

<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    serverTimestamp,
    getDocs,
    limit
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
        "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
        "elitetask-pro.firebaseapp.com",

    projectId:
        "elitetask-pro",

    storageBucket:
        "elitetask-pro.firebasestorage.app",

    messagingSenderId:
        "504295275402",

    appId:
        "1:504295275402:web:cf744a5d4e82c72145a673"

};


/* INITIALIZE */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/* ELEMENTS */

const chatBox =
    document.getElementById("chatBox");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const attachBtn =
    document.getElementById("attachBtn");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const previewImage =
    document.getElementById("previewImage");

const previewName =
    document.getElementById("previewName");

const removeImage =
    document.getElementById("removeImage");


let currentUser = null;
let unsubscribeMessages = null;
let selectedImage = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser = user;

        messageInput.disabled = false;
        sendBtn.disabled = false;
        attachBtn.disabled = false;

        loadMessages(user.uid);

    }
);


/* =========================
   LOAD CHAT
========================= */

function loadMessages(uid){

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }

    chatBox.innerHTML = `
        <div class="empty-chat">
            Loading conversation...
        </div>
    `;


    const messagesRef =
        collection(
            db,
            "supportMessages"
        );


    /*
       Sirf userId par query hai.
       Is se Firestore composite index
       ki zaroorat nahi hogi.
    */

    const q =
        query(
            messagesRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribeMessages =
        onSnapshot(

            q,

            async (snapshot) => {

                /*
                   New user ke liye automatic
                   welcome message.
                */

                if(snapshot.empty){

                    chatBox.innerHTML = `
                        <div class="empty-chat">
                            No messages yet.
                            <br><br>
                            Send us a message and
                            our support team will help you.
                        </div>
                    `;

                    await createWelcomeMessage(uid);

                    return;

                }


                const messages = [];


                snapshot.forEach(
                    (docSnap) => {

                        messages.push({
                            id:docSnap.id,
                            ...docSnap.data()
                        });

                    }
                );


                /*
                   Local sorting
                */

                messages.sort(
                    (a,b) => {

                        return (
                            getTime(a.createdAt)
                            -
                            getTime(b.createdAt)
                        );

                    }
                );


                chatBox.innerHTML = "";


                messages.forEach(
                    (msg) => {

                        renderMessage(msg);

                    }
                );


                scrollToBottom();

            },

            (error) => {

                console.error(
                    "CHAT ERROR:",
                    error
                );

                chatBox.innerHTML = `
                    <div class="empty-chat">
                        Unable to load chat.
                        <br><br>
                        Please refresh the page.
                    </div>
                `;

            }

        );

}


/* =========================
   WELCOME MESSAGE
========================= */

async function createWelcomeMessage(uid){

    try{

        /*
           Check again so duplicate welcome
           message na bane.
        */

        const messagesRef =
            collection(
                db,
                "supportMessages"
            );

        const q =
            query(
                messagesRef,
                where(
                    "userId",
                    "==",
                    uid
                ),
                limit(1)
            );

        const existing =
            await getDocs(q);

        if(!existing.empty){

            return;

        }


        await addDoc(
            messagesRef,
            {

                userId:
                    uid,

                userEmail:
                    currentUser?.email || "",

                sender:
                    "admin",

                message:
                    "Welcome to EliteTask Pro Customer Support! How can we help you today?",

                status:
                    "new",

                createdAt:
                    serverTimestamp()

            }
        );

    }
    catch(error){

        console.error(
            "Welcome message error:",
            error
        );

    }

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(msg){

    const sender =
        String(
            msg.sender ||
            msg.from ||
            "user"
        ).toLowerCase();


    const isAdmin =
        sender === "admin" ||
        sender === "support";


    const message =
        document.createElement("div");


    message.className =
        isAdmin
        ? "chat-message admin-message"
        : "chat-message user-message";


    const label =
        isAdmin
        ? "Customer Support"
        : "You";


    message.innerHTML = `

        <div class="message-label">
            ${label}
        </div>

        <div
            class="message-text"
        ></div>

    `;


    const text =
        message.querySelector(
            ".message-text"
        );


    text.textContent =
        msg.message ||
        msg.text ||
        "";


    /*
       Agar image hai to image bhi show karo.
    */

    if(msg.imageUrl){

        const img =
            document.createElement("img");

        img.className =
            "chat-image";

        img.src =
            msg.imageUrl;

        img.alt =
            "Shared image";

        img.loading =
            "lazy";

        img.onclick =
            () => {

                window.open(
                    msg.imageUrl,
                    "_blank"
                );

            };

        message.appendChild(img);

    }


    chatBox.appendChild(message);

}


/* =========================
   TIME
========================= */

function getTime(timestamp){

    if(
        timestamp &&
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }

    return 0;

}


/* =========================
   SCROLL
========================= */

function scrollToBottom(){

    setTimeout(
        () => {

            chatBox.scrollTop =
                chatBox.scrollHeight;

        },
        100
    );

}


/* =========================
   GALLERY BUTTON
========================= */

attachBtn.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


/* =========================
   SELECT IMAGE
========================= */

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];


        if(!file){

            return;

        }


        if(!file.type.startsWith("image/")){

            alert(
                "Please select an image."
            );

            imageInput.value = "";

            return;

        }


        /*
           5MB limit
        */

        if(file.size > 5 * 1024 * 1024){

            alert(
                "Image 5MB se choti honi chahiye."
            );

            imageInput.value = "";

            return;

        }


        selectedImage =
            file;


        previewImage.src =
            URL.createObjectURL(file);


        previewName.textContent =
            file.name;


        imagePreview.style.display =
            "flex";

    }
);


/* =========================
   REMOVE IMAGE
========================= */

removeImage.addEventListener(
    "click",
    () => {

        selectedImage =
            null;

        imageInput.value =
            "";

        previewImage.src =
            "";

        imagePreview.style.display =
            "none";

    }
);


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    const text =
        messageInput.value.trim();


    if(!text && !selectedImage){

        return;

    }


    sendBtn.disabled =
        true;

    attachBtn.disabled =
        true;


    try{

        let imageUrl = "";


        /*
           IMAGE UPLOAD
        */

        if(selectedImage){

            const fileName =
                Date.now() +
                "_" +
                selectedImage.name
                .replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const imageRef =
                ref(
                    storage,
                    "supportImages/" +
                    currentUser.uid +
                    "/" +
                    fileName
                );


            const uploadResult =
                await uploadBytes(
                    imageRef,
                    selectedImage
                );


            imageUrl =
                await getDownloadURL(
                    uploadResult.ref
                );

        }


        /*
           FIRESTORE MESSAGE
        */

        await addDoc(
            collection(
                db,
                "supportMessages"
            ),
            {

                userId:
                    currentUser.uid,

                userEmail:
                    currentUser.email || "",

                sender:
                    "user",

                message:
                    text,

                imageUrl:
                    imageUrl,

                status:
                    "new",

                createdAt:
                    serverTimestamp()

            }
        );


        /*
           CLEAR INPUT
        */

        messageInput.value =
            "";

        selectedImage =
            null;

        imageInput.value =
            "";

        previewImage.src =
            "";

        imagePreview.style.display =
            "none";

    }
    catch(error){

        console.error(
            "SEND ERROR:",
            error
        );


        if(
            error.code ===
            "permission-denied"
        ){

            alert(
                "Permission denied. Firebase Firestore/Storage Rules check karo."
            );

        }
        else{

            alert(
                "Message send nahi ho saka. Dobara try karo."
            );

        }

    }


    sendBtn.disabled =
        false;

    attachBtn.disabled =
        false;

    messageInput.focus();

}


/* =========================
   SEND BUTTON
========================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER KEY
========================= */

messageInput.addEventListener(
    "keydown",
    (event) => {

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   QUICK HELP
========================= */

window.sendQuick =
function(text){

    messageInput.value =
        text;

    sendMessage();

};

</script>

</body>
</html>
