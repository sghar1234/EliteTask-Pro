<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Support - EliteTask Pro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:15px;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    border-radius:15px;
    font-size:21px;
    font-weight:bold;
}

.card{
    background:white;
    margin-top:15px;
    padding:18px;
    border-radius:15px;
    box-shadow:0 3px 10px #ddd;
}

.telegram{
    display:block;
    background:#229ED9;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
}

.title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:12px;
}

.chat-box{
    height:350px;
    overflow-y:auto;
    background:#f3f4f6;
    padding:12px;
    border-radius:12px;
}

.message{
    max-width:80%;
    padding:11px 13px;
    margin-bottom:10px;
    border-radius:12px;
    word-break:break-word;
}

.user-message{
    margin-left:auto;
    background:#2563eb;
    color:white;
}

.admin-message{
    margin-right:auto;
    background:white;
    color:#111827;
    border:1px solid #ddd;
}

.sender{
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
    opacity:.8;
}

.chat-input{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.chat-input input{
    flex:1;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:14px;
}

.chat-input button{
    width:80px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
}

.chat-input button:disabled{
    opacity:.5;
}

.back{
    display:block;
    margin-top:20px;
    background:#111827;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:14px;
    border-radius:12px;
}

.error{
    color:#dc2626;
    text-align:center;
    padding:15px;
}

</style>

</head>


<body>


<div class="header">
🎧 Customer Support
</div>


<!-- TELEGRAM -->

<div class="card">

<a
class="telegram"
href="https://t.me/Helpcenter21"
target="_blank">

✈️ Contact us on Telegram

</a>

</div>



<!-- LIVE CHAT -->

<div class="card">

<div class="title">
💬 Live Chat Support
</div>


<div
id="chatBox"
class="chat-box">

<p style="text-align:center;color:#777;">
Loading chat...
</p>

</div>


<div class="chat-input">

<input
id="messageInput"
type="text"
placeholder="Write your message..."
maxlength="500"
>

<button id="sendBtn">
Send
</button>

</div>

</div>



<a
href="dashboard.html"
class="back">

⬅ Back to Dashboard

</a>



<script type="module">

import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
collection,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUser = null;


const chatBox =
document.getElementById("chatBox");


const messageInput =
document.getElementById("messageInput");


const sendBtn =
document.getElementById("sendBtn");



onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="index.html";

return;

}

currentUser = user;

loadChat();

});



function loadChat(){

const chatQuery = query(

collection(db,"supportMessages"),

where("uid","==",currentUser.uid),

orderBy("createdAt","asc")

);


onSnapshot(

chatQuery,

(snapshot)=>{

chatBox.innerHTML="";


if(snapshot.empty){

chatBox.innerHTML=`

<p style="text-align:center;color:#777;padding:20px;">
No messages yet.<br>
Send a message to start live chat.
</p>

`;

return;

}


snapshot.forEach((item)=>{

const data =
item.data();


const message =
document.createElement("div");


message.classList.add("message");


if(data.sender === "user"){

message.classList.add(
"user-message"
);

message.innerHTML=`

<div class="sender">
You
</div>

${escapeHtml(data.message)}

`;

}else{

message.classList.add(
"admin-message"
);

message.innerHTML=`

<div class="sender">
Support
</div>

${escapeHtml(data.message)}

`;

}


chatBox.appendChild(message);

});


chatBox.scrollTop =
chatBox.scrollHeight;

},

(error)=>{

console.error(error);

chatBox.innerHTML=`

<div class="error">
Unable to load chat.
</div>

`;

}

);

}



sendBtn.addEventListener(
"click",
sendMessage
);



messageInput.addEventListener(
"keydown",
(event)=>{

if(event.key==="Enter"){

sendMessage();

}

}
);



async function sendMessage(){

const text =
messageInput.value.trim();


if(!text){

return;

}


if(!currentUser){

alert("Please login first.");

return;

}


sendBtn.disabled=true;


try{

await addDoc(

collection(db,"supportMessages"),

{

uid:currentUser.uid,

name:currentUser.displayName || "",

email:currentUser.email || "",

message:text,

sender:"user",

createdAt:serverTimestamp()

}

);


messageInput.value="";


}catch(error){

alert(
"Message could not be sent: "
+ error.message
);

}


sendBtn.disabled=false;

}



function escapeHtml(text){

const div =
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

</script>


</body>

</html>
