<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Service - EliteTask Pro</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#222;
    padding-bottom:80px;
}

/* TOP */

.topbar{
    height:62px;
    background:linear-gradient(135deg,#5b168f,#8e35bd);
    display:flex;
    align-items:center;
    padding:0 14px;
    color:white;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.back{
    color:white;
    text-decoration:none;
    font-size:25px;
    margin-right:13px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:11px;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:15px;
}

.logo-text{
    margin-left:9px;
    font-size:17px;
    font-weight:bold;
}

/* MAIN */

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:14px 12px 25px;
}

.header{
    text-align:center;
    padding:8px 5px 14px;
}

.header-icon{
    width:55px;
    height:55px;
    margin:auto;
    border-radius:17px;
    background:linear-gradient(135deg,#6c1c9c,#a14bcb);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    color:white;
}

.header h2{
    margin-top:9px;
    font-size:21px;
    color:#4e176c;
}

.header p{
    margin-top:4px;
    color:#888;
    font-size:12px;
}

/* CHAT CARD */

.chat-card{
    background:white;
    border-radius:18px;
    padding:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.chat-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 4px 10px;
}

.chat-title strong{
    font-size:16px;
    color:#4e176c;
}

.online{
    font-size:10px;
    color:#18a45b;
}

/* CHAT */

.chat-box{
    height:390px;
    overflow-y:auto;
    padding:10px;
    background:#f8f7fa;
    border-radius:14px;
    border:1px solid #eee;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#999;
    font-size:12px;
}

/* MESSAGE */

.message{
    max-width:82%;
    padding:9px 11px;
    border-radius:14px;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.user{
    align-self:flex-end;
    background:linear-gradient(135deg,#7020a0,#9840c1);
    color:white;
    border-bottom-right-radius:4px;
}

.admin{
    align-self:flex-start;
    background:white;
    color:#333;
    border:1px solid #e6e1e9;
    border-bottom-left-radius:4px;
}

.label{
    font-size:9px;
    font-weight:bold;
    opacity:.7;
    margin-bottom:3px;
}

.msg-text{
    white-space:pre-wrap;
}

.msg-image{
    display:block;
    width:100%;
    max-width:220px;
    max-height:240px;
    object-fit:cover;
    border-radius:10px;
    margin-top:4px;
    cursor:pointer;
}

/* PREVIEW */

.preview{
    display:none;
    position:relative;
    margin-top:9px;
    padding:8px;
    background:#f4f0f6;
    border-radius:12px;
}

.preview img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:9px;
}

.remove-image{
    position:absolute;
    left:65px;
    top:2px;
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:#e33;
    color:white;
    font-size:13px;
}

/* INPUT */

.input-area{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:9px;
}

.gallery-btn{
    width:43px;
    height:43px;
    flex-shrink:0;
    border:none;
    border-radius:12px;
    background:#f0e7f4;
    color:#671b91;
    font-size:20px;
}

.message-input{
    flex:1;
    height:43px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 12px;
    outline:none;
    font-size:13px;
    background:white;
}

.message-input:focus{
    border-color:#8c35b5;
}

.send-btn{
    width:43px;
    height:43px;
    flex-shrink:0;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#681b91,#9b3ec1);
    color:white;
    font-size:18px;
}

.send-btn:disabled,
.gallery-btn:disabled{
    opacity:.55;
}

/* HIDDEN FILE */

#imageInput{
    display:none;
}

/* QUICK HELP */

.quick-title{
    margin:17px 2px 9px;
    font-size:16px;
    color:#4e176c;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.quick-btn{
    border:1px solid #eadff0;
    background:white;
    border-radius:14px;
    padding:11px 8px;
    color:#551873;
    font-size:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.quick-btn div{
    font-size:21px;
    margin-bottom:3px;
}

/* BOTTOM */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-around;
    box-shadow:0 -4px 18px rgba(0,0,0,.1);
    border-top:1px solid #eee;
    z-index:1000;
}

.nav-item{
    width:25%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    text-decoration:none;
    color:#888;
    font-size:10px;
}

.nav-item span{
    font-size:19px;
}

.nav-item.active{
    color:#72219b;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- TOP -->

<div class="topbar">

    <a href="dashboard.html" class="back">
        ←
    </a>

    <div class="logo">
        ET
    </div>

    <div class="logo-text">
        EliteTask Pro
    </div>

</div>


<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="header-icon">
            💬
        </div>

        <h2>
            Customer Service
        </h2>

        <p>
            We're here to help you
        </p>

    </div>


    <!-- CHAT -->

    <div class="chat-card">

        <div class="chat-title">

            <strong>
                Live Support
            </strong>

            <span class="online">
                ● Online
            </span>

        </div>


        <div
            class="chat-box"
            id="chatBox"
        >

            <div class="empty">
                Loading conversation...
            </div>

        </div>


        <!-- IMAGE PREVIEW -->

        <div
            class="preview"
            id="preview"
        >

            <img
                id="previewImage"
                alt="Selected image"
            >

            <button
                type="button"
                class="remove-image"
                id="removeImage"
            >
                ×
            </button>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <button
                type="button"
                class="gallery-btn"
                id="galleryBtn"
            >
                🖼️
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button
                type="button"
                class="send-btn"
                id="sendBtn"
            >
                ➤
            </button>

        </div>

    </div>


    <!-- QUICK HELP -->

    <h3 class="quick-title">
        Quick Help
    </h3>

    <div class="quick-grid">

        <button
            type="button"
            class="quick-btn"
            onclick="quickMessage('I need help with my tasks.')"
        >
            <div>📦</div>
            Task Help
        </button>

        <button
            type="button"
            class="quick-btn"
            onclick="quickMessage('I need help with withdrawal.')"
        >
            <div>💳</div>
            Withdrawal
        </button>

        <button
            type="button"
            class="quick-btn"
            onclick="quickMessage('I have a problem with my account.')"
        >
            <div>👤</div>
            Account
        </button>

        <button
            type="button"
            class="quick-btn"
            onclick="quickMessage('I need help with my balance.')"
        >
            <div>💰</div>
            Balance
        </button>

    </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item"
    >
        <span>⌂</span>
        Home
    </a>

    <a
        href="orders.html"
        class="nav-item"
    >
        <span>▣</span>
        Tasks
    </a>

    <a
        href="support.html"
        class="nav-item active"
    >
        <span>💬</span>
        Support
    </a>

    <a
        href="profile.html"
        class="nav-item"
    >
        <span>👤</span>
        Profile
    </a>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
    "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
    "elitetask-pro.firebaseapp.com",

    projectId:
    "elitetask-pro",

    storageBucket:
    "elitetask-pro.firebasestorage.app",

    messagingSenderId:
    "504295275402",

    appId:
    "1:504295275402:web:cf744a5d4e82c72145a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/* ELEMENTS */

const chatBox =
    document.getElementById("chatBox");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const galleryBtn =
    document.getElementById("galleryBtn");

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");


let currentUser = null;

let selectedFile = null;

let unsubscribe = null;


/* AUTH */

onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser = user;

        messageInput.disabled = false;
        sendBtn.disabled = false;
        galleryBtn.disabled = false;

        loadChat(user.uid);

    }
);


/* LOAD ONLY CURRENT USER CHAT */

function loadChat(uid){

    if(unsubscribe){

        unsubscribe();

        unsubscribe = null;

    }


    chatBox.innerHTML = `
        <div class="empty">
            Loading conversation...
        </div>
    `;


    const messagesRef =
        collection(
            db,
            "supportMessages"
        );


    /*
    IMPORTANT:

    Sirf current user's UID ki messages
    load hongi.

    Is query mein orderBy nahi hai,
    isliye Firestore composite index
    ki zaroorat nahi.
    */

    const q =
        query(
            messagesRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribe =
        onSnapshot(

            q,

            (snapshot) => {

                if(snapshot.empty){

                    chatBox.innerHTML = `
                        <div class="empty">
                            No messages yet.<br>
                            Send us a message.
                        </div>
                    `;

                    return;

                }


                const messages = [];


                snapshot.forEach(
                    (docSnap) => {

                        messages.push({
                            id:docSnap.id,
                            ...docSnap.data()
                        });

                    }
                );


                /* LOCAL SORT */

                messages.sort(
                    (a,b) => {

                        return getTime(a.createdAt)
                             -
                               getTime(b.createdAt);

                    }
                );


                chatBox.innerHTML = "";


                messages.forEach(
                    (msg) => {

                        const sender =
                            String(
                                msg.sender ||
                                msg.from ||
                                "user"
                            ).toLowerCase();


                        const isAdmin =
                            sender === "admin" ||
                            sender === "support";


                        const div =
                            document.createElement("div");


                        div.className =
                            isAdmin
                            ? "message admin"
                            : "message user";


                        const label =
                            document.createElement("div");


                        label.className =
                            "label";


                        label.textContent =
                            isAdmin
                            ? "Customer Support"
                            : "You";


                        div.appendChild(label);


                        /* IMAGE */

                        const imageUrl =
                            msg.imageUrl ||
                            msg.image ||
                            msg.photoURL ||
                            "";


                        if(imageUrl){

                            const img =
                                document.createElement("img");


                            img.className =
                                "msg-image";


                            img.src =
                                imageUrl;


                            img.alt =
                                "Image";


                            img.onclick =
                                () => {

                                    window.open(
                                        imageUrl,
                                        "_blank"
                                    );

                                };


                            div.appendChild(img);

                        }


                        /* TEXT */

                        const textValue =
                            msg.message ||
                            msg.text ||
                            "";


                        if(textValue){

                            const text =
                                document.createElement("div");


                            text.className =
                                "msg-text";


                            text.textContent =
                                textValue;


                            div.appendChild(text);

                        }


                        chatBox.appendChild(div);

                    }
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            },


            (error) => {

                console.error(
                    "CHAT ERROR:",
                    error
                );


                chatBox.innerHTML = `
                    <div class="empty">
                        Chat load nahi ho rahi.<br><br>
                        Firestore Rules check karo.
                    </div>
                `;

            }

        );

}


/* TIMESTAMP */

function getTime(timestamp){

    if(
        timestamp &&
        typeof timestamp.toMillis === "function"
    ){

        return timestamp.toMillis();

    }

    return 0;

}


/* GALLERY */

galleryBtn.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


/* SELECT IMAGE */

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];


        if(!file){

            return;

        }


        /* 5MB LIMIT */

        if(file.size > 5 * 1024 * 1024){

            alert(
                "Image 5MB se choti honi chahiye."
            );

            imageInput.value = "";

            return;

        }


        selectedFile =
            file;


        const reader =
            new FileReader();


        reader.onload =
            (event) => {

                previewImage.src =
                    event.target.result;

                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* REMOVE IMAGE */

removeImage.addEventListener(
    "click",
    () => {

        selectedFile =
            null;

        imageInput.value =
            "";

        previewImage.src =
            "";

        preview.style.display =
            "none";

    }
);


/* SEND */

async function sendMessage(text){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    text =
        String(text || "").trim();


    if(!text && !selectedFile){

        return;

    }


    sendBtn.disabled =
        true;

    galleryBtn.disabled =
        true;

    messageInput.disabled =
        true;


    try{

        let imageUrl = "";


        /* UPLOAD IMAGE */

        if(selectedFile){

            const fileName =
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(2) +
                "_" +
                selectedFile.name;


            const storageRef =
                ref(
                    storage,
                    "supportImages/" +
                    currentUser.uid +
                    "/" +
                    fileName
                );


            const uploadResult =
                await uploadBytes(
                    storageRef,
                    selectedFile
                );


            imageUrl =
                await getDownloadURL(
                    uploadResult.ref
                );

        }


        /* SAVE MESSAGE */

        const messageData = {

            userId:
                currentUser.uid,

            userEmail:
                currentUser.email || "",

            message:
                text,

            sender:
                "user",

            status:
                "new",

            createdAt:
                serverTimestamp()

        };


        if(imageUrl){

            messageData.imageUrl =
                imageUrl;

        }


        await addDoc(

            collection(
                db,
                "supportMessages"
            ),

            messageData

        );


        /* RESET */

        messageInput.value =
            "";

        selectedFile =
            null;

        imageInput.value =
            "";

        previewImage.src =
            "";

        preview.style.display =
            "none";

    }
    catch(error){

        console.error(
            "SEND ERROR:",
            error
        );


        if(
            error.code ===
            "storage/unauthorized"
        ){

            alert(
                "Image upload permission denied. Storage Rules check karo."
            );

        }
        else if(
            error.code ===
            "permission-denied"
