<body>

<div class="chat-app">

  <div class="chat-header">
    <a href="dashboard.html" class="back-btn">‹</a>

    <div class="support-avatar">
      CS
    </div>

    <div class="header-info">
      <h3>EliteTask Pro Support</h3>
      <div class="online">Customer Service</div>
    </div>
  </div>

  <div class="chat-body" id="chatBody">

    <div class="welcome">
      👋 Welcome to EliteTask Pro Customer Support.<br>
      Send us your message and our support team will reply.
    </div>

    <div class="loading" id="loading">
      Loading messages...
    </div>

  </div>

  <div class="chat-input-area">

    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button id="sendBtn">➤</button>

  </div>

</div>

<script type="module">

  import {
    auth,
    db
  } from "./firebase.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

  import {
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


  const chatBody = document.getElementById("chatBody");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const loading = document.getElementById("loading");

  let currentUser = null;


  onAuthStateChanged(auth, (user) => {

    if (!user) {
      window.location.href = "index.html";
      return;
    }

    currentUser = user;

    loadMessages();

  });


  function loadMessages() {

    const messagesRef = collection(
      db,
      "supportChats",
      currentUser.uid,
      "messages"
    );

    const messagesQuery = query(
      messagesRef,
      orderBy("createdAt", "asc")
    );

    onSnapshot(messagesQuery, (snapshot) => {

      loading.style.display = "none";

      document.querySelectorAll(".chat-message").forEach(el => {
        el.remove();
      });

      if (snapshot.empty) {

        const empty = document.createElement("div");

        empty.className = "empty chat-message";

        empty.textContent =
          "No messages yet. Send a message to Customer Support.";

        chatBody.appendChild(empty);

      }

      snapshot.forEach((docSnap) => {

        const data = docSnap.data();

        const messageDiv = document.createElement("div");

        messageDiv.className =
          "message chat-message " +
          (data.senderId === currentUser.uid
            ? "user-message"
            : "admin-message");


        const textDiv = document.createElement("div");

        textDiv.textContent = data.text;


        const timeDiv = document.createElement("span");

        timeDiv.className = "message-time";

        if (data.createdAt) {

          const date = data.createdAt.toDate();

          timeDiv.textContent =
            date.toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit"
            });

        } else {

          timeDiv.textContent = "Sending...";

        }


        messageDiv.appendChild(textDiv);
        messageDiv.appendChild(timeDiv);

        chatBody.appendChild(messageDiv);

      });

      chatBody.scrollTop = chatBody.scrollHeight;

    }, (error) => {

      loading.textContent =
        "Unable to load messages: " + error.message;

    });

  }


  async function sendMessage() {

    const text = messageInput.value.trim();

    if (!text || !currentUser) {
      return;
    }

    sendBtn.disabled = true;

    try {

      const messagesRef = collection(
        db,
        "supportChats",
        currentUser.uid,
        "messages"
      );

      await addDoc(messagesRef, {

        text: text,

        senderId: currentUser.uid,

        senderRole: "user",

        createdAt: serverTimestamp()

      });

      messageInput.value = "";

      messageInput.focus();

    } catch (error) {

      alert(
        "Message failed: " + error.message
      );

    }

    sendBtn.disabled = false;

  }


  sendBtn.addEventListener("click", sendMessage);


  messageInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  });

</script>

</body>
</html>
