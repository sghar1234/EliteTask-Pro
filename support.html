<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Customer Service - EliteTask Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#fffdf7,#f7efd2,#fffaf0);
    color:#222;
    padding-bottom:90px;
}

/* TOP */

.top-area{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:18px 15px 14px;
}

.back-btn{
    position:absolute;
    left:15px;
    top:16px;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    background:white;
    border:1px solid rgba(212,175,55,.3);
    border-radius:12px;
    color:#9a7410;
    font-size:24px;
    box-shadow:0 4px 15px rgba(120,90,20,.1);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:linear-gradient(135deg,#d4af37,#f5df8b);
    color:white;
    font-weight:800;
    font-size:16px;
}

.logo-text{
    font-size:19px;
    font-weight:800;
    color:#7a5a0a;
}

/* MAIN */

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:5px 13px 25px;
}

/* HEADER */

.service-header{
    text-align:center;
    padding:14px 8px 16px;
}

.service-icon{
    width:58px;
    height:58px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    background:linear-gradient(135deg,#d4af37,#f3d875);
    font-size:27px;
    box-shadow:0 7px 20px rgba(180,140,30,.18);
}

.service-header h2{
    margin-top:10px;
    font-size:21px;
    color:#5f4707;
}

.service-header p{
    margin-top:5px;
    font-size:12px;
    color:#777;
}

/* CARD */

.support-card{
    background:rgba(255,255,255,.96);
    border-radius:20px;
    padding:14px;
    border:1px solid rgba(212,175,55,.28);
    box-shadow:0 8px 25px rgba(120,90,20,.11);
}

.support-card h3{
    font-size:16px;
    color:#5e4606;
}

.support-card > p{
    margin-top:4px;
    margin-bottom:11px;
    color:#777;
    font-size:12px;
}

/* CHAT */

.chat-box{
    height:330px;
    overflow-y:auto;
    padding:10px;
    border-radius:15px;
    background:#faf8f0;
    border:1px solid rgba(212,175,55,.18);
    display:flex;
    flex-direction:column;
    gap:8px;
}

.empty-chat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#999;
    font-size:12px;
    padding:20px;
}

/* MESSAGE */

.chat-message{
    max-width:84%;
    padding:9px 11px;
    border-radius:14px;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.user-message{
    align-self:flex-end;
    background:linear-gradient(135deg,#d4af37,#e7ca63);
    color:white;
    border-bottom-right-radius:4px;
}

.admin-message{
    align-self:flex-start;
    background:white;
    color:#333;
    border:1px solid rgba(212,175,55,.22);
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    border-bottom-left-radius:4px;
}

.message-label{
    font-size:9px;
    font-weight:bold;
    margin-bottom:3px;
    opacity:.75;
}

.message-text{
    white-space:pre-wrap;
}

.message-image{
    display:block;
    width:100%;
    max-width:230px;
    max-height:230px;
    object-fit:contain;
    border-radius:10px;
    margin-top:5px;
}

/* SEND AREA */

.message-area{
    display:flex;
    gap:7px;
    margin-top:9px;
    align-items:center;
}

.attach-btn{
    width:43px;
    height:43px;
    flex:none;
    border:none;
    border-radius:12px;
    background:#f4ead0;
    color:#9a7410;
    font-size:20px;
    cursor:pointer;
}

.message-input{
    flex:1;
    height:43px;
    border-radius:12px;
    border:1px solid #ddd;
    outline:none;
    padding:0 12px;
    font-size:13px;
    background:white;
}

.message-input:focus{
    border-color:#d4af37;
}

.send-btn{
    width:45px;
    height:43px;
    flex:none;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#c9a227,#e4c75e);
    color:white;
    font-size:18px;
    cursor:pointer;
}

.send-btn:disabled,
.attach-btn:disabled{
    opacity:.55;
}

/* IMAGE PREVIEW */

.preview-box{
    display:none;
    margin-top:9px;
    padding:8px;
    background:#faf8f0;
    border:1px solid rgba(212,175,55,.2);
    border-radius:12px;
    position:relative;
}

.preview-box img{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:9px;
}

.remove-image{
    position:absolute;
    top:5px;
    left:92px;
    width:25px;
    height:25px;
    border:none;
    border-radius:50%;
    background:#d33;
    color:white;
    font-size:14px;
    cursor:pointer;
}

/* QUICK HELP */

.quick-title{
    margin:19px 3px 9px;
    font-size:16px;
    color:#5e4606;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.quick-btn{
    border:none;
    background:white;
    border:1px solid rgba(212,175,55,.25);
    border-radius:14px;
    padding:11px 8px;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(120,90,20,.07);
    color:#5e4606;
}

.quick-btn div{
    font-size:21px;
    margin-bottom:4px;
}

.quick-btn span{
    font-size:12px;
    font-weight:600;
}

/* BOTTOM */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:rgba(255,255,255,.98);
    border-top:1px solid rgba(212,175,55,.25);
    box-shadow:0 -4px 18px rgba(80,60,20,.08);
    z-index:100;
}

.nav-item{
    text-decoration:none;
    color:#888;
    font-size:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    width:25%;
    height:100%;
}

.nav-item span{
    font-size:20px;
}

.nav-item.active{
    color:#b38a13;
    font-weight:700;
}

.nav-center{
    width:40px;
    height:40px;
    margin-top:-17px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,#d4af37,#efd477);
    color:white;
    font-size:19px;
    border:4px solid white;
}

/* MOBILE */

@media(max-width:380px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .chat-box{
        height:300px;
    }

    .logo-text{
        font-size:17px;
    }

    .service-header h2{
        font-size:19px;
    }
}
</style>
</head>

<body>

<!-- TOP -->

<div class="top-area">

<a href="dashboard.html" class="back-btn">
←
</a>

<div class="logo-area">

<div class="logo">
ET
</div>

<div class="logo-text">
EliteTask Pro
</div>

</div>

</div>


<div class="container">

<!-- SERVICE HEADER -->

<div class="service-header">

<div class="service-icon">
💬
</div>

<h2>
Customer Service
</h2>

<p>
How can we help you today?
</p>

</div>


<!-- SUPPORT -->

<div class="support-card">

<h3>
Live Support
</h3>

<p>
Send us a message and our support team will respond.
</p>


<div
class="chat-box"
id="chatBox"
>

<div class="empty-chat">
Loading conversation...
</div>

</div>


<!-- IMAGE PREVIEW -->

<div
class="preview-box"
id="previewBox"
>

<img
id="previewImage"
alt="Selected image"
>

<button
class="remove-image"
id="removeImage"
type="button"
>
×
</button>

</div>


<!-- MESSAGE -->

<div class="message-area">

<input
type="file"
id="imageInput"
accept="image/*"
style="display:none"
>

<button
class="attach-btn"
id="attachBtn"
type="button"
>
📷
</button>

<input
type="text"
id="messageInput"
class="message-input"
placeholder="Type your message..."
autocomplete="off"
>

<button
class="send-btn"
id="sendBtn"
type="button"
>
➤
</button>

</div>

</div>


<!-- QUICK HELP -->

<h3 class="quick-title">
Quick Help
</h3>

<div class="quick-grid">

<button
class="quick-btn"
onclick="sendQuick('I need help with my tasks.')"
>

<div>📦</div>

<span>
Task Help
</span>

</button>


<button
class="quick-btn"
onclick="sendQuick('I need help with withdrawal.')"
>

<div>💳</div>

<span>
Withdrawal
</span>

</button>


<button
class="quick-btn"
onclick="sendQuick('I have a problem with my account.')"
>

<div>👤</div>

<span>
Account
</span>

</button>


<button
class="quick-btn"
onclick="sendQuick('I need help with my balance.')"
>

<div>💰</div>

<span>
Balance
</span>

</button>

</div>

</div>


<!-- BOTTOM -->

<div class="bottom-nav">

Home

<span>▣</span>

💬
</div>

Support

</a>


<a href="profile.html" class="nav-item">

<span>👤</span>

Profile

</a>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

authDomain:
"elitetask-pro.firebaseapp.com",

projectId:
"elitetask-pro",

storageBucket:
"elitetask-pro.firebasestorage.app",

messagingSenderId:
"504295275402",

appId:
"1:504295275402:web:cf744a5d4e82c72145a673"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ELEMENTS */

const chatBox =
document.getElementById("chatBox");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const attachBtn =
document.getElementById("attachBtn");

const imageInput =
document.getElementById("imageInput");

const previewBox =
document.getElementById("previewBox");

const previewImage =
document.getElementById("previewImage");

const removeImage =
document.getElementById("removeImage");


let currentUser = null;

let unsubscribeMessages = null;

let selectedImageData = "";

let sending = false;


/* =========================
   IMAGE SELECT
========================= */

attachBtn.addEventListener(
"click",
()=>{

if(!currentUser){

alert("Please login first.");

return;

}

imageInput.click();

});


imageInput.addEventListener(
"change",
()=>{

const file =
imageInput.files[0];

if(!file)
return;


/*
IMAGE SIZE LIMIT

Firestore document ki limit ki wajah se
image ko chota/compress kiya ja raha hai.
*/

if(file.size > 5 * 1024 * 1024){

alert(
"Please select an image smaller than 5MB."
);

imageInput.value="";

return;

}


const reader =
new FileReader();


reader.onload =
function(event){

selectedImageData =
event.target.result;

previewImage.src =
selectedImageData;

previewBox.style.display =
"block";

};


reader.readAsDataURL(file);

});


/* REMOVE IMAGE */

removeImage.addEventListener(
"click",
()=>{

selectedImageData="";

imageInput.value="";

previewImage.src="";

previewBox.style.display="none";

});


/* =========================
   AUTH
========================= */

onAuthStateChanged(
auth,
(user)=>{

if(!user){

currentUser=null;

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages=null;

}

chatBox.innerHTML=`

<div class="empty-chat">

Please login to use Customer Service.

</div>

`;

messageInput.disabled=true;

sendBtn.disabled=true;

attachBtn.disabled=true;

return;

}


currentUser=user;

messageInput.disabled=false;

sendBtn.disabled=false;

attachBtn.disabled=false;

loadMessages(user.uid);

});


/* =========================
   LOAD USER CHAT
========================= */

function loadMessages(uid){

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages=null;

}


chatBox.innerHTML=`

<div class="empty-chat">

Loading conversation...

</div>

`;


const messagesRef =
collection(
db,
"supportMessages"
);


/*
IMPORTANT:

Sirf current logged-in user ki
messages load hongi.
*/

const q =
query(
messagesRef,
where(
"userId",
"==",
uid
)
);


unsubscribeMessages =
onSnapshot(

q,

(snapshot)=>{

if(snapshot.empty){

chatBox.innerHTML=`

<div class="empty-chat">

No messages yet.<br><br>

Send us a message and our support team
will respond.

</div>

`;

return;

}


const messages=[];


snapshot.forEach(
docSnap=>{

messages.push({

id:docSnap.id,

...docSnap.data()

});

});


/*
LOCAL SORT
*/

messages.sort(
(a,b)=>{

return (
getTime(a.createdAt) -
getTime(b.createdAt)
);

});


chatBox.innerHTML="";


messages.forEach(
msg=>{

const sender =
String(
msg.sender ||
msg.from ||
"user"
).toLowerCase();


const isAdmin =
sender==="admin" ||
sender==="support";


const message =
document.createElement("div");


message.className =
isAdmin
?
"chat-message admin-message"
:
"chat-message user-message";


const label =
isAdmin
?
"Customer Support"
:
"You";


message.innerHTML=`

<div class="message-label">
${label}
</div>

<div class="message-text"></div>

`;


const text =
message.querySelector(
".message-text"
);


text.textContent =
msg.message ||
msg.text ||
"";


/*
IMAGE MESSAGE
*/

if(msg.image){

const img =
document.createElement("img");

img.className =
"message-image";

img.src =
msg.image;

img.alt =
"Support image";

message.appendChild(img);

}


chatBox.appendChild(
message
);

});


chatBox.scrollTop =
chatBox.scrollHeight;

},

(error)=>{

console.error(
"Support chat error:",
error
);


chatBox.innerHTML=`

<div class="empty-chat">

Unable to load conversation.

<br><br>

Please try again later.

</div>

`;

});

}


/* =========================
   TIME
========================= */

function getTime(timestamp){

if(
timestamp &&
typeof timestamp.toMillis ===
"function"
){

return timestamp.toMillis();

}

return 0;

}


/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(
dataUrl
){

return new Promise(
(resolve)=>{

const img =
new Image();


img.onload =
()=>{

const canvas =
document.createElement("canvas");


const maxWidth=700;

const maxHeight=700;


let width =
img.width;

let height =
img.height;


if(width > maxWidth){

height =
height *
maxWidth /
width;

width=maxWidth;

}


if(height > maxHeight){

width =
width *
maxHeight /
height;

height=maxHeight;

}


canvas.width =
Math.round(width);

canvas.height =
Math.round(height);


const ctx =
canvas.getContext("2d");


ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);


resolve(
canvas.toDataURL(
"image/jpeg",
0.65
)
);

};


img.src =
dataUrl;

});

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

if(sending)
return;


if(!currentUser){

alert(
"Please login first."
);

return;

}


const text =
messageInput.value.trim();


if(!text && !selectedImageData){

return;

}


sending=true;

sendBtn.disabled=true;

attachBtn.disabled=true;

messageInput.disabled=true;

sendBtn.textContent="...";


try{

let imageData="";


/*
Agar image selected hai
to compress karke Firestore mein
data URL save hogi.
*/

if(selectedImageData){

imageData =
await compressImage(
selectedImageData
);

}


/*
USER MESSAGE

userId current user ka UID hoga.
Is wajah se har user ki chat
alag rahegi.
*/

await addDoc(

collection(
db,
"supportMessages"
),

{

userId:
currentUser.uid,

userEmail:
currentUser.email || "",

message:
text,

image:
imageData,

sender:
"user",

status:
"new",

createdAt:
serverTimestamp()

}

);


/* CLEAR */

messageInput.value="";

selectedImageData="";

imageInput.value="";

previewImage.src="";

previewBox.style.display="none";


}
catch(error){

console.error(
"Send message error:",
error
);


if(
error.code==="permission-denied"
){

alert(
"Message permission denied. Firestore Rules check karo."
);

}
else{

alert(
"Message send nahi ho saka. Please try again."
);

}

}


sending=false;

sendBtn.disabled=false;

attachBtn.disabled=false;

messageInput.disabled=false;

sendBtn.textContent="➤";

messageInput.focus();

}


/* =========================
   SEND BUTTON
========================= */

sendBtn.addEventListener(
"click",
sendMessage
);


/* =========================
   ENTER
========================= */

messageInput.addEventListener(
"keydown",
(event)=>{

if(
event.key==="Enter"
){

event.preventDefault();

sendMessage();

}

});


/* =========================
   QUICK HELP
========================= */

window.sendQuick =
function(text){

messageInput.value =
text;

messageInput.focus();

};


/* =========================
   PREVENT IMAGE TOO LARGE
========================= */

window.addEventListener(
"error",
(event)=>{

if(
event.target &&
event.target.tagName==="IMG"
){

console.log(
"Image load error"
);

}

},
true
);

</script>

</body>
</html>
