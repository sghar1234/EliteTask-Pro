<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Service - EliteTask Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f8fc;
    color:#172033;
    padding-bottom:82px;
}

/* =========================
   TOP BAR
========================= */

.top-area{
    height:72px;
    background:linear-gradient(135deg,#6d35f5,#9146f5);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    box-shadow:0 4px 18px rgba(85,50,180,.18);
}

.back-btn{
    position:absolute;
    left:15px;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:white;
    font-size:28px;
    font-weight:300;

    border-radius:50%;
    background:rgba(255,255,255,.13);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:39px;
    height:39px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.18);

    color:white;

    font-size:15px;
    font-weight:800;
}

.logo-text{
    font-size:18px;
    font-weight:800;
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:600px;

    margin:auto;

    padding:12px 14px 25px;
}

/* =========================
   SUPPORT HEADER
========================= */

.service-header{
    text-align:center;

    padding:8px 5px 15px;
}

.service-icon{
    width:58px;
    height:58px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        #7138f5,
        #a05bf5
    );

    color:white;

    font-size:27px;

    box-shadow:
        0 8px 22px
        rgba(105,55,230,.22);
}

.service-header h2{
    margin-top:9px;

    font-size:21px;

    color:#191c35;
}

.service-header p{
    margin-top:4px;

    font-size:13px;

    color:#7d8498;
}

/* =========================
   CHAT CARD
========================= */

.support-card{
    background:white;

    border-radius:25px;

    overflow:hidden;

    box-shadow:
        0 8px 30px
        rgba(25,30,70,.08);

    border:1px solid #ececf4;
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
    height:70px;

    display:flex;
    align-items:center;

    padding:10px 15px;

    background:
        linear-gradient(
            135deg,
            #f4f1ff,
            #ffffff
        );

    border-bottom:1px solid #ededf4;
}

.support-avatar{
    width:48px;
    height:48px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #7138f5,
        #a45cf5
    );

    color:white;

    font-size:23px;

    margin-right:11px;
}

.support-info{
    flex:1;
}

.support-name{
    font-size:15px;
    font-weight:800;

    color:#24263b;
}

.online{
    margin-top:3px;

    font-size:11px;

    color:#22a35a;
}

.online-dot{
    display:inline-block;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#22b55d;

    margin-right:4px;
}

/* =========================
   CHAT BOX
========================= */

.chat-box{
    height:430px;

    overflow-y:auto;

    padding:15px 11px;

    background:
        linear-gradient(
            180deg,
            #f8f9fd,
            #ffffff
        );

    display:flex;
    flex-direction:column;

    gap:10px;
}

/* scrollbar */

.chat-box::-webkit-scrollbar{
    width:5px;
}

.chat-box::-webkit-scrollbar-thumb{
    background:#cfcfe0;
    border-radius:10px;
}

/* =========================
   EMPTY
========================= */

.empty-chat{
    margin:auto;

    text-align:center;

    color:#9aa0b0;

    font-size:13px;

    line-height:1.5;

    padding:25px;
}

/* =========================
   MESSAGES
========================= */

.chat-message{
    max-width:82%;

    padding:9px 11px;

    border-radius:16px;

    font-size:14px;

    line-height:1.4;

    word-break:break-word;

    position:relative;
}

.user-message{
    align-self:flex-end;

    background:
        linear-gradient(
            135deg,
            #6d35f5,
            #8744f5
        );

    color:white;

    border-bottom-right-radius:5px;

    box-shadow:
        0 4px 12px
        rgba(105,55,230,.14);
}

.admin-message{
    align-self:flex-start;

    background:white;

    color:#292b37;

    border:1px solid #ececf3;

    border-bottom-left-radius:5px;

    box-shadow:
        0 3px 12px
        rgba(30,35,70,.06);
}

.message-label{
    font-size:10px;

    font-weight:800;

    margin-bottom:3px;

    opacity:.68;
}

.message-text{
    white-space:pre-wrap;

    font-size:14px;
}

/* =========================
   MESSAGE IMAGE
========================= */

.message-image{
    display:block;

    width:100%;
    max-width:300px;

    max-height:300px;

    object-fit:cover;

    border-radius:11px;

    margin-top:3px;

    cursor:pointer;
}

/* =========================
   TIME
========================= */

.message-time{
    display:block;

    text-align:right;

    font-size:9px;

    margin-top:4px;

    opacity:.58;
}

/* =========================
   IMAGE PREVIEW
========================= */

.preview-area{
    display:none;

    padding:8px 12px;

    background:#fafaff;

    border-top:1px solid #eeeeF5;

    align-items:center;

    gap:8px;
}

.preview-area.show{
    display:flex;
}

.preview-image{
    width:55px;
    height:55px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #ddd;
}

.preview-info{
    flex:1;

    font-size:11px;

    color:#777;
}

.remove-image{
    width:28px;
    height:28px;

    border:none;

    border-radius:50%;

    background:#eee;

    color:#555;

    font-size:16px;
}

/* =========================
   MESSAGE AREA
========================= */

.message-area{
    min-height:67px;

    padding:10px 11px;

    display:flex;

    align-items:center;

    gap:7px;

    background:white;

    border-top:1px solid #eeeeF5;
}

.attach-btn{
    width:43px;
    height:43px;

    flex:none;

    border:none;

    border-radius:50%;

    background:#f0eff8;

    color:#6d35f5;

    font-size:23px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.message-input{
    flex:1;

    min-width:0;

    height:43px;

    border:1px solid #e2e3eb;

    border-radius:22px;

    padding:0 15px;

    outline:none;

    font-size:13px;

    background:#fafbfe;

    color:#222;
}

.message-input:focus{
    border-color:#8250f5;

    background:white;
}

.send-btn{
    width:43px;
    height:43px;

    flex:none;

    border:none;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #6d35f5,
            #934bf5
        );

    color:white;

    font-size:19px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 5px 14px
        rgba(105,55,230,.25);
}

.send-btn:disabled{
    opacity:.45;
}

/* hidden file */

#imageInput{
    display:none;
}

/* =========================
   QUICK HELP
========================= */

.quick-title{
    margin:19px 4px 10px;

    font-size:18px;

    color:#191c35;
}

.quick-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;
}

.quick-btn{
    border:1px solid #ececf4;

    background:white;

    border-radius:17px;

    padding:13px 8px;

    cursor:pointer;

    color:#292b3b;

    box-shadow:
        0 5px 17px
        rgba(30,35,70,.06);
}

.quick-btn:active{
    transform:scale(.97);
}

.quick-btn div{
    font-size:21px;

    margin-bottom:4px;
}

.quick-btn span{
    font-size:12px;

    font-weight:700;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    display:flex;

    align-items:center;
    justify-content:space-around;

    background:
        rgba(255,255,255,.98);

    border-top:1px solid #ececf3;

    box-shadow:
        0 -5px 20px
        rgba(30,35,70,.08);

    z-index:1000;
}

.nav-item{
    width:25%;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    text-decoration:none;

    color:#7f8596;

    font-size:10px;
}

.nav-item span{
    font-size:21px;
}

.nav-item.active{
    color:#7138f5;

    font-weight:800;
}

.nav-center{
    width:46px;
    height:46px;

    margin-top:-18px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #7138f5,
            #984ef5
        );

    color:white;

    font-size:22px;

    border:4px solid white;

    box-shadow:
        0 6px 18px
        rgba(105,55,230,.25);
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .chat-box{
        height:390px;
    }

    .chat-message{
        max-width:86%;
        font-size:13px;
    }

    .message-input{
        font-size:12px;
    }

    .quick-grid{
        gap:7px;
    }
}

</style>
</head>

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    serverTimestamp,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
        "elitetask-pro.firebaseapp.com",

    projectId:
        "elitetask-pro",

    storageBucket:
        "elitetask-pro.firebasestorage.app",

    messagingSenderId:
        "504295275402",

    appId:
        "1:504295275402:web:cf744a5d4e82c72145a673"

};


/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/* =========================
   ELEMENTS
========================= */

const chatBox =
    document.getElementById("chatBox");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const attachBtn =
    document.getElementById("attachBtn");

const imageInput =
    document.getElementById("imageInput");

const previewArea =
    document.getElementById("previewArea");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");


let currentUser = null;

let unsubscribeMessages = null;

let selectedImage = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            currentUser = null;

            if(unsubscribeMessages){

                unsubscribeMessages();

                unsubscribeMessages = null;

            }

            chatBox.innerHTML = `
                <div class="empty-chat">
                    Please login to use Customer Service.
                </div>
            `;

            messageInput.disabled = true;
            sendBtn.disabled = true;
            attachBtn.disabled = true;

            return;
        }


        currentUser = user;

        messageInput.disabled = false;
        sendBtn.disabled = false;
        attachBtn.disabled = false;


        await createWelcomeMessage(
            user.uid
        );


        loadMessages(
            user.uid
        );

    }
);


/* =========================
   NEW USER WELCOME MESSAGE
========================= */

async function createWelcomeMessage(uid){

    try{

        const messagesRef =
            collection(
                db,
                "supportMessages"
            );


        const q =
            query(
                messagesRef,
                where(
                    "userId",
                    "==",
                    uid
                )
            );


        const snapshot =
            await getDocs(q);


        /*
         Sirf bilkul new user ke liye
         automatic support message.
        */

        if(snapshot.empty){

            await addDoc(
                messagesRef,
                {

                    userId:
                        uid,

                    userEmail:
                        currentUser.email || "",

                    message:
                        "Welcome to EliteTask Pro Customer Support! 👋\nHow can we help you today?",

                    sender:
                        "admin",

                    status:
                        "sent",

                    createdAt:
                        serverTimestamp()

                }
            );

        }

    }
    catch(error){

        console.error(
            "Welcome message error:",
            error
        );

    }

}


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(uid){

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    chatBox.innerHTML = `
        <div class="empty-chat">
            Loading conversation...
        </div>
    `;


    const messagesRef =
        collection(
            db,
            "supportMessages"
        );


    const q =
        query(
            messagesRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribeMessages =
        onSnapshot(

            q,

            (snapshot) => {

                if(snapshot.empty){

                    chatBox.innerHTML = `
                        <div class="empty-chat">
                            No messages yet.<br>
                            Send us a message and our support team will respond.
                        </div>
                    `;

                    return;

                }


                const messages = [];


                snapshot.forEach(
                    (docSnap) => {

                        const data =
                            docSnap.data();


                        messages.push({

                            id:
                                docSnap.id,

                            ...data

                        });

                    }
                );


                /*
                Local sorting.
                Firestore index ki zaroorat nahi.
                */

                messages.sort(
                    (a,b) => {

                        return (
                            getMessageTime(
                                a.createdAt
                            )
                            -
                            getMessageTime(
                                b.createdAt
                            )
                        );

                    }
                );


                chatBox.innerHTML = "";


                messages.forEach(
                    (msg) =>
