<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Service - EliteTask Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#fffdf7,#f7efd2,#fffaf0);
    color:#222;
    padding-bottom:85px;
}

/* TOP */

.top-area{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:10px 15px;
}

.back-btn{
    position:absolute;
    left:15px;
    width:40px;
    height:40px;
    border-radius:12px;
    background:white;
    border:1px solid #eadca9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9a7410;
    text-decoration:none;
    font-size:24px;
    box-shadow:0 4px 14px rgba(120,90,20,.10);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(135deg,#d4af37,#f0d878);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:bold;
}

.logo-text{
    font-size:18px;
    font-weight:bold;
    color:#745707;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    padding:5px 12px 25px;
}

/* HEADER */

.service-header{
    text-align:center;
    padding:12px 5px 16px;
}

.service-icon{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:18px;
    background:linear-gradient(135deg,#d4af37,#efd477);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 7px 20px rgba(180,140,30,.18);
}

.service-header h2{
    margin-top:10px;
    font-size:21px;
    color:#604807;
}

.service-header p{
    margin-top:5px;
    font-size:12px;
    color:#888;
}

/* CARD */

.support-card{
    background:white;
    border-radius:20px;
    padding:13px;
    border:1px solid #eadca9;
    box-shadow:0 7px 25px rgba(120,90,20,.10);
}

.support-card h3{
    font-size:16px;
    color:#604807;
}

.support-card > p{
    margin-top:4px;
    margin-bottom:10px;
    font-size:11px;
    color:#888;
}

/* CHAT */

.chat-box{
    height:340px;
    overflow-y:auto;
    padding:10px;
    border-radius:15px;
    background:#faf8f0;
    border:1px solid #eee3b9;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.empty-chat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#999;
    font-size:12px;
    padding:20px;
}

/* MESSAGE */

.chat-message{
    max-width:82%;
    padding:9px 11px;
    border-radius:14px;
    font-size:13px;
    line-height:1.35;
    word-break:break-word;
}

.user-message{
    align-self:flex-end;
    background:linear-gradient(135deg,#d4af37,#e8cc68);
    color:white;
    border-bottom-right-radius:4px;
}

.admin-message{
    align-self:flex-start;
    background:white;
    color:#333;
    border:1px solid #eadca9;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    border-bottom-left-radius:4px;
}

.message-label{
    font-size:9px;
    font-weight:bold;
    margin-bottom:3px;
    opacity:.75;
}

.message-text{
    white-space:pre-wrap;
}

/* IMAGE */

.chat-image{
    width:100%;
    max-width:220px;
    max-height:230px;
    object-fit:contain;
    border-radius:10px;
    display:block;
    margin-top:5px;
    background:#eee;
    cursor:pointer;
}

/* INPUT */

.message-area{
    display:flex;
    gap:6px;
    margin-top:9px;
    align-items:center;
}

.message-input{
    flex:1;
    min-width:0;
    height:44px;
    border-radius:12px;
    border:1px solid #ddd;
    outline:none;
    padding:0 11px;
    font-size:13px;
    background:white;
}

.message-input:focus{
    border-color:#d4af37;
}

/* GALLERY */

.gallery-btn{
    width:42px;
    height:44px;
    flex-shrink:0;
    border:none;
    border-radius:12px;
    background:#f7f1d9;
    color:#a27a0d;
    font-size:20px;
    cursor:pointer;
}

.send-btn{
    width:44px;
    height:44px;
    flex-shrink:0;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#c9a227,#e4c75e);
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* PREVIEW */

.preview-box{
    display:none;
    position:relative;
    margin-top:8px;
    padding:7px;
    background:#faf8f0;
    border-radius:12px;
}

.preview-box img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:9px;
}

.remove-preview{
    position:absolute;
    top:2px;
    left:78px;
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:#e33;
    color:white;
    font-size:12px;
}

/* QUICK HELP */

.quick-title{
    margin:18px 2px 9px;
    font-size:16px;
    color:#604807;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.quick-btn{
    border:1px solid #eadca9;
    background:white;
    border-radius:14px;
    padding:11px 8px;
    cursor:pointer;
    box-shadow:0 4px 13px rgba(120,90,20,.07);
    color:#604807;
}

.quick-btn div{
    font-size:21px;
    margin-bottom:4px;
}

.quick-btn span{
    font-size:11px;
    font-weight:bold;
}

/* BOTTOM */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    background:white;
    border-top:1px solid #eadca9;
    box-shadow:0 -4px 18px rgba(80,60,20,.08);
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:1000;
}

.nav-item{
    width:25%;
    height:100%;
    text-decoration:none;
    color:#888;
    font-size:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.nav-item span{
    font-size:20px;
}

.nav-item.active{
    color:#b38a13;
    font-weight:bold;
}

.nav-center{
    width:42px;
    height:42px;
    margin-top:-17px;
    border-radius:50%;
    background:linear-gradient(135deg,#d4af37,#efd477);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    border:4px solid white;
}

/* MOBILE */

@media(max-width:380px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .chat-box{
        height:310px;
    }

    .logo-text{
        font-size:17px;
    }
}
</style>
</head>

<body>

<!-- TOP -->

<div class="top-area">

    <a href="dashboard.html" class="back-btn">
        ←
    </a>

    <div class="logo-area">

        <div class="logo">
            ET
        </div>

        <div class="logo-text">
            EliteTask Pro
        </div>

    </div>

</div>


<div class="container">

<!-- HEADER -->

<div class="service-header">

    <div class="service-icon">
        💬
    </div>

    <h2>
        Customer Service
    </h2>

    <p>
        How can we help you today?
    </p>

</div>


<!-- SUPPORT -->

<div class="support-card">

    <h3>
        Live Support
    </h3>

    <p>
        Send a message or photo to customer support.
    </p>


    <div
        class="chat-box"
        id="chatBox"
    >

        <div class="empty-chat">
            Loading conversation...
        </div>

    </div>


    <!-- IMAGE PREVIEW -->

    <div
        class="preview-box"
        id="previewBox"
    >

        <img
            id="previewImage"
            alt="Preview"
        >

        <button
            class="remove-preview"
            id="removePreview"
            type="button"
        >
            ×
        </button>

    </div>


    <!-- MESSAGE AREA -->

    <div class="message-area">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="gallery-btn"
            id="galleryBtn"
            type="button"
            title="Gallery"
        >
            🖼️
        </button>

        <input
            type="text"
            id="messageInput"
            class="message-input"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button
            class="send-btn"
            id="sendBtn"
            type="button"
        >
            ➤
        </button>

    </div>

</div>


<!-- QUICK HELP -->

<h3 class="quick-title">
    Quick Help
</h3>

<div class="quick-grid">

    <button
        class="quick-btn"
        onclick="sendQuick('I need help with my tasks.')"
    >
        <div>📦</div>
        <span>Task Help</span>
    </button>

    <button
        class="quick-btn"
        onclick="sendQuick('I need help with withdrawal.')"
    >
        <div>💳</div>
        <span>Withdrawal</span>
    </button>

    <button
        class="quick-btn"
        onclick="sendQuick('I have a problem with my account.')"
    >
        <div>👤</div>
        <span>Account</span>
    </button>

    <button
        class="quick-btn"
        onclick="sendQuick('I need help with my balance.')"
    >
        <div>💰</div>
        <span>Balance</span>
    </button>

</div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <a href="dashboard.html" class="nav-item">
        <span>⌂</span>
        Home
    </a>

    <a href="orders.html" class="nav-item">
        <span>▣</span>
        Tasks
    </a>

    <a href="support.html" class="nav-item active">
        <div class="nav-center">
            💬
        </div>
        Support
    </a>

    <a href="profile.html" class="nav-item">
        <span>👤</span>
        Profile
    </a>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
    "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain:
    "elitetask-pro.firebaseapp.com",

    projectId:
    "elitetask-pro",

    storageBucket:
    "elitetask-pro.firebasestorage.app",

    messagingSenderId:
    "504295275402",

    appId:
    "1:504295275402:web:cf744a5d4e82c72145a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/* ELEMENTS */

const chatBox =
    document.getElementById("chatBox");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const galleryBtn =
    document.getElementById("galleryBtn");

const imageInput =
    document.getElementById("imageInput");

const previewBox =
    document.getElementById("previewBox");

const previewImage =
    document.getElementById("previewImage");

const removePreview =
    document.getElementById("removePreview");


let currentUser = null;
let selectedImage = null;
let unsubscribeMessages = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            currentUser = null;

            if(unsubscribeMessages){
                unsubscribeMessages();
                unsubscribeMessages = null;
            }

            chatBox.innerHTML = `
                <div class="empty-chat">
                    Please login to use Customer Service.
                </div>
            `;

            messageInput.disabled = true;
            sendBtn.disabled = true;
            galleryBtn.disabled = true;

            return;
        }


        currentUser = user;

        messageInput.disabled = false;
        sendBtn.disabled = false;
        galleryBtn.disabled = false;

        loadMessages(user.uid);

    }
);


/* =========================
   LOAD USER CHAT
========================= */

function loadMessages(uid){

    if(unsubscribeMessages){
        unsubscribeMessages();
        unsubscribeMessages = null;
    }


    chatBox.innerHTML = `
        <div class="empty-chat">
            Loading conversation...
        </div>
    `;


    const messagesRef =
        collection(
            db,
            "supportMessages"
        );


    /*
    IMPORTANT:

    Sirf current user ke messages
    load honge.

    Har user ki chat alag rahegi.
    */

    const q =
        query(
            messagesRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot => {

                if(snapshot.empty){

                    chatBox.innerHTML = `
                        <div class="empty-chat">
                            No messages yet.<br><br>
                            Send us a message and our support team will respond.
                        </div>
                    `;

                    return;
                }


                const messages = [];


                snapshot.forEach(
                    docSnap => {

                        messages.push({
                            id:docSnap.id,
                            ...docSnap.data()
                        });

                    }
                );


                messages.sort(
                    (a,b) => {

                        return getTime(a.createdAt)
                             - getTime(b.createdAt);

                    }
                );


                chatBox.innerHTML = "";


                messages.forEach(
                    msg => {

                        const sender =
                            String(
                                msg.sender ||
                                msg.from ||
                                "user"
                            ).toLowerCase();


                        const isAdmin =
                            sender === "admin" ||
                            sender === "support";


                        const message =
                            document.createElement("div");


                        message.className =
                            isAdmin
                            ? "chat-message admin-message"
                            : "chat-message user-message";


                        const label =
                            isAdmin
                            ? "Customer Support"
                            : "You";


                        message.innerHTML = `
                            <div class="message-label">
                                ${label}
                            </div>

                            <div class="message-text"></div>
                        `;


                        const text =
                            message.querySelector(
                                ".message-text"
                            );


                        text.textContent =
                            msg.message ||
                            msg.text ||
                            "";


                        /*
                        IMAGE MESSAGE
                        */

                        if(msg.imageUrl){

                            const img =
                                document.createElement("img");

                            img.className =
                                "chat-image";

                            img.src =
                                msg.imageUrl;

                            img.alt =
                                "Sent image";

                            img.onclick =
                                () => {
                                    window.open(
                                        msg.imageUrl,
                                        "_blank"
                                    );
                                };


                            text.after(img);

                        }


                        chatBox.appendChild(message);

                    }
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            },


            error => {

                console.error(
                    "CHAT ERROR:",
                    error
                );


                chatBox.innerHTML = `
                    <div class="empty-chat">
                        Unable to load conversation.<br><br>
                        Please check Firebase rules.
                    </div>
                `;

            }
        );

}


/* TIME */

function getTime(timestamp){

    if(
        timestamp &&
        typeof timestamp.toMillis === "function"
    ){
        return timestamp.toMillis();
    }

    return 0;
}


/* =========================
   GALLERY
========================= */

galleryBtn.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


/* SELECT IMAGE */

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];


        if(!file){
            return;
        }


        /*
        5MB LIMIT
        */

        if(file.size > 5 * 1024 * 1024){

            alert(
                "Image 5MB se kam honi chahiye."
            );

            imageInput.value = "";
            return;

        }


        if(!file.type.startsWith("image/")){

            alert(
                "Sirf image select karo."
            );

            imageInput.value = "";
            return;

        }


        selectedImage = file;


        const reader =
            new FileReader();


        reader.onload =
            event => {

                previewImage.src =
                    event.target.result;

                previewBox.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* REMOVE IMAGE */

removePreview.addEventListener(
    "click",
    () => {

        selectedImage = null;

        imageInput.value = "";

        previewBox.style.display =
            "none";

        previewImage.src = "";

    }
);


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    const text =
        messageInput.value.trim();


    if(!text && !selectedImage){

        return;

    }


    sendBtn.disabled = true;
    galleryBtn.disabled = true;
    messageInput.disabled = true;

    sendBtn.textContent = "...";


    try{

        let imageUrl = "";


        /*
        UPLOAD IMAGE
        */

        if(selectedImage){

            const fileName =
                Date.now() +
                "_" +
                selectedImage.name
                .replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const imageRef =
                ref(
                    storage,
                    "supportImages/" +
                    currentUser.uid +
                    "/" +
                    fileName
                );


            const uploadResult =
                await uploadBytes(
                    imageRef,
                    selectedImage
                );


            imageUrl =
                await getDownloadURL(
                    uploadResult.ref
                );

        }


        /*
        FIRESTORE MESSAGE

        userId current logged-in user ka hai,
        isliye har user ki chat separate rahegi.
        */

        await addDoc(
            collection(
                db,
                "supportMessages"
            ),
            {

                userId:
                    currentUser.uid,

                userEmail:
                    currentUser.email || "",

                message:
                    text,

                imageUrl:
                    imageUrl,

                sender:
                    "user",

                status:
                    "new",

                createdAt:
                    serverTimestamp()

            }
        );


        messageInput.value = "";

        selectedImage = null;

        imageInput.value = "";

        previewBox.style.display =
            "none";

        previewImage.src = "";

    }
    catch(error){

        console.error(
            "SEND ERROR:",
            error
        );


        alert(
            "Message send nahi ho saka: " +
            error.message
        );

    }


    sendBtn.disabled = false;
    galleryBtn.disabled = false;
    messageInput.disabled = false;

    sendBtn.textContent = "➤";

    messageInput.focus();

}


/* SEND BUTTON */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ENTER */

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* QUICK HELP */

window.sendQuick =
function(text){

    messageInput.value =
        text;

    sendMessage();

};

</script>

</body>
</html>
