<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.login-box{
background:white;
max-width:400px;
margin:80px auto;
padding:25px;
border-radius:18px;
box-shadow:0 4px 15px #ddd;
}

h1{
text-align:center;
color:#111827;
}

p{
text-align:center;
margin-top:8px;
color:#666;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:18px;
background:#111827;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

</style>

</head>


<body>


<div class="login-box">

<h1>EliteTask Pro</h1>

<p>Admin Login</p>


<input
id="email"
type="email"
placeholder="Admin Email"
>


<input
id="password"
type="password"
placeholder="Password"
>


<button id="loginBtn">
Admin Login
</button>

</div>



<script type="module">

import { auth, db } from "./firebase.js";

import {
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


document.getElementById("loginBtn")
.addEventListener("click",async()=>{


const email =
document.getElementById("email").value.trim();


const password =
document.getElementById("password").value;


if(!email || !password){

alert("Enter email and password");

return;

}


try{


const result =
await signInWithEmailAndPassword(
auth,
email,
password
);


const userSnap =
await getDoc(
doc(db,"users",result.user.uid)
);


if(
!userSnap.exists() ||
userSnap.data().role !== "admin"
){

await auth.signOut();

alert("You are not authorized as admin.");

return;

}


window.location.href="admin.html";


}catch(error){

alert(error.message);

}


});

</script>


</body>
</html>
