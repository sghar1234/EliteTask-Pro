<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-card{
width:100%;
max-width:400px;
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 4px 15px #ddd;
}

.logo{
text-align:center;
font-size:28px;
margin-bottom:8px;
}

.title{
text-align:center;
font-size:22px;
font-weight:bold;
color:#111827;
}

.subtitle{
text-align:center;
color:#777;
margin-top:7px;
font-size:14px;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:18px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
}

button:disabled{
opacity:.6;
}

.message{
margin-top:15px;
text-align:center;
font-size:14px;
font-weight:bold;
}

.error{
color:#dc2626;
}

.success{
color:#16a34a;
}

</style>

</head>


<body>


<div class="login-card">

<div class="logo">
⚙️
</div>

<div class="title">
EliteTask Pro
</div>

<div class="subtitle">
Admin Panel Login
</div>


<input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="email"
>


<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>


<button id="loginBtn">
Login as Admin
</button>


<div
id="message"
class="message">
</div>

</div>



<script type="module">

import { auth, db } from "./firebase.js";


import {
signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const emailInput =
document.getElementById("email");


const passwordInput =
document.getElementById("password");


const loginBtn =
document.getElementById("loginBtn");


const message =
document.getElementById("message");



loginBtn.addEventListener(
"click",
adminLogin
);



passwordInput.addEventListener(
"keydown",
(event)=>{

if(event.key === "Enter"){

adminLogin();

}

}
);



async function adminLogin(){

const email =
emailInput.value.trim();


const password =
passwordInput.value;


message.innerText="";
message.className="message";


if(!email || !password){

message.innerText =
"Please enter email and password.";

message.classList.add("error");

return;

}


loginBtn.disabled=true;

loginBtn.innerText="Checking...";


try{


/* Firebase Authentication login */

const result =
await signInWithEmailAndPassword(
auth,
email,
password
);


const user =
result.user;


/* Get user's Firestore document */

const userRef =
doc(db,"users",user.uid);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

await auth.signOut();

throw new Error(
"Admin profile not found."
);

}


const userData =
userSnap.data();


/* Check role */

if(userData.role !== "admin"){

await auth.signOut();

throw new Error(
"Access denied. This account is not an admin."
);

}


/* Admin verified */

message.innerText =
"Admin verified. Opening panel...";

message.classList.add("success");


setTimeout(()=>{

window.location.href =
"admin.html";

},500);


}catch(error){

console.error(error);

message.innerText =
error.message;

message.classList.add("error");

loginBtn.disabled=false;

loginBtn.innerText =
"Login as Admin";

}

}

</script>


</body>

</html>
