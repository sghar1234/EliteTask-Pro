<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Admin Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
    padding-bottom:85px;
}

/* TOP */

.topbar{
    height:70px;
    background:linear-gradient(135deg,#07152f,#1454a3);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
    color:white;
}

.back{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.title{
    font-size:17px;
    font-weight:bold;
}

.subtitle{
    font-size:11px;
    opacity:.7;
    margin-top:3px;
}

/* CONTAINER */

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

/* USER */

.user-card{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 4px 18px rgba(20,40,80,.07);
    margin-bottom:12px;
}

.user-name{
    font-size:17px;
    font-weight:bold;
}

.user-email{
    font-size:12px;
    color:#8992a2;
    margin-top:4px;
    word-break:break-word;
}

/* CHAT */

.chat-box{
    background:#eef3f8;
    border-radius:18px;
    padding:15px;
    min-height:430px;
    max-height:calc(100vh - 245px);
    overflow-y:auto;
}

.message{
    max-width:82%;
    padding:11px 13px;
    border-radius:15px;
    margin-bottom:10px;
    font-size:13px;
    line-height:1.45;
    word-break:break-word;
}

.user-message{
    background:white;
    color:#263241;
    border-bottom-left-radius:4px;
    margin-right:auto;
    box-shadow:0 2px 7px rgba(0,0,0,.05);
}

.admin-message{
    background:#1478ed;
    color:white;
    border-bottom-right-radius:4px;
    margin-left:auto;
}

.time{
    font-size:9px;
    opacity:.6;
    margin-top:5px;
}

.empty{
    text-align:center;
    color:#8992a2;
    padding:80px 20px;
    font-size:13px;
}

.loading{
    text-align:center;
    color:#8992a2;
    padding:80px 20px;
    font-size:13px;
}

.error{
    background:#fee2e2;
    color:#b91c1c;
    padding:15px;
    border-radius:12px;
    line-height:1.5;
}

/* INPUT */

.message-area{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.message-input{
    flex:1;
    border:1px solid #dfe5ec;
    background:white;
    border-radius:14px;
    padding:13px;
    font-size:13px;
    outline:none;
}

.send-btn{
    width:52px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send-btn:active{
    transform:scale(.96);
}

</style>

</head>

<body>

<div class="topbar">

    <a href="admin.html" class="back">
        ←
    </a>

    <div>
        <div class="title">
            💬 Admin Chat
        </div>

        <div class="subtitle">
            Customer Support
        </div>
    </div>

</div>


<div class="container">

    <div class="user-card">

        <div class="user-name" id="userName">
            Loading User...
        </div>

        <div class="user-email" id="userEmail">
            Loading...
        </div>

    </div>


    <div class="chat-box" id="chatBox">

        <div class="loading">
            Loading conversation...
        </div>

    </div>


    <div class="message-area">

        <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Type your reply..."
        >

        <button
            id="sendBtn"
            class="send-btn"
        >
            ➤
        </button>

    </div>

</div>


<script type="module">

import {
    auth,
    db
}
from "./firebase.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
    collection,
    addDoc,
    query,
    where,
    getDocs,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* ADMIN UID */

const ADMIN_UID =
"BLmacTdfuBVlQ0eEJWsQidnexY02";


/* ELEMENTS */

const chatBox =
document.getElementById("chatBox");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const userName =
document.getElementById("userName");

const userEmail =
document.getElementById("userEmail");


/* GET USER FROM URL */

const params =
new URLSearchParams(
window.location.search
);

const targetUid =
params.get("uid");

const targetName =
params.get("name") || "User";


userName.textContent =
targetName;


if(!targetUid){

    chatBox.innerHTML = `
        <div class="error">
            User ID missing.<br><br>
            Please open chat from Admin Panel → Users.
        </div>
    `;

    sendBtn.disabled = true;

}


/* AUTH */

onAuthStateChanged(
auth,
async(user)=>{

    if(!user){

        window.location.href =
        "admin-login.html";

        return;

    }


    if(user.uid !== ADMIN_UID){

        chatBox.innerHTML = `
            <div class="error">
                Access denied. This account is not the Admin account.
            </div>
        `;

        sendBtn.disabled = true;

        return;

    }


    if(targetUid){

        await loadUserChat();

    }

});


/* LOAD CHAT */

async function loadUserChat(){

    chatBox.innerHTML = `
        <div class="loading">
            Loading conversation...
        </div>
    `;


    try{

        const q =
        query(
            collection(
                db,
                "supportMessages"
            ),
            where(
                "userId",
                "==",
                targetUid
            )
        );


        const snapshot =
        await getDocs(q);


        const messages = [];


        snapshot.forEach(
            item=>{

                messages.push({
                    id:item.id,
                    data:item.data()
                });

            }
        );


        /* SORT ON DEVICE */

        messages.sort(
            (a,b)=>{

                const aTime =
                a.data.createdAt?.seconds || 0;

                const bTime =
                b.data.createdAt?.seconds || 0;

                return aTime - bTime;

            }
        );


        chatBox.innerHTML = "";


        if(messages.length === 0){

            chatBox.innerHTML = `
                <div class="empty">
                    No messages yet.<br><br>
                    Send a message to start the conversation.
                </div>
            `;

            return;

        }


        messages.forEach(
            item=>{

                const data =
                item.data;


                const div =
                document.createElement("div");


                if(data.sender === "admin"){

                    div.className =
                    "message admin-message";

                }else{

                    div.className =
                    "message user-message";

                }


                const text =
                document.createElement("div");

                text.textContent =
                data.message ||
                data.text ||
                "";


                div.appendChild(text);


                const time =
                document.createElement("div");

                time.className =
                "time";


                if(data.createdAt?.seconds){

                    const date =
                    new Date(
                        data.createdAt.seconds * 1000
                    );


                    time.textContent =
                    date.toLocaleString();

                }else{

                    time.textContent =
                    "Just now";

                }


                div.appendChild(time);


                chatBox.appendChild(div);

            }
        );


        chatBox.scrollTop =
        chatBox.scrollHeight;


        /* EMAIL */

        const first =
        messages[0]?.data;


        if(first?.email){

            userEmail.textContent =
            first.email;

        }else{

            userEmail.textContent =
            "Customer";

        }


    }catch(error){

        console.error(error);


        chatBox.innerHTML = `
            <div class="error">
                Unable to load chat.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* SEND ADMIN MESSAGE */

async function sendMessage(){

    const message =
    messageInput.value.trim();


    if(!message){

        return;

    }


    if(!targetUid){

        alert(
            "User ID missing."
        );

        return;

    }


    try{

        sendBtn.disabled = true;


        await addDoc(

            collection(
                db,
                "supportMessages"
            ),

            {

                userId:
                targetUid,

                name:
                targetName,

                email:
                userEmail.textContent || "",

                message:
                message,

                sender:
                "admin",

                createdAt:
                serverTimestamp()

            }

        );


        messageInput.value = "";


        await loadUserChat();


    }catch(error){

        console.error(error);


        alert(
            "Message send nahi ho saka:\n" +
            error.message
        );

    }


    sendBtn.disabled = false;

}


/* SEND BUTTON */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ENTER */

messageInput.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ESCAPE */

function escapeHtml(text){

    return String(text)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
