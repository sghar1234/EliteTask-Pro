<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Admin Chat</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fa;
    color:#172033;
    padding-bottom:20px;
}


/* HEADER */

.header{
    height:72px;
    background:linear-gradient(135deg,#07152f,#1454a3);
    color:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.back{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12);
    color:white;
    font-size:22px;
    cursor:pointer;
}

.header-info{
    flex:1;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.header-user{
    font-size:12px;
    opacity:.75;
    margin-top:4px;
}


/* MAIN */

.container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.chat-card{
    background:white;
    border-radius:21px;
    padding:15px;
    box-shadow:0 5px 20px rgba(20,40,80,.08);
}


/* STATUS */

.status{
    text-align:center;
    font-size:11px;
    color:#8994a6;
    margin-bottom:10px;
}


/* CHAT */

.chat-box{
    height:500px;
    background:#f7f9fc;
    border-radius:17px;
    padding:15px;
    overflow-y:auto;
}

.message{
    max-width:82%;
    padding:11px 13px;
    border-radius:15px;
    margin-bottom:10px;
    font-size:13px;
    line-height:1.45;
    word-break:break-word;
}

.user-message{
    background:white;
    color:#263244;
    border:1px solid #e4e8ef;
    border-bottom-left-radius:4px;
}

.admin-message{
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    margin-left:auto;
    border-bottom-right-radius:4px;
}

.time{
    font-size:9px;
    opacity:.55;
    margin-top:5px;
}


/* EMPTY */

.empty{
    min-height:450px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#8994a6;
    font-size:14px;
}


/* ERROR */

.error{
    padding:20px;
    text-align:center;
    color:#b91c1c;
    font-size:13px;
    line-height:1.6;
}


/* INPUT */

.message-area{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.message-input{
    flex:1;
    border:1px solid #dce2ea;
    border-radius:14px;
    padding:13px;
    font-size:14px;
    outline:none;
    background:white;
}

.message-input:focus{
    border-color:#1678e8;
}

.send-btn{
    width:55px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    font-size:21px;
    cursor:pointer;
}

.send-btn:disabled{
    opacity:.6;
}


/* USER INFO */

.user-info{
    margin-top:12px;
    background:#f5f8fc;
    border-radius:13px;
    padding:12px;
    font-size:11px;
    color:#788496;
}

.user-info b{
    color:#172033;
}


/* MOBILE */

@media(max-width:380px){

    .container{
        padding:12px;
    }

    .chat-box{
        height:450px;
    }

    .header-title{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <button
        class="back"
        id="backBtn">
        ←
    </button>


    <div class="header-info">

        <div class="header-title">
            💬 Customer Support
        </div>

        <div
            class="header-user"
            id="userName">
            Loading user...
        </div>

    </div>

</div>


<!-- MAIN -->

<div class="container">

    <div class="chat-card">


        <div
            class="status"
            id="statusText">
            Checking admin login...
        </div>


        <!-- CHAT -->

        <div
            class="chat-box"
            id="chatBox">

            <div class="empty">
                Loading chat...
            </div>

        </div>


        <!-- INPUT -->

        <div class="message-area">

            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Type your reply...">

            <button
                id="sendBtn"
                class="send-btn">
                ➤
            </button>

        </div>


        <!-- USER INFO -->

        <div class="user-info">

            Chatting with:
            <b id="userInfoName">
                User
            </b>

            <br>

            User ID:
            <b id="userInfoId">
                Loading...
            </b>

        </div>


    </div>

</div>


<!-- FIREBASE -->

<script type="module">


/* =========================
   FIREBASE
========================= */


import {
    auth,
    db
}
from "./firebase.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
    collection,
    addDoc,
    query,
    where,
    getDocs,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



/* =========================
   ADMIN UID
========================= */


const ADMIN_UID =
"BLmacTdfuBVlQ0eEJWsQidnexY02";



/* =========================
   URL USER
========================= */


const params =
new URLSearchParams(
    window.location.search
);


const userId =
params.get("uid");


const userName =
params.get("name") ||
"User";



/* =========================
   ELEMENTS
========================= */


const chatBox =
document.getElementById(
    "chatBox"
);


const input =
document.getElementById(
    "messageInput"
);


const sendBtn =
document.getElementById(
    "sendBtn"
);


const statusText =
document.getElementById(
    "statusText"
);


const userNameBox =
document.getElementById(
    "userName"
);


const userInfoName =
document.getElementById(
    "userInfoName"
);


const userInfoId =
document.getElementById(
    "userInfoId"
);



/* =========================
   SHOW USER
========================= */


userNameBox.textContent =
"Chat with: " + userName;


userInfoName.textContent =
userName;


userInfoId.textContent =
userId || "Missing";



/* =========================
   BACK
========================= */


document
.getElementById("backBtn")
.addEventListener(
    "click",
    () => {

        window.location.href =
        "admin.html";

    }
);



/* =========================
   ADMIN LOGIN
========================= */


let adminUser = null;


onAuthStateChanged(
    auth,
    async (user) => {


        if(!user){

            statusText.textContent =
            "Admin login required.";

            chatBox.innerHTML = `
                <div class="error">
                    Admin login not found.
                    <br><br>
                    Please login as Admin.
                </div>
            `;

            return;

        }


        if(
            user.uid !==
            ADMIN_UID
        ){

            statusText.textContent =
            "Access denied.";

            chatBox.innerHTML = `
                <div class="error">
                    Access Denied.
                    <br><br>
                    This account is not the Admin account.
                </div>
            `;

            return;

        }


        adminUser = user;


        if(!userId){

            statusText.textContent =
            "User not selected.";

            chatBox.innerHTML = `
                <div class="error">
                    User ID is missing.
                    <br><br>
                    Please open Chat with User
                    from the Admin Users section.
                </div>
            `;

            return;

        }


        statusText.textContent =
        "Loading messages...";


        await loadChat();

    }
);



/* =========================
   LOAD CHAT
========================= */


async function loadChat(){

    try{


        const messagesRef =
        collection(
            db,
            "supportMessages"
        );


        /*
         IMPORTANT:
         Only where() is used.
         No orderBy().
         Therefore Firebase index
         is NOT required.
        */


        const q =
        query(
            messagesRef,
            where(
                "userId",
                "==",
                userId
            )
        );


        const snapshot =
        await getDocs(q);


        chatBox.innerHTML = "";


        if(
            snapshot.empty
        ){

            chatBox.innerHTML = `
                <div class="empty">
                    💬
                    <br><br>
                    No messages yet.
                    <br><br>
                    Send a message to the user.
                </div>
            `;

            statusText.textContent =
            "No messages";

            return;

        }


        const messages = [];


        snapshot.forEach(
            (item) => {

                const data =
                item.data();


                messages.push({
                    id:item.id,
                    ...data
                });

            }
        );


        /* SORT LOCALLY */


        messages.sort(
            (a,b) => {

                let timeA = 0;
                let timeB = 0;


                if(
                    a.createdAt &&
                    typeof a.createdAt.toMillis ===
                    "function"
                ){

                    timeA =
                    a.createdAt.toMillis();

                }


                if(
                    b.createdAt &&
                    typeof b.createdAt.toMillis ===
                    "function"
                ){

                    timeB =
                    b.createdAt.toMillis();

                }


                return timeA - timeB;

            }
        );


        messages.forEach(
            (data) => {

                addMessageToScreen(
                    data
                );

            }
        );


        chatBox.scrollTop =
        chatBox.scrollHeight;


        statusText.textContent =
        "Live Support";


    }
    catch(error){


        console.error(
            "CHAT ERROR:",
            error
        );


        chatBox.innerHTML = `
            <div class="error">

                <b>
                    Unable to load chat
                </b>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

                <br><br>

                <b>
                    ${escapeHtml(
                        error.code ||
                        ""
                    )}
                </b>

            </div>
        `;


        statusText.textContent =
        "Chat loading error";

    }

}



/* =========================
   ADD MESSAGE TO SCREEN
========================= */


function addMessageToScreen(
    data
){

    const div =
    document.createElement(
        "div"
    );


    if(
        data.sender ===
        "admin"
    ){

        div.className =
        "message admin-message";

    }
    else{

        div.className =
        "message user-message";

    }


    const text =
    document.createElement(
        "div"
    );


    text.textContent =
    data.message ||
    data.text ||
    "";


    const time =
    document.createElement(
        "div"
    );


    time.className =
    "time";


    if(
        data.createdAt &&
        typeof data.createdAt.toDate ===
        "function"
    ){

        time.textContent =
        data.createdAt
        .toDate()
        .toLocaleString();

    }
    else{

        time.textContent =
        "Just now";

    }


    div.appendChild(
        text
    );


    div.appendChild(
        time
    );


    chatBox.appendChild(
        div
    );

}



/* =========================
   SEND MESSAGE
========================= */


async function sendMessage(){


    const message =
    input.value.trim();


    if(!message){

        return;

    }


    if(!adminUser){

        alert(
            "Admin login required."
        );

        return;

    }


    if(!userId){

        alert(
            "User ID missing."
        );

        return;

    }


    try{


        sendBtn.disabled =
        true;


        statusText.textContent =
        "Sending...";


        await addDoc(
            collection(
                db,
                "supportMessages"
            ),
            {

                userId:
                userId,

                email:
                "",

                name:
                userName,

                message:
                message,

                sender:
                "admin",

                createdAt:
                serverTimestamp()

            }
        );


        input.value = "";


        statusText.textContent =
        "Message sent ✓";


        /*
         Reload chat so the new
         message appears immediately.
        */


        await loadChat();


    }
    catch(error){


        console.error(
            "SEND ERROR:",
            error
        );


        alert(
            "Message send nahi ho saka:\n\n" +
            error.message
        );


        statusText.textContent =
        "Send error";

    }


    sendBtn.disabled =
    false;

}



/* =========================
   SEND BUTTON
========================= */


sendBtn.addEventListener(
    "click",
    sendMessage
);



/* =========================
   ENTER KEY
========================= */


input.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =========================
   ESCAPE HTML
========================= */


function escapeHtml(text){

    return String(text)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


</script>

</body>

</html>
