<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Admin - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:21px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.user{
padding:15px;
background:#f3f4f6;
border-radius:12px;
margin-top:10px;
cursor:pointer;
}

.user strong{
display:block;
color:#111827;
}

.user small{
color:#666;
}

.chat-title{
font-size:18px;
font-weight:bold;
margin-bottom:12px;
}

.chat-box{
height:350px;
overflow-y:auto;
background:#f3f4f6;
padding:12px;
border-radius:12px;
}

.message{
max-width:80%;
padding:10px 12px;
margin-bottom:10px;
border-radius:12px;
word-break:break-word;
}

.user-message{
background:#2563eb;
color:white;
margin-right:auto;
}

.admin-message{
background:white;
color:#111827;
border:1px solid #ddd;
margin-left:auto;
}

.sender{
font-size:11px;
font-weight:bold;
margin-bottom:5px;
}

.chat-input{
display:flex;
gap:8px;
margin-top:12px;
}

.chat-input input{
flex:1;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

.chat-input button{
width:80px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
}

.back{
display:block;
margin-top:20px;
background:#111827;
color:white;
text-decoration:none;
text-align:center;
padding:14px;
border-radius:12px;
}

.hidden{
display:none;
}

</style>

</head>


<body>


<div class="header">
🎧 Support Admin
</div>


<div class="card">

<h3>
Users / Conversations
</h3>

<div id="usersList">
Loading...
</div>

</div>



<div id="chatCard" class="card hidden">

<div class="chat-title" id="chatTitle">
Live Chat
</div>


<div id="chatBox" class="chat-box">
</div>


<div class="chat-input">

<input
id="messageInput"
type="text"
placeholder="Write reply..."
maxlength="500"
>

<button id="sendBtn">
Send
</button>

</div>

</div>



<a href="admin.html" class="back">
⬅ Back to Admin
</a>



<script type="module">

import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
collection,
query,
where,
onSnapshot,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const usersList =
document.getElementById("usersList");

const chatCard =
document.getElementById("chatCard");

const chatTitle =
document.getElementById("chatTitle");

const chatBox =
document.getElementById("chatBox");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");


let selectedUid = "";

let selectedName = "";



onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="admin-login.html";

return;

}

loadUsers();

});



function loadUsers(){

const q =
query(
collection(db,"supportMessages")
);


onSnapshot(q,(snapshot)=>{

const users = {};


snapshot.forEach((item)=>{

const data =
item.data();

if(data.uid){

users[data.uid] = {

uid:data.uid,

name:data.name || "User",

email:data.email || ""

};

}

});


usersList.innerHTML="";


const userArray =
Object.values(users);


if(userArray.length === 0){

usersList.innerHTML =
"<p style='color:#777;margin-top:10px;'>No conversations yet.</p>";

return;

}


userArray.forEach((user)=>{

const div =
document.createElement("div");

div.className="user";


div.innerHTML=`

<strong>
${escapeHtml(user.name)}
</strong>

<small>
${escapeHtml(user.email)}
</small>

`;


div.addEventListener(
"click",
()=>openChat(
user.uid,
user.name
)
);


usersList.appendChild(div);

});

});

}



function openChat(uid,name){

selectedUid=uid;

selectedName=name;

chatCard.classList.remove("hidden");

chatTitle.innerText =
"💬 Chat with " + name;

loadMessages(uid);

}



function loadMessages(uid){

const q =
query(

collection(db,"supportMessages"),

where("uid","==",uid)

);


onSnapshot(q,(snapshot)=>{

chatBox.innerHTML="";


const messages=[];


snapshot.forEach((item)=>{

messages.push({

id:item.id,

data:item.data()

});

});


messages.sort((a,b)=>{

const aTime =
a.data.createdAt?.seconds || 0;

const bTime =
b.data.createdAt?.seconds || 0;

return aTime-bTime;

});


if(messages.length===0){

chatBox.innerHTML =
"<p style='text-align:center;color:#777;'>No messages.</p>";

return;

}


messages.forEach((item)=>{

const data =
item.data;

const div =
document.createElement("div");


div.classList.add("message");


if(data.sender==="admin"){

div.classList.add(
"admin-message"
);

div.innerHTML=`

<div class="sender">
You / Admin
</div>

${escapeHtml(data.message)}

`;

}else{

div.classList.add(
"user-message"
);

div.innerHTML=`

<div class="sender">
${escapeHtml(data.name || "User")}
</div>

${escapeHtml(data.message)}

`;

}


chatBox.appendChild(div);

});


chatBox.scrollTop =
chatBox.scrollHeight;

});

}



sendBtn.addEventListener(
"click",
sendReply
);



messageInput.addEventListener(
"keydown",
(event)=>{

if(event.key==="Enter"){

sendReply();

}

});



async function sendReply(){

const text =
messageInput.value.trim();


if(!text){

return;

}


if(!selectedUid){

alert("Select a conversation first.");

return;

}


sendBtn.disabled=true;


try{

await addDoc(

collection(db,"supportMessages"),

{

uid:selectedUid,

name:selectedName,

message:text,

sender:"admin",

createdAt:serverTimestamp()

}

);


messageInput.value="";


}catch(error){

alert(
"Reply failed: " +
error.message
);

}


sendBtn.disabled=false;

}



function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
text || "";

return div.innerHTML;

}

</script>


</body>

</html>
