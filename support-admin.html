<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Admin Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fa;
    color:#172033;
    padding-bottom:20px;
}

.header{
    height:72px;
    background:linear-gradient(135deg,#07152f,#1454a3);
    color:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:12px;
}

.back{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12);
    color:white;
    font-size:22px;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.header-user{
    font-size:12px;
    opacity:.75;
    margin-top:3px;
}

.container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.chat-card{
    background:white;
    border-radius:20px;
    padding:15px;
    box-shadow:0 5px 20px rgba(20,40,80,.08);
}

.chat-box{
    height:500px;
    background:#f7f9fc;
    border-radius:16px;
    padding:15px;
    overflow-y:auto;
}

.message{
    max-width:82%;
    padding:11px 13px;
    border-radius:14px;
    margin-bottom:10px;
    font-size:14px;
    line-height:1.45;
    word-break:break-word;
}

.user-message{
    background:white;
    color:#263244;
    border:1px solid #e6eaf0;
    border-bottom-left-radius:4px;
}

.admin-message{
    background:#1678ed;
    color:white;
    margin-left:auto;
    border-bottom-right-radius:4px;
}

.time{
    font-size:9px;
    opacity:.6;
    margin-top:5px;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#8994a6;
    font-size:15px;
}

.error{
    padding:20px;
    color:#b91c1c;
    text-align:center;
    line-height:1.5;
}

.message-area{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.message-input{
    flex:1;
    border:1px solid #dce2ea;
    border-radius:13px;
    padding:13px;
    font-size:14px;
    outline:none;
}

.message-input:focus{
    border-color:#1678ed;
}

.send-btn{
    width:55px;
    border:none;
    border-radius:13px;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    font-size:21px;
}

.status{
    text-align:center;
    font-size:11px;
    color:#8b95a5;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">

    <button class="back" onclick="history.back()">←</button>

    <div>
        <div class="header-title">
            💬 Customer Support
        </div>

        <div class="header-user" id="userName">
            Loading user...
        </div>
    </div>

</div>


<div class="container">

    <div class="chat-card">

        <div class="status" id="statusText">
            Loading chat...
        </div>

        <div class="chat-box" id="chatBox">

            <div class="empty">
                Loading messages...
            </div>

        </div>


        <div class="message-area">

            <input
                id="messageInput"
                class="message-input"
                type="text"
                placeholder="Type your reply..."
            >

            <button
                id="sendBtn"
                class="send-btn">
                ➤
            </button>

        </div>

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* ADMIN UID */

const ADMIN_UID =
"BLmacTdfuBVlQ0eEJWsQidnexY02";


/* GET USER ID FROM URL */

const params =
new URLSearchParams(
    window.location.search
);

const userId =
params.get("uid");

const userName =
params.get("name") || "User";


document.getElementById(
    "userName"
).textContent =
"Chat with: " + userName;


const chatBox =
document.getElementById(
    "chatBox"
);

const input =
document.getElementById(
    "messageInput"
);

const sendBtn =
document.getElementById(
    "sendBtn"
);

const statusText =
document.getElementById(
    "statusText"
);


let currentAdmin = null;


/* AUTH */

onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            statusText.textContent =
            "Admin login required.";

            chatBox.innerHTML = `
                <div class="error">
                    Admin login not found.
                </div>
            `;

            return;
        }


        if(user.uid !== ADMIN_UID){

            statusText.textContent =
            "Access denied.";

            chatBox.innerHTML = `
                <div class="error">
                    This account is not the Admin account.
                </div>
            `;

            return;
        }


        currentAdmin = user;


        if(!userId){

            statusText.textContent =
            "No user selected.";

            chatBox.innerHTML = `
                <div class="error">
                    User ID is missing.
                </div>
            `;

            return;
        }


        loadChat();

    }
);


/* LOAD CHAT */

function loadChat(){

    statusText.textContent =
    "Loading chat...";


    const messagesRef =
    collection(
        db,
        "supportMessages"
    );


    const q =
    query(
        messagesRef,
        where(
            "userId",
            "==",
            userId
        ),
        orderBy(
            "createdAt",
            "asc"
        )
    );


    onSnapshot(
        q,
        (snapshot) => {

            chatBox.innerHTML = "";


            if(snapshot.empty){

                chatBox.innerHTML = `
                    <div class="empty">
                        No messages yet.
                    </div>
                `;

                statusText.textContent =
                "No messages";

                return;
            }


            snapshot.forEach(
                (item) => {

                    const data =
                    item.data();


                    const div =
                    document.createElement(
                        "div"
                    );


                    if(
                        data.sender === "admin"
                    ){

                        div.className =
                        "message admin-message";

                    }else{

                        div.className =
                        "message user-message";

                    }


                    const text =
                    document.createElement(
                        "div"
                    );

                    text.textContent =
                    data.message || "";


                    const time =
                    document.createElement(
                        "div"
                    );

                    time.className =
                    "time";


                    if(
                        data.createdAt &&
                        data.createdAt.toDate
                    ){

                        time.textContent =
                        data.createdAt
                        .toDate()
                        .toLocaleString();

                    }else{

                        time.textContent =
                        "";

                    }


                    div.appendChild(text);
                    div.appendChild(time);

                    chatBox.appendChild(div);

                }
            );


            chatBox.scrollTop =
            chatBox.scrollHeight;


            statusText.textContent =
            "Live Support";

        },

        (error) => {

            console.error(
                "CHAT ERROR:",
                error
            );


            chatBox.innerHTML = `
                <div class="error">
                    <b>Unable to load chat.</b>
                    <br><br>
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

            statusText.textContent =
            "Chat loading error";

        }
    );

}


/* SEND ADMIN MESSAGE */

async function sendMessage(){

    const message =
    input.value.trim();


    if(!message){
        return;
    }


    if(!currentAdmin){
        return;
    }


    if(!userId){

        alert(
            "User ID missing."
        );

        return;
    }


    try{

        sendBtn.disabled = true;


        await addDoc(
            collection(
                db,
                "supportMessages"
            ),
            {

                userId:
                userId,

                email:
                "",

                message:
                message,

                sender:
                "admin",

                createdAt:
                serverTimestamp()

            }
        );


        input.value = "";


    }catch(error){

        console.error(error);

        alert(
            "Message send nahi ho saka:\n" +
            error.message
        );

    }


    sendBtn.disabled = false;

}


/* SEND BUTTON */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ENTER */

input.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            sendMessage();

        }

    }
);


/* ESCAPE */

function escapeHtml(text){

    return String(text)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>
</html>
