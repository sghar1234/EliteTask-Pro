<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteTask Pro Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<div class="top-icons">

<button class="notify">🔔</button>

<button class="profile">👤</button>

</div>

</div>


<div class="welcome-card">

<h2 id="userName">
Welcome
</h2>

<p id="userId">
User ID : Loading...
</p>

</div>


<div class="balance-card">

<div>

<h3>Balance</h3>

<h1 id="balance">
$0.00
</h1>

</div>

<div>

<h3>Commission</h3>

<h2 id="commission">
$0.00
</h2>

</div>

</div>
<div class="vip-card">

<h3>⭐ VIP Level</h3>

<h2 id="vipLevel">VIP 0</h2>

<p>Complete orders to unlock higher VIP levels.</p>

</div>


<button class="grab-btn">
🛒 Start Grabbing Orders
</button>


<div class="product-card">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
alt="Product">

<div class="product-info">

<h3>Wireless Sneakers</h3>

<p>Price : <b>$120</b></p>

<p>Commission :
<span>$6.00</span>
</p>

<button class="grab-order">
Grab Order
</button>

</div>

</div>


<div class="menu-grid">

<a href="withdraw.html" class="menu-box">
💸
<br>
Withdraw
</a>

<a href="support.html" class="menu-box">
💬
<br>
Support
</a>

<a href="#" class="menu-box">
👥
<br>
Invite
</a>

<a href="#" class="menu-box">
📜
<br>
History
</a>

</div>
<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    document.getElementById("userId").innerText =
        "User ID : " + user.uid.substring(0,8).toUpperCase();

    const docRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {

        const data = docSnap.data();

        document.getElementById("userName").innerText =
            "Welcome, " + data.name;

        document.getElementById("balance").innerText =
            "$" + (data.balance || 0);

        document.getElementById("commission").innerText =
            "$" + (data.commission || 0);

        if(data.vip){
            document.getElementById("vipLevel").innerText = data.vip;
        }

    }

});

</script>

</body>
</html>
