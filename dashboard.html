<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-box{
background:white;
padding:15px;
border-radius:12px;
margin-top:10px;
}

.task-box h3{
margin-bottom:8px;
}

.task-btn{
width:100%;
padding:12px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
}

</style>

</head>


<body>


<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a href="support.html" class="support">
Customer Service
</a>

</div>



<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p class="user" id="userEmail"></p>

<p class="user" id="userId"></p>

</div>



<div class="card">

<p>My Balance</p>

<div class="balance" id="balance">
Rs 0
</div>

</div>



<div class="stats">

<div class="stat">

<h3 id="completed">
0
</h3>

<p>Completed</p>

</div>


<div class="stat">

<h3 id="commission">
Rs 0
</h3>

<p>Commission</p>

</div>


<div class="stat">

<h3>
0
</h3>

<p>Pending</p>

</div>


<div class="stat">

<h3>
User
</h3>

<p>ID</p>

</div>

</div>



<div class="menu">

<a href="orders.html">
📦 Orders
</a>

<a href="withdraw.html">
💰 Withdraw
</a>

<a href="profile.html">
👤 Profile
</a>

<a href="support.html">
🎧 Customer Service
</a>

</div>



<div class="task">

<h3>
Today's Tasks
</h3>

<div id="taskList">
Loading Tasks...
</div>

</div>



<script type="module">

import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
updateDoc,
collection,
getDocs,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUserId = "";



onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="index.html";

return;

}


currentUserId = user.uid;


const userRef =
doc(db,"users",user.uid);


const userSnap =
await getDoc(userRef);


if(userSnap.exists()){

const data =
userSnap.data();


document.getElementById("userName")
.innerText =
data.name || "User";


document.getElementById("userEmail")
.innerText =
data.email || "";


document.getElementById("userId")
.innerText =
"ID: " + user.uid.substring(0,8);


document.getElementById("balance")
.innerText =
"Rs " + Number(data.balance || 0);


document.getElementById("commission")
.innerText =
"Rs " + Number(data.commission || 0);


document.getElementById("completed")
.innerText =
Number(data.completed || 0);

}


loadTasks();

});



async function loadTasks(){

const taskList =
document.getElementById("taskList");


try{

const tasks =
await getDocs(
collection(db,"tasks")
);


taskList.innerHTML="";


if(tasks.empty){

taskList.innerHTML =
"<p>No Task Available</p>";

return;

}


tasks.forEach((item)=>{

const task =
item.data();


taskList.innerHTML += `

<div class="task-box">

<h3>
${task.name || "Task"}
</h3>

<p>
Price: Rs ${Number(task.price || 0)}
</p>

<p>
Commission: Rs ${Number(task.commission || 0)}
</p>

<p>
${task.description || ""}
</p>

<button
class="task-btn"
onclick="completeTask(
'${item.id}',
'${task.name || "Task"}',
'${task.price || 0}',
'${task.commission || 0}'
)">

Complete Task

</button>

</div>

`;

});

}catch(error){

taskList.innerHTML =
"<p>Error loading tasks.</p>";

}

}



window.completeTask =
async function(
taskId,
taskName,
price,
commission
){

try{


const userRef =
doc(db,"users",currentUserId);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

alert("User account not found");

return;

}


const user =
userSnap.data();


const oldBalance =
Number(user.balance || 0);


const oldCommission =
Number(user.commission || 0);


const oldCompleted =
Number(user.completed || 0);


const taskCommission =
Number(commission || 0);


const newBalance =
oldBalance + taskCommission;


const newCommission =
oldCommission + taskCommission;


const newCompleted =
oldCompleted + 1;



await updateDoc(userRef,{

balance:newBalance,

commission:newCommission,

completed:newCompleted

});



await addDoc(
collection(db,"orders"),
{

uid:currentUserId,

name:user.name || "",

email:user.email || "",

taskId:taskId,

taskName:taskName,

price:Number(price || 0),

commission:taskCommission,

status:"Completed",

createdAt:serverTimestamp()

}
);



alert(
"Task Completed Successfully!"
);


location.reload();


}catch(error){

alert(
"Error: " + error.message
);

}

};


</script>


</body>

</html>
