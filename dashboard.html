<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:15px;
}

.topbar{
    background:#111827;
    color:white;
    padding:18px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.support{
    background:#22c55e;
    color:white;
    padding:8px 12px;
    border-radius:20px;
    text-decoration:none;
    font-size:13px;
}

.card{
    background:white;
    margin-top:15px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px #ddd;
}

.balance{
    font-size:28px;
    font-weight:bold;
    color:#2563eb;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.stat{
    background:white;
    padding:15px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px #ddd;
}

.menu{
    margin-top:20px;
}

.menu a{
    display:block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    text-align:center;
    font-size:16px;
}

.menu a:hover{
    opacity:.8;
}

.task{
    background:#fff7ed;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="topbar">
    <div class="logo">EliteTask Pro</div>
    <a href="support.html" class="support">Customer Service</a>
</div>


<div class="card">
    <p>My Balance</p>
    <div class="balance">Rs 0</div>
</div>


<div class="stats">

<div class="stat">
<h3>0</h3>
<p>Completed</p>
</div>

<div class="stat">
<h3>Rs 0</h3>
<p>Commission</p>
</div>

<div class="stat">
<h3>0</h3>
<p>Pending</p>
</div>

<div class="stat">
<h3>User ID</h3>
<p>ELT001</p>
</div>

</div>


<div class="menu">

<a href="orders.html">📦 Orders</a>

<a href="withdraw.html">💰 Withdraw</a>

<a href="profile.html">👤 Profile</a>

<a href="support.html">🎧 Customer Service</a>

</div>


<div class="task">
<h3>Today's Task</h3>
<p>No Task Available</p>
</div>


</body>
</html>
