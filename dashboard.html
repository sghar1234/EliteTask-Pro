<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
word-break:break-word;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat h3{
font-size:20px;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-title{
font-size:20px;
font-weight:bold;
}

.task-progress{
margin-top:7px;
font-size:13px;
color:#777;
}

.task-box{
background:white;
padding:15px;
border-radius:12px;
margin-top:12px;
box-shadow:0 2px 6px #ddd;
}

.task-image{
width:100%;
max-height:200px;
object-fit:cover;
border-radius:10px;
margin-bottom:12px;
}

.task-number{
display:inline-block;
background:#2563eb;
color:white;
padding:5px 10px;
border-radius:15px;
font-size:12px;
font-weight:bold;
margin-bottom:9px;
}

.task-box h3{
font-size:19px;
margin-bottom:8px;
}

.task-info{
margin-top:7px;
font-size:14px;
}

.task-btn{
width:100%;
padding:13px;
margin-top:14px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
}

.task-btn:disabled{
opacity:.6;
}

.completed-box{
text-align:center;
padding:20px;
color:#16a34a;
font-weight:bold;
}

.loading{
text-align:center;
padding:20px;
color:#777;
}

.error{
text-align:center;
padding:20px;
color:#dc2626;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a
href="support.html"
class="support">

Customer Service

</a>

</div>

<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p
class="user"
id="userEmail">
</p>

<p
class="user"
id="userId">
</p>

</div>

<div class="card">

<p>
My Balance
</p>

<div
class="balance"
id="balance">

Rs 0

</div>

</div>

<div class="stats">

<div class="stat">

<h3 id="completed">
0
</h3>

<p>
Completed
</p>

</div>

<div class="stat">

<h3 id="commission">
Rs 0
</h3>

<p>
Commission
</p>

</div>

<div class="stat">

<h3 id="pending">
0
</h3>

<p>
Next Task
</p>

</div>

<div class="stat">

<h3>
User
</h3>

<p>
ID
</p>

</div>

</div>

<div class="menu">

<a href="orders.html">
📦 Orders / History
</a>

<a href="withdraw.html">
💰 Withdraw
</a>

<a href="profile.html">
👤 Profile
</a>

<a href="support.html">
🎧 Customer Service
</a>

</div>

<div class="task">

<div class="task-title">
📦 Today's Tasks
</div>

<div
class="task-progress"
id="taskProgress">

Loading progress...

</div>

<div id="taskList">

<div class="loading">
Loading Task...
</div>

</div>

</div>

<script type="module">


import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
updateDoc,
collection,
getDocs,
addDoc,
query,
where,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUserId = "";

let currentUserData = null;



const taskList =
document.getElementById(
"taskList"
);

const taskProgress =
document.getElementById(
"taskProgress"
);



/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUserId =
user.uid;


await loadUser();


await loadNextTask();

});



/* =========================
   LOAD USER
========================= */

async function loadUser(){

try{


const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(
userRef
);


if(!userSnap.exists()){

document.getElementById(
"userName"
).innerText =
"User";

return;

}


const data =
userSnap.data();


currentUserData =
data;


document.getElementById(
"userName"
).innerText =
data.name ||
"User";


document.getElementById(
"userEmail"
).innerText =
data.email ||
auth.currentUser.email ||
"";


document.getElementById(
"userId"
).innerText =
"ID: " +
currentUserId.substring(
0,
8
);


document.getElementById(
"balance"
).innerText =
"Rs " +
Number(
data.balance || 0
);


document.getElementById(
"commission"
).innerText =
"Rs " +
Number(
data.commission || 0
);


const completed =
Number(
data.completed || 0
);


document.getElementById(
"completed"
).innerText =
completed;


document.getElementById(
"pending"
).innerText =
completed + 1;


}
catch(error){

console.log(
error
);

}

}



/* =========================
   LOAD NEXT TASK
========================= */

async function loadNextTask(){

taskList.innerHTML =
'<div class="loading">Loading Task...</div>';


try{


/*
 * User ka completed count
 */

const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(
userRef
);


if(!userSnap.exists()){

taskList.innerHTML =
'<div class="error">User profile not found.</div>';

return;

}


const user =
userSnap.data();


const completed =
Number(
user.completed || 0
);


/*
 * Next task number
 *
 * completed 0 = task 1
 * completed 1 = task 2
 * completed 9 = task 10
 * completed 10 = task 11
 */

const nextTaskNumber =
completed + 1;


taskProgress.innerText =
"Task " +
nextTaskNumber +
" of 20";


/*
 * Get all published tasks
 */

const snap =
await getDocs(
collection(
db,
"tasks"
)
);


if(snap.empty){

taskList.innerHTML = `

<div class="error">

No tasks have been published yet.

</div>

`;

return;

}


/*
 * Find next task
 */

let nextTask = null;


snap.forEach(
(item)=>{

const data =
item.data();


const order =
Number(
data.order ||
data.taskNumber ||
data.number ||
0
);


if(
order === nextTaskNumber
){

nextTask = {

id:item.id,

data:data

};

}

});



/*
 * No more tasks
 */

if(!nextTask){

taskProgress.innerText =
"Completed: " +
completed;


taskList.innerHTML = `

<div class="completed-box">

🎉 All available tasks completed!

<br><br>

You have completed all
published tasks.

</div>

`;

return;

}


const task =
nextTask.data;


const image =
task.image ||
"";


taskList.innerHTML = `

<div class="task-box">


${
image
?
`

<img
src="${escapeHtml(image)}"
class="task-image"
onerror="this.style.display='none'"
>

`
:
""
}


<div class="task-number">

TASK ${nextTaskNumber}

</div>


<h3>

${escapeHtml(
task.name ||
"Task"
)}

</h3>


<div class="task-info">

💰 Price:
<b>
Rs ${Number(
task.price || 0
)}
</b>

</div>


<div class="task-info">

💵 Commission:
<b>
Rs ${Number(
task.commission || 0
)}
</b>

</div>


<div class="task-info">

📝
${escapeHtml(
task.description ||
"No description"
)}

</div>


<button
class="task-btn"
id="completeBtn"
onclick="completeTask(
'${nextTask.id}',
'${escapeHtml(task.name || "Task")}',
${Number(task.price || 0)},
${Number(task.commission || 0)},
${nextTaskNumber}
)">

✅ Complete Task

</button>

</div>

`;

}
catch(error){

taskList.innerHTML = `

<div class="error">

Error loading task.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}



/* =========================
   COMPLETE TASK
========================= */

window.completeTask =
async function(
taskId,
taskName,
price,
commission,
taskNumber
){

const button =
document.getElementById(
"completeBtn"
);


if(button){

button.disabled = true;

button.innerText =
"Completing...";

}


try{


/*
 * Get latest user data
 */

const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(
userRef
);


if(!userSnap.exists()){

throw new Error(
"User account not found."
);

}


const user =
userSnap.data();


const oldCompleted =
Number(
user.completed || 0
);


const oldBalance =
Number(
user.balance || 0
);


const oldCommission =
Number(
user.commission || 0
);


/*
 * Important:
 *
 * User ko task sequence ke
 * bahar complete nahi karne dena.
 */

const expectedTask =
oldCompleted + 1;


if(
Number(taskNumber) !==
expectedTask
){

throw new Error(
"Please complete tasks in order."
);

}


/*
 * Check whether this task
 * was already completed.
 */

const orderQuery =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUserId
),

where(
"taskId",
"==",
taskId
)

);


const oldOrders =
await getDocs(
orderQuery
);


if(!oldOrders.empty){

throw new Error(
"This task has already been completed."
);

}


/*
 * New values
 */

const taskCommission =
Number(
commission || 0
);


const newBalance =
oldBalance +
taskCommission;


const newCommission =
oldCommission +
taskCommission;


const newCompleted =
oldCompleted +
1;


/*
 * Update user
 */

await updateDoc(

userRef,

{

balance:
newBalance,

commission:
newCommission,

completed:
newCompleted

}

);


/*
 * Save order history
 */

await addDoc(

collection(
db,
"orders"
),

{

uid:
currentUserId,

name:
user.name || "",

email:
user.email ||
auth.currentUser.email ||
"",

taskId:
taskId,

taskNumber:
Number(taskNumber),

taskName:
taskName,

price:
Number(price || 0),

commission:
taskCommission,

status:
"Completed",

createdAt:
serverTimestamp()

}

);


alert(
"Task " +
taskNumber +
" completed successfully! ✅"
);


/*
 * Reload dashboard
 *
 * Ab next task show hoga.
 */

await loadUser();

await loadNextTask();


}
catch(error){

alert(
"Task Error: " +
error.message
);


if(button){

button.disabled = false;

button.innerText =
"✅ Complete Task";

}

}

};



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement(
"div"
);

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>

</body>

</html>
