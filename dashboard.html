<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
word-break:break-word;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat h3{
font-size:20px;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
font-weight:bold;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-box{
background:white;
padding:15px;
border-radius:12px;
margin-top:10px;
box-shadow:0 2px 7px #ddd;
}

.task-image{
width:100%;
max-height:190px;
object-fit:cover;
border-radius:10px;
margin-bottom:12px;
}

.task-number{
display:inline-block;
background:#2563eb;
color:white;
padding:5px 10px;
border-radius:15px;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
}

.task-box h3{
margin-bottom:8px;
font-size:19px;
}

.task-info{
margin-top:7px;
font-size:14px;
}

.task-btn{
width:100%;
padding:13px;
margin-top:14px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
}

.locked{
background:#f3f4f6;
padding:15px;
border-radius:12px;
margin-top:10px;
text-align:center;
color:#777;
}

.withdraw-notice{
background:#dcfce7;
color:#166534;
padding:13px;
border-radius:10px;
margin-top:12px;
font-weight:bold;
text-align:center;
}

.no-task{
text-align:center;
padding:20px;
color:#777;
}

.loading{
text-align:center;
padding:20px;
color:#777;
}

</style>

</head>


<body>


<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a href="support.html" class="support">
Customer Service
</a>

</div>



<!-- USER -->

<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p class="user" id="userEmail"></p>

<p class="user" id="userId"></p>

</div>



<!-- BALANCE -->

<div class="card">

<p>My Balance</p>

<div
class="balance"
id="balance">

Rs 0

</div>

</div>



<!-- STATS -->

<div class="stats">

<div class="stat">

<h3 id="completed">
0
</h3>

<p>Completed</p>

</div>


<div class="stat">

<h3 id="commission">
Rs 0
</h3>

<p>Commission</p>

</div>


<div class="stat">

<h3 id="remaining">
20
</h3>

<p>Tasks Remaining</p>

</div>


<div class="stat">

<h3 id="round">
1
</h3>

<p>Current Round</p>

</div>

</div>



<!-- MENU -->

<div class="menu">

<a href="orders.html">
📦 Orders / History
</a>


<a href="withdraw.html">
💰 Withdraw
</a>


<a href="profile.html">
👤 Profile
</a>


<a href="support.html">
🎧 Customer Service
</a>

</div>



<!-- TASK -->

<div class="task">

<h3>
📦 Current Task
</h3>

<div id="taskList">

<div class="loading">
Loading Task...
</div>

</div>

</div>



<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
updateDoc,
collection,
getDocs,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUserId = "";



/* =========================
   LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUserId =
user.uid;


await loadUser();

await loadTasks();

});



/* =========================
   LOAD USER
========================= */

async function loadUser(){


try{


const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

alert(
"User account not found."
);

return;

}


const data =
userSnap.data();


document.getElementById(
"userName"
).innerText =
data.name || "User";


document.getElementById(
"userEmail"
).innerText =
data.email || "";


document.getElementById(
"userId"
).innerText =
"ID: " +
currentUserId.substring(0,8);


document.getElementById(
"balance"
).innerText =
"Rs " +
Number(
data.balance || 0
);


document.getElementById(
"commission"
).innerText =
"Rs " +
Number(
data.commission || 0
);


const completed =
Number(
data.completed || 0
);


/* COMPLETED */

document.getElementById(
"completed"
).innerText =
completed;


/* REMAINING */

const remaining =
Math.max(
20 - completed,
0
);


document.getElementById(
"remaining"
).innerText =
remaining;


/* ROUND */

const currentRound =
completed < 10
?
1
:
2;


document.getElementById(
"round"
).innerText =
currentRound;


}
catch(error){

console.log(
error
);

}

}



/* =========================
   LOAD CURRENT TASK
========================= */

async function loadTasks(){


const taskList =
document.getElementById(
"taskList"
);


taskList.innerHTML = `

<div class="loading">
Loading Task...
</div>

`;


try{


/*
 * USER DATA
 */

const userSnap =
await getDoc(
doc(
db,
"users",
currentUserId
)
);


if(!userSnap.exists()){

taskList.innerHTML = `

<div class="no-task">
User profile not found.
</div>

`;

return;

}


const user =
userSnap.data();


const completed =
Number(
user.completed || 0
);



/*
 * MAX 20 TASKS
 */

if(completed >= 20){

taskList.innerHTML = `

<div class="withdraw-notice">

🎉 All 20 Tasks Completed!

<br><br>

Your second withdrawal
is now available.

<br><br>

Go to Withdraw.

</div>

`;

return;

}



/*
 * GET TASKS
 */

const snapshot =
await getDocs(
collection(
db,
"tasks"
)
);


const tasks = [];


snapshot.forEach(
(item)=>{

const data =
item.data();


const order =
Number(
data.order ||
data.taskNumber ||
data.number ||
999999
);


/*
 * ONLY TASK 1-20
 */

if(
order >= 1 &&
order <= 20
){

tasks.push({

id:item.id,

data:data,

order:order

});

}

});



/*
 * SORT TASKS
 */

tasks.sort(
(a,b)=>
a.order - b.order
);



/*
 * CURRENT TASK NUMBER
 */

const nextTaskNumber =
completed + 1;



/*
 * FIND ONLY NEXT TASK
 */

const currentTask =
tasks.find(
(task)=>
task.order ===
nextTaskNumber
);



if(!currentTask){

taskList.innerHTML = `

<div class="no-task">

Task ${nextTaskNumber}
abhi admin ne publish nahi kiya.

</div>

`;

return;

}



const task =
currentTask.data;



const image =
task.image || "";



/*
 * WITHDRAW MESSAGE
 *
 * After task 10
 */

let withdrawNotice = "";


if(
completed === 9
){

withdrawNotice = `

<div class="withdraw-notice">

🎯 Ye Task 10 hai.

<br>

Task 10 complete karne ke baad
Withdraw unlock ho jayega.

</div>

`;

}


if(
completed === 19
){

withdrawNotice = `

<div class="withdraw-notice">

🎯 Ye Task 20 hai.

<br>

Task 20 complete karne ke baad
second Withdraw unlock ho jayega.

</div>

`;

}



/*
 * SHOW CURRENT TASK ONLY
 */

taskList.innerHTML = `

<div class="task-box">


${
image
?
`

<img
src="${escapeHtml(image)}"
class="task-image"
onerror="this.style.display='none'"
>

`
:
""
}


<div class="task-number">

TASK ${currentTask.order} / 20

</div>


<h3>

${escapeHtml(
task.name ||
"Task"
)}

</h3>


<div class="task-info">

💰 Price:

<b>
Rs ${Number(
task.price || 0
)}
</b>

</div>


<div class="task-info">

💵 Commission:

<b>
Rs ${Number(
task.commission || 0
)}
</b>

</div>


<div class="task-info">

📝

${escapeHtml(
task.description ||
"No description"
)}

</div>


<button
class="task-btn"
onclick="completeTask(
'${currentTask.id}',
'${escapeHtml(task.name || "Task")}',
${Number(task.price || 0)},
${Number(task.commission || 0)},
${currentTask.order}
)">

✅ Complete Task

</button>


${withdrawNotice}


</div>

`;



}
catch(error){

taskList.innerHTML = `

<div class="no-task">

Error loading task.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}



/* =========================
   COMPLETE TASK
========================= */

window.completeTask =
async function(
taskId,
taskName,
price,
commission,
taskOrder
){


try{


/*
 * USER
 */

const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

alert(
"User account not found."
);

return;

}


const user =
userSnap.data();


const oldCompleted =
Number(
user.completed || 0
);


/*
 * SECURITY
 *
 * User must complete tasks
 * in exact order.
 */

const expectedTask =
oldCompleted + 1;


if(
Number(taskOrder)
!==
expectedTask
){

alert(
"Please complete tasks in order."
);

return;

}


/*
 * MAX 20
 */

if(
oldCompleted >= 20
){

alert(
"All 20 tasks are already completed."
);

return;

}



const oldBalance =
Number(
user.balance || 0
);


const oldCommission =
Number(
user.commission || 0
);


const taskCommission =
Number(
commission || 0
);


const newBalance =
oldBalance +
taskCommission;


const newCommission =
oldCommission +
taskCommission;


const newCompleted =
oldCompleted + 1;



/*
 * UPDATE USER
 */

await updateDoc(

userRef,

{

balance:
newBalance,

commission:
newCommission,

completed:
newCompleted

}

);



/*
 * ORDER HISTORY
 */

await addDoc(

collection(
db,
"orders"
),

{

uid:
currentUserId,

name:
user.name || "",

email:
user.email || "",

taskId:
taskId,

taskNumber:
Number(taskOrder),

taskName:
taskName,

price:
Number(price || 0),

commission:
taskCommission,

status:
"Completed",

createdAt:
serverTimestamp()

}

);



/*
 * SUCCESS
 */

if(
newCompleted === 10
){

alert(
"Task 10 Completed Successfully!\n\n" +
"🎉 Withdraw is now unlocked."
);

}
else if(
newCompleted === 20
){

alert(
"Task 20 Completed Successfully!\n\n" +
"🎉 Second Withdraw is now unlocked."
);

}
else{

alert(
"Task " +
newCompleted +
" Completed Successfully!"
);

}


/*
 * REFRESH
 */

await loadUser();

await loadTasks();


}
catch(error){

alert(
"Error: " +
error.message
);

}

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement(
"div"
);

div.textContent =
String(
text || ""
);

return div.innerHTML;

}


</script>


</body>

</html>
