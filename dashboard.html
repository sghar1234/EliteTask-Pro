<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-box{
background:white;
padding:15px;
border-radius:12px;
margin-top:10px;
}

.task-btn{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
margin-top:10px;
}

</style>

</head>


<body>


<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a href="support.html" class="support">
Customer Service
</a>

</div>



<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p class="user" id="userEmail"></p>

<p class="user" id="userId"></p>

</div>



<div class="card">

<p>My Balance</p>

<div class="balance" id="balance">
Rs 0
</div>

</div>



<div class="stats">

<div class="stat">
<h3 id="completed">0</h3>
<p>Completed</p>
</div>


<div class="stat">
<h3 id="commission">Rs 0</h3>
<p>Commission</p>
</div>


<div class="stat">
<h3>0</h3>
<p>Pending</p>
</div>


<div class="stat">
<h3>ID</h3>
<p>User</p>
</div>

</div>
<div class="menu">

<a href="orders.html">
📦 Orders
</a>

<a href="withdraw.html">
💰 Withdraw
</a>

<a href="profile.html">
👤 Profile
</a>

<a href="support.html">
🎧 Customer Service
</a>

</div>



<div class="task">

<h3>
Today's Tasks
</h3>


<div id="taskList">
Loading Tasks...
</div>


</div>



<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";





onAuthStateChanged(auth, async(user)=>{


if(user){


const userRef = doc(db,"users",user.uid);


const userSnap = await getDoc(userRef);



if(userSnap.exists()){


const data = userSnap.data();


document.getElementById("userName").innerText=data.name;

document.getElementById("userEmail").innerText=data.email;

document.getElementById("userId").innerText=
"ID: "+user.uid.substring(0,8);


document.getElementById("balance").innerText=
"Rs "+data.balance;


document.getElementById("commission").innerText=
"Rs "+data.commission;


}



const taskList =
document.getElementById("taskList");


const tasks =
await getDocs(collection(db,"tasks"));


taskList.innerHTML="";



if(tasks.empty){


taskList.innerHTML=
"No Task Available";


}else{


tasks.forEach((item)=>{


let task=item.data();



taskList.innerHTML += `


<div class="task-box">


<h3>${task.name}</h3>


<p>
Price: Rs ${task.price}
</p>


<p>
Commission: Rs ${task.commission}
</p>


<button class="task-btn">
Complete Task
</button>


</div>


`;


});


}



}else{


window.location.href="index.html";


}



});


</script>


</body>

</html>
