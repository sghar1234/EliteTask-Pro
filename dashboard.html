<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
word-break:break-word;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat h3{
font-size:20px;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
font-weight:bold;
}

.menu a.locked{
background:#9ca3af;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.progress{
background:#e5e7eb;
height:9px;
border-radius:10px;
margin-top:12px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:#2563eb;
width:0%;
transition:.3s;
}

.task-box{
background:white;
padding:15px;
border-radius:12px;
margin-top:12px;
box-shadow:0 2px 7px #ddd;
}

.task-number{
display:inline-block;
background:#2563eb;
color:white;
padding:5px 9px;
border-radius:15px;
font-size:12px;
font-weight:bold;
margin-bottom:8px;
}

.task-box h3{
margin-bottom:8px;
}

.task-image{
width:100%;
max-height:190px;
object-fit:cover;
border-radius:10px;
margin-bottom:12px;
}

.task-info{
margin-top:8px;
font-size:15px;
}

.task-btn{
width:100%;
padding:13px;
margin-top:15px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
}

.task-btn:disabled{
opacity:.6;
}

.message{
text-align:center;
padding:15px;
color:#666;
}

.success{
color:#16a34a;
font-weight:bold;
}

.locked-box{
background:#f3f4f6;
padding:18px;
border-radius:12px;
text-align:center;
color:#555;
margin-top:12px;
}

.history-link{
display:block;
margin-top:12px;
text-align:center;
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a href="support.html" class="support">
Customer Service
</a>

</div>

<!-- USER -->

<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p class="user" id="userEmail"></p>

<p class="user" id="userId"></p>

</div>

<!-- BALANCE -->

<div class="card">

<p>My Balance</p>

<div
class="balance"
id="balance">

Rs 0

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat">

<h3 id="completed">
0
</h3>

<p>Completed</p>

</div>

<div class="stat">

<h3 id="commission">
Rs 0
</h3>

<p>Commission</p>

</div>

<div class="stat">

<h3 id="remaining">
20
</h3>

<p>Tasks Left</p>

</div>

<div class="stat">

<h3 id="withdrawStatus">
🔒
</h3>

<p>Withdraw</p>

</div>

</div>

<!-- MENU -->

<div class="menu">

<a href="orders.html">
📦 Orders / History
</a>

<a
id="withdrawLink"
href="withdraw.html">

💰 Withdraw

</a>

<a href="profile.html">
👤 Profile
</a>

<a href="support.html">
🎧 Customer Service
</a>

</div>

<!-- TASK -->

<div class="task">

<div class="task-header">

<h3>
Today's Task
</h3>

<strong id="taskProgress">
0 / 20
</strong>

</div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

<div id="taskList">

<div class="message">
Loading Task...
</div>

</div>

</div>

<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
getDocs,
query,
where,
writeBatch
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


let currentUser = null;

let currentTask = null;

let completedTaskIds = new Set();


const TOTAL_TASKS = 20;

const WITHDRAW_UNLOCK = 10;



/* =========================
   LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href =
"index.html";

return;

}


currentUser = user;


await loadDashboard();

});



/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard(){

try{

await loadUser();

await loadCompletedTasks();

await loadNextTask();

}
catch(error){

document.getElementById(
"taskList"
).innerHTML = `

<div class="message">

Error loading dashboard.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}



/* =========================
   LOAD USER
========================= */

async function loadUser(){

const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

throw new Error(
"User profile not found."
);

}


const data =
userSnap.data();


const completed =
Number(
data.completed || 0
);


const commission =
Number(
data.commission || 0
);


const balance =
Number(
data.balance || 0
);


document.getElementById(
"userName"
).innerText =
data.name || "User";


document.getElementById(
"userEmail"
).innerText =
data.email || currentUser.email || "";


document.getElementById(
"userId"
).innerText =
"ID: " +
currentUser.uid.substring(0,8);


document.getElementById(
"balance"
).innerText =
"Rs " + balance;


document.getElementById(
"commission"
).innerText =
"Rs " + commission;


document.getElementById(
"completed"
).innerText =
completed;


const remaining =
Math.max(
TOTAL_TASKS - completed,
0
);


document.getElementById(
"remaining"
).innerText =
remaining;


document.getElementById(
"taskProgress"
).innerText =
Math.min(completed,TOTAL_TASKS)
+
" / "
+
TOTAL_TASKS;


const percentage =
Math.min(
(completed / TOTAL_TASKS) * 100,
100
);


document.getElementById(
"progressBar"
).style.width =
percentage + "%";


const withdrawStatus =
document.getElementById(
"withdrawStatus"
);


const withdrawLink =
document.getElementById(
"withdrawLink"
);


if(completed >= WITHDRAW_UNLOCK){

withdrawStatus.innerText =
"✅";

withdrawLink.classList.remove(
"locked"
);

withdrawLink.innerText =
"💰 Withdraw";

}
else{

withdrawStatus.innerText =
"🔒";

withdrawLink.classList.add(
"locked"
);

withdrawLink.innerText =
"🔒 Withdraw (10 Tasks Required)";

}

}



/* =========================
   LOAD COMPLETED TASKS
========================= */

async function loadCompletedTasks(){

completedTaskIds =
new Set();


const ordersQuery =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(
ordersQuery
);


snapshot.forEach(
(item)=>{

const data =
item.data();


if(
data.taskId &&
String(
data.status || ""
).toLowerCase()
===
"completed"
){

completedTaskIds.add(
String(data.taskId)
);

}

});

}



/* =========================
   LOAD NEXT TASK
========================= */

async function loadNextTask(){

const taskList =
document.getElementById(
"taskList"
);


taskList.innerHTML = `

<div class="message">
Loading next task...
</div>

`;


const snapshot =
await getDocs(
collection(
db,
"tasks"
)
);


if(snapshot.empty){

taskList.innerHTML = `

<div class="locked-box">

No tasks are available yet.

</div>

`;

return;

}


const tasks = [];


snapshot.forEach(
(item)=>{

const data =
item.data();


const order =
Number(
data.order ||
data.taskNumber ||
data.number ||
999999
);


tasks.push({

id:item.id,

data:data,

order:order

});

});


/*
 * Tasks ko order ke mutabiq sort
 */

tasks.sort(
(a,b)=>
a.order - b.order
);


/*
 * Sirf pehla incomplete task
 */

let nextTask = null;


for(
const task of tasks
){

if(
!completedTaskIds.has(
String(task.id)
)
){

nextTask = task;

break;

}

}


if(!nextTask){

currentTask = null;


taskList.innerHTML = `

<div class="locked-box">

<div class="success">
🎉 All 20 Tasks Completed!
</div>

<br>

Aap ne tamam available tasks complete kar liye hain.

</div>

`;

return;

}


currentTask =
nextTask;


const task =
nextTask.data;


const order =
nextTask.order;


taskList.innerHTML = `

<div class="task-box">

${
task.image
?
`

<img
src="${escapeHtml(task.image)}"
class="task-image"
onerror="this.style.display='none'"
>

`
:
""
}


<div class="task-number">

TASK ${order}

</div>


<h3>

${escapeHtml(
task.name || "Task"
)}

</h3>


<div class="task-info">

💰 Price:
<b>
Rs ${Number(
task.price || 0
)}
</b>

</div>


<div class="task-info">

💵 Commission:
<b>
Rs ${Number(
task.commission || 0
)}
</b>

</div>


<div class="task-info">

📝
${escapeHtml(
task.description ||
"No description"
)}

</div>


<button
id="completeTaskBtn"
class="task-btn">

✅ Complete Task

</button>

</div>

`;


document
.getElementById(
"completeTaskBtn"
)
.addEventListener(
"click",
completeCurrentTask
);

}



/* =========================
   COMPLETE CURRENT TASK
========================= */

async function completeCurrentTask(){

if(!currentTask){

return;

}


const button =
document.getElementById(
"completeTaskBtn"
);


button.disabled = true;

button.innerText =
"Completing...";


try{

const task =
currentTask.data;

const taskId =
currentTask.id;

const taskName =
task.name || "Task";

const price =
Number(
task.price || 0
);

const taskCommission =
Number(
task.commission || 0
);


const userRef =
doc(
db,
"users",
currentUser.uid
);


/*
 * Orders mein duplicate check
 */

const existingQuery =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUser.uid
),

where(
"taskId",
"==",
taskId
)

);


const existingSnapshot =
await getDocs(
existingQuery
);


if(!existingSnapshot.empty){

throw new Error(
"This task has already been completed."
);

}


/*
 * User + order ko ek batch mein save
 */

const userSnap =
await getDoc(
userRef
);


if(!userSnap.exists()){

throw new Error(
"User profile not found."
);

}


const userData =
userSnap.data();


const oldBalance =
Number(
userData.balance || 0
);


const oldCommission =
Number(
userData.commission || 0
);


const oldCompleted =
Number(
userData.completed || 0
);


const newBalance =
oldBalance +
taskCommission;


const newCommission =
oldCommission +
taskCommission;


const newCompleted =
oldCompleted +
1;


const orderRef =
doc(
collection(
db,
"orders"
)
);


const batch =
writeBatch(db);


batch.update(

userRef,

{

balance:
newBalance,

commission:
newCommission,

completed:
newCompleted

}

);


batch.set(

orderRef,

{

uid:
currentUser.uid,

name:
userData.name || "",

email:
userData.email ||
currentUser.email ||
"",

taskId:
taskId,

taskName:
taskName,

price:
price,

commission:
taskCommission,

status:
"Completed",

createdAt:
new Date()

}

);


await batch.commit();


alert(
"Task Completed Successfully! ✅"
);


/*
 * Page ko reload nahi karte.
 * Seedha next task show hoga.
 */

await loadDashboard();

}
catch(error){

alert(
"Task complete failed: " +
error.message
);

button.disabled = false;

button.innerText =
"✅ Complete Task";

}

}



/* =========================
   WITHDRAW LOCK
========================= */

document
.getElementById(
"withdrawLink"
)
.addEventListener(
"click",
async function(event){

const userRef =
doc(
db,
"users",
currentUser.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

event.preventDefault();

alert(
"User profile not found."
);

return;

}


const completed =
Number(
userSnap.data().completed || 0
);


if(
completed < WITHDRAW_UNLOCK
){

event.preventDefault();

alert(
"Withdraw unlock hone ke liye pehle 10 tasks complete karo.\n\n" +
"Completed: " +
completed +
" / 10"
);

}

});



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement(
"div"
);

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>

</body>

</html>
