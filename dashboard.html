<!-- TASKS -->

<div class="task">

<div class="task-header">

<h3>
Today's Tasks
</h3>

<div
class="task-count"
id="taskCount">

Loading Task...
</div>

</div>

</div>



<script type="module">


import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
updateDoc,
collection,
getDocs,
addDoc,
serverTimestamp,
arrayUnion
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



let currentUserId = "";

let currentUserData = null;

let allTasks = [];

let completedTaskIds = [];



/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUserId =
user.uid;


await loadUser();

});



/* =========================
   LOAD USER
========================= */

async function loadUser(){


try{


const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

alert(
"User account not found."
);

return;

}


const data =
userSnap.data();


currentUserData =
data;


/*
 * Existing completedTaskIds
 */

completedTaskIds =
Array.isArray(
data.completedTaskIds
)
?
data.completedTaskIds
:
[];



document.getElementById(
"userName"
).innerText =
data.name || "User";



document.getElementById(
"userEmail"
).innerText =
data.email || "";



document.getElementById(
"userId"
).innerText =
"ID: " +
currentUserId.substring(0,8);



document.getElementById(
"balance"
).innerText =
"Rs " +
Number(
data.balance || 0
);



document.getElementById(
"commission"
).innerText =
"Rs " +
Number(
data.commission || 0
);



document.getElementById(
"completed"
).innerText =
Number(
data.completed || 0
);



loadTasks();


}
catch(error){

console.log(error);

alert(
"Unable to load account: " +
error.message
);

}

}



/* =========================
   LOAD TASKS
========================= */

async function loadTasks(){


const taskList =
document.getElementById(
"taskList"
);


taskList.innerHTML = `

<div class="loading">
Loading Task...
</div>

`;


try{


const snapshot =
await getDocs(
collection(
db,
"tasks"
)
);


if(snapshot.empty){

taskList.innerHTML = `

<div class="no-task">

No tasks available right now.

</div>

`;

document.getElementById(
"taskCount"
).innerText =
"0 Tasks";

return;

}



/*
 * Convert Firebase tasks
 * into array
 */

allTasks = [];


snapshot.forEach(
(item)=>{

const task =
item.data();


allTasks.push({

id:item.id,

data:task

});

});



/*
 * Sort tasks.
 *
 * Agar admin task mein
 * order / taskNumber / number
 * diya hua hai to usko use karega.
 */

allTasks.sort(
(a,b)=>{

const orderA =
Number(
a.data.order ||
a.data.taskNumber ||
a.data.number ||
999999
);


const orderB =
Number(
b.data.order ||
b.data.taskNumber ||
b.data.number ||
999999
);


if(
orderA !== orderB
){

return orderA - orderB;

}


/*
 * Fallback:
 * task ID
 */

return a.id.localeCompare(
b.id
);

}

);



/*
 * Find FIRST incomplete task
 */

let nextTaskIndex = -1;


for(
let i = 0;
i < allTasks.length;
i++
){

if(
!completedTaskIds.includes(
allTasks[i].id
)
){

nextTaskIndex = i;

break;

}

}



/*
 * All tasks completed
 */

if(
nextTaskIndex === -1
){

document.getElementById(
"taskCount"
).innerText =
allTasks.length +
" / " +
allTasks.length;


taskList.innerHTML = `

<div class="success-box">

🎉 Congratulations!<br><br>

You have completed all
${allTasks.length} tasks.

<br><br>

Your available withdrawal
milestones can now be checked
from the Withdraw page.

</div>

`;

return;

}



/*
 * Show ONLY next task
 */

const nextTask =
allTasks[nextTaskIndex];


const task =
nextTask.data;


const taskNumber =
nextTaskIndex + 1;


document.getElementById(
"taskCount"
).innerText =

taskNumber +
" / " +
allTasks.length;



taskList.innerHTML = `

<div class="task-box">

<div class="task-number">

TASK ${taskNumber}

</div>


<h3>

${escapeHtml(
task.name || "Task"
)}

</h3>


<div class="task-info">

💰 Price:
<b>
Rs ${Number(
task.price || 0
)}
</b>

</div>


<div class="task-info">

💵 Commission:
<b>
Rs ${Number(
task.commission || 0
)}
</b>

</div>


${
task.description
?
`
<div class="task-description">

${escapeHtml(
task.description
)}

</div>
`
:
""
}


<button
class="task-btn"
id="completeTaskBtn">

✅ Complete Task

</button>


</div>

`;



document.getElementById(
"completeTaskBtn"
)
.addEventListener(
"click",
()=>{

completeTask(
nextTask.id,
task
);

});


}
catch(error){

console.log(error);

taskList.innerHTML = `

<div class="no-task">

Error loading tasks.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}



/* =========================
   COMPLETE TASK
========================= */

async function completeTask(
taskId,
task
){


const button =
document.getElementById(
"completeTaskBtn"
);


if(button){

button.disabled = true;

button.innerText =
"Completing...";

}


try{


/*
 * Get latest user data
 */

const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(
userRef
);


if(!userSnap.exists()){

throw new Error(
"User account not found."
);

}


const user =
userSnap.data();



/*
 * Prevent duplicate task
 */

const oldCompletedIds =
Array.isArray(
user.completedTaskIds
)
?
user.completedTaskIds
:
[];


if(
oldCompletedIds.includes(
taskId
)
){

alert(
"This task has already been completed."
);

await loadUser();

return;

}



/*
 * Current values
 */

const oldBalance =
Number(
user.balance || 0
);


const oldCommission =
Number(
user.commission || 0
);


const oldCompleted =
Number(
user.completed || 0
);


const taskCommission =
Number(
task.commission || 0
);



/*
 * New values
 */

const newBalance =
oldBalance +
taskCommission;


const newCommission =
oldCommission +
taskCommission;


const newCompleted =
oldCompleted +
1;



/*
 * Update user
 *
 * completedTaskIds saves
 * exactly which tasks were completed.
 */

await updateDoc(

userRef,

{

balance:
newBalance,

commission:
newCommission,

completed:
newCompleted,

completedTaskIds:
arrayUnion(taskId)

}

);



/*
 * Save order history
 */

await addDoc(

collection(
db,
"orders"
),

{

uid:
currentUserId,

name:
user.name || "",

email:
user.email || "",

taskId:
taskId,

taskName:
task.name || "Task",

price:
Number(
task.price || 0
),

commission:
taskCommission,

status:
"Completed",

createdAt:
serverTimestamp()

}

);



alert(
"Task Completed Successfully! ✅"
);


/*
 * Reload dashboard.
 *
 * Ab next task automatically
 * show hoga.
 */

await loadUser();


}
catch(error){

alert(
"Error: " +
error.message
);


if(button){

button.disabled = false;

button.innerText =
"✅ Complete Task";

}

}

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text || "");

return div.innerHTML;

}


</script>


</body>

</html>
