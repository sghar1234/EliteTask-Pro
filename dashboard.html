<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
    padding-bottom:90px;
}

/* TOP BAR */

.topbar{
    height:70px;
    background:linear-gradient(135deg,#07152f,#1454a3);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    color:white;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.profile-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    text-decoration:none;
    color:white;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    background:linear-gradient(135deg,#2d8cff,#55c8ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:17px;
}

.logo-text{
    font-size:16px;
    font-weight:bold;
}

/* MAIN */

.container{
    max-width:600px;
    margin:auto;
    padding:18px 15px;
}

/* WELCOME */

.welcome{
    margin-bottom:18px;
}

.welcome h2{
    font-size:22px;
    margin-bottom:5px;
}

.welcome p{
    color:#7b8494;
    font-size:13px;
}

/* BALANCE */

.balance-card{
    background:linear-gradient(135deg,#081a3c,#1454a3);
    border-radius:22px;
    padding:23px;
    color:white;
    box-shadow:0 12px 30px rgba(13,65,140,.25);
    position:relative;
    overflow:hidden;
}

.balance-card:after{
    content:"";
    position:absolute;
    width:160px;
    height:160px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    right:-55px;
    top:-55px;
}

.balance-title{
    font-size:13px;
    opacity:.75;
}

.balance{
    font-size:32px;
    font-weight:bold;
    margin:8px 0 15px;
}

.balance-bottom{
    display:flex;
    justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.15);
    padding-top:14px;
}

.balance-item span{
    display:block;
    font-size:11px;
    opacity:.65;
    margin-bottom:4px;
}

.balance-item strong{
    font-size:15px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.stat-card{
    background:white;
    border-radius:18px;
    padding:17px;
    box-shadow:0 5px 20px rgba(20,40,80,.07);
}

.stat-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#eef5ff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    font-size:18px;
}

.stat-card p{
    font-size:12px;
    color:#8791a1;
}

.stat-card h3{
    margin-top:5px;
    font-size:20px;
}

/* TASKS */

.section-title{
    margin:23px 2px 12px;
}

.section-title h3{
    font-size:17px;
}

.task-card{
    background:white;
    border-radius:20px;
    padding:15px;
    box-shadow:0 5px 20px rgba(20,40,80,.07);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.task-info{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.task-image{
    width:52px;
    height:52px;
    border-radius:15px;
    object-fit:cover;
    background:#eaf2ff;
    flex-shrink:0;
}

.task-placeholder{
    width:52px;
    height:52px;
    border-radius:15px;
    background:linear-gradient(135deg,#e8f2ff,#d8eaff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    flex-shrink:0;
}

.task-info h4{
    font-size:14px;
    margin-bottom:5px;
}

.task-info p{
    font-size:11px;
    color:#8a93a1;
}

.task-btn{
    border:none;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    padding:10px 14px;
    border-radius:11px;
    font-size:12px;
    font-weight:bold;
    flex-shrink:0;
}

.no-task{
    background:white;
    border-radius:18px;
    padding:25px;
    text-align:center;
    color:#8992a2;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:20px;
    color:#7d8796;
    font-size:13px;
}

/* BOTTOM BAR */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:73px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 25px rgba(0,0,0,.10);
    z-index:1000;
    border-top:1px solid #edf0f5;
}

.nav-item{
    text-decoration:none;
    color:#8992a2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:25%;
    font-size:10px;
}

.nav-item span{
    font-size:21px;
}

.nav-item.active{
    color:#1677e8;
    font-weight:bold;
}

.nav-item.support{
    color:#1478ed;
}

.nav-center{
    width:55px;
    height:55px;
    margin-top:-25px;
    border-radius:50%;
    background:linear-gradient(135deg,#1478ed,#36b4ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 8px 20px rgba(20,120,237,.35);
    border:5px solid #f4f7fb;
}

@media(max-width:380px){

    .balance{
        font-size:28px;
    }

    .logo-text{
        font-size:14px;
    }

    .container{
        padding:15px 12px;
    }

}

</style>

</head>

<body>


<!-- TOP BAR -->

<div class="topbar">

    <a href="profile.html" class="profile-btn">
        👤
    </a>

    <div class="logo-area">

        <div class="logo">
            ET
        </div>

        <div class="logo-text">
            EliteTask Pro
        </div>

    </div>

</div>


<!-- MAIN -->

<div class="container">


    <div class="welcome">

        <h2>
            Welcome, <span id="userName">User</span> 👋
        </h2>

        <p>
            Manage your tasks and earnings from here.
        </p>

    </div>


    <!-- BALANCE CARD -->

    <div class="balance-card">

        <div class="balance-title">
            Available Balance
        </div>

        <div class="balance" id="balance">
            $0.00
        </div>

        <div class="balance-bottom">

            <div class="balance-item">

                <span>
                    Commission
                </span>

                <strong id="commission">
                    $0.00
                </strong>

            </div>

            <div class="balance-item">

                <span>
                    Pending
                </span>

                <strong id="pending">
                    $0.00
                </strong>

            </div>

        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <p>
                Completed Tasks
            </p>

            <h3 id="completedTasks">
                0
            </h3>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <p>
                Today's Commission
            </p>

            <h3 id="todayCommission">
                $0.00
            </h3>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📋
            </div>

            <p>
                Total Tasks
            </p>

            <h3 id="totalTasks">
                0
            </h3>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⭐
            </div>

            <p>
                Task Level
            </p>

            <h3>
                1
            </h3>

        </div>

    </div>


    <!-- AVAILABLE TASKS -->

    <div class="section-title">

        <h3>
            Available Tasks
        </h3>

    </div>


    <div id="taskList">

        <div class="loading">
            Loading tasks...
        </div>

    </div>


</div>


<!-- BOTTOM NAVIGATION -->

<div class="bottom-nav">


    <a
        href="dashboard.html"
        class="nav-item active"
    >

        <span>
            ⌂
        </span>

        Home

    </a>


    <a
        href="orders.html"
        class="nav-item"
    >

        <span>
            ▣
        </span>

        Tasks

    </a>


    <a
        href="support.html"
        class="nav-item support"
    >

        <div class="nav-center">
            💬
        </div>

        Support

    </a>


    <a
        href="withdraw.html"
        class="nav-item"
    >

        <span>
            💳
        </span>

        Withdraw

    </a>


</div>


<!-- FIREBASE SCRIPT -->

<script type="module">


/* FIREBASE APP */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


/* AUTH */

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIRESTORE */

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* YOUR FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain: "elitetask-pro.firebaseapp.com",

    projectId: "elitetask-pro",

    storageBucket: "elitetask-pro.firebasestorage.app",

    messagingSenderId: "504295275402",

    appId: "1:504295275402:web:8c480445c5510fa645a673"

};


/* START FIREBASE */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* CHECK USER LOGIN */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        await loadUser(user.uid);

        await loadTasks();

    }
);


/* LOAD USER */

async function loadUser(uid){

    try{

        const userRef =
            doc(
                db,
                "users",
                uid
            );


        const userSnap =
            await getDoc(userRef);


        if(!userSnap.exists()){

            console.log(
                "User data not found"
            );

            return;

        }


        const data =
            userSnap.data();


        /* NAME */

        document
            .getElementById("userName")
            .textContent =
            data.name || "User";


        /* BALANCE */

        const balance =
            Number(
                data.balance || 0
            );


        document
            .getElementById("balance")
            .textContent =
            "$" + balance.toFixed(2);


        /* COMMISSION */

        const commission =
            Number(
                data.commission || 0
            );


        document
            .getElementById("commission")
            .textContent =
            "$" + commission.toFixed(2);


        /* PENDING */

        const pending =
            Number(
                data.pending || 0
            );


        document
            .getElementById("pending")
            .textContent =
            "$" + pending.toFixed(2);


        /* COMPLETED */

        const completed =
            Number(
                data.completedTasks || 0
            );


        document
            .getElementById("completedTasks")
            .textContent =
            completed;


        /* TODAY COMMISSION */

        const todayCommission =
            Number(
                data.todayCommission || 0
            );


        document
            .getElementById("todayCommission")
            .textContent =
            "$" + todayCommission.toFixed(2);

    }

    catch(error){

        console.error(
            "User error:",
            error
        );

    }

}


/* LOAD TASKS */

async function loadTasks(){

    const taskList =
        document.getElementById(
            "taskList"
        );


    try{

        const tasksRef =
            collection(
                db,
                "tasks"
            );


        const snapshot =
            await getDocs(
                tasksRef
            );


        document
            .getElementById("totalTasks")
            .textContent =
            snapshot.size;


        taskList.innerHTML = "";


        if(snapshot.empty){

            taskList.innerHTML = `

                <div class="no-task">

                    No tasks available
                    right now.

                </div>

            `;

            return;

        }


        snapshot.forEach(
            (docSnap) => {

                const task =
                    docSnap.data();


                const taskId =
                    docSnap.id;


                const name =
                    task.name ||
                    "Product Task";


                const price =
                    Number(
                        task.price || 0
                    );


                const image =
                    task.image ||
                    "";


                let imageHTML;


                if(image){

                    imageHTML = `

                        <img
                            src="${image}"
                            class="task-image"
                            alt="Task"
                        >

                    `;

                }

                else{

                    imageHTML = `

                        <div
                            class="task-placeholder"
                        >
                            🛍️
                        </div>

                    `;

                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "task-card";


                card.innerHTML = `

                    <div class="task-info">

                        ${imageHTML}

                        <div>

                            <h4>
                                ${name}
                            </h4>

                            <p>
                                Task Amount:
                                $${price.toFixed(2)}
                            </p>

                        </div>

                    </div>


                    <button
                        class="task-btn"
                    >
                        Start
                    </button>

                `;


                card
                    .querySelector(
                        ".task-btn"
                    )
                    .addEventListener(
                        "click",
                        function(){

                            window.location.href =
                                "orders.html?task=" +
                                taskId;

                        }
                    );


                taskList.appendChild(
                    card
                );

            }
        );

    }

    catch(error){

        console.error(
            "Task error:",
            error
        );


        taskList.innerHTML = `

            <div class="no-task">

                Unable to load tasks.

            </div>

        `;

    }

}

</script>


</body>
</html>
