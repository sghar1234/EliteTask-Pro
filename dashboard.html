<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-box{
background:white;
padding:15px;
border-radius:12px;
margin-top:10px;
box-shadow:0 2px 6px #eee;
}

.task-box h3{
margin-bottom:8px;
}

.task-box p{
margin-top:6px;
}

.task-btn{
width:100%;
padding:12px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
}

.locked{
background:#f3f4f6;
border:1px solid #ddd;
color:#777;
}

.locked .task-btn{
background:#9ca3af;
cursor:not-allowed;
}

.task-number{
font-size:13px;
color:#666;
margin-bottom:6px;
}

.progress{
background:white;
padding:15px;
border-radius:12px;
margin-top:12px;
}

.progress-bar{
width:100%;
height:10px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
margin-top:8px;
}

.progress-fill{
height:100%;
background:#2563eb;
width:0%;
}

.unlock{
margin-top:10px;
font-size:14px;
font-weight:bold;
}

.reward-box{
margin-top:12px;
background:#ecfdf5;
padding:12px;
border-radius:10px;
color:#166534;
font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a href="support.html" class="support">
Customer Service
</a>

</div>

<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p class="user" id="userEmail"></p>

<p class="user" id="userId"></p>

</div>

<div class="card">

<p>My Balance</p>

<div class="balance" id="balance">
Rs 0
</div>

</div>

<div class="stats">

<div class="stat">

<h3 id="completed">
0
</h3>

<p>Completed</p>

</div>

<div class="stat">

<h3 id="commission">
Rs 0
</h3>

<p>Commission</p>

</div>

<div class="stat">

<h3 id="pending">
0
</h3>

<p>Pending</p>

</div>

<div class="stat">

<h3 id="userIdShort">
User
</h3>

<p>ID</p>

</div>

</div>

<div class="menu">

<a href="orders.html">
📦 Orders
</a>

<a href="withdraw.html">
💰 Withdraw
</a>

<a href="profile.html">
👤 Profile
</a>

<a href="support.html">
🎧 Customer Service
</a>

</div>

<div class="task">

<h3>
Today's Tasks
</h3>

<div class="progress">

<div>
Task Progress:
<b id="progressText">
0 / 20
</b>
</div>

<div class="progress-bar">

<div
id="progressFill"
class="progress-fill">
</div>

</div>

<div
id="unlockMessage"
class="unlock">
Task 1 is ready to start.
</div>

<div
id="rewardMessage">
</div>

</div>

<div id="taskList">

Loading Tasks...

</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
updateDoc,
collection,
getDocs,
addDoc,
query,
where,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


let currentUserId = "";

let currentUserData = {};



/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="index.html";

return;

}


currentUserId = user.uid;


try{

const userRef =
doc(
db,
"users",
user.uid
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

alert(
"User account not found."
);

return;

}


currentUserData =
userSnap.data();


document
.getElementById("userName")
.innerText =
currentUserData.name || "User";


document
.getElementById("userEmail")
.innerText =
currentUserData.email || "";


const shortId =
user.uid.substring(0,8);


document
.getElementById("userId")
.innerText =
"ID: " + shortId;


document
.getElementById("userIdShort")
.innerText =
shortId;


document
.getElementById("balance")
.innerText =
"Rs " +
Number(
currentUserData.balance || 0
);


document
.getElementById("commission")
.innerText =
"Rs " +
Number(
currentUserData.commission || 0
);


const completed =
Number(
currentUserData.completed || 0
);


document
.getElementById("completed")
.innerText =
completed;


await loadTasks();

}
catch(error){

alert(
"Dashboard Error: " +
error.message
);

}

});



/* =========================
   LOAD TASKS
========================= */

async function loadTasks(){

const taskList =
document.getElementById("taskList");


try{


/*
 * User ke completed count ko
 * current progress maana jayega.
 */

const completed =
Number(
currentUserData.completed || 0
);


const progress =
Math.min(
completed,
20
);


document
.getElementById("progressText")
.innerText =
progress + " / 20";


document
.getElementById("progressFill")
.style.width =
(
(progress / 20) * 100
) + "%";


updateUnlockMessage(progress);



const tasksSnap =
await getDocs(
collection(db,"tasks")
);


if(tasksSnap.empty){

taskList.innerHTML =
`
<div class="task-box">

<p>
No tasks available right now.
</p>

</div>
`;

return;

}


/*
 * Tasks ko taskNumber ke hisaab se
 * sort karenge.
 *
 * Agar taskNumber missing ho to
 * createdAt / ID fallback rahega.
 */

const tasks = [];


tasksSnap.forEach((item)=>{

const data =
item.data();


tasks.push({

id:item.id,

...data

});

});


tasks.sort((a,b)=>{

const aNumber =
Number(
a.taskNumber || 999999
);

const bNumber =
Number(
b.taskNumber || 999999
);


if(
aNumber !== bNumber
){

return aNumber - bNumber;

}


return a.id.localeCompare(
b.id
);

});



taskList.innerHTML = "";


/*
 * Sirf pehle 20 tasks use honge.
 */

const first20 =
tasks.slice(0,20);


first20.forEach((task,index)=>{

const taskNumber =
Number(
task.taskNumber || (index + 1)
);


/*
 * Task sequentially unlock hoga.
 *
 * completed = 0
 * => Task 1 unlocked
 *
 * completed = 1
 * => Task 2 unlocked
 */

const unlocked =
taskNumber <= completed + 1;


const price =
Number(
task.price || 0
);


const commission =
Number(
task.commission || 0
);


if(unlocked){

taskList.innerHTML += `

<div class="task-box">

<div class="task-number">
Task ${taskNumber} of 20
</div>

<h3>
${escapeHtml(
task.name || "Task"
)}
</h3>

<p>
Price:
<b>
Rs ${price}
</b>
</p>

<p>
Commission:
<b>
Rs ${commission}
</b>
</p>

${
task.description
?
`
<p>
${escapeHtml(
task.description
)}
</p>
`
:
""
}

<button
class="task-btn"
onclick="completeTask(
'${task.id}',
'${escapeAttribute(
task.name || "Task"
)}',
${price},
${commission},
${taskNumber}
)">

✅ Complete Task

</button>

</div>

`;

}
else{

taskList.innerHTML += `

<div class="task-box locked">

<div class="task-number">
Task ${taskNumber} of 20
</div>

<h3>
🔒 ${escapeHtml(
task.name || "Task"
)}
</h3>

<p>
This task is locked.
</p>

<p>
Complete Task ${completed + 1}
first.
</p>

<button
class="task-btn"
disabled>

🔒 Locked

</button>

</div>

`;

}

});


/*
 * Agar 20 tasks complete ho gaye.
 */

if(
completed >= 20
){

document
.getElementById("unlockMessage")
.innerText =
"🎉 All 20 tasks completed!";

}

}
catch(error){

taskList.innerHTML = `
<div class="task-box">

<p>
Error loading tasks.
</p>

<p>
${escapeHtml(
error.message
)}
</p>

</div>
`;

}

}



/* =========================
   UNLOCK MESSAGE
========================= */

function updateUnlockMessage(
completed
){

const message =
document.getElementById(
"unlockMessage"
);


const rewardMessage =
document.getElementById(
"rewardMessage"
);


if(completed >= 20){

message.innerText =
"🎉 All 20 tasks completed!";

rewardMessage.innerHTML = `

<div class="reward-box">

✅ First milestone: 10 tasks completed<br>
✅ Second milestone: 20 tasks completed<br><br>

You have completed all available tasks.

</div>

`;

return;

}


if(completed >= 10){

message.innerText =
"🎉 First 10 tasks completed. Tasks 11–20 are now available.";

rewardMessage.innerHTML = `

<div class="reward-box">

✅ First milestone reached: 10 tasks completed.

</div>

`;

return;

}


message.innerText =
"🔓 Complete Task " +
(completed + 1) +
" to unlock the next task.";

rewardMessage.innerHTML = "";

}



/* =========================
   COMPLETE TASK
========================= */

window.completeTask =
async function(
taskId,
taskName,
price,
commission,
taskNumber
){

try{


/*
 * Current user dobara Firebase se
 * read karte hain.
 */

const userRef =
doc(
db,
"users",
currentUserId
);


const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

alert(
"User account not found."
);

return;

}


const user =
userSnap.data();


const oldCompleted =
Number(
user.completed || 0
);


/*
 * Security check:
 * Sirf next task complete ho sakta hai.
 */

if(
Number(taskNumber) !==
oldCompleted + 1
){

alert(
"Please complete the tasks in order."
);

return;

}


/*
 * Duplicate task check.
 */

const ordersQuery =
query(

collection(db,"orders"),

where(
"uid",
"==",
currentUserId
),

where(
"taskId",
"==",
taskId
)

);


const ordersSnap =
await getDocs(
ordersQuery
);


if(!ordersSnap.empty){

alert(
"This task has already been completed."
);

return;

}


const oldBalance =
Number(
user.balance || 0
);


const oldCommission =
Number(
user.commission || 0
);


const taskCommission =
Number(
commission || 0
);


const newBalance =
oldBalance +
taskCommission;


const newCommission =
oldCommission +
taskCommission;


const newCompleted =
oldCompleted +
1;


/*
 * User progress update.
 */

await updateDoc(

userRef,

{

balance:newBalance,

commission:newCommission,

completed:newCompleted

}

);


/*
 * Order record.
 */

await addDoc(

collection(db,"orders"),

{

uid:currentUserId,

name:user.name || "",

email:user.email || "",

taskId:taskId,

taskNumber:Number(taskNumber),

taskName:taskName,

price:Number(price || 0),

commission:taskCommission,

status:"Completed",

createdAt:serverTimestamp()

}

);


/*
 * Updated local data.
 */

currentUserData = {

...user,

balance:newBalance,

commission:newCommission,

completed:newCompleted

};


alert(
"Task " +
taskNumber +
" Completed Successfully!"
);


/*
 * Dashboard reload.
 */

location.reload();


}
catch(error){

alert(
"Error: " +
error.message
);

}

};



/* =========================
   HTML SAFETY
========================= */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return String(value)

.replaceAll("\\","\\\\")
.replaceAll("'","\\'");

}

</script>

</body>

</html>
