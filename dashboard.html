<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat h3{
color:#2563eb;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-box{
background:white;
padding:15px;
border-radius:12px;
margin-top:10px;
}

.task-box h3{
margin-bottom:8px;
color:#2563eb;
}

.task-box p{
margin-top:6px;
color:#555;
font-size:14px;
}

.open-tasks{
display:block;
width:100%;
padding:12px;
margin-top:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold;
}

.required{
margin-top:10px;
padding:10px;
border-radius:9px;
background:#fff7ed;
color:#c2410c;
font-weight:bold;
font-size:13px;
}

.ready{
margin-top:10px;
padding:10px;
border-radius:9px;
background:#dcfce7;
color:#166534;
font-weight:bold;
font-size:13px;
}

.loading{
text-align:center;
color:#777;
padding:15px;
}

.error{
color:#b91c1c;
background:#fee2e2;
padding:12px;
border-radius:10px;
margin-top:10px;
word-break:break-word;
}

</style>

</head>


<body>


<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a
href="support.html"
class="support">

Customer Service

</a>

</div>



<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p
class="user"
id="userEmail">
</p>

<p
class="user"
id="userId">
</p>

</div>



<div class="card">

<p>My Balance</p>

<div
class="balance"
id="balance">

Rs 0

</div>

</div>



<div class="stats">

<div class="stat">

<h3 id="completed">
0
</h3>

<p>Completed</p>

</div>


<div class="stat">

<h3 id="commission">
Rs 0
</h3>

<p>Commission</p>

</div>


<div class="stat">

<h3 id="available">
Rs 0
</h3>

<p>Available for Tasks</p>

</div>


<div class="stat">

<h3>
0
</h3>

<p>Pending</p>

</div>

</div>



<div class="menu">

<a href="orders.html">
📦 Start / View Tasks
</a>

<a href="withdraw.html">
💰 Withdraw
</a>

<a href="profile.html">
👤 Profile
</a>

<a href="support.html">
🎧 Customer Service
</a>

</div>



<div class="task">

<h3>
Today's Tasks
</h3>


<div id="taskList">

<div class="loading">
Loading Tasks...
</div>

</div>


<a
href="orders.html"
class="open-tasks">

🚀 Open Tasks

</a>

</div>



<script type="module">


import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
doc,
getDoc,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const userName =
document.getElementById(
"userName"
);

const userEmail =
document.getElementById(
"userEmail"
);

const userId =
document.getElementById(
"userId"
);

const balance =
document.getElementById(
"balance"
);

const commission =
document.getElementById(
"commission"
);

const completed =
document.getElementById(
"completed"
);

const available =
document.getElementById(
"available"
);

const taskList =
document.getElementById(
"taskList"
);



onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


try{

await loadUser(user.uid);

await loadTasks();

}catch(error){

taskList.innerHTML = `

<div class="error">

Firebase Error:<br>
${escapeHtml(error.message)}

</div>

`;

}

});



/* =========================
LOAD USER
========================= */

async function loadUser(uid){

const userRef =
doc(
db,
"users",
uid
);


const userSnap =
await getDoc(
userRef
);


if(!userSnap.exists()){

throw new Error(
"User profile not found."
);

}


const data =
userSnap.data();


const userBalance =
Number(
data.balance || 0
);


const userCommission =
Number(
data.commission || 0
);


const totalAvailable =
userBalance +
userCommission;



userName.innerText =
data.name || "User";


userEmail.innerText =
data.email || "";


userId.innerText =
"ID: " +
uid.substring(0,8);


balance.innerText =
"Rs " +
userBalance;


commission.innerText =
"Rs " +
userCommission;


completed.innerText =
Number(
data.completed || 0
);


available.innerText =
"Rs " +
totalAvailable;

}



/* =========================
LOAD TASK PREVIEW
========================= */

async function loadTasks(){

const tasks =
await getDocs(
collection(
db,
"tasks"
)
);


taskList.innerHTML = "";


if(tasks.empty){

taskList.innerHTML = `

<div class="loading">

No Task Available

</div>

`;

return;

}



/*
Only show first 3 tasks
on dashboard.
*/

const taskArray = [];


tasks.forEach(
(item)=>{

taskArray.push({

id:item.id,

data:item.data()

});

});


taskArray.sort(
(a,b)=>
Number(
a.data.order || 0
)
-
Number(
b.data.order || 0
)
);


const previewTasks =
taskArray.slice(
0,
3
);



/*
Get current displayed
wallet values.
*/

const balanceValue =
Number(
balance.innerText
.replace("Rs ","")
);


const commissionValue =
Number(
commission.innerText
.replace("Rs ","")
);


const totalAvailable =
balanceValue +
commissionValue;



previewTasks.forEach(
(item,index)=>{


const task =
item.data;


const price =
Number(
task.price || 0
);


const required =
Math.max(
0,
price - totalAvailable
);


const box =
document.createElement(
"div"
);


box.className =
"task-box";


let requirement;


if(required > 0){

requirement = `

<div class="required">

⚠️ Additional Virtual Credits Required:
Rs ${required}

</div>

`;

}else{

requirement = `

<div class="ready">

✅ Enough available credits

</div>

`;

}


box.innerHTML = `

<h3>
Task ${index + 1}:
${escapeHtml(
task.name || "Task"
)}
</h3>

<p>
💰 Task Amount:
<b>Rs ${price}</b>
</p>

<p>
💎 Task Commission:
<b>Rs ${Number(
task.commission || 0
)}</b>
</p>

<p>
📊 Available:
<b>Rs ${totalAvailable}</b>
</p>

${requirement}

`;


taskList.appendChild(
box
);

});

}



/* =========================
ESCAPE TEXT
========================= */

function escapeHtml(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>


</body>

</html>
```
