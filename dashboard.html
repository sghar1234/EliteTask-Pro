<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.topbar{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.support{
background:#22c55e;
color:white;
padding:8px 12px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

.card{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.balance{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}

.user{
margin-top:8px;
color:#555;
word-break:break-word;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat h3{
font-size:20px;
}

.menu{
margin-top:20px;
}

.menu a{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:15px;
border-radius:12px;
margin-bottom:12px;
text-align:center;
}

.task{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.task-box{
background:white;
padding:16px;
border-radius:12px;
margin-top:10px;
box-shadow:0 2px 7px #ddd;
}

.task-box h3{
margin-bottom:8px;
}

.task-number{
font-size:13px;
color:#2563eb;
font-weight:bold;
margin-bottom:7px;
}

.task-btn{
width:100%;
padding:12px;
margin-top:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
}

.task-btn:disabled{
background:#9ca3af;
}

.progress{
margin-top:15px;
background:white;
padding:15px;
border-radius:12px;
}

.progress-bar{
height:10px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress-fill{
height:100%;
width:0%;
background:#22c55e;
transition:.3s;
}

.message{
margin-top:12px;
padding:12px;
border-radius:10px;
background:#ecfdf5;
color:#166534;
font-size:14px;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.empty{
text-align:center;
padding:20px;
color:#777;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
EliteTask Pro
</div>

<a href="support.html" class="support">
Customer Service
</a>

</div>


<div class="card">

<p>Welcome</p>

<h2 id="userName">
Loading...
</h2>

<p class="user" id="userEmail"></p>

<p class="user" id="userId"></p>

</div>


<div class="card">

<p>My Balance</p>

<div class="balance" id="balance">
Rs 0
</div>

</div>


<div class="stats">

<div class="stat">

<h3 id="completed">
0
</h3>

<p>Completed</p>

</div>


<div class="stat">

<h3 id="totalTasks">
0
</h3>

<p>Total Tasks</p>

</div>


<div class="stat">

<h3 id="remainingTasks">
0
</h3>

<p>Remaining</p>

</div>


<div class="stat">

<h3 id="progressText">
0%
</h3>

<p>Progress</p>

</div>

</div>


<div class="progress">

<b>Task Progress</b>

<div class="progress-bar">

<div
id="progressFill"
class="progress-fill">
</div>

</div>

</div>


<div class="menu">

<a href="orders.html">
📦 Orders
</a>

<a href="withdraw.html">
💰 Withdraw
</a>

<a href="profile.html">
👤 Profile
</a>

<a href="support.html">
🎧 Customer Service
</a>

</div>


<div class="task">

<h3>
Today's Tasks
</h3>

<div id="taskList">
Loading Tasks...
</div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
doc,
getDoc,
collection,
getDocs,
query,
where,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


let currentUserId = "";

let currentUserData = null;

let allTasks = [];

let completedTaskIds = new Set();


const taskList =
document.getElementById("taskList");


/* =========================
   LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href =
"index.html";

return;

}

currentUserId =
user.uid;


try{

const userRef =
doc(
db,
"users",
user.uid
);

const userSnap =
await getDoc(userRef);


if(!userSnap.exists()){

taskList.innerHTML =
'<div class="empty">User profile not found.</div>';

return;

}


currentUserData =
userSnap.data();


document.getElementById(
"userName"
).innerText =
currentUserData.name || "User";


document.getElementById(
"userEmail"
).innerText =
currentUserData.email || user.email || "";


document.getElementById(
"userId"
).innerText =
"ID: " + user.uid.substring(0,8);


document.getElementById(
"balance"
).innerText =
"Rs " +
Number(
currentUserData.balance || 0
);


await loadCompletedTasks();

await loadTasks();

}
catch(error){

taskList.innerHTML = `
<div class="empty error">
${escapeHtml(error.message)}
</div>
`;

}

});


/* =========================
   COMPLETED TASKS
========================= */

async function loadCompletedTasks(){

completedTaskIds =
new Set();


const ordersQuery =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUserId
)

);


const ordersSnap =
await getDocs(
ordersQuery
);


ordersSnap.forEach(
(item)=>{

const data =
item.data();


if(
data.status === "Completed" &&
data.taskId
){

completedTaskIds.add(
data.taskId
);

}

});

}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks(){

try{

const tasksSnap =
await getDocs(
collection(db,"tasks")
);


allTasks = [];


tasksSnap.forEach(
(item)=>{

const data =
item.data();


allTasks.push({

id:item.id,

...data

});

});


/*
Tasks ko order ke mutabiq
sort karna.
*/

allTasks.sort(
(a,b)=>{

const orderA =
Number(a.order || 9999);

const orderB =
Number(b.order || 9999);

return orderA - orderB;

});


updateStats();

showNextTask();


}
catch(error){

taskList.innerHTML = `
<div class="empty error">
Task loading failed.<br><br>
${escapeHtml(error.message)}
</div>
`;

}

}


/* =========================
   STATS
========================= */

function updateStats(){

const total =
allTasks.length;


const completed =
allTasks.filter(
task =>
completedTaskIds.has(
task.id
)
).length;


const remaining =
Math.max(
total - completed,
0
);


const percentage =
total > 0
?
Math.round(
(completed / total) * 100
)
:
0;


document.getElementById(
"completed"
).innerText =
completed;


document.getElementById(
"totalTasks"
).innerText =
total;


document.getElementById(
"remainingTasks"
).innerText =
remaining;


document.getElementById(
"progressText"
).innerText =
percentage + "%";


document.getElementById(
"progressFill"
).style.width =
percentage + "%";

}


/* =========================
   SHOW NEXT TASK
========================= */

function showNextTask(){

taskList.innerHTML = "";


const nextTask =
allTasks.find(
task =>
!completedTaskIds.has(
task.id
)
);


if(!nextTask){

taskList.innerHTML = `

<div class="empty">

🎉 All available tasks completed!

</div>

`;

return;

}


const taskNumber =
Number(
nextTask.order || 1
);


const name =
nextTask.name ||
"Task " + taskNumber;


const description =
nextTask.description ||
"Complete this task.";


const price =
Number(
nextTask.price || 0
);


taskList.innerHTML = `

<div class="task-box">

<div class="task-number">
TASK ${taskNumber}
</div>

<h3>
${escapeHtml(name)}
</h3>

<p>
${escapeHtml(description)}
</p>

<p style="margin-top:8px;">
Task Value: Rs ${price}
</p>

<button
class="task-btn"
id="completeTaskBtn">

Complete Task
</button>

</div>

`;


document
.getElementById(
"completeTaskBtn"
)
.addEventListener(
"click",
()=>{

completeTask(
nextTask
);

});


}


/* =========================
   COMPLETE TASK
========================= */

async function completeTask(task){

const btn =
document.getElementById(
"completeTaskBtn"
);


if(!btn){

return;

}


btn.disabled = true;

btn.innerText =
"Completing...";


try{


/*
Check dobara ke task already
complete to nahi hua.
*/

await loadCompletedTasks();


if(
completedTaskIds.has(
task.id
)
){

alert(
"This task is already completed."
);

await loadTasks();

return;

}


/*
Order record create.
*/

await addDoc(

collection(
db,
"orders"
),

{

uid:
currentUserId,

name:
currentUserData.name || "",

email:
currentUserData.email || "",

taskId:
task.id,

taskName:
task.name || "Task",

price:
Number(task.price || 0),

status:
"Completed",

createdAt:
serverTimestamp()

}

);


completedTaskIds.add(
task.id
);


updateStats();


alert(
"Task completed successfully!"
);


showNextTask();


}
catch(error){

btn.disabled = false;

btn.innerText =
"Complete Task";


alert(
"Error: " +
error.message
);

}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>

</body>
</html>
