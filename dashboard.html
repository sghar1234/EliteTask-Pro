<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

/* ===== GOLD PLATED DASHBOARD DESIGN ONLY ===== */

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#3f3000;

    background:
        radial-gradient(circle at 10% 5%,rgba(255,255,255,.95),transparent 25%),
        radial-gradient(circle at 90% 15%,rgba(255,220,100,.35),transparent 30%),
        linear-gradient(
            135deg,
            #fffdf3 0%,
            #f8edbd 25%,
            #fff9dc 50%,
            #ead276 75%,
            #fff5c5 100%
        );

    background-attachment:fixed;
}


/* TOP BAR */

.top-bar{
    margin:0;
    padding:22px 18px;

    text-align:center;

    background:
        linear-gradient(
            135deg,
            #8c6500,
            #d8ae32,
            #f5db78,
            #b27e00,
            #765200
        );

    color:white;

    border-bottom:1px solid #f9e49a;

    box-shadow:
        0 8px 25px rgba(91,62,0,.25),
        inset 0 1px 3px rgba(255,255,255,.55);
}

.top-bar h2{
    margin:0;
    font-size:25px;
    font-weight:900;
    letter-spacing:.4px;
    text-shadow:0 2px 5px rgba(67,44,0,.35);
}

.top-bar p{
    margin:7px 0 0;
    font-size:13px;
    color:#fff7d0;
}


/* BALANCE */

.balance-card{
    position:relative;
    overflow:hidden;

    margin:18px 14px;

    padding:25px 20px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            #765100 0%,
            #bd8e10 25%,
            #f5d86d 48%,
            #b17d00 73%,
            #6d4a00 100%
        );

    border:1px solid #f7df7d;

    color:white;

    box-shadow:
        0 12px 30px rgba(91,62,0,.30),
        inset 0 1px 4px rgba(255,255,255,.65);
}

.balance-card::after{
    content:"";
    position:absolute;

    width:180px;
    height:180px;

    right:-80px;
    top:-100px;

    border-radius:50%;

    background:rgba(255,255,255,.22);

    filter:blur(4px);
}

.balance-card h3{
    position:relative;
    z-index:1;

    margin:0;

    color:#fff5bd;
    font-size:14px;
}

.balance-card h1{
    position:relative;
    z-index:1;

    margin:8px 0 0;

    font-size:36px;
    font-weight:900;

    color:white;

    text-shadow:
        0 3px 8px rgba(65,42,0,.4);
}


/* COMMISSION CARD */

.dashboard-card{
    position:relative;
    overflow:hidden;

    margin:14px;

    padding:20px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.97),
            rgba(255,247,203,.95)
        );

    border:1px solid #dfc45c;

    box-shadow:
        0 8px 24px rgba(105,74,0,.14),
        inset 0 1px 3px rgba(255,255,255,.9);
}

.dashboard-card::after{
    content:"";

    position:absolute;

    width:80px;
    height:80px;

    right:-35px;
    top:-35px;

    border-radius:50%;

    background:rgba(220,185,55,.17);
}

.dashboard-card h3{
    position:relative;
    z-index:1;

    margin:0 0 8px;

    color:#6b5000;

    font-size:19px;
}

.dashboard-card p{
    position:relative;
    z-index:1;

    margin:0;

    color:#806c32;

    font-size:14px;
}

.dashboard-card p span{
    color:#a27600;
    font-weight:900;
}


/* START TASK BUTTON */

.dashboard-card button{
    position:relative;
    z-index:2;

    width:100%;

    margin-top:16px;

    padding:13px 18px;

    border:0;
    border-radius:12px;

    color:white;

    font-size:15px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #9b6e00,
            #e1bb42,
            #a87600
        );

    box-shadow:
        0 6px 15px rgba(107,74,0,.25),
        inset 0 1px 2px rgba(255,255,255,.65);

    cursor:pointer;
}

.dashboard-card button:active{
    transform:scale(.98);
}


/* MENU */

.menu-box{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin:18px 14px 35px;
}

.menu-box button{
    padding:14px 10px;

    border-radius:15px;

    border:1px solid #d5b84d;

    background:
        linear-gradient(
            145deg,
            #fffef3,
            #f9eab0,
            #fffdf0
        );

    color:#715400;

    font-size:14px;
    font-weight:bold;

    box-shadow:
        0 7px 18px rgba(104,73,0,.13),
        inset 0 1px 3px rgba(255,255,255,.95);

    cursor:pointer;
}

.menu-box button:active{
    transform:scale(.98);
}


/* MOBILE */

@media(max-width:480px){

    .top-bar{
        padding:20px 14px;
    }

    .top-bar h2{
        font-size:23px;
    }

    .balance-card{
        margin:14px 10px;
    }

    .dashboard-card{
        margin:12px 10px;
    }

    .menu-box{
        margin-left:10px;
        margin-right:10px;
    }

    .balance-card h1{
        font-size:32px;
    }
}

</style>

</head>


<body>


<div class="top-bar">

<h2>EliteTask Pro</h2>

<p id="username">Welcome User</p>

</div>



<div class="balance-card">

<h3>Total Balance</h3>

<h1>Rs <span id="balance">0</span></h1>

</div>



<div class="dashboard-card">

<h3>Commission</h3>

<p>Today's Commission: Rs <span id="commission">0</span></p>

</div>



<div class="dashboard-card">

<h3>Daily Tasks</h3>

<p>Complete tasks and earn commission</p>


<button onclick="startTask()">
Start Task
</button>


</div>



<div class="menu-box">


<button onclick="location.href='withdraw.html'">
Withdraw
</button>


<button onclick="location.href='support.html'">
Customer Service
</button>


</div>




<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import { getAuth, onAuthStateChanged }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import { getDatabase, ref, get }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

authDomain: "elitetask-pro.firebaseapp.com",

projectId: "elitetask-pro",

storageBucket: "elitetask-pro.firebasestorage.app",

messagingSenderId: "504295275402",

appId: "1:504295275402:web:cf744a5d4e82c72145a673"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const database = getDatabase(app);



onAuthStateChanged(auth,(user)=>{


if(user){


get(ref(database,"users/"+user.uid))

.then((snapshot)=>{


let data = snapshot.val();


if(data){


document.getElementById("username").innerHTML =
"Welcome "+data.name;


document.getElementById("balance").innerHTML =
data.balance;


document.getElementById("commission").innerHTML =
data.commission;


}


});


}


});




window.startTask=function(){

alert("Tasks will appear soon");

}


</script>



</body>

</html>
