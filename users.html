<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - EliteTask Pro Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.user-card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.user-card h3{
color:#2563eb;
font-size:18px;
}

.info{
margin-top:8px;
color:#555;
font-size:14px;
}

.actions{
margin-top:15px;
}

.chat-btn{
display:block;
width:100%;
background:#16a34a;
color:white;
padding:13px;
border-radius:10px;
text-align:center;
text-decoration:none;
font-size:15px;
font-weight:bold;
}

.back{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#2563eb;
padding:12px;
}

.status{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
text-align:center;
color:#777;
}

.error{
color:#dc2626;
text-align:left;
line-height:1.5;
}

</style>

</head>


<body>


<div class="header">
👥 Users Management
</div>


<div id="usersList">

<div class="status">
Loading Users...
</div>

</div>


<a href="admin.html" class="back">
⬅ Back to Admin
</a>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const usersList =
document.getElementById("usersList");


async function loadUsers(){

try{

const snapshot =
await getDocs(
collection(db,"users")
);


if(snapshot.empty){

usersList.innerHTML = `
<div class="status">
No users found.
</div>
`;

return;

}


usersList.innerHTML = "";


snapshot.forEach((docSnap)=>{

const user =
docSnap.data();

const userId =
docSnap.id;

const name =
user.name || "User";

const email =
user.email || "No email";

const balance =
user.balance ?? 0;

const commission =
user.commission ?? 0;


const card =
document.createElement("div");

card.className =
"user-card";


card.innerHTML = `

<h3>
👤 ${escapeHtml(name)}
</h3>

<p class="info">
Email: ${escapeHtml(email)}
</p>

<p class="info">
Balance: Rs ${balance}
</p>

<p class="info">
Commission: Rs ${commission}
</p>

<p class="info">
ID: ${escapeHtml(
userId.substring(0,8)
)}
</p>

<div class="actions">

<a
class="chat-btn"
href="admin-chat.html?uid=${encodeURIComponent(userId)}&name=${encodeURIComponent(name)}"
>
💬 Chat
</a>

</div>

`;


usersList.appendChild(card);

});


}catch(error){

console.error(error);


usersList.innerHTML = `

<div class="status">

<div class="error">

<strong>
Firebase Error
</strong>

<br><br>

${escapeHtml(error.message)}

<br><br>

Code:
${escapeHtml(error.code || "unknown")}

</div>

</div>

`;

}

}


function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


loadUsers();

</script>


</body>
</html>
```
