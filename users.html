<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - EliteTask Pro Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.user-card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.user-card h3{
color:#2563eb;
}

.info{
margin-top:8px;
color:#555;
}

.back{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#2563eb;
}

</style>

</head>


<body>


<div class="header">
👥 Users Management
</div>



<div id="usersList">

Loading Users...

</div>



<a href="admin.html" class="back">
⬅ Back to Admin
</a>




<script type="module">


import { db } from "./firebase.js";


import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const usersList =
document.getElementById("usersList");



const users =
await getDocs(collection(db,"users"));



usersList.innerHTML="";



users.forEach((item)=>{


let user=item.data();



usersList.innerHTML += `


<div class="user-card">


<h3>
${user.name}
</h3>


<p class="info">
Email: ${user.email}
</p>


<p class="info">
Balance: Rs ${user.balance}
</p>


<p class="info">
Commission: Rs ${user.commission}
</p>


<p class="info">
ID: ${item.id.substring(0,8)}
</p>


</div>


`;



});



</script>



</body>
</html>
