<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - EliteTask Pro Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.user-card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.user-card h3{
color:#2563eb;
font-size:18px;
}

.info{
margin-top:8px;
color:#555;
font-size:14px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.chat-btn{
flex:1;
background:#16a34a;
color:white;
border:none;
padding:13px;
border-radius:10px;
font-size:15px;
font-weight:bold;
text-decoration:none;
text-align:center;
}

.chat-btn:active{
opacity:.8;
}

.back{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#2563eb;
padding:12px;
}

</style>

</head>


<body>


<div class="header">
👥 Users Management
</div>


<div id="usersList">

Loading Users...

</div>


<a href="admin.html" class="back">
⬅ Back to Admin
</a>


<script type="module">


import { db } from "./firebase.js";


import {
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const usersList =
document.getElementById("usersList");


try{


const users =
await getDocs(
collection(db,"users")
);


usersList.innerHTML="";


if(users.empty){

usersList.innerHTML=`
<div class="user-card">
No users found.
</div>
`;

}


users.forEach((item)=>{


let user =
item.data();


const userId =
item.id;


const name =
user.name || "User";


const email =
user.email || "No email";


const balance =
user.balance || 0;


const commission =
user.commission || 0;


usersList.innerHTML += `

<div class="user-card">

<h3>
👤 ${escapeHtml(name)}
</h3>

<p class="info">
Email: ${escapeHtml(email)}
</p>

<p class="info">
Balance: Rs ${balance}
</p>

<p class="info">
Commission: Rs ${commission}
</p>

<p class="info">
ID: ${userId.substring(0,8)}
</p>

<div class="actions">

<a
class="chat-btn"
href="admin-chat.html?uid=${encodeURIComponent(userId)}&name=${encodeURIComponent(name)}"
>
💬 Chat
</a>

</div>

</div>

`;

});


}catch(error){

usersList.innerHTML=`

<div class="user-card">

<p style="color:red;">
Error loading users:
</p>

<p class="info">
${escapeHtml(error.message)}
</p>

</div>

`;

}


/* SECURITY FOR DISPLAYED TEXT */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>


</body>
</html>
```
