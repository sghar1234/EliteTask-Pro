<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Sign Up</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(145deg,#06132e,#0d3975,#1677d2);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.wrapper{
    width:100%;
    max-width:420px;
}

.brand{
    text-align:center;
    color:white;
    margin-bottom:22px;
}

.logo{
    width:68px;
    height:68px;
    margin:auto;
    border-radius:21px;
    background:linear-gradient(135deg,#2d8cff,#55c8ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:bold;
    box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.brand h1{
    font-size:23px;
    margin-top:11px;
}

.brand p{
    font-size:12px;
    opacity:.7;
    margin-top:5px;
}

.card{
    background:white;
    border-radius:26px;
    padding:25px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.card h2{
    text-align:center;
    color:#172033;
    font-size:21px;
}

.subtitle{
    text-align:center;
    color:#8992a2;
    font-size:12px;
    margin:6px 0 21px;
}

.error{
    display:none;
    background:#fff1f1;
    color:#d83232;
    padding:10px;
    border-radius:10px;
    font-size:11px;
    text-align:center;
    margin-bottom:13px;
}

label{
    display:block;
    color:#596579;
    font-size:12px;
    margin-bottom:7px;
}

.input-box{
    position:relative;
    margin-bottom:15px;
}

.input-box span{
    position:absolute;
    left:14px;
    top:15px;
    font-size:16px;
}

input{
    width:100%;
    height:49px;
    border:1px solid #e0e6ef;
    border-radius:13px;
    padding:0 14px 0 42px;
    outline:none;
    font-size:13px;
    background:#fafcff;
}

input:focus{
    border-color:#2588ed;
    background:white;
}

.signup-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(20,120,237,.25);
    margin-top:4px;
}

.signup-btn:disabled{
    opacity:.6;
}

.login{
    text-align:center;
    margin-top:19px;
    color:#8992a2;
    font-size:12px;
}

.login a{
    color:#1478ed;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="wrapper">

    <div class="brand">

        <div class="logo">
            ET
        </div>

        <h1>
            EliteTask Pro
        </h1>

        <p>
            Smart Tasks • Better Earnings
        </p>

    </div>


    <div class="card">

        <h2>
            Create Account
        </h2>

        <div class="subtitle">
            Join EliteTask Pro and get started
        </div>


        <div
            class="error"
            id="errorBox"
        ></div>


        <label>
            Full Name
        </label>

        <div class="input-box">

            <span>👤</span>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

        </div>


        <label>
            Email Address
        </label>

        <div class="input-box">

            <span>📧</span>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

        </div>


        <label>
            Password
        </label>

        <div class="input-box">

            <span>🔒</span>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
            >

        </div>


        <label>
            Confirm Password
        </label>

        <div class="input-box">

            <span>🔐</span>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
            >

        </div>


        <button
            class="signup-btn"
            id="signupBtn"
        >
            Create Account
        </button>


        <div class="login">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain: "elitetask-pro.firebaseapp.com",

    projectId: "elitetask-pro",

    storageBucket: "elitetask-pro.firebasestorage.app",

    messagingSenderId: "504295275402",

    appId: "1:504295275402:web:8c480445c5510fa645a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


const nameInput =
    document.getElementById("name");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmInput =
    document.getElementById("confirmPassword");

const signupBtn =
    document.getElementById("signupBtn");

const errorBox =
    document.getElementById("errorBox");


function showError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


signupBtn.addEventListener(
    "click",
    async () => {

        errorBox.style.display =
            "none";


        const name =
            nameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmInput.value;


        if(!name){

            showError(
                "Apna naam enter karo."
            );

            return;

        }


        if(!email){

            showError(
                "Email enter karo."
            );

            return;

        }


        if(password.length < 6){

            showError(
                "Password kam az kam 6 characters ka ho."
            );

            return;

        }


        if(password !== confirmPassword){

            showError(
                "Passwords match nahi kar rahe."
            );

            return;

        }


        signupBtn.disabled =
            true;

        signupBtn.textContent =
            "Creating...";


        try{

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            await setDoc(
                doc(
                    db,
                    "users",
                    user.uid
                ),
                {

                    name:
                        name,

                    email:
                        email,

                    balance:
                        0,

                    commission:
                        0,

                    completed:
                        0,

                    pending:
                        0,

                    role:
                        "user",

                    createdAt:
                        serverTimestamp()

                }
            );


            window.location.href =
                "dashboard.html";

        }

        catch(error){

            console.error(error);


            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                showError(
                    "Ye email pehle se registered hai."
                );

            }
            else if(
                error.code ===
                "auth/invalid-email"
            ){

                showError(
                    "Email address ghalat hai."
                );

            }
            else if(
                error.code ===
                "auth/weak-password"
            ){

                showError(
                    "Password zyada strong rakho."
                );

            }
            else{

                showError(
                    "Account create nahi ho saka. Dobara try karo."
                );

            }

        }


        signupBtn.disabled =
            false;

        signupBtn.textContent =
            "Create Account";

    }
);


confirmInput.addEventListener(
    "keydown",
    (event) => {

        if(event.key === "Enter"){

            signupBtn.click();

        }

    }
);

</script>

</body>
</html>
