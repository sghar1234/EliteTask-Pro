<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.header{
background:#111827;
color:white;
padding:20px;
border-radius:16px;
font-size:23px;
font-weight:bold;
}

.wallet{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.walletBox{
background:white;
padding:17px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.walletBox p{
color:#666;
font-size:14px;
}

.walletBox h2{
color:#2563eb;
margin-top:7px;
font-size:25px;
}

.card{
background:white;
padding:18px;
border-radius:16px;
margin-top:15px;
box-shadow:0 3px 10px #ddd;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

.task{
border-bottom:1px solid #eee;
padding-bottom:20px;
margin-bottom:20px;
}

.task:last-child{
border-bottom:none;
margin-bottom:0;
}

.taskImage{
width:100%;
height:190px;
object-fit:cover;
border-radius:13px;
display:block;
margin-bottom:14px;
}

.taskName{
font-size:20px;
font-weight:bold;
color:#2563eb;
margin-bottom:12px;
}

.info{
font-size:16px;
color:#555;
margin-top:8px;
}

.info b{
color:#111827;
}

.required{
margin-top:14px;
padding:14px;
border-radius:12px;
background:#fff7ed;
color:#c2410c;
font-weight:bold;
line-height:1.5;
}

.ready{
margin-top:14px;
padding:14px;
border-radius:12px;
background:#dcfce7;
color:#166534;
font-weight:bold;
}

.completeBtn{
width:100%;
border:0;
background:#2563eb;
color:white;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:bold;
margin-top:13px;
}

.completeBtn:disabled{
background:#9ca3af;
}

.completedBtn{
width:100%;
border:0;
background:#16a34a;
color:white;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:bold;
margin-top:13px;
}

.empty{
text-align:center;
padding:25px;
color:#777;
}

.error{
background:#fee2e2;
color:#b91c1c;
padding:15px;
border-radius:12px;
word-break:break-word;
}

.back{
display:block;
margin-top:20px;
background:#2563eb;
color:white;
text-decoration:none;
text-align:center;
padding:15px;
border-radius:12px;
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
📦 Available Tasks
</div>


<div class="wallet">

<div class="walletBox">
<p>Balance</p>
<h2 id="balance">Rs 0</h2>
</div>

<div class="walletBox">
<p>Commission</p>
<h2 id="commission">Rs 0</h2>
</div>

</div>


<div class="card">

<div class="title">
📦 Available Tasks
</div>

<div id="tasksList">
Loading Tasks...
</div>

</div>


<div class="card">

<div class="title">
✅ Completed Tasks
</div>

<div id="completedList">
Loading Completed Tasks...
</div>

</div>


<a href="dashboard.html" class="back">
← Back to Dashboard
</a>


<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
collection,
getDocs,
getDoc,
doc,
query,
where,
updateDoc,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const balanceEl =
document.getElementById("balance");

const commissionEl =
document.getElementById("commission");

const tasksList =
document.getElementById("tasksList");

const completedList =
document.getElementById("completedList");


let currentUser = null;

let balance = 0;

let commission = 0;


/* =========================
AUTH
========================= */

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href = "index.html";

return;

}

currentUser = user;

try{

await loadUser();

await loadTasks();

await loadCompleted();

}catch(error){

tasksList.innerHTML = `
<div class="error">
${escapeHtml(error.message)}
</div>
`;

}

});


/* =========================
USER
========================= */

async function loadUser(){

const ref =
doc(db,"users",currentUser.uid);

const snap =
await getDoc(ref);

if(!snap.exists()){

throw new Error("User account not found.");

}

const data =
snap.data();

balance =
Number(data.balance || 0);

commission =
Number(data.commission || 0);

updateWallet();

}


function updateWallet(){

balanceEl.innerText =
"Rs " + balance;

commissionEl.innerText =
"Rs " + commission;

}


/* =========================
LOAD TASKS
========================= */

async function loadTasks(){

tasksList.innerHTML =
"Loading Tasks...";


const taskSnap =
await getDocs(
collection(db,"tasks")
);


/* Completed task IDs */

const orderQuery =
query(
collection(db,"orders"),
where("uid","==",currentUser.uid)
);

const orderSnap =
await getDocs(orderQuery);

const completedIds =
new Set();


orderSnap.forEach(item=>{

const data = item.data();

if(data.status === "Completed"){

completedIds.add(data.taskId);

}

});


const tasks = [];


taskSnap.forEach(item=>{

const data = item.data();

tasks.push({
id:item.id,
data:data
});

});


tasks.sort((a,b)=>{

return Number(a.data.order || 0)
-
Number(b.data.order || 0);

});


tasksList.innerHTML = "";


let shown = 0;


tasks.forEach((item)=>{

if(completedIds.has(item.id)){

return;

}

renderTask(
item.id,
item.data
);

shown++;

});


if(shown === 0){

tasksList.innerHTML = `
<div class="empty">
🎉 All available tasks are completed.
</div>
`;

}

}


/* =========================
RENDER TASK
========================= */

function renderTask(id,task){

const price =
Number(task.price || 0);

const taskCommission =
Number(task.commission || 0);


/*
Available internal credits
*/

const available =
balance + commission;


/*
Amount still needed
*/

const required =
Math.max(0,price - available);


const box =
document.createElement("div");

box.className = "task";


let image = "";


/*
Admin already saves image
as "image".
*/

if(task.image){

image = `
<img
class="taskImage"
src="${escapeAttribute(task.image)}"
alt="Task Image"
onerror="this.style.display='none'"
>
`;

}


let requirement = "";


if(required > 0){

requirement = `

<div class="required">

⚠️ Required Credits:
Rs ${required}

<br>

Available Credits:
Rs ${available}

<br><br>

The task cannot be completed until the required
internal credits are available.

</div>

`;

}else{

requirement = `

<div class="ready">

✅ Enough available credits for this task.

</div>

`;

}


box.innerHTML = `

${image}

<div class="taskName">

Task ${Number(task.order || "")}:
${escapeHtml(task.name || "Task")}

</div>

<div class="info">

💰 Task Price:
<b>Rs ${price}</b>

</div>

<div class="info">

💎 Commission:
<b>Rs ${taskCommission}</b>

</div>

${requirement}

<button
class="completeBtn"
id="btn-${id}"
${required > 0 ? "disabled" : ""}>

${
required > 0
?
"Insufficient Credits"
:
"Complete Task"
}

</button>

`;


tasksList.appendChild(box);


const button =
document.getElementById("btn-"+id);


if(required === 0){

button.onclick = async()=>{

await completeTask(
id,
task,
price,
taskCommission,
button
);

};

}

}


/* =========================
COMPLETE TASK
========================= */

async function completeTask(
taskId,
task,
price,
taskCommission,
button
){

button.disabled = true;

button.innerText =
"Processing...";


try{


/*
FINAL duplicate check
*/

const duplicateQuery =
query(
collection(db,"orders"),
where("uid","==",currentUser.uid),
where("taskId","==",taskId)
);

const duplicateSnap =
await getDocs(duplicateQuery);


if(!duplicateSnap.empty){

button.innerText =
"Completed ✅";

button.className =
"completedBtn";

await loadTasks();

await loadCompleted();

return;

}


/*
Reload latest user data
before completing.
*/

const userRef =
doc(db,"users",currentUser.uid);

const userSnap =
await getDoc(userRef);

if(!userSnap.exists()){

throw new Error("User account not found.");

}

const user =
userSnap.data();


let currentBalance =
Number(user.balance || 0);

let currentCommission =
Number(user.commission || 0);


const available =
currentBalance +
currentCommission;


if(available < price){

button.disabled = false;

button.innerText =
"Insufficient Credits";

return;

}


/*
USE BALANCE FIRST.
THEN COMMISSION.
*/

let remaining =
price;


if(currentBalance >= remaining){

currentBalance -= remaining;

remaining = 0;

}else{

remaining -= currentBalance;

currentBalance = 0;

}


if(remaining > 0){

currentCommission -= remaining;

remaining = 0;

}


/*
ONLY THE TASK REWARD IS ADDED.
*/

currentCommission +=
taskCommission;


/*
Completed count
*/

const completedQuery =
query(
collection(db,"orders"),
where("uid","==",currentUser.uid)
);

const completedSnap =
await getDocs(completedQuery);

let completedCount = 0;

completedSnap.forEach(item=>{

if(item.data().status === "Completed"){

completedCount++;

}

});


/*
Update user
*/

await updateDoc(
userRef,
{

balance:
currentBalance,

commission:
currentCommission,

completed:
completedCount + 1

}
);


/*
Save completed order
*/

await addDoc(
collection(db,"orders"),
{

uid:
currentUser.uid,

taskId:
taskId,

taskName:
task.name || "Task",

price:
price,

commission:
taskCommission,

status:
"Completed",

createdAt:
serverTimestamp()

}
);


/*
Update local display
*/

balance =
currentBalance;

commission =
currentCommission;

updateWallet();


button.innerText =
"Completed ✅";

button.className =
"completedBtn";


/*
Move task to completed section
*/

await loadTasks();

await loadCompleted();


}catch(error){

button.disabled = false;

button.innerText =
"Complete Task";

alert(
"Task Error: " +
error.message
);

}

}


/* =========================
COMPLETED
========================= */

async function loadCompleted(){

completedList.innerHTML =
"Loading Completed Tasks...";


const q =
query(
collection(db,"orders"),
where("uid","==",currentUser.uid)
);


const snap =
await getDocs(q);


completedList.innerHTML = "";


let count = 0;


snap.forEach(item=>{

const order =
item.data();


if(order.status !== "Completed"){

return;

}


count++;


const box =
document.createElement("div");

box.className =
"task";


box.innerHTML = `

<div class="taskName">

${escapeHtml(
order.taskName || "Task"
)}

</div>

<div class="info">

💰 Task Price:
<b>Rs ${Number(order.price || 0)}</b>

</div>

<div class="info">

💎 Commission:
<b>Rs ${Number(order.commission || 0)}</b>

</div>

<button
class="completedBtn"
disabled>

Completed ✅

</button>

`;


completedList.appendChild(box);

});


if(count === 0){

completedList.innerHTML = `

<div class="empty">

No completed tasks yet.

</div>

`;

}

}


/* =========================
ESCAPE
========================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}

</script>

</body>
</html>
