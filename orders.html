<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EliteTask Pro - Orders</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f8fa;
color:#172033;
padding-bottom:90px
}

.topbar{
height:65px;
background:linear-gradient(135deg,#063b46,#078d91);
display:flex;
align-items:center;
padding:0 15px;
color:white
}

.back{
color:white;
text-decoration:none;
font-size:25px;
margin-right:15px
}

.logo{
font-weight:bold;
font-size:18px
}

.container{
max-width:600px;
margin:auto;
padding:20px 15px
}

h1{
font-size:28px;
margin-bottom:5px
}

.subtitle{
color:#8992a2;
font-size:13px;
margin-bottom:18px
}

.balance{
background:linear-gradient(135deg,#07545d,#09a3a0);
color:white;
border-radius:20px;
padding:20px;
margin-bottom:18px
}

.balance small{
opacity:.8
}

.balance strong{
display:block;
font-size:32px;
margin-top:5px
}

.card{
background:white;
border-radius:22px;
padding:16px;
box-shadow:0 6px 20px rgba(0,0,0,.08)
}

.task-image{
width:100%;
height:300px;
object-fit:contain;
background:#f3f6f7;
border-radius:18px;
margin-bottom:15px
}

.task-name{
font-size:24px;
font-weight:bold;
margin-bottom:12px
}

.details{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.box{
background:#f7f9fa;
padding:14px;
border-radius:14px
}

.box small{
display:block;
color:#8992a2;
font-size:10px;
margin-bottom:5px
}

.box strong{
font-size:19px
}

.commission{
color:#15965a
}

.required{
margin-top:12px;
padding:14px;
background:#fff6e5;
border:1px solid #ffe1a6;
border-radius:14px
}

.required small{
display:block;
color:#9b7634
}

.required strong{
display:block;
color:#c47b00;
font-size:21px;
margin-top:4px
}

/* RATING */

.rating-box{
margin-top:15px;
padding:15px;
background:#f7f9fa;
border-radius:15px;
text-align:center
}

.rating-title{
font-size:14px;
font-weight:bold;
margin-bottom:10px
}

.stars{
display:flex;
justify-content:center;
gap:7px
}

.star{
font-size:34px;
color:#c9c9c9;
cursor:pointer;
line-height:1
}

.star.active{
color:#ffc107
}

.comment-box{
margin-top:12px
}

.comment-box textarea{
width:100%;
height:90px;
border:1px solid #dfe4e8;
border-radius:12px;
padding:12px;
font-family:Arial,sans-serif;
font-size:14px;
resize:none;
outline:none
}

button{
width:100%;
border:0;
border-radius:14px;
padding:15px;
margin-top:14px;
background:linear-gradient(135deg,#078d91,#0bb9b0);
color:white;
font-weight:bold;
font-size:15px
}

button:disabled{
background:#aaa
}

.message{
text-align:center;
background:white;
padding:35px 20px;
border-radius:20px;
color:#777
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -4px 15px rgba(0,0,0,.1)
}

.bottom a{
text-decoration:none;
color:#777;
font-size:11px;
text-align:center
}

.bottom span{
display:block;
font-size:20px;
margin-bottom:3px
}

.active{
color:#078d91!important;
font-weight:bold
}
</style>
</head>

<body>

<div class="topbar">

<a href="dashboard.html" class="back">
←
</a>

<div class="logo">
EliteTask Pro
</div>

</div>


<div class="container">

<h1>My Order</h1>

<p class="subtitle">
Complete your order and earn commission.
</p>


<div class="balance">

<small>Available Balance</small>

<strong id="balance">
$0.00
</strong>

</div>


<div id="loading" class="message">
Loading current order...
</div>


<div id="taskBox" class="card" style="display:none">

<img
id="taskImage"
class="task-image"
alt="Task"
>

<div
id="taskName"
class="task-name"
>
Task
</div>


<div class="details">

<div class="box">

<small>ORDER AMOUNT</small>

<strong id="taskPrice">
$0.00
</strong>

</div>


<div class="box commission">

<small>COMMISSION</small>

<strong id="taskCommission">
+$0.00
</strong>

</div>

</div>


<div class="required">

<small>
REQUIRED DEPOSIT
</small>

<strong id="required">
$0.00
</strong>

</div>


<!-- 5 STAR RATING -->

<div class="rating-box">

<div class="rating-title">
Rate this order
</div>

<div class="stars">

<span class="star" data-rating="1">★</span>
<span class="star" data-rating="2">★</span>
<span class="star" data-rating="3">★</span>
<span class="star" data-rating="4">★</span>
<span class="star" data-rating="5">★</span>

</div>

</div>


<!-- COMMENT -->

<div class="comment-box">

<textarea
id="orderComment"
placeholder="Write your comment..."
></textarea>

</div>


<button
id="completeBtn"
disabled
>
Complete Order
</button>

</div>


<div
id="noTask"
class="message"
style="display:none"
>

<div style="font-size:45px">
🎉
</div>

<h3 style="margin:10px 0">
All Tasks Completed
</h3>

<p>
No more tasks are available.
</p>

</div>

</div>


<div class="bottom">

<a href="dashboard.html">
<span>⌂</span>
Home
</a>

<a href="orders.html" class="active">
<span>▣</span>
Orders
</a>

<a href="support.html">
<span>💬</span>
Support
</a>

<a href="profile.html">
<span>👤</span>
Profile
</a>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
updateDoc,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

authDomain:
"elitetask-pro.firebaseapp.com",

projectId:
"elitetask-pro",

storageBucket:
"elitetask-pro.firebasestorage.app",

messagingSenderId:
"504295275402",

appId:
"1:504295275402:web:cf744a5d4e82c72145a673"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


let userId=null;

let currentTask=null;

let taskIndex=0;

let selectedRating=0;


/* =========================
   RATING
========================= */

const stars=
document.querySelectorAll(".star");

const commentInput=
document.getElementById("orderComment");

const completeBtn=
document.getElementById("completeBtn");


function checkSubmit(){

const comment=
commentInput.value.trim();

if(
selectedRating>0 &&
comment.length>0
){

completeBtn.disabled=false;

}else{

completeBtn.disabled=true;

}

}


stars.forEach(
star=>{

star.addEventListener(
"click",
()=>{

selectedRating=
Number(
star.dataset.rating
);


stars.forEach(
s=>{

const rating=
Number(
s.dataset.rating
);

if(
rating<=selectedRating
){

s.classList.add("active");

}else{

s.classList.remove("active");

}

});

checkSubmit();

});

});


commentInput.addEventListener(
"input",
checkSubmit
);


/* =========================
   LOGIN
========================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="index.html";

return;

}

userId=user.uid;

loadOrder();

});


/* =========================
   LOAD ORDER
========================= */

async function loadOrder(){

try{

const userSnap=
await getDoc(
doc(db,"users",userId)
);

if(!userSnap.exists()){

showNoTask();

return;

}


const user=
userSnap.data();


const balance=
Number(user.balance||0);

const commission=
Number(user.commission||0);


document
.getElementById("balance")
.textContent=
"$"+balance.toFixed(2);


taskIndex=
Number(
user.currentTaskIndex||0
);


const snap=
await getDocs(
collection(db,"tasks")
);


const tasks=[];


snap.forEach(d=>{

tasks.push({
id:d.id,
...d.data()
});

});


tasks.sort(
(a,b)=>
Number(a.order||0)-
Number(b.order||0)
);


if(
tasks.length===0 ||
taskIndex>=tasks.length
){

showNoTask();

return;

}


currentTask=
tasks[taskIndex];


const price=
Number(
currentTask.price||0
);


const earned=
Number(
currentTask.commission||0
);


/*
BALANCE + COMMISSION
DONO NEXT TASK KE LIYE USE HONGE
*/

const usable=
balance+commission;


const required=
Math.max(
price-usable,
0
);


document
.getElementById("loading")
.style.display="none";


document
.getElementById("taskBox")
.style.display="block";


document
.getElementById("taskName")
.textContent=
currentTask.name||"Task";


document
.getElementById("taskPrice")
.textContent=
"$"+price.toFixed(2);


document
.getElementById("taskCommission")
.textContent=
"+$"+earned.toFixed(2);


document
.getElementById("required")
.textContent=
"$"+required.toFixed(2);


const image=
document.getElementById("taskImage");


if(currentTask.image){

image.src=
currentTask.image;

image.style.display="block";

}else{

image.style.display="none";

}


}catch(error){

console.log(error);

document
.getElementById("loading")
.textContent=
"Unable to load order.";

}

}


/* =========================
   COMPLETE ORDER
========================= */

completeBtn.onclick=
async()=>{

if(!currentTask)
return;


/* RATING CHECK */

if(selectedRating===0){

alert(
"Please select a star rating."
);

return;

}


/* COMMENT CHECK */

const comment=
commentInput.value.trim();


if(!comment){

alert(
"Please write a comment."
);

return;

}


completeBtn.disabled=true;

completeBtn.textContent=
"Completing...";


try{

const userRef=
doc(db,"users",userId);


const userSnap=
await getDoc(userRef);


const user=
userSnap.data();


let balance=
Number(user.balance||0);

let commission=
Number(user.commission||0);


const price=
Number(
currentTask.price||0
);

const earned=
Number(
currentTask.commission||0
);


const usable=
balance+commission;


const required=
Math.max(
price-usable,
0
);


/*
AGAR BALANCE + COMMISSION
TASK KE LIYE KAFI NAHI
*/

if(required>0){

alert(
"Insufficient amount.\n\nRequired: $"+
required.toFixed(2)
);

completeBtn.disabled=false;

completeBtn.textContent=
"Complete Order";

return;

}


/*
PEHLE BALANCE USE HOGA
PHIR COMMISSION
*/

let newBalance=0;

let newCommission=0;


if(balance>=price){

newBalance=
balance-price;

newCommission=
commission;

}else{

const remaining=
price-balance;

newBalance=0;

newCommission=
commission-remaining;

}


/*
SIRF EARNED COMMISSION
COMMISSION BOX MEIN ADD
*/

newCommission+=
earned;


/*
TODAY'S COMMISSION
PURANI + NEW
*/

const oldTodayCommission=
Number(
user.todayCommission||0
);

const newTodayCommission=
oldTodayCommission+
earned;


const completed=
Number(
user.completedTasks||0
)+1;


const nextIndex=
taskIndex+1;


await updateDoc(
userRef,
{

balance:
newBalance,

commission:
newCommission,

todayCommission:
newTodayCommission,

completedTasks:
completed,

currentTaskIndex:
nextIndex

}
);


alert(
"Order completed successfully!"
);


location.reload();


}catch(error){

console.log(error);

alert(error.message);

completeBtn.disabled=false;

completeBtn.textContent=
"Complete Order";

}

};


/* =========================
   NO TASK
========================= */

function showNoTask(){

document
.getElementById("loading")
.style.display="none";

document
.getElementById("taskBox")
.style.display="none";

document
.getElementById("noTask")
.style.display="block";

}

</script>

</body>
</html>
