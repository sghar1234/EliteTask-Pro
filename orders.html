<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders - EliteTask Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

.order{
background:white;
margin-top:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.order h3{
color:#2563eb;
margin-bottom:12px;
}

.info{
margin:8px 0;
color:#555;
}

.btn{
width:100%;
border:none;
background:#2563eb;
color:white;
padding:14px;
border-radius:12px;
font-size:16px;
margin-top:15px;
}

.back{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#2563eb;
}

</style>

</head>

<body>

<div class="header">
📦 My Orders
</div>


<div class="order">

<h3>Order #001</h3>

<p class="info">👕 Product: Premium Shirt</p>

<p class="info">💰 Order Price: Rs 500</p>

<p class="info">⭐ Commission: Rs 50</p>

<button class="btn" onclick="completeTask()">
Complete Task
</button>

</div>


<a class="back" href="dashboard.html">
⬅ Back to Dashboard
</a>


<script>

function completeTask(){

alert("Task Completed Successfully! Commission Added.");

}

</script>

</html>
