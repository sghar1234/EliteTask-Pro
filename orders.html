```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;

}

.header{

box-shadow:0 3px 10px #ddd;
}

</style>

</head>


<body>


<div class="header">
📦 Available Tasks
</div>



<div class="wallet">

<div class="wallet-box">

<p>Balance</p>

<h2 id="balance">
Rs 0
</h2>

</div>


<div class="wallet-box">

<p>Commission</p>

<h2 id="commission">
Rs 0
</h2>

</div>

</div>



<div class="card">

<div id="tasksList">

Loading Tasks...

</div>

</div>



<a href="dashboard.html" class="back">
⬅ Back to Dashboard
</a>



<script type="module">


import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
collection,
query,
orderBy,
getDocs,
doc,
getDoc,
updateDoc,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const balanceBox =
document.getElementById("balance");

const commissionBox =
document.getElementById("commission");

const tasksList =
document.getElementById("tasksList");


let currentUser = null;

let userBalance = 0;

let userCommission = 0;



/* =========================
AUTH
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUser = user;

await loadUser();

await loadTasks();

});



/* =========================
LOAD USER
========================= */

async function loadUser(){

try{


const userRef =
doc(
db,
"users",
currentUser.uid
);


const snap =
await getDoc(userRef);


if(!snap.exists()){

tasksList.innerHTML = `
<div class="error">
User profile not found.
</div>
`;

return;

}


const data =
snap.data();


userBalance =
Number(data.balance || 0);


userCommission =
Number(data.commission || 0);


updateWallet();


}catch(error){

tasksList.innerHTML = `
<div class="error">
Firebase Error:
${escapeHtml(error.message)}
</div>
`;

}

}



/* =========================
WALLET DISPLAY
========================= */

function updateWallet(){

balanceBox.innerText =
"Rs " +
userBalance;


commissionBox.innerText =
"Rs " +
userCommission;

}



/* =========================
LOAD TASKS
========================= */

async function loadTasks(){


tasksList.innerHTML =
`
<div class="empty">
Loading Tasks...
</div>
`;


try{


const snap =
await getDocs(
collection(db,"tasks")
);


tasksList.innerHTML = "";


if(snap.empty){

tasksList.innerHTML =
`
<div class="empty">
No tasks available.
</div>
`;

return;

}


const tasks = [];


snap.forEach(
(item)=>{

tasks.push({

id:item.id,

data:item.data()

});

});


tasks.sort(
(a,b)=>
Number(
a.data.order || 0
)
-
Number(
b.data.order || 0
)
);


/* FIRST 10 TASKS */

const firstTen =
tasks.slice(0,10);


firstTen.forEach(
(item,index)=>{

renderTask(
item.id,
item.data,
index + 1
);

});


}catch(error){

tasksList.innerHTML =
`
<div class="error">

Firebase Error:
<br><br>

${escapeHtml(
error.message
)}

</div>
`;

}

}



/* =========================
RENDER TASK
========================= */

function renderTask(
taskId,
task,
number
){


const price =
Number(task.price || 0);


const taskCommission =
Number(
task.commission || 0
);


/* BOTH WALLETS CAN BE USED */

const available =
userBalance +
userCommission;


/* REQUIRED VIRTUAL CREDITS */

const required =
Math.max(
0,
price - available
);


const taskDiv =
document.createElement(
"div"
);


taskDiv.className =
"task";


let requirementHTML = "";


if(required > 0){

requirementHTML = `

<div class="required">

⚠️ Required Additional Credits:
Rs ${required}

</div>

`;

}else{

requirementHTML = `

<div class="ready">

✅ You have enough available credits for this task.

</div>

`;

}


taskDiv.innerHTML = `

<h3>
Task ${number}: ${escapeHtml(
task.name || "Task"
)}
</h3>

<p class="info">
💰 Task Amount:
<b>Rs ${price}</b>
</p>

<p class="info">
💵 Task Commission:
<b>Rs ${taskCommission}</b>
</p>

<p class="info">
💳 Balance Available:
<b>Rs ${userBalance}</b>
</p>

<p class="info">
💎 Commission Available:
<b>Rs ${userCommission}</b>
</p>

<p class="info">
📊 Total Available:
<b>Rs ${available}</b>
</p>

${requirementHTML}

<button
class="complete"
id="complete-${taskId}"
${required > 0 ? "disabled" : ""}>

${required > 0
?
"Insufficient Credits"
:
"Complete Task"
}

</button>

<div
id="status-${taskId}">
</div>

`;


tasksList.appendChild(
taskDiv
);


const button =
document.getElementById(
"complete-" + taskId
);


if(required === 0){

button.addEventListener(
"click",
()=>completeTask(
taskId,
task,
price,
taskCommission,
button
)
);

}

}



/* =========================
COMPLETE TASK
========================= */

async function completeTask(
taskId,
task,
price,
taskCommission,
button
){


if(!currentUser){

return;

}


button.disabled = true;

button.innerText =
"Completing...";


try{


/*
AVAILABLE MONEY

Balance + Commission
*/

const available =
userBalance +
userCommission;


if(
available < price
){

throw new Error(
"Not enough available credits."
);

}


/*
FIRST USE BALANCE.

IF BALANCE IS NOT ENOUGH,
USE COMMISSION FOR THE REMAINING PART.
*/

let remaining =
price;


let newBalance =
userBalance;


let newCommission =
userCommission;


/* USE BALANCE FIRST */

if(
newBalance >= remaining
){

newBalance =
newBalance -
remaining;

remaining = 0;

}else{

remaining =
remaining -
newBalance;

newBalance = 0;

}


/* USE COMMISSION FOR REMAINING */

if(
remaining > 0
){

newCommission =
newCommission -
remaining;

remaining = 0;

}


/*
TASK AMOUNT + EARNED COMMISSION
GO INTO COMMISSION WALLET.

*/

newCommission =
newCommission +
price +
taskCommission;


/* UPDATE USER */

const userRef =
doc(
db,
"users",
currentUser.uid
);


await updateDoc(
userRef,
{

balance:
newBalance,

commission:
newCommission

}
);


/* SAVE ORDER */

await addDoc(

collection(
db,
"orders"
),

{

uid:
currentUser.uid,

taskId:
taskId,

taskName:
task.name || "Task",

price:
price,

commission:
taskCommission,

status:
"Completed",

createdAt:
serverTimestamp()

}

);


/* UPDATE LOCAL VALUES */

userBalance =
newBalance;

userCommission =
newCommission;


updateWallet();


button.innerText =
"Completed ✅";


const status =
document.getElementById(
"status-" + taskId
);


status.className =
"status";


status.innerText =
"Task completed successfully ✅";


/*
RELOAD TASKS SO REQUIRED AMOUNT
UPDATES USING NEW WALLET VALUES.
*/

setTimeout(
loadTasks,
500
);


}catch(error){


button.disabled =
false;

button.innerText =
"Complete Task";


alert(
"Task Error: " +
error.message
);

}

}



/* =========================
ESCAPE HTML
========================= */

function escapeHtml(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>


</body>

</html>
