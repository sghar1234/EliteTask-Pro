<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Orders</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f8fa;
    color:#172033;
    padding-bottom:90px;
}

.topbar{
    height:70px;
    background:linear-gradient(135deg,#063b46,#078d91);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    color:white;
    box-shadow:0 4px 18px rgba(0,0,0,.13);
}

.back-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:22px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    background:linear-gradient(135deg,#39d6d0,#8cf5e7);
    color:#07535a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.logo-text{
    font-size:16px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:auto;
    padding:18px 15px;
}

.page-title{
    margin:5px 2px 18px;
}

.page-title h2{
    font-size:22px;
}

.page-title p{
    color:#8992a2;
    font-size:13px;
    margin-top:5px;
}

/* BALANCE */

.balance-mini{
    background:linear-gradient(135deg,#07545d,#09a3a0);
    color:white;
    border-radius:21px;
    padding:19px;
    margin-bottom:18px;
    box-shadow:0 10px 25px rgba(5,130,132,.2);
    position:relative;
    overflow:hidden;
}

.balance-mini:after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    right:-35px;
    top:-55px;
}

.balance-mini span{
    font-size:11px;
    opacity:.75;
    position:relative;
    z-index:2;
}

.balance-mini strong{
    display:block;
    font-size:27px;
    margin-top:6px;
    position:relative;
    z-index:2;
}

/* TASK CARD */

.task-card{
    background:white;
    border-radius:21px;
    padding:15px;
    margin-bottom:13px;
    box-shadow:0 5px 20px rgba(20,40,80,.07);
    border:1px solid #edf1f3;
}

.task-top{
    display:flex;
    gap:13px;
    align-items:center;
}

.task-image{
    width:68px;
    height:68px;
    border-radius:17px;
    object-fit:cover;
    background:#eafafa;
    flex-shrink:0;
}

.task-placeholder{
    width:68px;
    height:68px;
    border-radius:17px;
    background:linear-gradient(135deg,#e7faf9,#d8f3f1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    flex-shrink:0;
}

.task-name{
    font-size:15px;
    font-weight:bold;
}

.task-price{
    margin-top:6px;
    font-size:12px;
    color:#7d8796;
}

.task-price strong{
    color:#078d91;
}

.task-bottom{
    border-top:1px solid #edf0f5;
    margin-top:14px;
    padding-top:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.reward{
    font-size:11px;
    color:#8992a2;
}

.reward strong{
    display:block;
    color:#16a05d;
    font-size:15px;
    margin-top:3px;
}

.start-btn{
    border:none;
    background:linear-gradient(135deg,#078d91,#0bb9b0);
    color:white;
    padding:11px 18px;
    border-radius:12px;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
}

.start-btn:active{
    transform:scale(.97);
}

.empty{
    background:white;
    border-radius:20px;
    padding:35px 20px;
    text-align:center;
    color:#8992a2;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#8992a2;
    font-size:13px;
}

/* ORDER POPUP */

.popup-overlay{
    position:fixed;
    inset:0;
    background:rgba(4,28,34,.58);
    backdrop-filter:blur(5px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:3000;
}

.popup-overlay.show{
    display:flex;
}

.order-popup{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:27px 27px 0 0;
    padding:22px 18px 29px;
    animation:popupUp .25s ease;
}

@keyframes popupUp{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.popup-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.popup-head h3{
    font-size:19px;
}

.close-popup{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#f0f3f4;
    color:#56636a;
    font-size:20px;
    cursor:pointer;
}

.popup-product{
    display:flex;
    align-items:center;
    gap:13px;
    background:#f6f9fa;
    padding:13px;
    border-radius:18px;
    margin-bottom:15px;
}

.popup-product img{
    width:70px;
    height:70px;
    border-radius:15px;
    object-fit:cover;
}

.popup-placeholder{
    width:70px;
    height:70px;
    border-radius:15px;
    background:#e5f7f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.popup-product h4{
    font-size:15px;
    margin-bottom:6px;
}

.popup-product p{
    font-size:11px;
    color:#89939a;
}

.popup-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
}

.detail-box{
    background:#f7f9fa;
    padding:14px;
    border-radius:16px;
}

.detail-box span{
    display:block;
    color:#89939a;
    font-size:10px;
    margin-bottom:6px;
}

.detail-box strong{
    font-size:17px;
}

.detail-box.commission strong{
    color:#16a05d;
}

.popup-start{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px;
    background:linear-gradient(135deg,#078d91,#0bb9b0);
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.popup-start:active{
    transform:scale(.98);
}

/* BOTTOM */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:73px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 25px rgba(0,0,0,.10);
    z-index:1000;
    border-top:1px solid #edf0f5;
}

.nav-item{
    text-decoration:none;
    color:#8992a2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:25%;
    font-size:10px;
}

.nav-item span{
    font-size:21px;
}

.nav-item.active{
    color:#078d91;
    font-weight:bold;
}

.nav-center{
    width:55px;
    height:55px;
    margin-top:-25px;
    border-radius:50%;
    background:linear-gradient(135deg,#078d91,#20c7c0);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 8px 20px rgba(7,141,145,.35);
    border:5px solid #f5f8fa;
}

@media(max-width:380px){
    .container{
        padding:15px 12px;
    }

    .logo-text{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

    <a href="dashboard.html" class="back-btn">
        ←
    </a>

    <div class="logo-area">

        <div class="logo">
            ET
        </div>

        <div class="logo-text">
            EliteTask Pro
        </div>

    </div>

</div>


<div class="container">

    <div class="page-title">

        <h2>
            Available Orders
        </h2>

        <p>
            Select an order and earn your commission.
        </p>

    </div>


    <!-- BALANCE -->

    <div class="balance-mini">

        <span>
            Available Balance
        </span>

        <strong id="balance">
            $0.00
        </strong>

    </div>


    <!-- TASKS -->

    <div id="taskList">

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>


<!-- ORDER POPUP -->

<div
    class="popup-overlay"
    id="orderPopup"
>

    <div class="order-popup">

        <div class="popup-head">

            <h3>
                Order Details
            </h3>

            <button
                class="close-popup"
                id="closePopup"
            >
                ×
            </button>

        </div>


        <div class="popup-product">

            <div id="popupImage">
                <div class="popup-placeholder">
                    🛍️
                </div>
            </div>

            <div>

                <h4 id="popupName">
                    Product Task
                </h4>

                <p>
                    Order is ready to start
                </p>

            </div>

        </div>


        <div class="popup-details">

            <div class="detail-box">

                <span>
                    Total Order
                </span>

                <strong id="popupPrice">
                    $0.00
                </strong>

            </div>


            <div class="detail-box commission">

                <span>
                    Commission
                </span>

                <strong id="popupCommission">
                    +$0.00
                </strong>

            </div>

        </div>


        <button
            class="popup-start"
            id="popupStart"
        >
            Start Order
        </button>

    </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item"
    >
        <span>⌂</span>
        Home
    </a>


    <a
        href="orders.html"
        class="nav-item active"
    >
        <span>▣</span>
        Orders
    </a>


    <a
        href="support.html"
        class="nav-item"
    >

        <div class="nav-center">
            💬
        </div>

        Support

    </a>


    <a
        href="profile.html"
        class="nav-item"
    >
        <span>👤</span>
        Profile
    </a>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain: "elitetask-pro.firebaseapp.com",

    projectId: "elitetask-pro",

    storageBucket: "elitetask-pro.firebasestorage.app",

    messagingSenderId: "504295275402",

    appId: "1:504295275402:web:8c480445c5510fa645a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* SELECTED TASK */

let selectedTaskId = "";


/* LOGIN */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        await loadBalance(user.uid);

        await loadTasks();

    }
);


/* BALANCE */

async function loadBalance(uid){

    try{

        const ref =
            doc(
                db,
                "users",
                uid
            );

        const snap =
            await getDoc(ref);


        if(snap.exists()){

            const data =
                snap.data();

            const balance =
                Number(
                    data.balance || 0
                );

            document
                .getElementById("balance")
                .textContent =
                "$" + balance.toFixed(2);

        }

    }

    catch(error){

        console.error(
            "Balance error:",
            error
        );

    }

}


/* TASKS */

async function loadTasks(){

    const list =
        document.getElementById(
            "taskList"
        );


    try{

        const ref =
            collection(
                db,
                "tasks"
            );

        const snapshot =
            await getDocs(ref);


        list.innerHTML = "";


        if(snapshot.empty){

            list.innerHTML = `

                <div class="empty">

                    📦

                    <br>
                    <br>

                    No tasks available right now.

                </div>

            `;

            return;

        }


        snapshot.forEach(
            (taskDoc) => {

                const task =
                    taskDoc.data();


                const taskId =
                    taskDoc.id;


                const name =
                    task.name ||
                    "Product Task";


                const price =
                    Number(
                        task.price || 0
                    );


                const commission =
                    Number(
                        task.commission || 0
                    );


                const image =
                    task.image ||
                    "";


                let imageHTML;


                if(image){

                    imageHTML = `

                        <img
                            src="${image}"
                            class="task-image"
                            alt="Product"
                        >

                    `;

                }

                else{

                    imageHTML = `

                        <div
                            class="task-placeholder"
                        >
                            🛍️
                        </div>

                    `;

                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "task-card";


                card.innerHTML = `

                    <div class="task-top">

                        ${imageHTML}

                        <div>

                            <div class="task-name">
                                ${name}
                            </div>

                            <div class="task-price">

                                Total Order:

                                <strong>
                                    $${price.toFixed(2)}
                                </strong>

                            </div>

                        </div>

                    </div>


                    <div class="task-bottom">

                        <div class="reward">

                            Commission

                            <strong>
                                +$${commission.toFixed(2)}
                            </strong>

                        </div>


                        <button
                            class="start-btn"
                        >
                            View Order
                        </button>

                    </div>

                `;


                card
                    .querySelector(
                        ".start-btn"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            openPopup(
                                taskId,
                                name,
                                price,
                                commission,
                                image
                            );

                        }
                    );


                list.appendChild(
                    card
                );

            }
        );

    }

    catch(error){

        console.error(
            "Task error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                Unable to load tasks.

            </div>

        `;

    }

}


/* OPEN POPUP */

function openPopup(
    taskId,
    name,
    price,
    commission,
    image
){

    selectedTaskId =
        taskId;


    document
        .getElementById("popupName")
        .textContent =
        name;


    document
        .getElementById("popupPrice")
        .textContent =
        "$" + price.toFixed(2);


    document
        .getElementById("popupCommission")
        .textContent =
        "+$" + commission.toFixed(2);


    const imageBox =
        document.getElementById(
            "popupImage"
        );


    if(image){

        imageBox.innerHTML = `

            <img
                src="${image}"
                alt="Product"
            >

        `;

    }

    else{

        imageBox.innerHTML = `

            <div class="popup-placeholder">
                🛍️
            </div>

        `;

    }


    document
        .getElementById("orderPopup")
        .classList
        .add("show");

}


/* CLOSE POPUP */

function closePopup(){

    document
        .getElementById("orderPopup")
        .classList
        .remove("show");

}


document
    .getElementById("closePopup")
    .addEventListener(
        "click",
        closePopup
    );


document
    .getElementById("orderPopup")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closePopup();

            }

        }
    );


/* START ORDER */

document
    .getElementById("popupStart")
    .addEventListener(
        "click",
        function(){

            if(!selectedTaskId){
                return;
            }

            window.location.href =
                "orders.html?task=" +
                selectedTaskId;

        }
    );

</script>

</body>
</html>
