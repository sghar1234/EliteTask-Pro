<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:21px;
font-weight:bold;
}

.wallet{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.wallet-box{
background:white;
padding:15px;
border-radius:13px;
box-shadow:0 3px 10px #ddd;
}

.wallet-box p{
font-size:13px;
color:#666;
}

.wallet-box h2{
margin-top:6px;
color:#2563eb;
}

.card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.section-title{
font-size:19px;
font-weight:bold;
color:#111827;
margin-bottom:12px;
}

.task{
border-bottom:1px solid #eee;
padding-bottom:18px;
margin-bottom:18px;
}

.task:last-child{
border-bottom:none;
margin-bottom:0;
padding-bottom:0;
}

.task-image{
width:100%;
height:190px;
object-fit:cover;
border-radius:12px;
margin-bottom:14px;
display:block;
}

.task h3{
color:#2563eb;
margin-bottom:10px;
}

.info{
margin-top:7px;
color:#555;
font-size:15px;
}

.required{
margin-top:12px;
padding:12px;
border-radius:10px;
background:#fff7ed;
color:#c2410c;
font-weight:bold;
}

.ready{
margin-top:12px;
padding:12px;
border-radius:10px;
background:#dcfce7;
color:#166534;
font-weight:bold;
}

.complete{
width:100%;
border:none;
background:#2563eb;
color:white;
padding:13px;
border-radius:10px;
font-size:15px;
font-weight:bold;
margin-top:12px;
}

.completed-btn{
width:100%;
border:none;
background:#16a34a;
color:white;
padding:13px;
border-radius:10px;
font-size:15px;
font-weight:bold;
margin-top:12px;
}

.complete:disabled{
background:#9ca3af;
}

.completed-box{
background:#dcfce7;
color:#166534;
padding:12px;
border-radius:10px;
margin-top:12px;
font-weight:bold;
}

.empty{
text-align:center;
color:#777;
padding:25px;
}

.error{
background:#fee2e2;
color:#b91c1c;
padding:14px;
border-radius:10px;
margin-top:10px;
word-break:break-word;
}

.back{
display:block;
margin-top:20px;
background:#2563eb;
color:white;
text-decoration:none;
text-align:center;
padding:14px;
border-radius:12px;
}

</style>

</head>


<body>


<div class="header">
📦 My Tasks
</div>



<div class="wallet">

<div class="wallet-box">

<p>Balance</p>

<h2 id="balance">
Rs 0
</h2>

</div>


<div class="wallet-box">

<p>Commission</p>

<h2 id="commission">
Rs 0
</h2>

</div>

</div>



<!-- AVAILABLE TASKS -->

<div class="card">

<div class="section-title">
📦 Available Tasks
</div>

<div id="tasksList">

Loading Tasks...

</div>

</div>



<!-- COMPLETED TASKS -->

<div class="card">

<div class="section-title">
✅ Completed Tasks
</div>

<div id="completedList">

Loading Completed Tasks...

</div>

</div>



<a href="dashboard.html" class="back">
⬅ Back to Dashboard
</a>



<script type="module">


import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
collection,
query,
where,
getDocs,
doc,
getDoc,
updateDoc,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const balanceBox =
document.getElementById("balance");

const commissionBox =
document.getElementById("commission");

const tasksList =
document.getElementById("tasksList");

const completedList =
document.getElementById("completedList");


let currentUser = null;

let userBalance = 0;

let userCommission = 0;



/* =========================
AUTH
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


currentUser = user;

await loadUser();

await loadTasks();

await loadCompleted();

});



/* =========================
LOAD USER
========================= */

async function loadUser(){

const userRef =
doc(
db,
"users",
currentUser.uid
);


const snap =
await getDoc(userRef);


if(!snap.exists()){

throw new Error(
"User profile not found."
);

}


const data =
snap.data();


userBalance =
Number(
data.balance || 0
);


userCommission =
Number(
data.commission || 0
);


updateWallet();

}



/* =========================
UPDATE WALLET
========================= */

function updateWallet(){

balanceBox.innerText =
"Rs " +
userBalance;

commissionBox.innerText =
"Rs " +
userCommission;

}



/* =========================
LOAD AVAILABLE TASKS
========================= */

async function loadTasks(){

tasksList.innerHTML =
"Loading Tasks...";


try{


const snapshot =
await getDocs(
collection(
db,
"tasks"
)
);


tasksList.innerHTML = "";


if(snapshot.empty){

tasksList.innerHTML = `

<div class="empty">

No tasks available.

</div>

`;

return;

}


const tasks = [];


snapshot.forEach(
(item)=>{

tasks.push({

id:item.id,

data:item.data()

});

});


tasks.sort(
(a,b)=>
Number(
a.data.order || 0
)
-
Number(
b.data.order || 0
)
);



/*
GET ALREADY COMPLETED TASK IDs
*/

const completedQuery =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUser.uid
)

);


const completedSnapshot =
await getDocs(
completedQuery
);


const completedIds =
new Set();


completedSnapshot.forEach(
(item)=>{

const data =
item.data();

if(
data.status === "Completed"
){

completedIds.add(
data.taskId
);

}

});



tasks.forEach(
(item,index)=>{


/*
Don't show completed tasks
in available section.
*/

if(
completedIds.has(
item.id
)
){

return;

}


renderTask(
item.id,
item.data,
index + 1
);

});


if(
tasksList.innerHTML.trim() === ""
){

tasksList.innerHTML = `

<div class="empty">

🎉 All available tasks are completed.

</div>

`;

}


}catch(error){

tasksList.innerHTML = `

<div class="error">

Firebase Error:<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}



/* =========================
RENDER TASK
========================= */

function renderTask(
taskId,
task,
number
){


const price =
Number(
task.price || 0
);


const taskCommission =
Number(
task.commission || 0
);


const available =
userBalance +
userCommission;


const required =
Math.max(
0,
price - available
);


const taskDiv =
document.createElement(
"div"
);


taskDiv.className =
"task";



/*
TASK IMAGE
*/

let imageHTML = "";


if(task.image){

imageHTML = `

<img
class="task-image"
src="${escapeAttribute(
task.image
)}"
alt="Task Image"
onerror="this.style.display='none'"
>

`;

}



/*
REQUIRED MESSAGE
*/

let requirementHTML = "";


if(required > 0){

requirementHTML = `

<div class="required">

⚠️ Additional Virtual Credits Required:
Rs ${required}

</div>

`;

}else{

requirementHTML = `

<div class="ready">

✅ You have enough available credits for this task.

</div>

`;

}



taskDiv.innerHTML = `

${imageHTML}

<h3>
Task ${number}:
${escapeHtml(
task.name || "Task"
)}
</h3>

<p class="info">

💰 Task Price:
<b>Rs ${price}</b>

</p>

<p class="info">

💎 Commission:
<b>Rs ${taskCommission}</b>

</p>

${requirementHTML}

<button
class="complete"
id="complete-${taskId}"
${required > 0 ? "disabled" : ""}>

${required > 0
?
"Insufficient Credits"
:
"Complete Task"
}

</button>

`;


tasksList.appendChild(
taskDiv
);



const button =
document.getElementById(
"complete-" + taskId
);


if(required === 0){

button.addEventListener(
"click",
()=>completeTask(
taskId,
task,
price,
taskCommission,
button
)
);

}

}



/* =========================
COMPLETE TASK
========================= */

async function completeTask(
taskId,
task,
price,
taskCommission,
button
){


if(!currentUser){

return;

}


button.disabled = true;

button.innerText =
"Checking...";


try{


/*
IMPORTANT:
CHECK FIRST IF THIS TASK
IS ALREADY COMPLETED.
*/

const existingQuery =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUser.uid
),

where(
"taskId",
"==",
taskId
)

);


const existingSnapshot =
await getDocs(
existingQuery
);


if(
!existingSnapshot.empty
){

button.innerText =
"Completed ✅";

button.className =
"completed-btn";

await loadTasks();

await loadCompleted();

return;

}



/*
AVAILABLE CREDITS
*/

const available =
userBalance +
userCommission;


if(
available < price
){

button.disabled = false;

button.innerText =
"Insufficient Credits";

return;

}


/*
USE BALANCE FIRST.
THEN COMMISSION.
*/

let remaining =
price;

let newBalance =
userBalance;

let newCommission =
userCommission;



if(
newBalance >= remaining
){

newBalance =
newBalance -
remaining;

remaining = 0;

}else{

remaining =
remaining -
newBalance;

newBalance = 0;

}



if(
remaining > 0
){

newCommission =
newCommission -
remaining;

remaining = 0;

}



/*
TASK PRICE + TASK COMMISSION
GO INTO COMMISSION.

THIS HAPPENS ONLY ONCE.
*/

newCommission =
newCommission +
price +
taskCommission;



/*
UPDATE USER
*/

const userRef =
doc(
db,
"users",
currentUser.uid
);


await updateDoc(
userRef,
{

balance:
newBalance,

commission:
newCommission,

completed:
(await getCompletedCount()) + 1

}
);



/*
SAVE ORDER
*/

await addDoc(

collection(
db,
"orders"
),

{

uid:
currentUser.uid,

taskId:
taskId,

taskName:
task.name || "Task",

price:
price,

commission:
taskCommission,

status:
"Completed",

createdAt:
serverTimestamp()

}

);



/*
UPDATE LOCAL VALUES
*/

userBalance =
newBalance;

userCommission =
newCommission;


updateWallet();



button.innerText =
"Completed ✅";

button.className =
"completed-btn";



/*
RELOAD BOTH SECTIONS
*/

await loadTasks();

await loadCompleted();


}catch(error){

button.disabled = false;

button.innerText =
"Complete Task";

alert(
"Task Error: " +
error.message
);

}

}



/* =========================
COMPLETED TASKS
========================= */

async function loadCompleted(){

completedList.innerHTML =
"Loading Completed Tasks...";


try{


const q =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);


completedList.innerHTML = "";


if(snapshot.empty){

completedList.innerHTML = `

<div class="empty">

No completed tasks yet.

</div>

`;

return;

}



snapshot.forEach(
(item)=>{


const order =
item.data();


const box =
document.createElement(
"div"
);


box.className =
"task";


box.innerHTML = `

<h3>

${escapeHtml(
order.taskName || "Task"
)}

</h3>

<p class="info">

💰 Task Price:
<b>Rs ${Number(
order.price || 0
)}</b>

</p>

<p class="info">

💎 Commission:
<b>Rs ${Number(
order.commission || 0
)}</b>

</p>

<div class="completed-box">

✅ Task Completed

</div>

`;


completedList.appendChild(
box
);

});



}catch(error){

completedList.innerHTML = `

<div class="error">

Unable to load completed tasks.

</div>

`;

}

}



/* =========================
COUNT COMPLETED
========================= */

async function getCompletedCount(){

const q =
query(

collection(
db,
"orders"
),

where(
"uid",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);


let count = 0;


snapshot.forEach(
(item)=>{

if(
item.data().status ===
"Completed"
){

count++;

}

});


return count;

}



/* =========================
ESCAPE HTML
========================= */

function escapeHtml(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}



/* =========================
ESCAPE ATTRIBUTE
========================= */

function escapeAttribute(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
);

}

</script>


</body>

</html>
