<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:21px;
font-weight:bold;
}

.card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.order{
border-bottom:1px solid #eee;
padding-bottom:15px;
margin-bottom:15px;
}

.order:last-child{
border-bottom:none;
margin-bottom:0;
}

.order h3{
color:#2563eb;
margin-bottom:8px;
}

.info{
margin-top:7px;
color:#555;
font-size:14px;
}

.status{
display:inline-block;
margin-top:10px;
padding:6px 10px;
border-radius:20px;
background:#dcfce7;
color:#166534;
font-size:13px;
font-weight:bold;
}

.empty{
text-align:center;
color:#777;
padding:20px;
}

.back{
display:block;
margin-top:20px;
background:#2563eb;
color:white;
text-decoration:none;
text-align:center;
padding:14px;
border-radius:12px;
}

</style>

</head>


<body>


<div class="header">
📦 My Orders
</div>



<div class="card">

<div id="ordersList">

Loading Orders...

</div>

</div>



<a href="dashboard.html" class="back">
⬅ Back to Dashboard
</a>



<script type="module">

import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const ordersList =
document.getElementById("ordersList");



onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="index.html";

return;

}


try{


const q =
query(
collection(db,"orders"),
where("uid","==",user.uid)
);


const snapshot =
await getDocs(q);


ordersList.innerHTML="";


if(snapshot.empty){

ordersList.innerHTML=`

<div class="empty">

No completed orders yet.

</div>

`;

return;

}


snapshot.forEach((item)=>{


const order =
item.data();


ordersList.innerHTML += `

<div class="order">

<h3>
${order.taskName || "Task"}
</h3>

<p class="info">
Task Price: Rs ${Number(order.price || 0)}
</p>

<p class="info">
Commission: Rs ${Number(order.commission || 0)}
</p>

<p class="info">
Status: ${order.status || "Completed"}
</p>

<span class="status">
${order.status || "Completed"}
</span>

</div>

`;

});


}catch(error){

ordersList.innerHTML=`

<div class="empty">

Error loading orders.

</div>

`;

}

});

</script>


</body>

</html>
