<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks - EliteTask Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.header{
background:#111827;
color:white;
padding:20px;
border-radius:16px;
font-size:23px;
font-weight:bold;
}

.wallet{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.walletBox{
background:white;
padding:17px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.walletBox p{
color:#666;
font-size:14px;
}

.walletBox h2{
color:#2563eb;
margin-top:7px;
font-size:25px;
}

.card{
background:white;
padding:18px;
border-radius:16px;
margin-top:15px;
box-shadow:0 3px 10px #ddd;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

.task{
padding-bottom:20px;
margin-bottom:20px;
border-bottom:1px solid #eee;
}

.task:last-child{
border-bottom:none;
margin-bottom:0;
}

.taskImage{
width:100%;
height:190px;
object-fit:cover;
border-radius:13px;
display:block;
margin-bottom:14px;
}

.taskName{
font-size:20px;
font-weight:bold;
color:#2563eb;
margin-bottom:12px;
}

.info{
font-size:16px;
color:#555;
margin-top:9px;
}

.info b{
color:#111827;
}

.required{
margin-top:15px;
padding:15px;
border-radius:12px;
background:#fff7ed;
color:#c2410c;
font-weight:bold;
line-height:1.6;
}

.ready{
margin-top:15px;
padding:15px;
border-radius:12px;
background:#dcfce7;
color:#166534;
font-weight:bold;
}

.completeBtn{
width:100%;
border:0;
background:#2563eb;
color:white;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:bold;
margin-top:13px;
}

.completeBtn:disabled{
background:#9ca3af;
}

.completedBtn{
width:100%;
border:0;
background:#16a34a;
color:white;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:bold;
margin-top:13px;
}

.empty{
text-align:center;
padding:25px;
color:#777;
}

.error{
background:#fee2e2;
color:#b91c1c;
padding:15px;
border-radius:12px;
word-break:break-word;
}

.back{
display:block;
margin-top:20px;
background:#2563eb;
color:white;
text-decoration:none;
text-align:center;
padding:15px;
border-radius:12px;
font-size:16px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
📦 Available Tasks
</div>

<div class="wallet">

<div class="walletBox">
<p>Balance</p>
<h2 id="balance">Rs 0</h2>
</div>

<div class="walletBox">
<p>Commission</p>
<h2 id="commission">Rs 0</h2>
</div>

</div>

<div class="card">

<div class="title">
📦 Available Tasks
</div>

<div id="tasksList">
Loading Tasks...
</div>

</div>

<div class="card">

<div class="title">
✅ Completed Tasks
</div>

<div id="completedList">
Loading Completed Tasks...
</div>

</div>

<a href="dashboard.html" class="back">
← Back to Dashboard
</a>

<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
collection,
getDocs,
getDoc,
doc,
query,
where,
updateDoc,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const balanceEl =
document.getElementById("balance");

const commissionEl =
document.getElementById("commission");

const tasksList =
document.getElementById("tasksList");

const completedList =
document.getElementById("completedList");


let currentUser = null;


/* =========================
AUTH
========================= */

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="index.html";
return;

}

currentUser=user;

try{

await loadAll();

}catch(error){

tasksList.innerHTML=`
<div class="error">
${escapeHtml(error.message)}
</div>
`;

}

});


/* =========================
LOAD EVERYTHING
========================= */

async function loadAll(){

const userRef=
doc(db,"users",currentUser.uid);

const userSnap=
await getDoc(userRef);

if(!userSnap.exists()){

throw new Error("User account not found.");

}

const user=
userSnap.data();

const balance=
Number(user.balance || 0);

const commission=
Number(user.commission || 0);

balanceEl.innerText=
"Rs "+balance;

commissionEl.innerText=
"Rs "+commission;


/* Completed orders */

const orderQuery=
query(
collection(db,"orders"),
where("uid","==",currentUser.uid)
);

const orderSnap=
await getDocs(orderQuery);

const completedIds=new Set();

orderSnap.forEach(item=>{

const data=item.data();

if(data.status==="Completed"){

completedIds.add(data.taskId);

}

});


/* Tasks */

const taskSnap=
await getDocs(
collection(db,"tasks")
);

const tasks=[];

taskSnap.forEach(item=>{

tasks.push({
id:item.id,
data:item.data()
});

});


tasks.sort((a,b)=>
Number(a.data.order || 0)-
Number(b.data.order || 0)
);


/* Available */

tasksList.innerHTML="";

let availableCount=0;

tasks.forEach(item=>{

if(completedIds.has(item.id)){

return;

}

renderTask(
item.id,
item.data,
balance,
commission
);

availableCount++;

});


if(availableCount===0){

tasksList.innerHTML=`
<div class="empty">
🎉 All available tasks are completed.
</div>
`;

}


/* Completed */

completedList.innerHTML="";

let completedCount=0;

orderSnap.forEach(item=>{

const order=item.data();

if(order.status!=="Completed"){

return;

}

completedCount++;

const box=
document.createElement("div");

box.className="task";

box.innerHTML=`

<div class="taskName">
${escapeHtml(order.taskName || "Task")}
</div>

<div class="info">
💰 Task Price:
<b>Rs ${Number(order.price || 0)}</b>
</div>

<div class="info">
💎 Commission:
<b>Rs ${Number(order.commission || 0)}</b>
</div>

<button class="completedBtn" disabled>
Completed ✅
</button>

`;

completedList.appendChild(box);

});


if(completedCount===0){

completedList.innerHTML=`
<div class="empty">
No completed tasks yet.
</div>
`;

}

}


/* =========================
TASK CARD
========================= */

function renderTask(
id,
task,
balance,
commission
){

const price=
Number(task.price || 0);

const taskCommission=
Number(task.commission || 0);


/*
IMPORTANT:
Balance + Commission
both count for next task.
*/

const available=
balance+commission;

const required=
Math.max(0,price-available);


const box=
document.createElement("div");

box.className="task";


let image="";

if(task.image){

image=`
<img
class="taskImage"
src="${escapeAttribute(task.image)}"
alt="Task Image"
onerror="this.style.display='none'"
>
`;

}


let requirement="";

if(required>0){

requirement=`

<div class="required">

⚠️ Required Deposit:
<b>Rs ${required}</b>

<br>

Available:
<b>Rs ${available}</b>

</div>

`;

}else{

requirement=`

<div class="ready">

✅ You have enough available amount for this task.

<br><br>

Available:
Rs ${available}

</div>

`;

}


box.innerHTML=`

${image}

<div class="taskName">

Task ${Number(task.order || "")}:
${escapeHtml(task.name || "Task")}

</div>

<div class="info">

💰 Task Price:
<b>Rs ${price}</b>

</div>

<div class="info">

💎 Commission:
<b>Rs ${taskCommission}</b>

</div>

${requirement}

<button
class="completeBtn"
id="complete-${id}"
${required>0 ? "disabled":""}>

${required>0 ?
"Insufficient Amount":
"Complete Task"}

</button>

`;


tasksList.appendChild(box);


const button=
document.getElementById(
"complete-"+id
);


if(required===0){

button.onclick=async()=>{

await completeTask(
id,
task,
price,
taskCommission,
button
);

};

}

}


/* =========================
COMPLETE TASK
========================= */

async function completeTask(
taskId,
task,
price,
taskCommission,
button
){

button.disabled=true;

button.innerText=
"Processing...";


try{


/*
Check duplicate
*/

const duplicateQuery=
query(
collection(db,"orders"),
where("uid","==",currentUser.uid),
where("taskId","==",taskId)
);

const duplicateSnap=
await getDocs(duplicateQuery);

if(!duplicateSnap.empty){

button.innerText=
"Completed ✅";

button.className=
"completedBtn";

await loadAll();

return;

}


/*
Latest user balance
*/

const userRef=
doc(db,"users",currentUser.uid);

const userSnap=
await getDoc(userRef);

if(!userSnap.exists()){

throw new Error(
"User account not found."
);

}

const user=
userSnap.data();


let oldBalance=
Number(user.balance || 0);

let oldCommission=
Number(user.commission || 0);


/*
Total available
*/

const available=
oldBalance+oldCommission;


if(available<price){

throw new Error(
"Insufficient amount for this task."
);

}


/*
================================
IMPORTANT RULE
================================

Task price is transferred
into Commission.

We first deduct task price
from Balance.

If Balance is not enough,
remaining amount is deducted
from Commission.

Then the FULL task price is
added to Commission again,
along with the new commission.

Example:

Balance 100
Task 100
Commission 20

After task:

Balance 0
Commission 140

Wait:
If old Commission was 20,
then task price 100 + old 20
+ new commission 20
= 140.

For your example where old
Commission is 0:

Balance 0
Commission 120.
================================
*/


let remainingPrice=price;


/*
Take from Balance first
*/

const balanceUsed=
Math.min(oldBalance,remainingPrice);

oldBalance=
oldBalance-balanceUsed;

remainingPrice=
remainingPrice-balanceUsed;


/*
If needed, take remaining
from Commission.
*/

const commissionUsed=
remainingPrice;

oldCommission=
oldCommission-commissionUsed;


/*
Now transfer the task price
to Commission and add reward.
*/

const newCommission=
oldCommission+
price+
taskCommission;


/*
Completed count
*/

const countQuery=
query(
collection(db,"orders"),
where("uid","==",currentUser.uid)
);

const countSnap=
await getDocs(countQuery);

let completed=0;

countSnap.forEach(item=>{

if(item.data().status==="Completed"){

completed++;

}

});


/*
Update User
*/

await updateDoc(
userRef,
{

balance:
oldBalance,

commission:
newCommission,

completed:
completed+1

}
);


/*
Save Order
*/

await addDoc(
collection(db,"orders"),
{

uid:
currentUser.uid,

taskId:
taskId,

taskName:
task.name || "Task",

price:
price,

commission:
taskCommission,

status:
"Completed",

createdAt:
serverTimestamp()

}
);


button.innerText=
"Completed ✅";

button.className=
"completedBtn";


/*
Reload screen
*/

await loadAll();


}catch(error){

button.disabled=false;

button.innerText=
"Complete Task";

alert(
"Error: "+error.message
);

}

}


/* =========================
ESCAPE
========================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}

</script>

</body>
</html>
