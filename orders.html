<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteTask Pro - Tasks</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
    padding-bottom:90px;
}

/* TOP */

.topbar{
    height:70px;
    background:linear-gradient(135deg,#07152f,#1454a3);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    color:white;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.back-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:22px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    background:linear-gradient(135deg,#2d8cff,#55c8ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.logo-text{
    font-size:16px;
    font-weight:bold;
}

/* MAIN */

.container{
    max-width:600px;
    margin:auto;
    padding:18px 15px;
}

.page-title{
    margin:5px 2px 18px;
}

.page-title h2{
    font-size:22px;
}

.page-title p{
    color:#8992a2;
    font-size:13px;
    margin-top:5px;
}

/* BALANCE */

.balance-mini{
    background:linear-gradient(135deg,#081a3c,#1454a3);
    color:white;
    border-radius:20px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 10px 25px rgba(13,65,140,.2);
}

.balance-mini span{
    font-size:11px;
    opacity:.7;
}

.balance-mini strong{
    display:block;
    font-size:25px;
    margin-top:6px;
}

/* TASK CARD */

.task-card{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-bottom:13px;
    box-shadow:0 5px 20px rgba(20,40,80,.07);
}

.task-top{
    display:flex;
    gap:13px;
    align-items:center;
}

.task-image{
    width:65px;
    height:65px;
    border-radius:16px;
    object-fit:cover;
    background:#eaf2ff;
}

.task-placeholder{
    width:65px;
    height:65px;
    border-radius:16px;
    background:linear-gradient(135deg,#e8f2ff,#d8eaff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    flex-shrink:0;
}

.task-name{
    font-size:15px;
    font-weight:bold;
}

.task-price{
    margin-top:6px;
    font-size:12px;
    color:#7d8796;
}

.task-price strong{
    color:#1478ed;
}

.task-bottom{
    border-top:1px solid #edf0f5;
    margin-top:14px;
    padding-top:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.reward{
    font-size:11px;
    color:#8992a2;
}

.reward strong{
    display:block;
    color:#16a05d;
    font-size:15px;
    margin-top:3px;
}

.start-btn{
    border:none;
    background:linear-gradient(135deg,#1478ed,#25a5ff);
    color:white;
    padding:11px 18px;
    border-radius:12px;
    font-weight:bold;
    font-size:12px;
}

.empty{
    background:white;
    border-radius:20px;
    padding:35px 20px;
    text-align:center;
    color:#8992a2;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#8992a2;
    font-size:13px;
}

/* BOTTOM */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:73px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 25px rgba(0,0,0,.10);
    z-index:1000;
    border-top:1px solid #edf0f5;
}

.nav-item{
    text-decoration:none;
    color:#8992a2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:25%;
    font-size:10px;
}

.nav-item span{
    font-size:21px;
}

.nav-item.active{
    color:#1677e8;
    font-weight:bold;
}

.nav-center{
    width:55px;
    height:55px;
    margin-top:-25px;
    border-radius:50%;
    background:linear-gradient(135deg,#1478ed,#36b4ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 8px 20px rgba(20,120,237,.35);
    border:5px solid #f4f7fb;
}

</style>

</head>

<body>


<!-- TOP BAR -->

<div class="topbar">

    <a href="dashboard.html" class="back-btn">
        ←
    </a>

    <div class="logo-area">

        <div class="logo">
            ET
        </div>

        <div class="logo-text">
            EliteTask Pro
        </div>

    </div>

</div>


<div class="container">


    <div class="page-title">

        <h2>
            Available Tasks
        </h2>

        <p>
            Complete tasks and earn commission.
        </p>

    </div>


    <!-- BALANCE -->

    <div class="balance-mini">

        <span>
            Available Balance
        </span>

        <strong id="balance">
            $0.00
        </strong>

    </div>


    <!-- TASKS -->

    <div id="taskList">

        <div class="loading">
            Loading tasks...
        </div>

    </div>


</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">


    <a
        href="dashboard.html"
        class="nav-item"
    >
        <span>⌂</span>
        Home
    </a>


    <a
        href="orders.html"
        class="nav-item active"
    >
        <span>▣</span>
        Tasks
    </a>


    <a
        href="support.html"
        class="nav-item"
    >

        <div class="nav-center">
            💬
        </div>

        Support

    </a>


    <a
        href="profile.html"
        class="nav-item"
    >
        <span>👤</span>
        Profile
    </a>


</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyA0i_06l0wqKyk05N5AgZBtl8c461QZAgg",

    authDomain: "elitetask-pro.firebaseapp.com",

    projectId: "elitetask-pro",

    storageBucket: "elitetask-pro.firebasestorage.app",

    messagingSenderId: "504295275402",

    appId: "1:504295275402:web:8c480445c5510fa645a673"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* LOGIN */

onAuthStateChanged(auth, async (user) => {

    if(!user){

        window.location.href =
            "index.html";

        return;

    }

    await loadBalance(user.uid);

    await loadTasks();

});


/* BALANCE */

async function loadBalance(uid){

    try{

        const ref =
            doc(
                db,
                "users",
                uid
            );

        const snap =
            await getDoc(ref);

        if(snap.exists()){

            const data =
                snap.data();

            const balance =
                Number(
                    data.balance || 0
                );

            document
                .getElementById("balance")
                .textContent =
                "$" + balance.toFixed(2);

        }

    }
    catch(error){

        console.error(error);

    }

}


/* TASKS */

async function loadTasks(){

    const list =
        document.getElementById(
            "taskList"
        );

    try{

        const ref =
            collection(
                db,
                "tasks"
            );

        const snapshot =
            await getDocs(ref);

        list.innerHTML = "";


        if(snapshot.empty){

            list.innerHTML = `

                <div class="empty">

                    📦<br><br>

                    No tasks available right now.

                </div>

            `;

            return;

        }


        snapshot.forEach((taskDoc) => {

            const task =
                taskDoc.data();

            const taskId =
                taskDoc.id;

            const name =
                task.name ||
                "Product Task";

            const price =
                Number(
                    task.price || 0
                );

            const commission =
                Number(
                    task.commission || 0
                );

            const image =
                task.image || "";


            let imageHTML = "";


            if(image){

                imageHTML = `

                    <img
                        src="${image}"
                        class="task-image"
                        alt="Task"
                    >

                `;

            }
            else{

                imageHTML = `

                    <div class="task-placeholder">
                        🛍️
                    </div>

                `;

            }


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "task-card";


            card.innerHTML = `

                <div class="task-top">

                    ${imageHTML}

                    <div>

                        <div class="task-name">
                            ${name}
                        </div>

                        <div class="task-price">

                            Task Amount:
                            <strong>
                                $${price.toFixed(2)}
                            </strong>

                        </div>

                    </div>

                </div>


                <div class="task-bottom">

                    <div class="reward">

                        Commission

                        <strong>
                            +$${commission.toFixed(2)}
                        </strong>

                    </div>


                    <button
                        class="start-btn"
                    >
                        Start Task
                    </button>

                </div>

            `;


            card
                .querySelector(".start-btn")
                .addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "orders.html?task=" +
                            taskId;

                    }
                );


            list.appendChild(card);

        });

    }
    catch(error){

        console.error(error);

        list.innerHTML = `

            <div class="empty">

                Tasks load nahi ho rahe.

            </div>

        `;

    }

}

</script>

</body>
</html>
