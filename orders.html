<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders - EliteTask Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
color:#111827;
}

.header{
background:#111827;
color:white;
padding:18px;
border-radius:15px;
font-size:21px;
font-weight:bold;
}

.sub{
font-size:13px;
opacity:.8;
margin-top:5px;
}

.card{
background:white;
margin-top:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

.order{
background:#f9fafb;
border:1px solid #e5e7eb;
padding:15px;
border-radius:12px;
margin-top:12px;
}

.order-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.order-name{
font-size:17px;
font-weight:bold;
}

.completed{
background:#dcfce7;
color:#15803d;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:9px;
font-size:14px;
}

.label{
color:#777;
}

.value{
font-weight:bold;
text-align:right;
word-break:break-word;
}

.commission{
color:#16a34a;
font-weight:bold;
}

.date{
margin-top:12px;
font-size:12px;
color:#777;
border-top:1px solid #eee;
padding-top:10px;
}

.loading{
text-align:center;
padding:25px;
color:#777;
}

.empty{
text-align:center;
padding:30px 15px;
color:#777;
}

.error{
color:#dc2626;
padding:15px;
word-break:break-word;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

📦 Order History

<div class="sub">
Your completed tasks and orders
</div>

</div>

<div class="card">

<div id="orderList">

<div class="loading">
Loading Order History...
</div>

</div>

</div>

<a
href="dashboard.html"
class="back">

⬅ Back to Dashboard

</a>

<script type="module">


import { auth, db }
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const orderList =
document.getElementById("orderList");


/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
auth,
async(user)=>{


if(!user){

window.location.href =
"index.html";

return;

}


await loadOrders(
user.uid
);

});



/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(uid){

orderList.innerHTML = `

<div class="loading">
Loading Order History...
</div>

`;


try{


const ordersRef =
collection(
db,
"orders"
);


const q =
query(

ordersRef,

where(
"uid",
"==",
uid
)

);


const snapshot =
await getDocs(q);


orderList.innerHTML = "";


if(snapshot.empty){

orderList.innerHTML = `

<div class="empty">

📦 No completed orders yet.

<br><br>

Complete your first task and
it will appear here.

</div>

`;

return;

}


/*
Convert Firestore documents
into array.
*/

const orders = [];


snapshot.forEach(
(item)=>{

orders.push({

id:item.id,

data:item.data()

});

});


/*
Newest completed order first.
*/

orders.sort(
(a,b)=>{

const timeA =
a.data.createdAt &&
a.data.createdAt.toMillis
?
a.data.createdAt.toMillis()
:
0;


const timeB =
b.data.createdAt &&
b.data.createdAt.toMillis
?
b.data.createdAt.toMillis()
:
0;


return timeB - timeA;

});


/*
Display every order.
*/

orders.forEach(
(item)=>{


const order =
item.data;


const taskName =
order.taskName ||
order.name ||
"Task";


const price =
Number(
order.price || 0
);


const commission =
Number(
order.commission || 0
);


const status =
order.status ||
"Completed";


let dateText =
"Date not available";


if(
order.createdAt &&
order.createdAt.toDate
){

const date =
order.createdAt.toDate();


dateText =
date.toLocaleString();

}


orderList.innerHTML += `

<div class="order">


<div class="order-top">

<div class="order-name">

📦 ${escapeHtml(taskName)}

</div>

<div class="completed">

${escapeHtml(status)}

</div>

</div>


<div class="row">

<span class="label">
Task Price
</span>

<span class="value">
Rs ${price}
</span>

</div>


<div class="row">

<span class="label">
Commission Earned
</span>

<span class="value commission">
+ Rs ${commission}
</span>

</div>


<div class="row">

<span class="label">
Task ID
</span>

<span class="value">
${escapeHtml(item.id.substring(0,8))}
</span>

</div>


<div class="date">

🕒 ${escapeHtml(dateText)}

</div>


</div>

`;

});


}
catch(error){

orderList.innerHTML = `

<div class="error">

Unable to load order history.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
String(text || "");

return div.innerHTML;

}

</script>

</body>

</html>
